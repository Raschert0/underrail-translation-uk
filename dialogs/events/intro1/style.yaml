file_id: dialogs\events\intro1.txt
derived_from: source-only
units: {total: 18, npc: 15, player: 3, empty: 0}

speakers:
  - slug: tanner
    name: Таннер
    units: default
    confidence: certain
    evidence: [q1, q6, q10, q11, q16]
    role: >-
      Головує на раді станції Саут-Гейт: веде порядок денний, роздає питання і
      закриває засідання. Мова керівника — стримана, без лайки, повними реченнями.
    relationships:
      - "Горський — начальник охорони, підлеглий на раді, але сперечається з ним відкрито (q14)"
      - "Віра — учасниця ради, звітує про роботи в тунелі"
      - "Гравець — новий громадянин, якого Таннер прийняв на станцію (q11)"
    address:
      npc_to_player: н/д
      player_to_npc: н/д
      basis: >-
        Гравець у цій сцені мовчить: усі його юніти — це ремарки ::Continue::/::Skip intro::.
        Про нього говорять у третій особі, до нього не звертаються. Регістр «ти/ви»
        визначати нема на чому.
      gender_cues: ["::He nods.::"]
    voice:
      register: офіційний, головуючий; спокійний і трохи втомлений
      idiolect:
        - "формули ведення засідання: «last topic», «that will conclude this council meeting»"
        - "подвоєне «Good, good» — схвалення без емоцій"
        - "закриває сцену переліком імен: «Vera. Gorsky.» — сухе прощання, не звертання-заклик"

  - slug: gorsky
    name: Горський
    units: [q7, q8, q9, q12, q14]
    confidence: probable
    evidence: [q6, q7, q14]
    role: >-
      Начальник охорони станції: звітує про пости, підходи й ворота. Мислить
      загрозами і живою дією, а не паперами.
    relationships:
      - "Таннер — головуючий; Горський відкрито ставить під сумнів його критерії відбору (q14)"
    address:
      npc_to_player: н/д
      player_to_npc: н/д
      basis: "до гравця не звертається; говорить про нього в третій особі (q12, q14)"
    voice:
      register: різкий, службовий, з військовою стислістю
      idiolect:
        - "пропуск підмета на початку речення: «Got one man at…», «Also, got one man…»"
        - "лайливий підсилювач «bloody Lurkers» — грубість зберігати, не пом’якшувати"
        - "оцінкові формули військового: «as far as I'm concerned», «live action»"

  - slug: vera
    name: Віра
    units: [q4, q5]
    confidence: probable
    evidence: [q3, q6, q16]
    role: >-
      Звітує про ремонт Південного тунелю після землетрусу — терміни, вибухівка,
      зміни робітників. Говорить по суті, технічно.
    address:
      npc_to_player: н/д
      player_to_npc: н/д
      basis: "у сцені до гравця не звертається"
    voice:
      register: діловий, конкретний, без прикрас
      idiolect:
        - "безособове «Got to dig deeper» — констатація потреби, не наказ"

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q15]
    confidence: unknown
    reason: >-
      Репліка відповідає на закид q14 і сама отримує відповідь «Indeed» у q16 від
      Таннера, тож Таннер виключений; лишаються Віра і Горський, і жоден сигнал
      (нарація, звертання, мовний відбиток) між ними не розрізняє.
    guidance: >-
      Перекладати нейтрально, у базовому діловому регістрі вузла. Уникати форм
      минулого часу й прикметників, що видають рід мовця.

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; підказки дій усередині ::…:: — інфінітив, §3.5"

unattributed_units: [q15]

new_names: ["Lurkers"]

idioms:
  - unit: q15
    src: "We need all hands on deck"
    note: "не калькувати «руки на палубі»; українською — «тут кожні руки потрібні»"
  - unit: q7
    src: "no one can sneak up on us"
    note: "розмовне «підкрастися/підібратися непомітно», не буквальне «скрадатися»"
  - unit: q14
    src: "live action"
    note: "протиставлення тестам — «у справжньому бою», а не «жива дія»"

pitfalls:
  - "q12 і q13 містять $(context.player.Name) — плейсхолдер не відмінювати; фразу перебудувати так, щоб ім’я стояло в називному"
  - "q13, q14, q15 повні $(#he/she), $(#He/She), $(#him/her) — український минулий час і прикметники теж гендеровані, тож плейсхолдерів потрібно БІЛЬШЕ, ніж в оригіналі (STYLE §2)"
  - "q13: $(#He/She) на початку речення — велика літера в обох гілках"
  - "q7: «the Crossroad» і «the Cove» — скорочення від Crossroad Watch (Перехресна Варта) і Mushroom Cove (Грибна Бухта); брати з глосарію, а не транслітерувати"
  - "q6: «::He nods.::» — нарація перед реплікою того самого мовця, не окремий рядок; ::…:: зберігати"
  - "a2 має «::Continue::» без крапки, a17 — «::Continue.::» з крапкою; пунктуацію не вирівнювати"
  - "«Горський» відмінюється як прикметник: Горського, Горському (registry)"
  - "q10 «council meeting» — рада станції; тримати той самий термін у всіх вузлах Саут-Гейт"

examples:
