    rule: "$(#he/she) при українському гендерованому дієслові — STYLE §2"
    uk_fragment: "$(#він стане/вона стане)"
    status: proposed
  - unit: a18
    rule: "підказка дії в ::…:: — інфінітив, STYLE §3.5"
    uk_fragment: "::Пропустити вступ::"
    status: proposed
  - unit: q8
    rule: "грубе лишається грубим — STYLE §9 (назву істот див. new_names)"
    uk_fragment: "кляті"
    status: proposed
