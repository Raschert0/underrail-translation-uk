  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q8, q19, q25, q26]
    confidence: unknown
    reason: >-
      Напарник Ryl. Нарація доводить, що це чоловік («::Her partner adresses
      you.::» у q7, «::Shouts at you a man::» у q25) і що в q8 та q19 говорить
      саме він, бо Ryl у цих юнітах згадана в третій особі. Але імені він у
      файлі не має.
    guidance: >-
      Той самий базовий регістр «ви», діловий тон: саме він проговорює умови
      угоди (ключ-картка, право викупити крам). Рід чоловічий — минулий час
      і прикметники в чоловічому роді допустимі.

  - slug: unknown_2
    name: мовця встановити не вдалося
    units: [q5, q10, q21]
    confidence: unknown
    reason: >-
      Три репліки в множині від імені пари («We've been scavenging», «Get
      ready!», «We hoped there was another way»), без нарації з іменем і без
      займенника, що вказав би на стать. Належать або Ryl, або її напарникові.
    guidance: >-
      Регістр і тон ті самі, що в решті вузла: «ви», діловий. Уникати
      гендерованого минулого часу й прикметників — форми множини «ми»
      вирішують це самі собою.

