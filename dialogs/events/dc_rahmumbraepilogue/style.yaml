speakers:
  - slug: rahm_umbra
    name: Рам-Умбра
    units: default
    confidence: certain
    evidence: [q116, q135, q131]
    role: >-
      Нелюдська істота, що з’являється після знищення Тчорта й веде гравця до наступної
      мети — Таннера. Говорить як хтось, для кого людська мова заскладна й неточна:
      усе абстраговано до «подій» і «учасників».
    relationships:
      - "Таннер — ціль полювання; той самий рід, що й мовець, але приховує це"
      - "Безликі — законні власники Куба, який мовець вимагає повернути"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Жодного скорочення в усьому вузлі: послідовно «Do not», «I do not», «I am»,
        «It is». Лексика книжна («insolence», «detrimental», «archaic»), фрази
        побудовані як формули. STYLE §3.2 — формальний мовець, «ви» без винятків.
        Гравець дзеркалить (§3.3), навіть у зухвалих репліках на кшталт a107.
      gender_cues: ["$(#men/women)"]
    voice:
      register: холодний, безсторонній, книжний; наказовий спосіб без грубості
      idiolect:
        - "нав’язливе event / events — тримати одне українське слово в усьому вузлі, це його словесний тик"
        - "your kin, one of your own kin — дистанціювання від людей; не зводити до «люди»"
        - "foolish / foolishness — оцінка, а не лайка; повторюваний корінь зберігати"
        - "уникає скорочень і питальних зворотів; заперечення повне, не стягнене"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Тут нарації особливо багато (q2, q8, q23, q63,
    q72, q96, q99, q111, q129, q130, q131) — вона описує зовнішність і появу істоти
    й задає тон усій сцені.

