    name: мовця встановити не вдалося
    units: default
    confidence: unknown
    reason: >-
      Кат-сцена початку вторгнення без жодного імені. З тексту випливає лише
      розстановка ролей: q1 і q3 говорить розвідник, що доповідає («commander»,
      «All is clear»), q4 — той, кого він називає командиром («::He nods.::
      We felt them here too»). Кому належать q5–q7, з файлу не встановити:
      «Maybe I spoke too soon» логічно продовжує q4, але доказу немає.
    guidance: >-
      Регістр військовий і субординаційний: доповідь підлеглого — «ви», з
      формулами рапорту, без розмовних стягнень. Нарація ::He nods.:: дає
      чоловічий рід тому, хто говорить q4; для решти рід не встановлений —
      уникати гендерованого минулого часу. Гравець у сцені не бере слова:
      усі a-юніти — службові підказки.

