speakers:
  - slug: cliff
    name: Кліфф
    units: [q1, q2, q4]
    confidence: certain
    evidence: [q2, q5]
    role: >-
      Шукач, що втік із нижнього рівня й тепер виправдовується перед
      напарницею. Головна його ознака — груба діалектна вимова, яка
      відрізняє його від Дженні на слух.
    relationships:
      - "Дженні — напарниця; сварка про те, хто винен у вилазці"
    address:
      npc_to_player: н/д
      basis: >-
        До гравця Кліфф не звертається взагалі: сварка йде між напарниками
        на «ти» (свої, вуличні — STYLE §3.2). Гравцеві в цій гілці лишається
        тільки піти (a6).
    voice:
      register: вуличний, діалектний, виправдувальний
      idiolect:
        - "стягнення «ya», «yer», «’er», «shoulda», «makin’» — суцільна діалектна вимова; відтворювати українським просторіччям, а не літературною нормою"
        - "самоперебивання «Jenny, ya made it! I--» — обрив зберігати"

  - slug: jenny
    name: Дженні
    units: [q3, q5, q8, q10]
    confidence: certain
    evidence: [q5, q8]
    role: >-
      Шукачка, яку Кліфф покинув унизу; у другій гілці — вціліла й розчавлена
      провиною за його смерть. Говорить літературніше за Кліффа — контраст
      вимови між ними є засобом характеристики, його треба втримати.
    relationships:
      - "Кліфф — напарник; у першій гілці об’єкт люті, у другій — провини"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        До гравця Дженні прямо не звертається, але в гілці горя (q8) вона
        сповідається незнайомцеві, і репліки гравця (a9, a12) — розважливі,
        без панібратства. Регістр незнайомців — «ви», STYLE §3.2–3.3.
      switches:
        - {unit: q3, to: ти, trigger: "лайка на адресу Кліффа — це «ти» до напарника, не до гравця"}
    voice:
      register: різкий у сварці, надламаний у горі
      idiolect:
        - "обірвана лайка «You're one big...!» — крапки замість слова, не добудовувати"

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q7]
    confidence: unknown
    reason: >-
      «Wish we never came here...» — множина «ми», без нарації, без імені й
      без діалектних стягнень, які видали б Кліффа. Може бути ідлом Дженні в
      гілці після його смерті або Кліффа в гілці, де вижили обоє.
    guidance: >-
      Форма «ми» знімає потребу в гендерованому минулому часі — скористатися
      цим. Регістр — базовий для вузла; діалектних стягнень Кліффа не
      додавати, поки мовця не підтверджено.

