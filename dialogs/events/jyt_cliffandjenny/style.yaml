pitfalls:
  - "«you hopper» (q3) — це образа через назву істоти, а не звертання до створіння. Глосарій дає «hopper → стрибун»; в українській лайка має читатися як лайка, тому потрібне рішення про форму звертання, а не буквальний іменник."
  - "«burrowers» (q4) — глосарій: «копаки» (одн. «копака»)."
  - "«scavenger» (a9, a12) — глосарій: «шукач»."
  - "Cliff і Jenny — імен немає в реєстрі; транслітерацію не вигадувати. Увага: «Cliff» тут особове ім’я, а не «скеля»."
  - "Контраст вимови між Кліффом (діалект) і Дженні (норма) — головний засіб характеристики вузла; якщо обох перекласти однаково рівно, сцена розпадається."
  - "\\n\\n у q5 — розрив абзацу, зберігати дослівно."

