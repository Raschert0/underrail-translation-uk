pitfalls:
  - "Головна пастка вузла: q3 містить «::He nods in agreement to what Gorsky said::» — це доводить, що q3 говорить НЕ Горський, а Таннер. Ім’я в нарації тут указує на іншого учасника, не на мовця."
  - "Регістри двох мовців різні («ви» в Таннера, «ти» в Горського) і йдуть упереміш у сусідніх юнітах. Гравцеві теж треба дзеркалити по-різному: a12–a28 звернені переважно до Таннера («ви»), але a26 про дорогу може стосуватися обох — узгодити з вибором для q27."
  - "Вибір «ти» для Горського тут задає його регістр і в решті вузлів (dialogs/events/cc_gorskytunneler, cc_gorskyassaultcrawlers) — міняти його не можна вибірково."
  - "Глосарій: SGS → «ССГ», Faceless → «Безликі», Protectorate → «Протекторат», Core City → «Центральне Місто», Rail Crossing → «Залізничний Переїзд», Hardcore City Bar → «Хардкор Сіті Бар», Underrail → лишати латиницею й не відмінювати («north Underrail» → «північна Underrail»)."
  - "Реєстр: Tanner → «Таннер», Gorsky → «Горський» (відмінюється як прикметник: Горського, Горському), Vera → «Віра» — з великої літери, попри омонімію."
  - "«tunneling machines» (q5) — бурові машини Безликих; не плутати з глосарійними «Tunnelers → Тунельники» (істоти)."
  - "«explosive charges» (q27) — вибухові заряди, предмет інвентарю; термін звірити з knowledge/."
  - "a28 і a31 — майже дублікати («Alright, I'm off.» / «Alright. I'm off.»); різниця лише в розділовому знаку, її треба зберегти."
  - "У q10 після «Rail Crossing.» стоять два пробіли — не «виправляти» самочинно."

