    units: [q1, q29]
    confidence: unknown
    reason: >-
      q1 «Don't you have somewhere to be?» — барк-відмова, який може належати
      будь-кому з двох. q29 «Good luck.» стоїть поряд із q30 і за логікою
      належить Таннерові, але нарації, яка це доводила б, у файлі немає.
    guidance: >-
