speakers:
  - slug: tanner
    name: Таннер
    units: default
    confidence: probable
    evidence: [q3, q22, q25]
    role: >-
      Голова ССГ, який на нараді викладає обстановку й видає гравцеві
      завдання. Мова аналітична й повна: довгі складені речення, обережні
      застереження («The reports are sketchy», «Not yet, anyway») —
      це голос керівника, а не бійця.
    relationships:
      - "Горський — підлеглий-ветеран, який вирушає до Центрального Міста окремо"
      - "Віра — має власне завдання для гравця (q25)"
      - "гравець — виконавець, якого Таннер відряджає до Залізничного Переїзду"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Керівник станції, що ставить службове завдання: розгорнуті інструкції,
        жодного панібратства, доручення й звіт («report back to me»).
        STYLE §3.2 (формальні, службові — «ви»), §3.4 (наказовий спосіб
        успадковує вибір: «уникайте», «знайдіть»).
    voice:
      register: стриманий, аналітичний, службовий
      idiolect:
        - "застереження-обмовки «as far as I can remember», «if possible», «apparently» — обережність формулювань, не згладжувати до впевненості"

