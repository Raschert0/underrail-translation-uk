speakers:
  - slug: mareth
    name: Марет
    units: default
    confidence: certain
    evidence: [q4, q13]
    role: >-
      Капітан підрозділу хімічного штурму, що вривається до штабу й на очах
      у всіх відбирає командування в полковника. Його зброя — підкреслено
      ввічлива форма при відверто принизливому змісті; саме цей розрив між
      формою і змістом має вціліти в перекладі.
    relationships:
      - "Каткарт — полковник, якого Мaret зве «my old friend» глузливо"
      - "консул Олівер — мішень для кпинів; Mareth демонстративно зве його на ім’я «Kerry»"
      - "гравець — капрал, якого він забирає під своє командування наприкінці"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Військова субординація по всій сцені: гравець — капрал, який відповідає
        «sir», Mareth — капітан. Формальні службові стосунки, STYLE §3.2 — «ви»
        в обидва боки. Знущання Mareth не змінює форми: він принижує саме
        через бездоганну ввічливість.
      gender_cues: ["$(#He/She)", "$(#boy/girl)"]
    voice:
      register: ввічливо-зверхній, розмірений, отруйний
      idiolect:
        - "звертання за званням у кожній репліці — «Colonel», «Captain»: ритуальна ввічливість як знаряддя"
        - "саркастичне «Sir.» окремим реченням після погрози (q15) — крапка обов’язкова"
        - "зооморфні образи про людей (mutts, ratter, bark, bite, squeal, biting into the flesh) — наскрізний ряд, тримати його єдиним"

  - slug: cathcart
    name: Каткарт
    units: [q4, q9, q12, q14, q29]
    confidence: certain
    evidence: [q2, q14]
    role: >-
      Полковник, комендант Форту Апогей, який програє сутичку за владу, але
      не втрачає форми. Говорить статутно й стримано; зрив у q14 —
      єдиний виняток, і саме тому він помітний.
    relationships:
      - "Mareth — давній знайомий і суперник, тепер формально старший за впливом"
      - "консул Олівер — підлеглий за протоколом союзник, якого Каткарт не захищає"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: "статутна субординація; до гравця-капрала прямо не звертається, але реєстр сцени формальний"
    voice:
      register: статутний, стриманий, з наростанням у q14
      idiolect:
        - "риторичне «Am I clear?» на завершення наказу — формула, не питання"

  - slug: oliver
    name: Олівер
    units: [q6]
    confidence: certain
    evidence: [q2, q6]
    role: >-
      Консул, який намагається обстояти титул і одразу ж буває обірваний.
      Єдина його репліка — незакінчена: обурення без наслідків.
    address:
      npc_to_player: ви
      basis: "цивільна посадова особа у військовому штабі; формальний реєстр"
    voice:
      register: ображено-офіційний
      idiolect:
        - "наполягання на титулі «Consul Oliver for you, Captain!» — суть репліки саме в титулі"

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q8, q17]
    confidence: unknown
    reason: >-
      Третя з групи — жінка-солдат: нарація («The woman hisses the consul's
      name», «::She giggles.::») дає стать і роль, але імені в файлі немає.
    guidance: >-
      Рід жіночий — гендеровані форми допустимі. Регістр той самий формальний
      «ви», але голос інший: дві короткі репліки, обидві з хихотінням;
      ефект будується на невідповідності милого тону моторошному опису.
      Не додавати їй ані грубості, ані офіціозу — вона говорить майже дитинно.

narration:
  present: true
  note: >-
    q1, q2, q18 — суцільна нарація, плюс вставки всередині реплік (q3, q5,
    q13, q14, q15, q16, q23, q28). Скрізь «ви», STYLE §3.1 — навіть там, де
    описано зневагу до гравця.

