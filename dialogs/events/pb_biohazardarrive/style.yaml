idioms:
  - unit: q5
    src: "You bark, yet never bite... while Kerry, he doesn't even squeal."
    note: "перероблене прислів’я про гавкіт і укус; локалізувати наявним українським відповідником, а не калькою — інакше зникне продовження про писк"
  - unit: q3
    src: "Long time no see."
    note: "стала розмовна формула привітання; український відповідник, не дослівність"
  - unit: q12
    src: "You're walking the tracks, now."
    note: "внутрішньоігрова погроза-ідіома Протекторату (рейки = смертельний ризик); не калькувати й не пояснювати, шукати компактний загрозливий зворот"
  - unit: q13
    src: "such a rookie mistake"
    note: "помилка новачка; «rookie» тут — оцінка, не звання"
  - unit: q13
    src: "to end this charade"
    note: "«фарс/балаган», не «шарада»"
  - unit: q11
    src: "clean up *your* mess"
    note: "розмовне «розгрібати чужий безлад»; зірочки навколо слова — авторський наголос, зберігати"
  - unit: q10
    src: "cybernetic mutts"
    note: "зневажливе про Безликих; грубість не пом’якшувати (STYLE §9)"
  - unit: q28
    src: "the colonel's errand $(#boy/girl)"
    note: "«хлопчик/дівчинка на побігеньках» — ідіома приниження; обидві гілки плейсхолдера українською"

pitfalls:
  - "$(context.player.Name) в a19, q20, a26, q28 — не відмінювати всередині плейсхолдера; фразу будувати так, щоб ім’я стояло в називному («Капрал $(context.player.Name)»)."
  - "$(#He/She) у q22 — Mareth говорить про гравця в третій особі; обидві гілки українською, і решта речення («seems to be the capable one») теж потребує узгодження за родом — імовірно, знадобиться додатковий плейсхолдер, якого в англійському немає. Це правильно, а не вільність (STYLE §2)."
  - "$(#boy/girl) у q28 — гендерна пара всередині ідіоми; латиниці всередині $(#…) не лишати."
  - "«sir» у a19, a25, q15 — військове звертання; потрібна статутна українська формула, а не «пане»."
  - "Kerry — це особове ім’я консула Олівера, яким Mareth демонстративно послуговується замість титулу. Не сплутати з окремим персонажем: у q6 сам Олівер вимагає звертатися «Consul Oliver»."
  - "Каткарт і Олівер є в реєстрі; Mareth, Kerry, Korn — ні. Форт Апогей, CAU і High Command — назви без канонічного рішення."
  - "Глосарій: Faceless → «Безликі», Free Drones → «Вільні Дрони», Protectorate → «Протекторат», Epione → «Епіон», South Gate Station → «Станція Саут-Гейт», Underrail → лишати латиницею й не відмінювати («South Underrail»)."
  - "«constitution» у q1 означає статуру тіла; глосарій дає «Constitution → Статура» як характеристику, тут це те саме слово в прозі, а не термін інтерфейсу."
  - "\\n\\n у q1, q3, q5, q9, q11, q13, q14, q15, q16, q18, q23, q28, q29 — розриви абзаців, зберігати дослівно, разом із поодинокими \\n."

