  - "Рід усіх дієслів і прикметників у сцені — жіночий (Лора); водночас звертання до гравця лишається на «ви» й гендерно нейтральним."
  - "«tubes and wires» (q1) — медичні трубки й дроти апаратури, не «труби»."
  - "Обидва юніти — суцільний блок у ::…::; роздільники лише на початку й у кінці."
  - "Остання фраза q2 навмисно коротка й проста («She is dead.») — не розгортати."

