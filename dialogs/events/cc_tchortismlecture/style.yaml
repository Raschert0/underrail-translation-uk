pitfalls:
  - "Три крапки перед останнім словом абзацу — авторський риторичний прийом мовця, що повторюється в кожній репліці («know that very... well», «offer... to you», «study it», «the Surface»). Це не пропуск і не обрив: пауза має стояти в українському реченні на тому самому логічному місці."
  - "Термінологія глосарія: Institute of Tchort → «Інститут Тчорта», Tchort → «Тчорт», Deep Caverns → «Глибокі Печери», Faceless → «Безликі», Core City → «Центральне Місто», Underrail → лишати латиницею й не відмінювати."
  - "Похідні «Tchortism» і «Tchortist» у глосарії відсутні — до централізованого рішення не вигадувати форму; від неї залежить весь вузол."
  - "q5 — фаховий генетичний уривок: «non-coding DNA», «junk DNA», «coding», «genome», «protein sequences». Терміни біологічні й точні; лапки навколо \"non-coding\" і \"junk\" зберігати."
  - "«0.5 %» у q5 — пробіл перед знаком відсотка є в оригіналі; типографіку не «виправляти» самочинно."
  - "\\n\\n у q2, q7, q9 — розрив абзацу, зберігати дослівно."
  - "Цитата Ейдейна в q9 (\"We can and we must.\") — лапки за STYLE переводяться в « »."

