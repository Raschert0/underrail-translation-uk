      як на засновника, тобто сам не є ним.
    guidance: >-
      Регістр установлено надійно, навіть якщо особа — ні: це публічна
      лекція до зали, «ви» без винятків («Thank you all», «brothers and
      sisters»). Стать мовця з джерела не випливає — уникати форм минулого
      часу й прикметників, що видають рід. Голос: наукоподібний, розмірений,
      підкреслено не сектантський («we are not a religious cult»).

