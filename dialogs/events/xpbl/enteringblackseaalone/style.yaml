pitfalls:
  - "Black Sea — глосарій дає «Чорне Море», обидва слова з великої й у відмінках теж («Чорного Моря»). У q1–q2 назва не звучить прямо, але сцена належить цій локації — узгоджувати з нею."
  - "«you raise you head» у q1 — друкарська помилка оригіналу (мало бути «your»); у перекладі відтворювати правильну форму, помилку не переносити."
  - "«stalactites» і «speleothemic» — спелеологічні терміни, потрібні точні українські відповідники (сталактити, натічні утворення), а не описові звороти."
  - "Обидва юніти — суцільний блок у ::…::; роздільники лише на початку й у кінці."
  - "Довгі періоди з тире й крапками з комою — авторська пунктуація; членувати на короткі речення не можна, на ритмі тримається ефект."

