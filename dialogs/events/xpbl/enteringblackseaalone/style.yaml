narration:
  present: true
  note: >-
    Вузол складається виключно з нарації: обидва юніти цілком узяті в ::…::,
    мовця немає. Другоособове звертання до гравця — «ви» без винятків,
    STYLE §3.1. Це найвищий за стилем фрагмент пакета: свідомо пишний,
    книжний період із рідкісною лексикою («stalactitic», «speleothemic»,
    «underture», «arbitration»). Знижувати реєстр до нейтрального опису
    означає зіпсувати сцену — потрібна українська книжна лексика тієї самої
    висоти, а не спрощення.

