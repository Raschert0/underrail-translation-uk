speakers:
  - slug: narrator
    name: нарація
    units: default
    confidence: certain
    evidence: [q1, q2, q8]
    role: >-
      Безособовий оповідач описує серію галюцинацій, що наздоганяють гравця після
      моргу. Це суцільна література жаху від другої особи — не діалог, тож вибір слів
      визначає не характер персонажа, а щільність образності.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Увесь вузол — нарація в «::…::», а вона за STYLE §3.1 завжди «ви», без винятків.
        Форма «ви» до того ж знімає більшість проблем із родом у минулому часі.
    voice:
      register: висока літературна проза, довгі періоди, нагнітання
      idiolect:
        - "щільні синонімічні ряди прикметників («repugnant, morbid pile»), які треба зберігати як ряд, а не стискати"
        - "музична термінологія як наскрізний образ у гілці Голосу: counterpoint, syncopation, euphony, cacophony, monophony"
        - "анатомічна конкретика (marrow, intestines, optic nerves) — не пом’якшувати до загального «нутрощі»"

  - slug: dying_voice
    name: голос істоти
    units: [q59, q60, q61, q62, q63, q64, q65, q66]
    confidence: probable
    evidence: [q60, q66]
    role: >-
      Голос згасаючої істоти, що благає про смерть; звучить уривками поза «::»,
      тоді як «::…::» у тих самих юнітах лишається нарацією.
    address:
      npc_to_player: ти
      player_to_npc: ви
      basis: >-
        Прямої граматичної адреси в репліках немає — самі «Kill... me... ...please».
        Якщо доведеться додати займенник, брати «ти»: це передсмертне благання, не
        службова мова. Обрамлення в «::…::» лишається на «ви».
    voice:
      register: уривчастий шепіт, заїкання, розпад мовлення
      idiolect:
        - "заїкання наростає від K-k до m-me — відтворювати на українському приголосному, STYLE §9"

narration:
  present: true
  note: >-
    Вузол майже цілком нарація — «ви» без винятків, STYLE §3.1. Репліки гравця — теж
    «::…::» і теж підказки дій, тож інфінітив за §3.5.

new_names: ["Other Voice"]

idioms:
  - unit: q4
    src: "body horror"
    note: "жанровий термін, не калька «тілесний жах» дослівно — потрібен усталений опис відрази до тілесного"
  - unit: q33
    src: "a contrapuntal dance of sentience"
    note: "музичний термін контрапункту тримати; не спрощувати до «гармонійного діалогу»"
  - unit: q42
    src: "rings with mounting subhumanity"
    note: "не калькувати; йдеться про наростання нелюдського в голосі"
  - unit: q56
    src: "not unlike a bowl of living jelly"
    note: "порівняння з драглями зберігати як побутовий образ, він навмисно знижений"
  - unit: q7
    src: "You feel pressure mounting inside your skull"
    note: "«pressure» тут фізичне відчуття тиску, а не тиск як примус"

pitfalls:
  - "a9, a20, a35, a49 містять тег перевірки «[Will]» — це базова здібність, а НЕ персонаж Will/Вілл із реєстру; брати назву здібності з knowledge, зразок оформлення — ::[Persuade]:: → ::[Переконати]:: у глосарії"
  - 'у q2, q3, q4, q6 та багатьох інших усередині рядка стоїть літерал \n\n — це розрив абзацу в грі; переносити його як є, не замінювати справжнім переносом і не втрачати пробіл перед ним там, де він є (q4, q16, q18)'
  - 'q59 має нетипову розмітку: ::K-k...\n\nKi...:: закривається, і «Kill...» стоїть уже поза «::» — межі маркерів не вирівнювати'
  - "q2 і q22 містять виділення зірочками (*all*, *has*, *must*) — зірочки лишати, переносячи наголос на відповідне українське слово"
  - "плейсхолдерів $(#…) у джерелі немає; форма «ви» дає множину в минулому часі, тож додавати гендерні плейсхолдери здебільшого не потрібно — уникати спокуси перейти на однину"
  - "q13, q18, q30, q47, q53 — короткі рядки-містки з трикрапкою в кінці; трикрапку зберігати, вона тримає ритм переходу"
  - "q59–q66 — це не нарація цілком: текст поза «::» промовляє істота, і саме там працює правило заїкання"

