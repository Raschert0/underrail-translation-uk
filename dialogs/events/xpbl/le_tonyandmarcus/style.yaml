  - unit: q5
    src: "check the pipes"
    note: >-
      Не «перевіряти труби». Це сленг Центрального Міста зі значенням «відлити»; q7
      прямо його розшифровує, тож українська ідіома має бути так само непрозорою для
      Маркуса й розкриватися в q7.
  - unit: q7
    src: "pipeworkin'"
    note: >-
      Лайливий підсилювач, утворений від того самого кореня. Глосарійне «труболаз»
      (pipeworker) — окреме, професійне значення; тут потрібна лайка, і зв’язок із
      «трубами» має вціліти, бо на ньому тримається жарт q11 «What. the. pipe--?».
  - unit: q3
    src: "get zoned out"
    note: "«зонити»/«вибити» — убити; спільнокореневе з глосарійним «зонер», тримати єдиний корінь"
  - unit: q34
    src: "derailed"
    note: "«зсунутий», «здурілий» — не «зійшов з рейок» дослівно; повторюється в q168, q297"
  - unit: q9
    src: "la-di-da"
    note: >-
      Ярлик Тоні для北 північної манірності; іменник, прикметник і дієслово водночас
      (q303 «la-di-dude», q295 «la-di-dadin'»). Потрібен один український корінь,
      здатний так само гнутися.
  - unit: q58
    src: "hardcore grinding"
    note: >-
      «grind» у вузлі має два значення — бійка (q58) і секс (q168 «rod grinder»,
      q180, q294). Двозначність навмисна, зберігати одне слово.
  - unit: q166
    src: "rod grinder"
    note: "Маркус розуміє буквально (q167 «construction work?») — калька зруйнує жарт"
  - unit: q220
    src: "mammaloons"
    note: "вигадане вульгарне слово Тоні, а не існуючий вульгаризм — потрібен новотвір"
  - unit: q131
    src: "Do one-eyed people blink or wink?"
    note: >-
      Уся гілка q131–q153 тримається на розрізненні двох дієслів. Обрати пару термінів
      і не змішувати; a152 «bwink» — навмисне зрощення цих двох слів.
  - unit: q168
