speakers:
  - slug: grim
    name: Грим
    units: default
    confidence: certain
    evidence: [q2, q23, q86, q341]
    role: >-
      Капітан піратів Cadmus Grim, який захопив професора Олдфілда і веде
      переговори про викуп; тримає церемонну ввічливість господаря корабля
      навіть тоді, коли погрожує. Ім’я в реєстрі — Грим (не «Грім»).
    relationships:
      - "Крузер і Бритва — його лейтенанти; він їх стримує («Cruzer.» — і той замовкає)"
      - "Олдфілд — заручник; про нього Грим говорить рівно, як про предмет угоди"
      - "Флінгер — підлеглий, який стереже професора (q176)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Формальний, освічений мовець у ролі господаря й переговорника:
        «Welcome to my ship», «Thank you, I appreciate the compliment»,
        «We are pirates, my friend». STYLE §3.2 — «ви»; репліки гравця
        дзеркалять (§3.3), гравець звертається «Captain».
      gender_cues: ["$(#man/woman)", "$(#him/her)", "$(#He/She)"]
      switches:
        - {unit: q48, to: ти, trigger: "обриває нахабство — «Watch your tongue»"}
        - {unit: q82, to: ти, trigger: "вибух гніву, наказ схопити гравця"}
        - {unit: q283, to: ти, trigger: "пряма погроза життю професора"}
    voice:
      register: стриманий, підкреслено чемний, з холодною погрозою під ввічливістю
      idiolect:
        - "послідовне випадання -g: makin’, somethin’, interestin’ — просторічний шар під книжним синтаксисом; в українській передавати розмовною лексикою, не «зіпсованою» орфографією"
        - "повторювана формула схвалення «I like the sound of that» / «We’re makin’ progress» — тримати сталою в усіх входженнях (q78, q150, q208, q244)"
        - "виділення курсивом через *зірочки*: *Everythin’*, *knows*, *take* — зірочки зберігати"
        - "любить сентенції-афоризми: «Impatience brings failure; patience brings reward»"

  - slug: cruzer
    name: Крузер
    units: [q3, q87, q89, q335, q337, q340, q342, q344, q346, q347, q348, q350, q368]
    confidence: probable
    evidence: [q3, q334, q335, q337]
    role: >-
      Лейтенант капітана, з рознесеною лівою половиною щелепи, прикритою
      банданою; грубий, сексуально-агресивний, тримає гравця під прицілом.
      Уся його мова — контраст до капітанової.
    relationships:
      - "Грим — капітан; Крузер його слухається з першого слова (q341 → q342 «Yes, Cap’n.»)"
      - "має особисту ненависть до Протекторату — шрам від їхнього солдата (q334)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний, відверто ворожий мовець із погрозами й непристойностями
        («Ye wanna bend over too, eh?») — STYLE §3.2 «ти». Репліки гравця
        до нього (a339, a345) дзеркалять цим самим «ти».
      gender_cues: []
    voice:
      register: грубий, брутальний, зверхній; грубе лишається грубим (STYLE §9)
      idiolect:
        - "найсильніший ідіолект у вузлі: артикль d’ замість the, ye/yer замість you/your, me замість my, випадання початкового h (’e, ’is, ’ere), 'cus замість because"
        - "передавати системною просторічністю української — редукції та згрубіла лексика, а не випадковими помилками"
        - "«Cap’n» у його вустах — коротка форма; тримати однаковою в q342 і в q3"
    note: >-
      Атрибуція тримається на бандані: q3 — голос крізь бандану, q335 — той
      самий персонаж стягує бандану й показує шрам, а q334 прямо називає цей
      шрам Крузеровим.

  - slug: oldfield
    name: Олдфілд
    units: [q177, q179, q181, q183]
    confidence: certain
    evidence: [q177]
    role: >-
      Професор-заручник, чути лише по рації; говорить спокійно й інтелігентно,
      без жодного піратського шару.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: "науковець, колега гравця по експедиції; гравець звертається «Professor» — STYLE §3.2"
      gender_cues: []
    voice:
      register: втомлений, але витриманий; повні форми, без розмовних скорочень
    note: >-
      У його репліках стоїть окремий плейсхолдер
      $(context.npc_xpbl_oldfield_playerName), а не $(context.player.Name).

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q343]
    confidence: unknown
    reason: >-
      Гола ремарка «::He turns to you.::» між реплікою Крузера (q342) і його ж
      тирадою (q344): «він» — це або капітан, що повертається до перерваної
      розмови, або Крузер, що переходить до наступної погрози.
    guidance: >-
      Нейтральна нарація на «ви» без уточнення особи; не додавати імені й не
      вживати гендерованих форм понад те, що є в джерелі.

narration:
