speakers:
  - slug: gms_raiders
    name: рейдери на GMS
    units: default
    confidence: probable
    evidence: [q1, q5, q9, q29, q33]
    role: >-
      Пара озброєних рейдерів, що захопила комплекс GMS і тримає старого шукача
      під прицілом; вони перехоплюють гравця, допитують і вирішують, убити його
      чи відвести до ватажка.
    relationships:
      - "двоє між собою — спільники, звертаються одне до одного без імен"
      - "старий («gramps») — їхній заручник"
      - "Max — їхній товариш, що лишався нагорі з ключем від люка"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличні бандити з ножем і арбалетом, які погрожують і лаються; STYLE §3.2
        віддає такому мовцеві «ти». Плейсхолдер $(#jack/sister) у q1, q5, q36 —
        прямий сигнал на користь «ти».
      gender_cues: ["$(#jack/sister)", "sister", "sis"]
    voice:
      register: грубий, вуличний, погрозливий; коротка різка фраза
      idiolect:
        - "стягнені й просторічні форми: ain't, gonna, how'd — передавати розмовною українською, не літературною"
        - "лайка-звертання bastard, punks — не пом’якшувати (STYLE §9)"

  - slug: gms_raider_crossbow
    name: рейдерка з арбалетом
    units: [q3, q8]
    confidence: certain
    evidence: [q3, q8]
    role: >-
      Жінка з арбалетом, яка веде допит і перша наводить зброю; її репліки
      потребують жіночих форм минулого часу в українській.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: "та сама вулична манера, що й у напарника"
    voice:
      register: різкий, командний
      idiolect:
        - "звертається до заручника зневажливо gramps"

  - slug: gms_raider_knife
    name: рейдер з ножем
    units: [q38]
    confidence: probable
    evidence: [q38]
    role: >-
      Другий рейдер; у q38 лише німа реакція — він зиркає на напарницю з
      арбалетом, отже сам він не арбалетник.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: "той самий вуличний регістр пари"

  - slug: gms_hostage_oldman
    name: старий заручник
    units: [q4]
    confidence: certain
    evidence: [q4]
    role: >-
      Літній чоловік, якого рейдери тримають на прицілі; єдина його репліка —
      перелякане виправдовування, що гравець не з ними.
    address:
      npc_to_player: ви
      player_to_npc: ти
      basis: >-
        Говорить не до гравця, а до рейдерів, і то з переляку; звертання до
        гравця в нього немає, тож «ви» тут — обережний нейтральний вибір, а не
        висновок із тексту.
      gender_cues: ["$(#He/She) ain't with us"]
    voice:
      register: збуджений, благальний, з повторами
      idiolect:
        - "подвоєння як ознака паніки: «You do! You do!»"

  - slug: narration
    name: нарація
    units: [q51]
    confidence: certain
    evidence: [q51]
    role: >-
      Службовий опис реакції обох рейдерів під перевірку навички; не мовлення
      персонажа.
    address:
      npc_to_player: ви
      basis: "нарація завжди на «ви» — STYLE §3.1"

narration:
  present: true
  note: >-
    ::…:: трапляється і як авторський опис (q3, q8, q38, q51), і як підказка дії
    гравця (::Attack!::, ::[Persuade]::). Опис — «ви» (STYLE §3.1), підказка дії —
    інфінітив (STYLE §3.5).

