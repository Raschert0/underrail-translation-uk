pitfalls:
  - >-
    q1, q2, q3 і q96 — це ФРАГМЕНТИ одного речення, які гра склеює підряд
    («…sitting behind the desk and » + «gazing into an azure drink…» + «down before
    going around the desk…»). Кінцеві пробіли й порядок слів визначають, чи склеїться
    українська фраза; перекладати як фрагменти, а не як самостійні речення.
  - >-
    Так само склеюються q25 + q26/q77 («And to make your job even simpler, » +
    «we learned where they’re hiding. »), q116 + q120/q121/q122/q123
    («However: » + «But it’ll have to wait. » + «Finish your tasks - » + «then we
    will discuss the Acorn.»). Українська синтаксична рамка має витримати обидва варіанти
    продовження.
  - "q3, q5, q8, q20, q47, q56, q68, q88, q90, q93, q95, q97, q119 містять $(context.player.Name) — не відмінювати всередині плейсхолдера, будувати фразу так, щоб ім’я стояло в називному"
  - "q91 містить $(context.playerArenaTitle) — те саме обмеження; титул підставляється в називному"
  - "JKK, Coretech, Praetorian Security, Biocorp, Underrail — глосарій прямо велить лишати латиницею й не відмінювати"
  - "Faceless → «Безликі», Protectorate → «Протекторат», Core City → «Центральне Місто», Drop Zone → «Зона Скидання», Invictus → «Інвіктус», charons → «харони» — усе за глосарієм"
  - "«Underrail Protectorate» (q136) — поєднання латиниці й перекладеного слова; не транслітерувати першу частину"
  - "q13 «chief of Praetorian Security» — «chief» за реєстром з малої («шеф»), крім початку речення"
  - "Tchortists — похідне від Tchort (глосарій: «Тчорт»); форма демоніма не канонізована, до new_names"
  - "«Acorn, a.k.a ACoNR» (a110) — акронім обіграно як слово; рішення потрібне централізоване, поки не вигадувати"

