  - "q2, q16, q52, q58, q131, q301, q304 містять $(context.player.Name) — не відмінювати всередині плейсхолдера; речення будувати так, щоб ім’я стояло в називному"
  - "У джерелі немає жодного $(#masc/fem), але українське минуле й прикметники гендерні — плейсхолдери доводиться додавати самому (STYLE §2), напр. у a15, a30, a44, a107, a124, a217"
  - "Обірвані юніти-половинки: q38+q39, q65, q83, q116+q117, q141, q144+q145, q288+q289 — це половини одного речення, склеювані рушієм. Перекладати як продовження, не дописувати крапку й не робити з кожної половини самостійне речення"
  - "Теги перевірок у «::…::» — ::[Chemistry]::, ::[Biology]::, ::[Persuade] or [Mercantile]::, ::[Intelligence]::, ::[Requires: Metathermics 35]:: — це UI-мітки; дужки й «::» зберігати, назви навичок брати з глосарію"
  - "Назви псі-здібностей (cryokinesis, cryostasis, pyrokinesis, pyrokinetic stream) і Metathermics мають збігатися з knowledge/ — не вигадувати локальний варіант у діалозі"
  - "Терміни з глосарію в цьому вузлі: burrower → копака, rathound → щурчак, hopper → стрибун, psi beetles → псі-жуки, mindshroom → Гриб Розуму, SGS → ССГ, GMS → лишати латиницею, Biocorp → латиницею, Foundry → Ливарня, Core City → Центральне Місто, Black Sea → Чорне Море, Faceless → Безликі"
  - "«Bret» у q159, q179, q288, q300 — це Big Bret з реєстру (Великий Брет); коротка форма в українському тексті має лишатися впізнаваною"
  - "«\\n\\n» — службовий розрив рядка, переносити як є, не замінювати на реальний перенос"
  - "q303–q305 — сцена першого знайомства; тут закладається базове «ви», далі не збиватися"

