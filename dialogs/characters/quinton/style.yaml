    src: "Pyrite? But pyrite is gold-colored"
    note: >-
      Каламбур на почутому: гравець каже «pirate», Квінтон чує «pyrite».
      Калька неможлива — потрібна українська пара співзвучних слів
      (пірит / пірат), інакше репліки a26–a28, a72–a74 і q27–q29 розпадаються.
      Перекладати цей ланцюжок як один блок.
