speakers:
  - slug: quinton
    name: Квінтон
    units: default
    confidence: certain
    evidence: [q304, q303, q108, q125]
    role: >-
      Біолог і хімік ССГ, тримає лабораторію з грибними теплицями й розтинає
      місцевих істот заради залоз і зразків; водночас учитель метатермії.
      Говорить як науковець-лектор: довгі пояснювальні періоди, терміни,
      постійні уточнення й застереження щодо власної компетенції.
    relationships:
      - "Великий Брет — колега по станції, змусив позбутися щурчаків після інциденту"
      - "Таннер — керівництво станції, до нього Квінтон готовий апелювати"
      - "Езра — визнає його вищим фахівцем із псі, відсилає гравця до нього"
      - "Паскуале — до нього відсилає з питаннями хімії препаратів"
      - "Чувак — замовник грибів і трав, Квінтона він спантеличує"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службовець станції, не свій і не вуличний: звертається на ім’я
        («I'm back, $(context.player.Name)»), просить дозволу на питання
        («May I ask where you found this carbonized man?»), пропонує руку при
        знайомстві. Ставлення шанобливо-колегіальне, без панібратства —
        STYLE §3.2. Репліки гравця дзеркалять «ви» (§3.3).
      gender_cues: []
      switches:
        - {unit: q220, to: ви, trigger: "обурення («Unacceptable!») — це підвищений тон, а не перехід на «ти»; базу тримати"}
    voice:
      register: стриманий, ввічливий, лекторський; захоплення показує через темп, а не через лайку
      idiolect:
        - "нав’язливе «Hm.» — словесний тик, ставити й у середині, і в кінці репліки («hm?», «Hm, well…»)"
        - "подвоєння на знак згоди: «Yes, yes», «sure, sure», «wait, wait, wait»"
        - "самопоправки й вставні уточнення через тире — «carbon allotropes - different forms in which an element can exist - produced naturally»"
        - "термінологія без спрощення: pyrolysis, carbonization, ossification, hydroxylapatite — передавати фаховими українськими відповідниками, не побутовими"
        - "«I'm just speculating», «I am no geologist» — постійне обмеження власних тверджень"

