speakers:
  - slug: ohad
    name: Огад
    units: default
    confidence: certain
    evidence: [q6, q9]
    role: >-
      Холодний, стриманий замовник, який доручає гравцеві публічно викрити торгівця
      Деніела Арду. Мотив приховує («It's a personal matter»), тримає дистанцію
      й розмовляє суто по-діловому.
    relationships:
      - "Деніел Арда — мішень доручення; особисті рахунки, які Огад відмовляється пояснювати"
      - "Джек Квіксілвер — посередник, який надіслав гравця; Огад визнає його як сторону угоди"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Мова без скорочень-просторіч, повні синтаксичні конструкції, службовий тон:
        «I hope I was clear enough, the rest is up to you», «Time is of the essence».
        Ремарки двічі підкреслюють холодність — «a stare as warm as a glacier» (q6),
        «::He answers in a calm manner.::» (q8, q36). Гравець дзеркалить діловий тон.
    voice:
      register: холодний, діловий, контрольований; жодного підвищення голосу
      idiolect:
        - "анафоричне «I want…» у q12 і q23 — тричі поспіль, ритм наказу зберігати"
        - "усмішка й смішок подаються лише ремаркою, ніколи вигуком у мовленні"
        - "уривчасте «Yes, yes...» (q31) — єдиний вияв нетерплячки"

