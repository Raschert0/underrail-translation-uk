speakers:
  - slug: vencel
    name: Венцель
    units: default
    confidence: certain
    evidence: [q28, q35, a27, a40]
    role: >-
      Наглядач стрілецького полігону ССГ: проводить вступне випробування
      новоприбулого, підбиває підсумки й відсилає результати Таннеру. Після
      вступу лишається балакучим завсідником бару з набором коротких реплік.
    relationships:
      - "Таннер — начальник; йому Венцель надсилає результати тестування"
      - "Гарольд — технік, якого доведеться кликати лагодити розбиті камери"
      - "Ньютон — Венцель кепкує з нього й переказує гравцеві його образи"
      - "Арлін — куховарка; її суп із мізків псі-жука — постійний привід для жарту"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Попри службову роль, весь мовний відбиток розмовний і панібратський:
        «Man...», «That’s the stuff», «that dude», «Nope», анекдоти, позіхання,
        розіграш із «below average». Гравець у a47 звертається «Come on, man» —
        дзеркалення дає «ти» (STYLE §3.3). Формальних маркерів немає:
        $(#sir/ma’am) у вузлі не трапляється жодного разу.
      switches:
        - {unit: q39, to: ти, trigger: "процедурні інструкції на полігоні — тон офіційніший, але регістр не змінюється"}
    voice:
      register: >-
        доброзичливий, втомлений, жартівливий; наскрізний мотив — він ледве не
        засинає (позіхає в q17, q31, q35, q48, q57)
      idiolect:
        - "коротке відрубане «Nope.» замість «No»"
        - "вигук «Man!» як реакція на прикрість — не звертання, а емоція"
        - "лайка з підземним колоритом: «What the rocky hell»"
        - "розіграш із удаваним поганим результатом (q48 → q50/q53/q55) — три варіанти однієї розв’язки, тон має збігатися"

