speakers:
  - slug: mitchell
    name: Мітчелл
    units: default
    confidence: certain
    evidence: [q4, q6, q12]
    role: >-
      Недалекий говіркий мешканець Центрального Міста, який плутає імена й
      факти і кожну історію завершує однією й тією самою відмовкою. Комізм
      вузла тримається на повторі, а не на змісті окремих реплік.
    address:
      npc_to_player: ти
      player_to_npc: —
      basis: >-
        Фамільярне панібратство з першого рядка, плутання імен співрозмовника,
        жарти про пердіння — «ти», STYLE §3.2. Реплік гравця у вузлі немає.
    voice:
      register: простакуватий, безтурботний, з постійним хихотінням
      idiolect:
        - "смішок «he-he-he» — словесний тик (q2, q4, q6, q12), тримати однаковою формою"
        - "рамка «I once tried … Never again.» повторюється п’ять разів (q3, q5, q7, q9, q13) і виноситься в окрему репліку q11 — переклад мусить бути дослівно тим самим, інакше повтор як жарт розсиплеться"
        - "«Yesh?» (q8) — недбала вимова «Yes?», відтворювати спотворенням, а не нормативним «Так?»"

