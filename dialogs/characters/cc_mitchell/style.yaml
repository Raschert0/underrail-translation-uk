pitfalls:
  - "q4 «$(#Peter/Olga)» і «$(#Branislav/Manjula)» — гендерні плейсхолдери з вигаданими іменами, якими Мітчелл навмання називає гравця; імена мусять бути українськими й обидві гілки заповнені, STYLE §2. Пуант — «it all sounds the same anyway», тож пари мають лишатися явно різними іменами"
  - "«Osmond Knight… or was it Angbond» — Knight → Найт (реєстр); Osmond і Angbond канонічних варіантів не мають, а «Angbond» є навмисним перекручуванням прізвища — спотворення зберегти"
  - "burrower → копака (глосарій); crossbow — арбалет"
  - "«Motion» (q9) — власна назва закладу, не рух як явище"
  - "«Slow Rain» — назва книжки, зберігати як назву"

