pitfalls:
  - "«pipeworker» має канонічний варіант у глосарії — «труболаз». Тут це образа (q49, q64), але слово те саме; іншого синоніма не вигадувати."
  - "hardcore: глосарій фіксує «Hardcore City Bar» → «Хардкор Сіті Бар», а STYLE §9 велить лишати внутрішньоігровий сленг запозиченням — тож запозичена форма має перевагу над описовим перекладом. Головне — однаковість у всіх юнітах."
  - "У вузлі немає жодного $(#…), але українська його вимагає в репліках гравця з минулим часом (a56, a67) та в іменнику «saviour» (a65)."
  - "a65 і q66 — пара «Saviour?» → відлуння. Форма в q66 має точно повторювати ту, що обрана в a65, разом із плейсхолдером."
  - "Друкарські помилки автора: «pressence» (q49, q71), «expceting» (q57), «Thats» (q37), «get of those» замість «get rid of» (q83). У цілі — правильна українська."
  - "Кількість «::» у цілі має точно збігатися з джерелом — це перевіряє tools/check-uk.ps1."
  - "Fred за реєстром — «Фред»; у q91 звучить у кличному відмінку з заїканням."

