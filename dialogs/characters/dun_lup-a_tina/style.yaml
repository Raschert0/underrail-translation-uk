      Забіякувата уціліла, що вдає незалежну одиначку («I’m not really with these guys»),
      хоча згодом сама себе видає словами «our ship» і «our crimes». Її партія тримається
      на нав’язливому слівці hardcore — це головне, що має пережити переклад.
    relationships:
      - "Fred — загиблий, за яким вона тужить лише в маренні (q4, q91)"
      - "«pipeworkers» — так вона зве нападників; для неї це лайка, а не професія (q39, q49, q64)"
    address:
