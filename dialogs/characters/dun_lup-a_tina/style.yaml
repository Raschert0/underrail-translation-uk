      basis: >-
        Вулична мова без прикрас: «ain’t fallin’», «’em», «the good ol’ hardcore way»,
        зневажливе «Thrown in here like a dog» і «::She looks down on you.::». Груба,
        своя, панібратська — «ти» за STYLE §3.2; гравець дзеркалить, §3.3.
      switches:
        - {unit: q55, to: ти, trigger: "після порятунку теплішає до вдячності, але регістр не міняє — «ти» лишається базою"}
    voice:
      register: різка, коротка, задиркувата; накази й обриви замість пояснень
      idiolect:
        - "hardcore — словесний тик у 10+ юнітах (q3, q22, q25, q37, q55, q75, q82); ОДИН український відповідник на весь вузол"
        - "dominate / dominating — другий тик тієї ж природи (q5, q79, q87)"
        - "випадання «g» і «ain’t»: «fallin’», «pummeling ’em», «ol’» — знижений регістр, не вирівнювати"
        - "відмахування замість відповіді: «Yeah, yeah.» (q34), «Just no, okay?» (q30)"

