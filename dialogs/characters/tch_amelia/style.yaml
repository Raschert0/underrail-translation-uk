speakers:
  - slug: amelia
    name: Амелія
    units: default
    confidence: certain
    evidence: [q58, q125, q132, q148]
    role: >-
      Препостор Інституту Тчорта — вона проводить вступну співбесіду з гравцем
      і після прийняття читає йому настанову про устрій Інституту. Голос
      церемонний, доброзичливо-контрольований: вона одночасно вербує й оцінює,
      тож ані теплота, ані загроза не мають звучати прямо.
    relationships:
      - "Ейдейн — засновник Інституту й Тчортизму; згадує його з пієтетом, «Eidein pardon me» — божба"
      - "Медіант Семюел, Джерре Франц, міністр Персіваль — підлеглі й колеги, називає їх із титулом"
      - "Гравець — спершу постулант, далі новіціат; вона тримає позицію старшої, але без зверхності"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Обрядова, книжна мова без розмовних скорочень, звертання за титулом
        («postulant», «novitiate») і формула вітання «Tchort is evolution» —
        STYLE §3.2 відносить такого мовця до «ви». Репліки гравця дзеркалять
        її регістр (§3.3), зокрема й звертання «Praepostor».
      gender_cues: ["$(#brother/sister)", "$(#himself/herself)", "$(#his/her)"]
      switches:
        - {unit: q104, to: ви, trigger: "різкий наказ «Just answer the question you were asked» — регістр той самий, змінюється лише тон: холодніше, коротше, без пом’якшень"}
    voice:
      register: рівний, вишуканий, обрядово-офіційний; ані фамільярності, ані сухого канцеляриту
      idiolect:
        - "«Mm-hmm» — наскрізний словесний тик, з’являється в 20+ репліках; передавати одним сталим вигуком і не варіювати"
        - "любить тире й уточнення в дужковій позиції: «protect - or preserve - Tchort»"
        - "риторичне перепитування реплікою співрозмовника: «You believe so?», «Clever you say...»"
        - "повторюване *unexpected* із зірочками — сигнал прихованої тривоги, той самий вислів мусить повторюватися дослівно в q147, q204, q216, q218"
        - "не вживає скорочених форм у настановчих монологах; поодинокі «I'm», «don't» — у живішому діалозі"

narration:
  present: true
  note: >-
    Розлогі описові блоки q56, q57, q106, q125, q132, q148, q160, q168 —
    «ви» без винятків, STYLE §3.1. Це найлітературніші сегменти вузла:
    портретний опис Амелії, побудований на розгорнутих порівняннях
    («like black oil being spilled over a shiny lump of gold»), — калькувати
    синтаксис не можна, образ треба перебудувати українською.

