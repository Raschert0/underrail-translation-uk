idioms:
  - unit: q16
    src: "Are you derailed?"
    note: >-
      внутрішньосвітова заміна «are you deranged» залізничною метафорою — калька
      «зійшов з рейок» саме тут доречна, бо метафора питома для сеттингу; нейтральне
      «ти здурів?» втрачає гру
  - unit: q9
    src: "a pair of oversized *trays*"
    note: "зневажливе применшення воріт до «тацьок»; зірочки-наголос зберегти"
  - unit: q74
    src: "more to that cave than meets the eye"
    note: "не калькувати; розмовне «тут щось не те»"
  - unit: a66
    src: "electronic gubbins"
    note: "просторічна назва дрібного мотлоху-електроніки; не термін — не перекладати як «компоненти»"
  - unit: q75
    src: "be it a cavelet or a cavern"
    note: "жартівлива пара зменшене/збільшене; зберегти протиставлення розміру"
  - unit: q159
    src: "Teamwork, man."
    note: "повторюється в a162 як відлуння гравця — обидва юніти мають дати те саме слово"

pitfalls:
  - "q40, q171 і a144 містять $(context.player.Name) — не відмінювати всередині плейсхолдера, будувати фразу так, щоб потрібен був називний"
  - "q41 і q47 — «400 SGS credits»: абревіатура за глосарієм передається як ССГ"
  - "«the Underrail» (q112) лишається латиницею й не відмінюється — глосарій; «Lower Underrail» так само"
  - "«Faceless» (a13, q103, q105) — Безликі, глосарій"
  - "«Lurkers» — назва банди, у глосарії немає; до централізованого рішення не вигадувати варіант"
  - "q120–q121: гра на тому, що Гарланд роками кликав Патріка Пірса «Danny»; обидва імені мають лишитися впізнаваними як імена"
  - "q3 має і нарацію ::…::, і пряму мову в одному юніті — регістр усередині різний: нарація на «ви», репліка на «ти»"
  - "асиндетон із крапками в q52 («no. matter. what!») — розділові зберегти"

