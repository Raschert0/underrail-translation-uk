speakers:
  - slug: harland
    name: Гарланд
    units: default
    confidence: certain
    evidence: [q5, q145, q148]
    role: >-
      Черговий охоронець воріт нижнього рівня ССГ, нервовий і балакучий; сидить сам
      біля моніторів і панічно роздуває кожну дрібницю до загрози безпеці. Його
      мова — суцільна розмовна скоромовка з тиками, і саме це, а не сюжет, диктує
      вибір слів.
    relationships:
      - "Гарольд — механік майстерні; Гарланд просить у нього бота-розвідника й «винен йому пиво» (q45, q75, q90)"
      - "Лукас — начальник, до якого Гарланд бігає зі скаргами (q8, q52)"
      - "Горський і Таннер — командування; лише їхній прямий наказ відчинив би ворота (q101, q108)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Свій, вуличний, панібратський тон: звертання «man» майже в кожній репліці,
        випадання g («waitin’», q21), «lemme», «gotta», «gonna». STYLE §3.2 — грубі
        й свої на «ти». Репліки гравця дзеркалять (§3.3), зокрема пряме звертання
        на ім’я в a84.
      gender_cues: []
    voice:
      register: розмовний, збуджений, панічний; постійно шукає підтвердження
      idiolect:
        - "«man» як вставне слово наприкінці речення — не перекладати щоразу однаково, але тик має лишитися чутним"
        - "розтягнуте «Maaan!» (q45, q141, q151) — окремий вигук розпачу, а не звертання; передавати розтягнутим українським голосним і тримати однаково в усіх юнітах"
        - "розтягнуті вигуки «Whoooooooooo!» (q3), «Oooooh» (q52) — довжину зберігати"
        - "потроєння слова на нервах: «Dammit, dammit, dammit!» (q148), «Yes, yes...» (q36, q67)"
        - "евфемістичне лайливе «freaking» (q112, q120) — не пом’якшувати до нейтрального, STYLE §9"
        - "повторюване гасло «It's dangerous out there» (q10, q43, q75) — тримати як сталу фразу"

narration:
