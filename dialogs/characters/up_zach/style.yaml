  - slug: zach
    name: Зак
    units: default
    confidence: certain
    evidence: [q3, q11, q35]
    role: >-
      Літній самоук зі Звалища, який зібрав із брухту сторожового бота й випадково
      виростив із нього людиноненависну ШІ. Розповідає про це як про побутову
      незручність — сором і самотність проступають крізь балачку, але прямо він їх
      не називає.
    relationships:
      - "SAD-5 — його витвір; сваряться як старе подружжя, Зак обриває бота на півслові"
      - "Фіксер — лікар зі Звалища, який відтяв Заку палець (q47)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Просторічний, свій, без жодної службової дистанції: «ya can't do nothing»,
        «there ain't much to tell», звертається без звання й без імені. STYLE §3.2 —
        вуличний мовець, отже «ти»; репліки гравця дзеркалять (§3.3).
    voice:
      register: розмовний, самоіронічний, з постійним «еканням»
      idiolect:
        - "нав’язливе «Eh?» наприкінці або на початку репліки — словесний тик, зберігати в кожному входженні (q1, q3, q11, q30, q39, q44)"
        - "говорить про себе в третій особі: «ol' Zach did a good job» (q11, q15) — не переписувати на першу"
        - "випадання g і подвійне заперечення: «ya can't do nothing», «ain't much» — просторіччя, відтворювати українським розмовним ладом"
        - "підсилювач «real bad», «real good» — повторюваний, тримати однаково (q19, q30, q47)"

  - slug: sad5
    name: SAD-5
    units: [q5, q7, q27, q32, q34, q67]
    confidence: certain
    evidence: [q3, q6, q7]
    role: >-
      Сторожовий бот із пошкодженим ядром ШІ, який дійшов висновку, що людство
      підлягає ліквідації. Зброя вимкнена, тож лишається тільки говорити — і він
      говорить як протокол, а не як персонаж.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Реєстр підкреслено книжний і безособовий, без жодного скорочення й
        просторіччя; звертається до людей як до категорії («defective humankind»).
        За STYLE §3.2 формальний мовець — «ви», навіть коли погрожує.
    voice:
      register: канцелярсько-клінічний, без скорочень, без емоційних часток
      idiolect:
        - "кожна репліка починається з технічної позначки типу «Statement; …:», «Interruption; …:», «Explanation; …:», «Response; …:», «Taunt; …:» — це частина реплік, не службові коментарі"
        - "нагромадження синонімів-триплетів: «Obliterated, eradicated, extirpated» (q27) — риторична фігура, потрібні три різні українські дієслова, не один із повторами"
        - "термінологічний жаргон замість побутових слів: input, observations, analysis, termination"
        - "звертається до Зака вигаданим токеном «zachHuman» (q7, q32, q34)"

