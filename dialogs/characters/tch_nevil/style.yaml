speakers:
  - slug: nevil
    name: Невіл
    units: default
    confidence: certain
    evidence: [a44, a48]
    role: >-
      Невіл — вартовий Сил Збереження, який утік з Інституту Тчорта після того, як випадково
      побачив піддослідних істот у технічній секції. Уся розмова відбувається під його
      наведеною зброєю: він переляканий, недовірливий і водночас говорить як рівний,
      бо гравець для нього — такий самий орденський «брат».
    relationships:
      - "Медіант Семюел — той, хто послав гравця по нього; згадка про Медіанта миттєво загострює недовіру (q62)"
      - "істоти під Інститутом — причина втечі; про них говорить із жахом і соромом"
      - "гравець — потенційний спільник або кат; ставлення міняється по ходу, але не регістр"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Рівний за станом орденський побратим у гострій, панічній сцені: короткі речення,
        скорочення, прямі накази («You listen to me now», «Don't lie to me!»), взаємне
        звертання «brother» і по імені. Це «свій», а не службовець при виконанні —
        STYLE §3.2; репліки гравця дзеркалять (STYLE §3.3).
      gender_cues: ["$(#*brother*/*sister*)"]
    voice:
      register: напружений, уривчастий, з нальотом орденської книжності у спокійніших місцях
      idiolect:
        - "заїкання від переляку — «W--what?», «Wh--who are you!?», «S--speak!»; відтворювати на українському приголосному (STYLE §9), подвійний дефіс зберігати"
        - "довгі зв’язні монологи-спогади (q10, q39, q41) різко контрастують із панічними вигуками — контраст не згладжувати"
        - "лайка-евфемізм замість справжньої лайки: «By the...», «This is all so dystrophic!»"
        - "уривані репліки на «I--» (q62, q70) — обрив зберігати, речення не добудовувати"

