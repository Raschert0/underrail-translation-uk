speakers:
  - slug: mac
    name: Мак
    units: default
    confidence: certain
    evidence: [q12, q62, q67]
    role: >-
      Єдиний графіті-райтер Центрального Міста, який працює в Зоні Скидання й
      вважає себе митцем; розмовляє з гравцем як із глядачем своєї творчості й
      водночас відкрито фліртує. Уразливий рівно в одному місці — оцінці його робіт.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний, панібратський мовець: «Hey, man», «babe», «ya», «gotta» —
        STYLE §3.2 дає «ти». Гравець дзеркалить (§3.3), зокрема в різкому
        a16 «Don't you throw up on me, or I'll bust your face».
      gender_cues: ["$(#man/babe)", "$(#zoner/zoner babe)"]
    voice:
      register: розслаблений, самозакоханий, вуличний
      idiolect:
        - "звертання «babe» — головна прикмета голосу, звучить і поза плейсхолдерами (q7, q47, q53, q62, q67)"
        - "нав’язливе «It makes no sense» як відмова від аргументу (q24, q35, q53, q54)"
        - "«hardcore» як універсальна похвала — спільне слівце з Максимом (cc_maxim), узгодити передачу між вузлами"
        - "проковтнуті форми: gonna, gotta, whatcha, ya, «I gotta add»"
        - "фахова зверхність до чужої роботи: «amateur work», «those dopes»"

narration:
  present: true
  note: >-
    «Ви» без винятків — STYLE §3.1, хоча сам Мак каже гравцеві «ти».
    Нарація тут описова й повторювана (q4, q25, q50, q66 — той самий жест
    «відвертається до роботи»); формулювання тримати єдиним.

new_names: ["Gauntlet"]

idioms:
  - unit: q10
    src: "I'm gonna do a throw up"
    note: >-
      «throw up» — термін графіті (заливка в один колір), а не блювання. Обрати
      український відповідник і тримати його однаково в q10, q12, q14.
  - unit: a11
    src: "You want to throw up? Are you feeling sick?"
    note: >-
      Вузол гри слів: гравець чує «throw up» як «блювати». Каламбур має вціліти —
      перекладати парою слів, де побутове значення справді читається; інакше q12 і q14,
      де Мак пояснює непорозуміння, стають беззмістовними.
  - unit: q9
    src: "I'm the only writer around here"
    note: "«writer» тут — графіті-райтер, не письменник; ключове самовизначення персонажа"
  - unit: q24
    src: "he's not up"
    note: "сленг графіті: «бути up» — мати роботи на видноті, бути відомим у сцені; калька «він не вгорі» руйнує репліку"
  - unit: q24
    src: "You're full of it"
    note: "звинувачення в брехні, знижене; локалізувати"
  - unit: q9
    src: "You do have eyes for real art"
    note: "комплімент із подвійним дном — далі одразу «Beautiful eyes»; зв’язок «очі → мистецтво → флірт» варто зберегти"
  - unit: q40
    src: "blind men can't see true art"
    note: "шпилька у відповідь на критику, продовження того самого мотиву очей"

pitfalls:
  - "q57 містить $(#/::Winks.::) — чоловіча гілка ПОРОЖНЯ навмисно. Порожню гілку лишити порожньою, підморгування додається тільки в жіночій."
  - "q46 містить $(#zoner/zoner babe) — обидві гілки починаються з «зонер»; жіноча додає пестливе звертання, а не змінює іменник."
  - "«babe» у q7, q47, q53, q62, q67 стоїть без плейсхолдера — гра звертається так до гравця будь-якої статі. Обрати нейтральне пестливе звертання, а не вигадувати новий $(#…) там, де джерело його не має."
  - "Глосарій: Core City → Центральне Місто, Free Drones → Вільні Дрони, SGS → ССГ, Hardcore City Bar → Хардкор Сіті Бар, Drop Zone → Зона Скидання, Arena → Арена, Faceless → Безликі, zoner → зонер."
  - "«Underrail» (a42) і «North Underrail» (q60) — латиницею, без відмінювання: «Північна Underrail» (глосарій, read-only)."
  - "Імена у відповідях гравця a23–a31 — Tanner, Gorsky, Big Bret, Quinton, Ezra, Lucas, Old Jonas — усі є в реєстрі; брати готові форми, не вигадувати."
  - "a19 «Meh...» — знецінювальний вигук, від нього залежить уся гілка образи (q39, q40); нейтралізувати не можна."
  - "q9 і q17 — той самий монолог про авторство графіті з різних гілок; перекладати узгоджено."

