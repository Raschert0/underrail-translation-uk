speakers:
  - slug: freddy
    name: Фредді
    units: default
    confidence: certain
    evidence: [q1]
    role: >-
      Худий торгівець їжею, увесь комізм якого — у відмові говорити. Майже
      всі його репліки складаються з одного слова або з кивка головою.
    relationships:
      - "Фред і Фредд — двоє інших торгівців із тим самим коренем імені (a10)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Побутовий торгівець без службової дистанції; його односкладові «Nope» /
        «Yup» не мають жодної ознаки ввічливої відстані — STYLE §3.2. Гравець
        дзеркалить, зокрема жартівливим «I'm waiting...» (a21).
      gender_cues: []
    voice:
      register: гранично лаконічний, флегматичний, без жодної емоції
      idiolect:
        - "«Nope» / «Yup» замість «ні» / «так» — розмовні форми, тримати їх розмовними"
        - "уся мова — одне слово на репліку; довших речень у нього лише два (q1)"
        - "жест замінює відповідь: ::He shakes his head.:: ::He nods.::"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; тут q1, q5, q8, q12, q23"

new_names: ["Rathound King"]

idioms:
  - unit: q6
    src: "Nope."
    note: >-
      Не нейтральне «Ні». Потрібне коротке розмовне заперечення, стале в усіх
      чотирьох появах (q6, q9, q14, q16, q23) — сталість тут і є характером.
  - unit: q11
    src: "Yup."
    note: "пара до «Nope»; обидві форми мають творити впізнавану пару"
  - unit: q20
    src: "Maybe... Or maybe not."
    note: >-
      Єдиний його жарт, розтягнутий на два юніти (q20 і q22). Перекладати як
      цілу конструкцію, інакше підводка й підсічка не зійдуться.

pitfalls:
  - >-
    Спокуса «дописати» відповіді до повних речень убиває персонажа. Один склад
    у джерелі — один-два склади в перекладі.
  - >-
    a10 будується на трьох майже однакових іменах: Fred → Фред, Fredd → Фредд,
    Freddy → Фредді (реєстр). Різниця має лишитися видимою, бо в ній весь жарт.
  - >-
    a3 закінчується підказкою дії ::Barter.:: — глосарій дає «::Торгувати.::»,
    інфінітив, STYLE §3.5.

examples:
  - unit: q6
    rule: "розмовне односкладове заперечення, стале в усіх появах"
    uk_fragment: "Не-а."
    status: proposed
