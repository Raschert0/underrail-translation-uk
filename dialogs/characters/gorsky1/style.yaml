narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1, навіть у q278, де нарація описує самого
    Горського. Підказки дій у ::…:: — інфінітив (§3.5): a8 ::Start the attack.::,
    a20 ::Tell Gorsky everything…::, a222 ::Offer Gorsky some money.::

unattributed_units: [q90, q143]

new_names: ["Bob", "Helaku", "Forte", "Black Crawlers", "Omega", "Gauntlet"]

idioms:
  - unit: q92
    src: "You're not bloody hoppering out on me"
    note: >-
      Гра слів на назві істоти hopper (глосарій: стрибун) у значенні «злякатися,
      дати задній хід». Калька неможлива; шукати українське рішення, яке
      зберігає зв’язок зі стрибуном, або жертвувати грою слів на користь змісту.
  - unit: q38
    src: "let the Cans run around the Underrail"
    note: >-
      Cans — зневажлива кличка солдатів Протекторату за броню («бляшанки»).
      Не власна назва: перекладати як лайливий демонім, з малої.
  - unit: q93
    src: "some zoned-up, cheapjack shield"
    note: >-
      zoned-up — вуличне «зібраний із мотлоху в Зоні», однокорінне із zoner
      (глосарій: зонер). Не калькувати; передавати як «дешева саморобка».
  - unit: q183
    src: "He kicked the bucket during sleep"
    note: "локалізувати сталим українським евфемізмом, не калькувати «відкинув відро»"
  - unit: q72
    src: "you seriously think I give a rat's ass"
    note: "груба ідіома — за STYLE §9 лишається грубою, не пом’якшувати"
  - unit: q38
    src: "they've got another thing coming"
    note: "«вони помиляються / вони ще побачать» — не калькувати"
  - unit: q127
    src: "make sure everything's indeed up to snuff"
    note: "«чи справді годяще» — не калькувати"
  - unit: q276
    src: "you're getting the boot ... The boot!"
    note: >-
      «викинемо / вилетиш» — повтор окремим рядком-вигуком є частиною погрози,
      його треба зберегти як повтор.
  - unit: q122
    src: "You pulling my leg?"
    note: "«ти з мене кепкуєш?» — не калькувати"

pitfalls:
  - >-
    q121, q122, q124, q125 — це фрагменти одного речення, які рушій зшиває
    підряд: q121 обривається на «The aforementioned », а q122 починається з
    «::just shrugs…». Порядок слів в українському перекладі має лишити стик
    граматичним; вільно переставляти частини не можна.
  - >-
    q87 не має плейсхолдера, але описує гравчиню прямо в тексті («unlike Bob,
    you're a woman»); q113 — його чоловічий відповідник. Це варіанти одного
    вузла, а не два різні рядки: q87 перекладати жіночим родом, q113 —
    чоловічим.
  - >-
    tunneler у цьому вузлі — бурова машина Безликих, а не істота. Глосарійне
    «Тунельники» (Tunnelers) сюди НЕ підходить.
  - >-
    $(context.player.Name) не відмінювати й нічим не обкладати всередині
    плейсхолдера (q39, q41, q49, q60, q92, q123, q126, q128, q133, q163, q274,
    q276). У q39 плейсхолдер стоїть окремим реченням — крапку після нього
    зберегти.
  - >-
    Літерали \n\n у q12, q21, q93, q97, q122, q124, q127, q178, q195, q197,
    q204, q205, q211, q218, q219, q237, q239, q241, q276, q281 — це розриви
    рядків рушія, лишати посимвольно.
  - >-
    Sneaky — це персонажка (глосарій-реєстр: Пронира), а не прикметник; у q39,
    q41, q43, q82, q108, q131, q145 вона адресат або згадка в третій особі.
  - >-
    Glossary-терміни цього вузла беруться готовими: Faceless → Безликі,
    Protectorate → Протекторат, Core City → Центральне Місто, SGS → ССГ,
    Junkyard → Звалище, Drop Zone → Зона Скидання, Foundry → Ливарня,
    charons → харони, burrowers → копаки, rathounds → щурчаки, zoners → зонери,
    Arena → Арена. Underrail, Biocorp, GMS лишаються латиницею й не відмінюються.
  - >-
    a179 ::[Persuade]:: — усталена форма ::[Переконати]:: (глосарій), не
    вигадувати варіант.

