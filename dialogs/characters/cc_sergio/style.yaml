speakers:
  - slug: sergio
    name: Серджо
    units: default
    confidence: certain
    evidence: [q4, q58]
    role: >-
      Торговець наркотиком Motion у Центральному Місті: стоїть біля кальяну під
      охороною тілоохоронців і продає «подорож» по дев’яносто харонів за сеанс.
      Веселий, улесливий, ухильний — «наркотик» називати відмовляється.
    relationships:
      - "тілоохоронці поруч — його, не гравцеві; у репліках не згадуються прямо"
      - "клієнти («усі коти») — його гине хтось із них, q84; турбується радше про бізнес"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Барижний зазивала: кожну репліку будує на панібратському звертанні cat,
        «you betcha», «you’re so silly», «trust me». Жодної службової дистанції —
        STYLE §3.2, «ти». Репліки гравця дзеркалять базовий регістр (§3.3),
        включно з фамільярним «C’mon, cat» у a13.
    voice:
      register: наспівний, улесливий, показово безтурботний
      idiolect:
        - "cat як звертання майже в кожній репліці — центральна риса персонажа; потрібне ОДНЕ стабільне українське слово на весь вузол, чоловічого й жіночого роду однаково (гравець може бути будь-якої статі), і воно має природно ставати у кличний відмінок"
        - "Meow! як самостійна репліка (q8, q30, q36, q59, q65, q75) — чиста звуконаслідувальна вставка"
        - "Fact! як окличне підтвердження власної тези (q28) — рубаний односкладовий вигук"
        - "виділення зірочками *obvious*, *Nope*, *unimaginable*, *very* — авторська емфаза, зірочки зберігати на слові-відповіднику"
        - "нанизування епітетів «fantastic, vivid, sensational, extraordinary» (q29) — ритмічний перелік, зберігати кількість"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; стосується великої вступної нарації q1 і ремарок ::He laughs.::, ::He points to the shisha.::"

new_names: ["Motion", "Gauntlet", "motioner"]

idioms:
  - unit: q28
    src: "the best thing since cats"
    note: "перекручене «the best thing since sliced bread»; жарт тримається на слові «коти» — має лишитися тим самим словом, що й звертання cat"
  - unit: q44
    src: "Only bullets and bolts are free in Core City - and only if you take them a certain way."
    note: "чорний жарт: «безкоштовно» отримати кулю; каламбур на take, локалізувати, не калькувати"
  - unit: q69
    src: "It's pipes and barrels of Core City."
    note: "образ «труби й бочки» = основа, кістяк міста; не дослівно"
  - unit: a37
    src: "You must be derailed to be charging that much!"
    note: "внутрішньоігрове derailed = «з’їхати з глузду» (від rail); ідіому локалізувати"
  - unit: a13
    src: "You know the drill"
    note: "не «ти знаєш дриль»; розмовне «сам знаєш, як воно»"
  - unit: q10
    src: "Wanna give it another shot?"
    note: "shot тут «спроба», а не доза й не постріл"

pitfalls:
  - "q16 будує каламбур на слові get, вихопленому з репліки гравця a15 («I'm gonna *get* going» → «*Get*... in Motion!»). a15 і q16 треба перекладати РАЗОМ, підібравши одне українське дієслово, що працює в обох; інакше жарт зникає"
  - "q47 «Y-- No.» — обірваний початок слова «Yes». Українська обірвана літера має відповідати першій літері українського «так» (напр. «Т-- Ні.»), а не лишатися латинською Y"
  - "q34+q35 і q45 — обірване речення «But you I'll charge...» з підхопленням у наступному юніті; стежити за узгодженням через межу юніта"
  - "Motion — власна назва препарату, завжди з великої, і від неї утворені get in Motion, motioner, in Motion; потрібне рішення, що дасть усі три форми одним коренем. До ухвалення — не вигадувати варіант посегментно"
  - "звертання cat вимагає кличного відмінка й нейтральності щодо статі гравця — перевірити на a13, де його вживає сам гравець"
  - "charon → харон, stygian coins → стигійські монети (глосарій); ::[Persuade]:: → ::[Переконати]:: (глосарій), дужки й :: зберігати"
  - "shisha (q17, q21, q32, q49) — кальян, загальна назва, не власна; одне слово на весь вузол"
  - "a79 ::[Debug] Test new cutscene.:: — службовий налагоджувальний рядок, не ігровий текст"

