      - "Марселла — зникла кохана; про неї говорить із болем і уриває розмову"
      - "Бекет — до нього відсилає по нагороду"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Наскрізне звертання «kiddo» (чотирнадцять разів) і формула «you are a
        part of the family now» ставлять гравця в позицію молодшого свого;
        це однозначне «ти» за STYLE §3.2. Гравець дзеркалить.
    voice:
      register: тепло-покровительський, із мітинговим підйомом, коли говорить про Протекторат
      idiolect:
        - "«kiddo» як постійне звертання — тримати ОДИН український відповідник на весь вузол, це впізнаваний маркер персонажа"
        - "зневажливе «Cans» про протекторатців, зокрема лайливе «Bloody Cans»"
        - "риторичне «Come on» на початку заперечення"
        - "подвоєння похвали: «a brilliant strategist, just brilliant»"

