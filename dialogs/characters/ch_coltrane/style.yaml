pitfalls:
  - "13 юнітів-байок (q8, q16–q28) — обірвані на середині зачини; кожен закінчується трьома крапками навмисно. Не дописувати й не завершувати думку"
  - "Ціни за поїздку йдуть парами: із націнкою на Grim Jetters (q5 сорок, q34 тридцять, q39 шістдесят) і без неї (q31 двадцять, q36 п’ятнадцять, q41 тридцять). Це різні гілки — числа не вирівнювати"
  - "У джерелі q5 стоїть fourty — одрук, читати як forty (сорок)"
  - "Зірочки навколо чисел (*fourty*, *thirty*, *sixty*) — інтонаційний наголос, зберігати"
  - "Український «піратський» говір не існує як усталений — його треба СКОНСТРУЮВАТИ один раз і тримати однаковим у 60+ юнітах: архаїчна морська лексика плюс кілька незмінних вигуків-запозичень. Не імпровізувати щоразу заново"
  - "Головна пастка вузла: не «випрямити» говір у нормативну мову. Тоді зникне сюжетний поворот q96–q106, де гравець викриває виставу"
  - "Дзеркально: у q102–q106 не залишити жодного піратського маркера — там мова має бути підкреслено звичайною"
  - "Топоніми з глосарію: Hell's Gut → Нутро Пекла, Black Sea → Чорне Море, Dreadpool → Жахлива Лагуна, Th' Rig → Платформа, Meatway → М’ясний Шлях, Chancer's Bay → Затока Авантюриста, Junkyard → Звалище, SGS → ССГ, South Gate Station → Станція Саут-Гейт, Core City → Центральне Місто, Camp Hathor → Табір Хатор"
  - "Істоти й одиниці з глосарію: hopper → стрибун, crawler → повзун, scavenger → шукач, mindshrooms → Гриб Розуму, stygian coins → стигійські монети"
  - "Cap'n — усічене captain, частина маски; за реєстром «Cap'n Svana» → «капітанка Свана», отже «Cap'n Coltrane» → «капітан Колтрейн», але усічення в українському говорі теж має бути позначене"
  - "Kareem → Карім, Rastko → Растко, Svana → Свана, Theodore → Теодор — з реєстру"
  - "Underrail (North/South Underrail) лишається латиницею й не відмінюється — глосарій"

