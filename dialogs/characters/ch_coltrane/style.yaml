speakers:
  - slug: coltrane
    name: Колтрейн
    units: default
    confidence: certain
    evidence: [q1, q102]
    role: >-
      Перевізник на власному поромі, який розмовляє вигаданим «піратським»
      говором і сипле байками — це маркетинговий образ, а не мова: під тиском
      гравця (q102–q106) він його скидає і зізнається, що конкурує з більшими
      перевізниками й годує дітей.
    relationships:
      - "Cap'n Svana і Растко — конкуренти з швидшими й просторішими поромами"
      - "дід — джерело говору й сюжетів; переказував піратські історії старого світу"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        $(#laddie/lassie) і повторюване matey — панібратське звертання (STYLE §3.2);
        воно тримається і після скидання маски: у q102 стоїть $(#man/sister).
      gender_cues: ["$(#laddie/lassie)", "$(#man/sister)", "matey"]
    voice:
      register: >-
        ДВА різні шари, і в цьому вся суть вузла. Основний — театральний
        «піратський»: хрипкий, гучний, архаїчний. У q102–q106 — тихий,
        сучасний, діловий голос без хрипу.
      idiolect:
        - "маска: вигуки Yarr / Aye / Ahoy / Blimey / Nay / Thar, зв’язка be замість am/is/are, ye замість you, стягнення th’, ’n’, ’tis, ’e, ’is, ’im, -in’ замість -ing"
        - "маска: кожна байка починається однаковою формулою «Now, matey/$(#laddie/lassie), let me tell ye a story ’bout…» — 13 юнітів, формула має бути ДОСЛІВНО однакова в усіх"
        - "справжній голос (q102–q106): звичайні розмовні стягнення ain’t, gotta, doin’, startin’ — і жодного Yarr/Aye/be"
        - "q107 — маска повертається просто посеред репліки, після ::He clears his throat.::; злам має бути чутний"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Нарація описує голос (q1 «raspy baritone»
    проти q102 «sunk a few semitones lower, no longer rasps») — це підказка
    читачеві про підробку, її не згладжувати.

