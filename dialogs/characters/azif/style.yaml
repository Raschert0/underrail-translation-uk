pitfalls:
  - "Багато реплік — фрагменти одного речення, розрізані між юнітами: q63+q64+q65, q79+q80, q82, q154+q155, q296+q297, q298+q299, q301+q302, q385, q387, q394. Не додавати крапку й велику літеру там, де фрагмент продовжується, і зберігати кінцевий пробіл перед <end>."
  - "q15, q38, q70, q74, q76, q91, q161, q487 містять $(context.player.Name) — не відмінювати всередині плейсхолдера; будувати фразу так, щоб ім’я стояло у називному (кличному) відмінку."
  - "q69: $(#men/people) — гілки в джерелі несиметричні (чоловічий рід проти нейтрального); перекладати обидві гілки українською, не лишати латиницю всередині $(#…)."
  - "a305 починається з «// todo:» — це коментар розробника, що просочився в текст; не перекладати як репліку, звірити з поточним станом файлу."
  - "q147 «with a courteous nigh» — очевидна помилка в англійському джерелі; не вигадувати сенс, лишити нейтральне закінчення фрази."
  - "Терміни з глосарію в цьому вузлі: Oculus → Окулус, Mainframe → Мейнфрейм, Godmen → Богмени, Faceless → Безликі, Tchort → Тчорт, Deep Caverns → Глибокі Печери, Core City → Центральне Місто, Black Sea → Чорне Море, Protectorate → Протекторат, Invictus → Інвіктус, charons → харони, SGS → ССГ. Underrail, Biocorp, Coretech лишаються латиницею."
  - "Числівники-суми в торзі (q262, q316, a322, a325, a328) прив’язані до ігрової логіки — цифри не змінювати."

