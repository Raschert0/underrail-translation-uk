    name: Азіф
    units: default
    confidence: certain
    evidence: [q450, q2, q61, q186]
    role: >-
      Голова Окулуса — розвідувальної організації, що наймає гравця; нелюдська істота
      з чорними безодніми очима, яка говорить повільно, книжно й ніколи не поспішає.
      Він працедавець і наставник, а не приятель: це визначає і його регістр, і те,
      що гравець базово тримає дистанцію.
    relationships:
      - "Рам-Умбра (Шість) — клієнт; Азіф прикривається контрактними обов’язками, коли не хоче говорити"
      - "Гадріан Таннер — колишній клієнт, замовник крадіжки Куба"
      - "гравець — спершу підлеглий-«окуліт», далі співрозмовник, якого Азіф визнає рівним у мисленні"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Азіф — формальний керівник організації, звертається до гравця на ім’я
        ($(context.player.Name)) і жодного разу не переходить на фамільярність;
        його мова навмисно книжна («I would not condition your contemplations
        with my own assumptions»). За STYLE §3.2 це «ви». Репліки гравця дзеркалять
        базовий регістр (§3.3), тому теж «ви» — попри поодинокі зухвалі випади.
      gender_cues: ["$(#men/people)", "$(#man/woman)"]
      switches:
        - {unit: q92, to: ви, trigger: "наказ «Do not pursue him» — «ви» лишається, наказовий спосіб за §3.4: «Не переслідуйте його»"}
        - {unit: q99, to: ви, trigger: "«Do not be insolent» — холодний докір, не привід переходити на «ти»"}
    voice:
      register: книжний, повільний, наставницький; довгі складнопідрядні періоди
      idiolect:
        - "нав’язливе «yes» наприкінці твердження й питання — словесний тик, відтворювати як «так?» / «так», а не викидати"
        - "«Indeed.» як окрема репліка-згода (q110, q142)"
        - "«It could be that…», «Then again…», «Perhaps» — постійне хеджування, не спрощувати до прямих тверджень"
        - "самопоправки з трикрапкою: «Yes... and no», «back when I... back when we» — паузи зберігати"
        - "майже не вживає розмовних скорочень у філософських пасажах; вони з’являються лише в діловому мовленні"

