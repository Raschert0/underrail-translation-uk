new_names: ["Rick", "Venator", "Cranium Basher", "Advatongue", "Hardokoro"]

idioms:
  - unit: q3
    src: "U speakish Advatongue?"
    note: >-
      Не перекладати нормативною мовою. Мова персонажа — суцільний зіпсований
      піджин, і українська версія має бути так само зіпсованою й упізнавано
      системною: ті самі зрощення й покручені суфікси в усіх десяти рядках.
  - unit: q7
    src: "How doo u does?"
    note: "навмисна граматична помилка джерела — відтворити помилку, а не виправити"
  - unit: q10
    src: "mindclonking yoyos"
    note: "лайка-новотвір; шукати український новотвір, не кальку"

pitfalls:
  - >-
    Головна небезпека — «причесати» мову до нормативної. Ламаність тут
    характеротворча, а не дефект джерела.
  - >-
    «Advatongue» і «Hardokoro» — покручені персонажем форми (ймовірно від
    «advanced tongue» і «Hardcore»), тож вони мають лишитися покрученими й
    в українській; до new_names внесені саме для централізованого рішення.
  - >-
    q4 «Core City dominativ!» містить топонім із глосарія — «Центральне Місто»,
    але сама фраза лишається покрученою.

examples:
