    role: >-
      Вуличний дивак із Центрального Міста, який говорить власним ламаним
      псевдодіалектом і хизується тим, що його «навчили» говорити «культурно».
      Захоплено переказує бої на Арені.
    relationships:
      - "Норман — той, хто нібито навчив його «Advatongue» (q5)"
    address:
      npc_to_player: ти
      basis: >-
        Панібратський вуличний зачіпало, який одразу лізе з жартами й
        компліментами незнайомцеві («U appar muchpretty au»); STYLE §3.2 — свій,
        вуличний, отже «ти».
      gender_cues: []
    voice:
      register: белькітливий, збуджений, вуличний
      idiolect:
        - "суцільний вигаданий піджин: зрощені слова (muchpretty, unedicatid, morenot)"
        - "«recept» замість «чути/бачити»: earrecept, eyerecept — власна словотвірна модель"
        - "вигуки-затравки: Gah!, Jaazuz!, Yay"
        - "«Truthis, truthis» — повторюване підтвердження, словесний тик"

