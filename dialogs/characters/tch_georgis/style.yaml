pitfalls:
  - "$(context.player.Name) у 18 юнітах — не відмінювати всередині плейсхолдера й не додавати до нього закінчень"
  - "q267 і q3 містять сталу формулу «Tchort is evolution» / відповідь a268 «Evolution is Tchort» — це дзеркальна пара, переклад має лишатися оберненим одне до одного"
  - "q20, q111, q113, q114, q132, q172 містять літеральне \\n\\n — переносити без змін"
  - "рвана вимова п’яного (q163 «Dr-ink», q167 «g-lad», q168 «ba-tch», q188 «Tch-ort») відтворюється на українському приголосному (STYLE §9), а не переноситься механічно на ту саму позицію"
  - "q159 «goOoOoOoOod» — розтягнутий голосний, зберегти прийом, а не писати слово нормально"
  - "q188 «ret-t-t-tarded thoughts» — образливе слово в устах п’яного; не пом’якшувати й не вилучати"
  - "a244, a254, a255, a256 — самі звуконаслідування; передавати українською фонетикою, не лишати латиницею"
  - "роки в мовленні написані словами («year ninety-eight», «around eighty-five», «year ninety-two») — зберегти словесну форму"
  - "«Investigator Octavia», «Principal Investigator Georgis», «Investigator» як звертання — звання з малої (STYLE §6, пор. «шеф Найт»), але сам термін ще не має канонічного відповідника, див. new_names"

