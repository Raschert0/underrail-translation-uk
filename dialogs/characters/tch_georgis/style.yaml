speakers:
  - slug: georgis
    name: Георгіс
    units: default
    confidence: certain
    evidence: [q267, q83, q159]
    role: >-
      Головний дослідник (Principal Investigator) і керівник Відділу хімії в
      Інституті Тчорта; веде дві побічні лінії — польове випробування кислотного
      пістолета XAL-001 і пошук даних у Hecate Research Outpost. Хронічно
      недосипає (позіхає майже в кожній сцені) і потайки жене власний алкоголь.
    relationships:
      - "Октавія — його дослідниця, сидить під дверима кабінету; до неї він відсилає гравця по хімікати та по аналіз"
      - "Ейдейн — предмет побожної шани, його ім’я у формулі вибачення"
      - "Ріста і Штефф — двоє інших головних дослідників, єдині, кому він довіряє дегустацію"
      - "Лідія (Episkopos) — вища за рангом; він обіцяє згадати перед нею заслуги гравця"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Учений і керівник відділу, який щойно познайомився з гравцем: розгорнутий
        книжний синтаксис, майже без скорочень, формульні перепрошення
        («Pardon me», «Allow me to explain what I meant», «It is... appreciated»).
        Це випадок STYLE §3.2 «формальні, службові» — «ви». Звертання
        $(#brother/sister) тут не панібратство, а обрядова формула секти й
        нормально співіснує з «ви». Репліки гравця дзеркалять базу (STYLE §3.3),
        включно з підкреслено ввічливим «Pleasure to meet you, Investigator».
      gender_cues: ["$(#brother/sister)", "$(#Brother/Sister)", "$(#men/women)"]
      switches:
        - {unit: q159, to: ти, trigger: "сцена пиятики: від q159 і далі він п’яний, мова розсипається на склади, він освідчується у приязні — тут «ви» звучало б штучно"}
        - {unit: q208, to: ти, trigger: "початок дегустації за зачиненими дверима — та сама сцена, вхід у неї"}
    voice:
      register: книжний, багатослівний, доброзичливо-педантичний; у сцені пиятики — розпливчастий і сентиментальний
      idiolect:
        - "«apex» — головний словесний тик, тчортистський сленг у значенні «найвищого ґатунку»; у ~25 репліках. Потрібне ОДНЕ українське слово, повторюване дослівно скрізь, а не синоніми до смаку"
        - "«Yes, right...» — заповнювач на початку репліки, теж має бути сталою формулою"
        - "«Magnificent Tchort!» / «By the Tchort» — вигук-божба; «Eidein pardon me» — формула вибачення"
        - "«Oh, oh, oh» — потрійне вигукування у вітанні та схваленні (q267, q159, q222)"
        - "::He yawns.:: — наскрізний ремарковий рефрен, тримати однаково в усіх юнітах"
        - "у сцені сп’яніння слова рвуться дефісом: «Dr-ink», «g-lad», «ba-tch», «pr-incipal», «in-stituti-on»"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Увага: частина q-юнітів — це не мовлення
    Георгіса, а нарація від другої особи про гравця (q4, q82, q83, q95, q158,
    q161, q165, q211, q216, q221, q228, q241, q242); мовець там відсутній.
    Підказки дій у ::…:: усередині a-юнітів — інфінітив (STYLE §3.5):
    ::Get ready.::, ::Smell the drink.::, ::Take the shot.::

