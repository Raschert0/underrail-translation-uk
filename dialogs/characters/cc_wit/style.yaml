speakers:
  - slug: wit
    name: Віт
    units: default
    confidence: certain
    evidence: [q18, q19, q22]
    role: >-
      Здитинілий старий генетик, який колись працював над «The Ark»; розум майже
      згас, мова розсипана на уривки. Впізнає гравця лише тоді, коли той
      назветься Аль Фабетом — його колишнім асистентом, і аж тоді говорить
      зв’язними реченнями.
    relationships:
      - "Аль Фабет — колишній асистент; лише це ім’я пробиває його марення (q18, q19)"
      - "Азіф — згаданий гравцем як той, хто його прислав (a11)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Більшість реплік — марення ні до кого. Там, де Віт таки звертається, він
        говорить до «Аля» як до свого молодшого помічника: хапає за голову,
        трясе за плечі, «You're going to love this» (q22) — це близька,
        нецеремонна мова. Гравець дзеркалить, STYLE §3.3.
      gender_cues: ["$(#man/woman)"]
    voice:
      register: уривчастий, маячливий; шепіт ученого, що втратив нитку
      idiolect:
        - "багатокрапка як основний розділовий знак — рвана фраза, а не пауза для ефекту; зберігати кількість крапок і місце обриву"
        - "нав’язливий образ довгих ниток: «long strands» (q2, q7), «long branches» (q21, q41), «long spirals» (q8, q42) — три різні англійські слова, три різні українські, але один упізнаваний мотив"
        - "рвана фраза без підмета, часто без завершення: «We do not need... to know anything...»"
        - "у нападі люті мова різко твердішає й стає зв’язною (q15) — контраст із маренням має чутися"

narration:
  present: true
  note: >-
    Нарації тут більше, ніж прямої мови: майже половина q-юнітів — самі ремарки
    (q10, q16, q25, q27, q43). Звертання до гравця в них — «ви» без винятків,
    STYLE §3.1, навіть коли сам Віт каже «ти».

new_names: ["Nosek", "The Ark", "Adahn"]

