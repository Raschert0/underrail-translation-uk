    src: "The name rings a bell for him"
    note: "нарація; не калькувати дзвіночок — «щось у ньому озвалося»"
  - unit: q15
    src: "selfish cannibalistic... bloody... rathounds"
    note: >-
      Лайка, розірвана паузами. Грубе лишається грубим — не пом’якшувати,
      STYLE §9. rathounds → щурчаки (глосарій).
  - unit: q23
    src: "as if he just conveyed you the meaning of life itself"
    note: "нарація-порівняння; передавати як образ, не пословно"

