pitfalls:
  - "q1 і q453 називають персонажа Jyles Pitt — ім’я Jyles канонізоване в registry.yaml, прізвище Pitt — ні, воно в new_names"
  - "«charon» / «stygian coin» — обидва є в глосарії (харон / стигійська монета); джерело вживає їх упереміш навіть у сусідніх юнітах (a52 «Pay 100 charons» vs a54 «Pay 230 charons» проти a65 «Pay 600 stygian coins»). Не уніфікувати самочинно — перекладати те, що стоїть у своєму юніті"
  - "Назви товарів і моделей — Laisum, Green Galaxy, Prestige, Classic, Black Modern, Tucker, Somnio, Corial, Debonair, Executive L, CoolMaster Medium, RotoFire, Broken Pixel, Vivid P-800, Body Domination Hex, Decimator DM-66, AT-9, HDB-01, HDB-02, CT FL127-4320 — бренд-подібні, лишаються латиницею за STYLE §6"
  - "Coretech, Biocorp, JKK, Praetorian Security, Underrail — глосарій вимагає латиниці й невідмінюваності"
  - "q59, q72/q188, q46/q197/q252, q137/q208/q296, q150/q309 — дослівні дублікати описів для різних кімнат. Переклади мають збігатися дослівно між дублікатами"
  - "Числа-словами не переводити в цифри: «two thousand five hundred charons» → словами; цифрові моделі (AT-9, DM-66) — навпаки, цифрами"
  - "q501 «Mrs. Catherine Saywick» — звертальний титул перед прізвищем; українською природніше «пані», а не «місіс»"
  - "q4 «Mister Morgan» — Morgan є в registry.yaml (Морган)"

