speakers:
  - slug: sully
    name: Саллі
    units: default
    confidence: certain
    evidence: [q36, q28]
    role: >-
      Ватажок невеликої громади вцілілих, що осіла на покинутій базі й саме зазнала
      нападу рейдерів. Говорить із гідністю й провиною, тримає слово і цим міряє
      співрозмовника.
    relationships:
      - "Bloomberg — покійний друг, який колись запечатав двері першого рівня; ключ був у нього"
      - "рейдери з табору на півночі — вороги, через них загинули люди громади"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Стійко уникає скорочень там, де розмовна мова їх вимагає: «I do not, but he
        must have had a good reason», «I do not trust you», «I think it be better if
        we left». Це книжна, підкреслено стримана мова провідника громади, що
        говорить із чужинцем, — STYLE §3.2 дає «ви». Репліки гравця дзеркалять
        базовий регістр (§3.3), навіть коли гравець грубий (a51 «Shut up and answer
        my questions») — грубість передається лексикою, а не переходом на «ти».
      gender_cues: ["$(#man/woman) of your word"]
    voice:
      register: стриманий, книжний, з нотою провини й утоми
      idiolect:
        - "майже не вживає скорочень — do not, cannot замість don't, can't; зберігати повні форми в українському відповіднику"
        - "формули честі: «I'm a man of my word», «You are a $(#man/woman) of your word» — повторюваний мотив, тримати однаковий переклад в обох місцях"
        - "зривається на паузи й обриви, коли говорить про загиблих: «We... we should have left...»"

narration:
  present: true
  note: >-
    ::He sighs.::, ::He frowns.::, ::As you turn to leave he grabs your arm.:: —
    «ви» без винятків, STYLE §3.1. Підказки дій усередині :: :: — інфінітив
    (§3.5): a13 ::Jerk your arm free and leave.::

new_names: ["Bloomberg"]

