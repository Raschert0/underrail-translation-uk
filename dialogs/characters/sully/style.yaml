  - "q24 $(#man/woman) — гендер ГРАВЦЯ, не Саллі; обидві гілки українською"
  - "a42 ::[Persuade]:: і a45 ::[Intimidate]:: — назви навичок у дужках, брати з глосарію (::[Переконати]::), не перекладати вільно"
  - "Саллі — чоловік (registry: «не відмінювати як жіноче ім'я»); минулий час і прикметники в його репліках — чоловічого роду"
  - "q11 і q34 — та сама фраза «Don't forget what you promised» у двох обрамленнях; переклад має збігатися дослівно"

