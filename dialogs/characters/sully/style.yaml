    src: "I think it be better if we left"
    note: >-
      навмисне нестандартна граматика, не помилка джерела; передавати як легку
      просторічну неправильність, не вирівнювати в чисту норму
  - unit: q30
    src: "Truth be told..."
    note: "усталений зворот, не калькувати дослівно; «правду кажучи…»"
  - unit: a23
    src: "Hang in there, man"
    note: >-
      підбадьорення, а не наказ триматися за щось; «man» тут — вигук-звертання,
      не іменник «чоловік»
  - unit: q46
    src: "Your threats are empty"
    note: "«порожні погрози» — сталий український відповідник є, не описувати перифразою"

