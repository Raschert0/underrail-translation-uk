    src: "But I digress"
    note: "не калькувати; книжне «та я відхилилася від теми» — вона одразу повертається до справи"
  - unit: q12
    src: "he wasn't pleased with your performance"
    note: "«performance» тут — службова оцінка роботи, не «виступ»"
  - unit: q15
    src: "Despite that little fluke"
    note: "розмовне применшення провини; «попри ту дрібну похибку», не «випадковість»"

pitfalls:
  - "Титули Episkopos, Monsignor, Praepostor, Protonotary, Principal Investigator, novitiate — вигаданий церковно-науковий устрій Інституту; канонічних відповідників у глосарії немає, узгоджувати з сусідніми вузлами tch_*, а не вигадувати окремо"
  - "«Your Eminence» (a17, a20, a44) — звертання гравця до Лідії; форма має бути та сама в усіх трьох юнітах"
  - "«Investigation» з великої (q30, q37–q40) — назва підрозділу, а не процес розслідування"
  - "Institute of Tchort → «Інститут Тчорта» (глосарій); Tchort → «Тчорт»"
  - "$(context.player.Name) стоїть у кличній позиції в більшості q-реплік — плейсхолдер не відмінювати, перебудовувати фразу навколо нього"
  - "«Tchort is evolution» / «Evolution is Tchort» — обрядова формула-відгук; дзеркальний порядок слів обов’язково зберегти в обох напрямках"

