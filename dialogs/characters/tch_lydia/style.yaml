speakers:
  - slug: lydia
    name: Лідія
    units: default
    confidence: certain
    evidence: [q5, q50, q57]
    role: >-
      Епіскопос Лідія — керівниця всіх трьох відділів Дослідження в Інституті Тчорта,
      майже десять років на посаді. Говорить як високопосадовиця, що вирішує кар’єру
      співрозмовника: холодна ввічливість, оцінка «послужного списку», жодної теплоти.
    relationships:
      - "Ріста — головний дослідник, який заперечував проти зустрічі з гравцем; Лідія переказує його заперечення підкреслено дистанційовано"
      - "Ейдейн — «його світлість», вища за неї особа; згадує його з пієтетом («Eidein pardon me»)"
      - "Амелія — праепостор, до якої вона відсилає гравця за подробицями"
      - "Ленора — монсеньйор, взірцева попередниця, з якою вона порівнює гравця"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова особа найвищого рангу в розмові-співбесіді; жодного панібратства,
        повні форми, накази подані як прохання («I ask of you to make your questions brief»).
        Гравець послідовно звертається «Your Eminence» — це закріплює «ви» з обох боків
        (STYLE §3.2, §3.3).
      gender_cues: ["$(#brother/sister)"]
      switches:
        - {unit: q57, to: ви, trigger: "докір «you should learn some manners» лишається на «ви» — холодність, а не зрив на «ти»"}
    voice:
      register: формальний, церковно-бюрократичний, стримано зверхній
      idiolect:
        - "нав’язливе «Mmm»/«Mmmm» на початку реплік — мовний тик, зберігати як «Ммм»/«Мммм», не викидати"
        - "довгі періоди з підрядними, кома-крапка-з-комою; не дробити на короткі речення"
        - "канцелярська лексика оцінювання: «record», «performance», «satisfying»"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; тут це q2 (портретний опис) і короткі ремарки «::She nods.::»"

new_names: ["Lenora"]

