speakers:
  - slug: jerre
    name: Джерре Франц
    units: default
    confidence: certain
    evidence: [q2, q30]
    role: >-
      Слідчий медицини та протофізик Інституту Тчорта, крамар ліків і платний
      лікар. Мовець книжний, багатослівний і підкреслено делікатний — це
      єдиний вузол, де довгі підрядні речення в перекладі є рисою персонажа,
      а не недоглядом.
    relationships:
      - "Тчортисти — «наші брати»; себе позначає абревіатурою IM"
      - "Томас Гардінг (Tom) — покійний колега, через якого прийшов до Інституту"
      - "Безликі — предмет відразливості; Вільні Дрони — винуватці смерті Тома"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службовець і платна обслуга (огляд за двадцять харонів), мова без
        просторіччя й без скорочень — STYLE §3.2. Ритуальне «$(#brother/sister)»
        тут релігійне звертання ордену, а не панібратство, і «ви» не скасовує:
        «брате, чи можу я вам допомогти». Гравець дзеркалить — STYLE §3.3.
      gender_cues: ["$(#brother/sister)", "$(#Brother/Sister)"]
    voice:
      register: тихий, ввічливий, книжний; проповідницький пафос про Тчорта
      idiolect:
        - "ритуальні формули «Tchort is evolution», «Tchort guide you» — сталий переклад по всьому корпусу"
        - "вигук «Magnificent Tchort!» як божба (q26, q40)"
        - "довгі періоди зі вставними «well», «in fact», «to be precise» (q23, q25)"
        - "науковий штамп «it is the superior design. Proven.» (q19) — сухий вирок, не пом’якшувати"
        - "єдиний зрив у грубість — «corrupted, inbred, dystrophic...» (q30), лишається різким"

