  - "«IM» (Investigator of Medicine) у q2 — самоназва-абревіатура; рішення про звання й скорочення потрібне централізоване, не вигадувати тут"
  - "«charons» (q10, q16) і «stygian coins» (a11) — різні одиниці глосарію: харон і стигійська монета"
  - "«Institute of Tchort» → Інститут Тчорта, «Free Drones» → Вільні Дрони, «Core City» → Центральне Місто, «Faceless» → Безликі — усе з глосарію"
  - "«Underrail» лишається латиницею й не відмінюється; складені «North/South/Upper Underrail» — у new_names"
  - "«rassophores» (q27) — рясофори, за приміткою реєстру до Payam"
  - "«Minister Percival» → Персіваль; «Assistant Minister» — звання, потребує єдиного рішення"

