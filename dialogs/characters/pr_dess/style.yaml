      Убивця з CAU Протекторату, колишня вчителька математики з Гексагона; отруює
      ворогів кислотними болтами й відверто насолоджується вбивством. Її веселість
      і хихотіння накладені на людожерський зміст — це головний ефект, який має вціліти.
    relationships:
      - "Cap (Captain Mareth) — командир, вона говорить про нього із замилуванням (q19, q20)"
      - "Void — напарник, «ідеальний друг», бо мовчить (q22, q24, q25)"
      - "гравець — «Corps», рівня їй за фахом убивці, звідси панібратство"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Десс від першої репліки чіпляє гравцеві прізвисько «Corps»/«Corpsie», тицяє
        його в спільне ремесло («it's what you and me are best at») і глузує
        («what kind of a pansy») — свій до свого, вулична панібратськість (STYLE §3.2).
        Гравець дзеркалить (§3.3), зокрема в a5 «I’d kill you right now if I could!».
    voice:
      register: манірно-весела жорстокість, хихотіння впереміш із описами вбивств
      idiolect:
        - "нав’язливе ::She giggles.:: — словесно-жестовий тик, повторюється 10+ разів; не прибирати й не варіювати щоразу різними словами"
        - "випадання g: killin', takin', hidin', somethin', turnin' — розмовна редукція"
        - "звертання «Corps» / пестливе «Corpsie» — звужена форма Corporal, її фірмова манера"
        - "подовження голосних на письмі: «Aaand», «Aaah» — зберігати як є"
        - "ain't, doncha, whatcha — стягнення, шукати українські розмовні відповідники, не книжні"
        - "капслок HA-HA! (q28) — реєстр крику, не пом’якшувати"

