    units: default
    confidence: certain
    evidence: [q2, q4]
    role: >-
      Слідчий Інституту Тчорта при прискорювачі частинок, крамар
      високотехнологічних деталей за дозволом Штеффа. Говорить рівно й
      беземоційно — реченнєва інтонація має лишатися пласкою навіть там, де
      зміст захопливий.
    relationships:
      - "Штефф — головний слідчий, керівник Відділу фізики й безпосередній начальник"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службовець на робочому місці, мова без просторіччя, без скорочень і без
        емоційних маркерів («I cannot spare», «I must have permission») —
        STYLE §3.2. «$(#brother/sister)» тут статутне звертання ордену, не
        панібратство. Гравець дзеркалить — STYLE §3.3.
      gender_cues: ["$(#brother/sister)"]
    voice:
      register: рівний, технічний, беземоційний; ввічливість без теплоти
      idiolect:
        - "механічна ввічливість-заповнювач «No problem at all», «Of course», «Precisely»"
        - "тчортистський схвальний присудок «Apex, is it not?» (q30) — сленг ордену, той самий відповідник, що й у tch_lal"
        - "точні числівники й терміни підряд (q27, q32) — не спрощувати до побутової мови"
        - "ритуальні формули «Tchort is evolution», «Tchort guide you» — сталий переклад по корпусу"

