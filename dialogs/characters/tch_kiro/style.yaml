  - "«brother» у a3 написане без плейсхолдера — це звертання гравця до NPC-чоловіка, тож форма фіксована, не гендерна"
  - "«::[Mechanics]::», «::[Electronics]::» — назви навичок у дужках, беруться з глосарію навичок, а не перекладаються заново"
  - "«Investigator» і «Principal Investigator (PI)» — звання; PI у q14 подано абревіатурою, потрібне єдине рішення для повної й скороченої форми"
  - "«super steel» (a6, q7, q32) — назва матеріалу, має бути та сама в усіх трьох"
  - "«Institute» → Інститут Тчорта, «Surface» — велика літера значуща (поверхня як топонім)"
  - "«Schteff» → Штефф за реєстром; «Kiro» → Кіро"

