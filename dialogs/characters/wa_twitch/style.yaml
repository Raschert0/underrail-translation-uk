      відірватися від них, тому кожну репліку рве навпіл. Видає гравцеві виводок копаки
      для стеження й переказує зібрані ним відомості.
    relationships:
      - "Азіф — той, хто його завербував; про нього говорить із пієтетом"
      - "Абрам — згаданий у нарації q22 як той, хто раніше так само «говорив» до виводка"
      - "шестипалий кіборг у q56 — клієнт, до якого забороняє підходити"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Панібратський вуличний тон без жодної службової дистанції: «Hey; hey; hey»,
        «It's creeping me out, man», «I'm your man», звертання на ім'я з першої репліки.
        Колишній наркозалежний із Центрального Міста, не обслуга — STYLE §3.2.
      gender_cues: []
    voice:
      register: гарячковий, деренчливий, фамільярний; мова женеться поперед думки
      idiolect:
        - "нав'язливе «Hmmm? I said, …» — перепитує себе й одразу повторює сказане; це головний тик, він має лишитися дослівним повтором"
        - "потрійні викрики через крапку з комою: «hey; hey; hey», «more; more» — пунктуацію джерела зберігати"
        - "обриви слова навпіл, коли він зиркає на монітор: «so fa-- … --r», «impa-- … --tient»"
        - "телеграфні переліки дієслів без сполучників: «Scrutinize, study, analyze»"
        - "невмотивовані вставні зауваження про зовнішність гравця (q12, q13) — подаються тим самим рівним тоном, без єхидства"

