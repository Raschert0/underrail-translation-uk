    rule: "службовий регістр «ви», наказовий спосіб успадковує вибір — STYLE §3.4"
    uk_fragment: "Наступний, будь ласка."
    status: proposed
  - unit: a3
    rule: "Doc → «док» за реєстром, з малої"
    uk_fragment: "доку"
    status: proposed
