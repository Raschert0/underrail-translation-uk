    role: >-
      Кураторка Бібліотеки Ейдейна в Інституті Тчорта. Говорить майже пошепки,
      надзвичайно ввічливо; щиро закохана у свою бібліотеку й у Первісний Звіт.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Служба при бібліотеці, підкреслено ввічлива мова з постійним «please»
        і формулою $(#brother/sister) — «ви» за STYLE §3.2. Гравець тримає
        той самий шанобливий тон, звертається «sister» (§3.3).
      gender_cues: ["$(#brother/sister)"]
    voice:
      register: тихий, церемонний, книжний
      idiolect:
        - "нав’язливе «please» як пом’якшувач — q5, q7, q8; не вирізати"
        - "подвоєння для наголосу: «a completely, completely different matter»"
        - "звертання «novitiate» до гравця замість імені — послідовно в q5, q8, q18"
        - "довгі складнопідрядні періоди в довідкових репліках q17, q25, q26 — не дробити на короткі речення"
        - "ритуальні формули вітання й прощання: «Tchort is evolution», «Tchort guide you», «Read well»"

