speakers:
  - slug: johan
    name: Йоган
    units: default
    confidence: certain
    evidence: [q1, q5, q7]
    role: >-
      Торговець брухтом на Звалищі; його купа мотлоху служить орієнтиром для інших
      персонажів. Продає без гарантій і про це чесно попереджає.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Гендерних плейсхолдерів у вузлі немає, тож рішення за STYLE §3.2 і оточенням:
        це вуличний торговець зі Звалища, де всі сусідні мовці на «ти», і мова в нього
        невимушена — «I got you covered», «But no refunds!». Прямої грубості немає,
        тому «ти» тут ділове-свійське, без розв’язності Елвуда.
    voice:
      register: діловитий, спокійний; коротко й по суті, без діалекту
      idiolect:
        - "мова стандартна — жодного випадання g і подвійних заперечень; це і є прикмета, що відрізняє його від Арчі, Горта й Елвуда в тому самому Звалищі"
        - "перекладання відповідальності на покупця: «It won't be my fault if you buy the wrong thing»"

