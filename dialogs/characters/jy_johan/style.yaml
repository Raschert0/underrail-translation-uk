  - "Colton є в реєстрі — «Колтон»"
  - "a3 і a8 ::Barter.:: / ::Barter:: — підказка дії, інфінітив (STYLE §3.5); у a8 в оригіналі немає крапки перед закриттям — пунктуацію оригіналу не «виправляти»"
  - "a6 «Armadillo class drill rotor circuit board» — той самий рядок, що й у jy_gort a4; переклад мусить збігатися дослівно"
  - "«Junkyard» як контекст — «Звалище» за глосарієм"

