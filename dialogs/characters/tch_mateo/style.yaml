pitfalls:
  - "«minions» — його підпорядковані істоти, наскрізний термін вузла; один відповідник на всі юніти (q13, q19, q23, q40, q53)"
  - "Efreitor і rassophore — звання; за registry «Rassophore Payam → рясофор Паям», отже rassophore → «рясофор» з малої"
  - "«Preservation» (q5) — назва підрозділу Інституту, з великої, не «збереження» як процес"
  - "«Surface» з великої (q37) — поверхня світу, топонімічне значення"
  - "q41 містить $(context.player.Name) посеред обірваної фрази — не відмінювати плейсхолдер, паузи довкола нього зберегти"
  - "a21, a55, a73 містять службову підказку ::Attack!:: / ::Fight!:: — це підказка дії, інфінітив (STYLE §3.5)"
  - "«brother» у репліках гравця (a4, a58) — орденське звертання, не родинне"

