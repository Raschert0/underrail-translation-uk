speakers:
  - slug: mateo
    name: Матео
    units: default
    confidence: certain
    evidence: [q5, q78]
    role: >-
      Єфрейтор Матео — рясофор Збереження, який застряг перед Монолітом і втратив себе:
      підпорядкував собі місцевих істот і дав їм зжерти власний загін. Говорить як людина,
      що майже не повертається до співрозмовника — уривками, з довгими паузами.
    relationships:
      - "Медіант Семюел — той, хто відправив загін; Матео дякує йому без іронії"
      - "рясофори його загону — «consumed»; він визнає провину, але вважає її виправданою"
      - "Моноліт — джерело «істини»; не особа, але звертається до нього як до сили"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Незнайомець із чернечого ордену, урочистий фрагментарний лад, жодних розмовних
        маркерів, звертання до гравця майже немає — тримаємо «ви» (STYLE §3.2).
        Гравець кличе його «brother» — це орденське звертання, воно не переводить розмову
        на «ти»: репліки гравця дзеркалять базовий регістр NPC (STYLE §3.3).
      switches:
        - {unit: q64, to: ви, trigger: "пряма погроза лишається на «ви» — вона тим страшніша, що холодна"}
    voice:
      register: монотонний, марення, урочисто-відсторонений
      idiolect:
        - "три крапки як основний розділовий знак — кількість і місце пауз зберігати юніт у юніт"
        - "повтори-відлуння: останнє слово репліки гравця повертається окремим рядком (q23 «Minions...», q30 «Questions...», q75)"
        - "нав’язливе «the truth» — наскрізний рефрен, перекладати ОДНИМ сталим словом у всіх юнітах"
        - "речення обриваються без завершення; не добудовувати їх до граматично повних"

