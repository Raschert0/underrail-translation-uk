pitfalls:
  - >-
    Глухота Форда — механіка вузла: a154 «I said: Nice catch.» дослівно повторює a164
    «Nice catch.», a159 повторює a165, a90 повторює a88, a10 повторює a8. Повторювані
    репліки МУСЯТЬ збігатися слово в слово з першими, інакше жарт розсипається.
  - "a10 набрано ВЕЛИКИМИ ЛІТЕРАМИ (гравець кричить) — капіталізацію зберігати повністю."
  - >-
    q31 і q38 обриваються на $(context.npc_jy_ford_whatHeNeeds) — плейсхолдер дописує
    речення списком риби. Будувати фразу так, щоб продовження стало на місце; крапки
    в кінці не додавати, плейсхолдер не відмінювати.
  - >-
    q68 закінчується пробілом і переходить у q69 — це одне розірване речення
    («I told you » + «I betcha couldn't bring me one of each...»). Кінцевий пробіл зберегти.
  - >-
    slackjaw працює водночас як назва риби (a53, q54) і як образа (q66, q114, q126).
    Український варіант має витримати обидві ролі — вибирати назву, придатну для лайки.
  - >-
    Ford наполягає на «Mr. Ford» проти прізвиська «Geezer Ford» (q22, q143) — це
    сюжетний конфлікт вузла. Форма звертання має бути помітно різна: шаноблива й глузлива.
  - "hopper → стрибун (глосарій) — і в q98/q128/q131 як складник лайки, і в імені Hopper Jim."
  - "South Underrail → «Південна Underrail» (глосарій: Underrail не перекладати й не відмінювати)."
  - "$(context.player.Name) в a21 і a140 — не відмінювати всередині плейсхолдера."

