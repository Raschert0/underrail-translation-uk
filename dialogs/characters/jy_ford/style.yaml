speakers:
  - slug: ford
    name: Форд
    units: default
    confidence: certain
    evidence: [q22, q97, q128]
    role: >-
      Старий глухуватий рибалка з кульгавою лівою ногою, який вважає себе найкращим
      рибалкою Південної Underrail і смертельно ображається на будь-який сумнів у
      цьому. Уся його мова — це хвастощі, кпини й вимога звати його «містером Фордом».
    relationships:
      - "Гоппер Джим — сусід біля намету, суперник; спіймав червоного вугра на п’ятдесят кіло, і Форд цього не пробачив"
      - "Гравець — «$(#son/woman)» згори вниз; від першої репліки і до кінця тримає позицію старшого"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Грубий вуличний старий, який звертається до гравця як до дитини
        («$(#son/woman)», «$(#son/daughter)») і лається — STYLE §3.2. Гравець дзеркалить
        базовий регістр (STYLE §3.3), зокрема й у ввічливих репліках на «Mr. Ford».
      gender_cues:
        - "$(#son/woman)"
        - "$(#son/daughter)"
        - "$(#you little hopper son of a rail/you brainless baggage)"
    voice:
      register: гучний, хвалькуватий, задерикуватий; густе просторіччя старого
      idiolect:
        - "my → me: «me ears», «me own», «me wife's grave» — послідовна ознака, не одруківка"
        - "випадання g наскрізь: fishin', talkin', walkin', havin', bittin', matin'"
        - "стягнення: betcha, whatcha, Wha'?, 'T's like, 'ere замість here, 'em замість them"
        - "незмінне be замість is: «it be obvious», «it be hangin'» — навмисна неграмотність, відтворювати просторічною формою"
        - "рефрен «you dig?» / «ya dig?» (q145, q155, q158) — перекладати ОДНАКОВО в усіх трьох місцях, це словесний тик"
        - "подвоєння як ознака гніву: «Then do it. Then do it.», «Prove it. Prove it.», «Alright. Alright.» — не скорочувати до одного разу"
        - "риболовецькі назви як лайка: slackjaw, hopper, phony hopper, yo-yo"

