        - {unit: q219, to: ви, trigger: "«Do not test my patience» — погроза лишається у «ви»"}
    voice:
      register: холодний, книжний, погрозливо ввічливий
      idiolect:
        - "майже без розмовних скорочень у прямій мові — перекладати повними формами, без «шо», «нема», «здоров»"
        - "аналітичний штамп «It is my belief», «I predict», «It is left to be seen» — витримувати як мову доповіді"
        - "повторюване «In due time» (q192, q216) — той самий український відповідник обидва рази"
        - "повторюване «Understandable» (q185, q265, q323) — теж один сталий варіант"
        - "накази короткі й безособові: «Leave me», «Leave then» — імператив на «ви», STYLE §3.4"
        - "три крапки в репліках — не стилістична пауза, а слід задишки; зберігати кількість і місця"

