pitfalls:
  - "Головний гімік вузла: «::wheeze::» (глосарій — «::хрип::») стоїть УСЕРЕДИНІ речень і розриває їх. Українську фразу треба будувати так, щоб розрив падав на природну паузу — після групи підмета, перед підрядним, перед прямим додатком; не переносити хрипи в інші місця й не змінювати їхню кількість."
  - "Варіанти ремарки різні й неоднакові: «::wheeze::», «::wheeze.::» (q8, q243, q271), «::coughs::», «::cough cough::» (q277, q288, q290, q325), «::He coughs.::», «::He coughs violently.::». Кожен передавати за його власною формою, не зводити все до одного «::хрип::»."
  - "Рушій склеює сусідні юніти в одне речення. q77 обривається на «with a little help from » і продовжується або q78 «SGS.», або q83 «the Protectorate.» — український хвіст стоятиме в родовому відмінку, тож голову треба будувати так, щоб керування було однакове для обох варіантів, а самі хвости подавати вже у потрібній формі."
  - "Той самий механізм — у блоці про The Rig: q129 + q130 + (q131 | q133+q134+q135 | q136 | q137 | q138) + (q132 | …). Ці юніти не можна перекладати поодинці, не звіривши всі можливі склейки; кінцевий пробіл наприкінці фрагмента зберігати."
  - "Ще склейки: q24 → q26/q29 → q27 («...current affairs.»), q242 → q243. Багатокрапка на початку фрагмента — частина склейки, не помилка."
  - "У джерелі немає жодного «$(#…)», але українською вони потрібні: минулий час і прикметники гравця гендеровані. q2 «you helped» → «$(#допоміг/допомогла)»; репліки гравця q281, q285, q291, q304, q314 («I saw…») → «$(#бачив/бачила)». Додавати плейсхолдер там, де в джерелі його не було, — правильно, а не вільність (STYLE §2)."
  - "«$(context.player.Name) of SGS» (q189, q192, q199, q203, q207, q208, q223, q271) — усередині плейсхолдера нічого не відмінювати; будувати оболонку так, щоб ім’я лишалося в називному: «$(context.player.Name) зі ССГ». Кличний відмінок при звертанні тут неможливий."
  - "SGS за глосарієм — «ССГ», а GMS лишається латиницею; не змішувати. «South Gate Station» (q66) — «Станція Саут-Гейт»."
  - "Латиницею лишаються Underrail, Biocorp, Coretech, Praetorian Security, JKK (глосарій, read-only). «South Underrail» — «Південна Underrail», без відмінювання назви."
  - "Готові рішення глосарію, які тут густо трапляються: The Rig → Платформа, Core Ring → Центральне Кільце, Chancer's Bay → Затока Авантюриста, Camp Hathor → Табір Хатор, Drop Zone → Зона Скидання, Rail Crossing → Залізничний Переїзд, Foundry → Ливарня, Junkyard → Звалище, Old Junkyard → Старе Звалище, Ironheads → Залізноголові, Free Drones → Вільні Дрони, Protectorate → Протекторат, Faceless → Безликі, Institute of Tchort → Інститут Тчорта, Deep Caverns → Глибокі Печери, Godmen → Богмени, Oculus → Окулус, The Eye → Око, charons → харони, burrower → копака."
  - "«Foundry Guard» за глосарієм НЕ перекладається, хоча саме місто Foundry — «Ливарня»."
  - "q228 містить обірване слово з ремаркою всередині: «if y-::coughs::... if you could» — обрив має падати на початок українського слова, а не на випадкову літеру. Так само q185 «Under-- …understandable» — гра на одному слові, потрібне українське слово, що ділиться так само."
  - "q205 і q207 містять літеральне «\\n\\n» — розрив абзацу, не текст; лишати як є."
  - "q116 «from the east... from the far east», q71 «On the topic of... On the topic of...» — навмисні повтори через задишку, не помилка джерела; зберігати повтор дослівно."
  - "«Six» (q178) — прізвисько за кількістю пальців, у реєстрі його немає; до вирішення не вигадувати варіант."

