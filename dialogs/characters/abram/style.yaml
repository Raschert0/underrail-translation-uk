    evidence: [q273, q1, q207]
    role: >-
      Керівник розвідувальної мережі в Окулусі: вербує гравця, торгує інформацією
      про станції Півдня й дає ризиковані доручення. Половина вузла — його
      аналітичні брифінги про фракції, тож поряд із вербувальною погрозливою
      ввічливістю тут є цілий пласт майже енциклопедичної прози.
    relationships:
      - "Азіф — колега по Окулусу; Абрам зневажає його теорії про Богменів (q17, q20)"
      - "Карім — касир, через нього виплачують гонорар (q243, q295)"
      - "Jack Quicksilver — «associate», зв’язковий, до якого відсилають гравця (q189, q204)"
      - "Мора — ув’язнена, звільнення якої Абрам замовляє (q227, q218)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Абрам послідовно уникає скорочень і говорить повними формами
        («I do not», «You may... not», «Do not concern yourself»), звертається
        до гравця не на ім’я, а формулою «$(context.player.Name) of SGS» —
        це дистанція наймача, а не вуличне панібратство. Репліки гравця
        дзеркалять базовий регістр — STYLE §3.3.
      switches:
