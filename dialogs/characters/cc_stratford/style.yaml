speakers:
  - slug: stratford
    name: Стратфорд
    units: default
    confidence: certain
    evidence: [q10, q58]
    role: >-
      Лейтенант Praetorian Security, вербувальник і безпосередній начальник
      гравця-енфорсера. Говорить статутно: короткі команди, повні форми без
      скорочень, постійна перевірка «Understood?».
    relationships:
      - "шеф Найт — його начальник; згадує його як інстанцію, що дає дозволи"
      - "гравець — підлеглий; звертається за званням, ніколи на ім’я"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова вертикаль без жодної фамільярності: звертається за званням
        («Recruit», «Enforcer», «civilian»), уникає скорочень (do not, cannot,
        I am), гравець відповідає «Yes, sir». STYLE §3.2 — формальні й службові
        на «ви»; гравець дзеркалить (§3.3).
      gender_cues: []
      switches:
        - {unit: q180, to: ви, trigger: "зрив на холодну зневагу — «*civilian*» замість звання; регістр той самий, змінюється температура"}
        - {unit: q123, to: ви, trigger: "роздратування («empty-headed buffoon») — грубішає лексика, не форма звертання"}
    voice:
      register: >-
        офіційно-військовий, підкреслено правильний; довгі періоди в настановах,
        рубані команди в кінці розмови
      idiolect:
        - "«Splendid!» — головний словесний тик, близько п’ятнадцяти юнітів;
           потрібен ОДИН український відповідник, ужитий скрізь однаково"
        - "«splendiferous» (q133) — навмисне вигадливе роздування того самого
           кореня; має відрізнятися від звичайного «Splendid», але лишатися
           впізнаваним як його форма"
        - "«Dismissed.» — статутна формула завершення, не побутове «Ідіть»"
        - "«Understood?» / «Is that correct?» — контрольні питання, повторювані
           дослівно; тримати сталу формулу"
        - "принципова відсутність скорочень — ознака персонажа; українською це
           повні книжні форми, без розмовних стягнень"

