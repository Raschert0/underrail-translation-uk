speakers:
  - slug: hutch
    name: Гатч
    units: default
    confidence: certain
    evidence: [q1, q42]
    role: >-
      Молодий вартовий при вході до бази Вільних Дронів: зустрічає гравця, проводить
      екскурсію по базі й дає характеристики всім мешканцям. Його репліки — головний
      довідник про осередок, тож імена й топоніми тут мають бути точними.
    relationships:
      - "Лазер — його пес, «my best friend»; про нього говорить з ніжністю і жартівливим пафосом"
      - "Сара — дівчина, у яку закоханий; тему обходить ніяково (q19)"
      - "Трентон — узірець, про якого говорить із захватом; Бейт — свій-у-дошку керівник"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Ровесник-побратим, вітає гравця розмовним «’Sup» і одразу переходить до
        побутових деталей аж до розташування вбиральні. Жодної службової дистанції —
        STYLE §3.2 дає «ти»; репліка гравця дзеркалить базовий регістр (§3.3).
    voice:
      register: молодий, щирий, захоплений; довгі речення з самоперебиваннями
      idiolect:
        - "розмовні зачини «’Sup», «Cool, cool», «Yay for Becket» — тримати легкими, без канцеляриту"
        - "самоперебивання: «at the… let’s see, um, north turn», «he… he truly feels» — затинання і «um/heh» зберігати, це його ритм"
        - "«Stay cool; stay free» — прощальна формула; друга половина збігається з гаслом Вільних Дронів у сусідніх вузлах, тримати сталою"
        - "гасла на підвищенні тону: «For Freedom!», «Down with the Protectorate!», «Death to Protectorate and United Stations!» — окличні, лозунгові"
        - "у q4 навмисно перемикається на рекламно-технічний стиль опису пса, а в q5 сам себе обриває — контраст стилів обов’язковий"

