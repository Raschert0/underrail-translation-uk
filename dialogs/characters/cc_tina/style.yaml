units: {total: 22, npc: 11, player: 11, empty: 2}

speakers:
  - slug: tina
    name: Тіна
    units: default
    confidence: certain
    evidence: [q7, q10]
    role: >-
      Німа бандитка, яка веде весь торг жестами: стукає по вусі, киває, тре
      пальцями на знак грошей, відмахується. Жодної вимовленої репліки не має.
    address:
      player_to_npc: ти
      basis: >-
        Її власного регістру встановити нема з чого — вона мовчить. Гравець
        говорить із вуличною бандиткою в тій самій сцені, що й у cc_svetlana,
        тому базово «ти» (STYLE §3.2). Поле npc_to_player свідомо відсутнє.
      gender_cues: []
    voice:
      register: мовчання; уся характеристика — у нарації жестів
      idiolect:
        - "жест замість слова: постукування по вусі = «не чую/кажи ще раз» (q7)"
        - "тертя великим пальцем об вказівний і середній = вимога грошей (q10)"
        - "відмова передається помахом руки, не словом (q4, q17)"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Тут це не декоративна ремарка: усі
    одинадцять q-юнітів є нарацією, тож правило керує цілим вузлом.

new_names: ["ICPD"]

idioms:
  - unit: q4
    src: "such an inhospitable face"
    note: "не калькувати «негостинне обличчя» — ідеться про непривітну міну"
  - unit: q10
    src: "A smirk appears on her face"
    note: "smirk — самовдоволена посмішка, не нейтральна усмішка; відтінок зберегти"

pitfalls:
  - >-
    Тіна німа. Будь-яка спокуса «озвучити» жест прямою мовою руйнує персонажа —
    описи лишаються описами.
  - >-
    Нарація тут у теперішньому часі й з погляду гравця («you have no idea what
    it means») — це форма «ви», і вона стосується гравця, а не Тіни.
  - >-
    a11, a13, a22 — підказки дій усередині ::…::, отже інфінітив, STYLE §3.5.
  - >-
    Вузол дублює cc_svetlana: репліки гравця майже тотожні, тому їх варто
    перекладати разом і однаково.

examples:
  - unit: a13
    rule: "підказка дії всередині ::…:: — інфінітив, STYLE §3.5"
    uk_fragment: "::Іти за нею.::"
    status: proposed
