speakers:
  - slug: fred
    name: Фред
    units: default
    confidence: certain
    evidence: [q1, q21, q27]
    role: >-
      Торговець медикаментами в Таборі Хатор і самопроголошений комік: пише
      п’єсу про Короля щурчаків і випробовує жарти на кожному покупцеві.
      Гумор у нього поганий, і саме це має бути смішно.
    relationships:
      - "Фредд і Фредді — інші торговці табору; у q19 Фред розігрує гравця вигадкою про братів, у q21 сам це спростовує"
      - "Едгар — ватажок табору; у q33 Фред згадує його загибель майже побіжно"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Панібратське $(#man/sister), «I'm messing with ya», суцільні стягнення
        й випадання g. Балакучий крамар свого табору — STYLE §3.2 дає «ти».
      gender_cues: ["$(#man/sister)", "$(# man/sister)"]
    voice:
      register: гучний, дружній, настирливо жартівливий
      idiolect:
        - "«you dig» — наскрізний словесний тик, з’являється в q5, q8, q9, q11, q19, q25, q35; потрібен ОДИН український відповідник на весь вузол"
        - "стягнення й просторіччя: outta, gonna, freakin', ya, «gona» (помилка джерела)"
        - "сам себе перебиває реготом — ремарки ::He laughs.:: вбудовані в репліку"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Найдовша нарація в q11 описує реакцію
    оточення на жарт; вона іронічна, і ця іронія має вціліти.

new_names: ["Hammerstein", "Rathound King", "Hathorians"]

idioms:
  - unit: q11
    src: "a shroomberry on the cake of visceral amusement"
    note: >-
      Перелицьована «вишенька на торті» з грибною підміною. Треба українська
      ідіома того ж типу з такою самою підміною, а не калька.
  - unit: q15
    src: "make a joke so funny the earth's gona crack... up!"
    note: >-
      Каламбур crack (тріскатися) / crack up (реготати), з паузою перед
      другою половиною. Дослівний переклад знищує жарт — потрібен український
      каламбур із такою ж структурою «слово… добавка».
  - unit: a22
    src: "trying to pull my leg"
    note: "«водити за носа»; те саме в q19 — обидва місця узгодити"
  - unit: q19
    src: "I will cut you like a pig"
    note: "грубе лишається грубим — STYLE §9, не пом’якшувати"
  - unit: q1
    src: "bushy arm-hair, which looks like it was transplanted from a large rathound"
    note: "жарт нарації тримається на слові «transplanted» — медичне слово в устах опису торговця ліками"
  - unit: q8
    src: "He's mean as he's ugly"
    note: "римована народна формула; шукати український відповідник із тією ж парністю"

pitfalls:
  - "q27 і q29 містять $(# man/sister) — з пробілом після #, на відміну від q15. Це особливість джерела: форму плейсхолдера відтворювати як у джерелі, не «виправляти»"
  - "«you dig» не можна перекладати щоразу по-різному — це впізнаваний тик, а не заповнювач"
  - "q8 — не спогад і не переказ подій, а текст п’єси, що пише Фред; це розкривається аж у q9. Пафос не «приземлювати», інакше зникне поворот"
  - "глосарій: mindshroom → Гриб Розуму, rathound(s) → щурчак(и), Camp Hathor → Табір Хатор, SGS → ССГ, Foundry → Ливарня, Core City → Центральне Місто, burrowers → копаки, Arena → Арена"
  - '\n\n у q1 і q8 — розділювач нарації й репліки, зберігати як є'
  - "q31 закінчується пробілом перед <end> — не чіпати структуру рядка"
  - "q19 і q21 — розіграш: погроза в q19 має звучати щиро, бо q21 її знімає. Якщо пом’якшити q19, розіграш не спрацює"

