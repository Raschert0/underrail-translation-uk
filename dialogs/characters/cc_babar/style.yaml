speakers:
  - slug: babar
    name: Бабар
    units: default
    confidence: certain
    evidence: [q1, q5, q9, q11]
    role: >-
      Розпорядник Арени Центрального Міста: сидить за столом із паперами, вітає
      відвідувачів, пояснює правила боїв і скеровує охочих записатися до Ланісти.
      Службова, «приймальна» позиція — звідси ввічлива дистанція за замовчуванням.
    relationships:
      - "Ланіста — тренер за дверима поруч; Бабар відсилає гравця саме до нього (q11)"
      - "Інвіктус — аренний титул гравця, яким Бабар вітає його після перемог (q1)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Базовий регістр — «ви»: службовець при вході, тримає офіційний тон і
        чотири рази вживає $(#sir/ma'am). Репліки гравця дзеркалять базу, а не
        зрив (STYLE §3.3). Це готове рішення зі STYLE §3.
      gender_cues: ["$(#sir/ma'am)", "$(#man/woman)", "$(#codger/hag)"]
      switches:
        - unit: q5
          to: ти
          trigger: >-
            плутає гравця з набридливим прохачем і зривається на крик; «ти»
            тримається лише до «Oh... oh - good day», далі — назад на «ви»
            в тому самому юніті
    voice:
      register: ввічливий, дещо пишномовний службовець; у зриві — різкий і грубий
      idiolect:
        - "формальні звороти на вході: «If you'd excuse me», «No problem at all»"
        - "піднесений, майже рекламний тон, коли описує Арену — довгі періоди з тире"
        - "фамільярне «Hey, ..., how's it going?» (q3) як знак упізнавання — тон теплішає, але регістр лишається «ви»"
        - "$(#codger/hag) — єдине грубе слово в лексиконі; не пом’якшувати (STYLE §9)"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; нарація в q5 і q11"

