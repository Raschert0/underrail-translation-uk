speakers:
  - slug: leo
    name: Лео
    units: default
    confidence: certain
    evidence: [q264, q89, q3]
    role: >-
      Старий самітник із Глибоких Печер, який утратив пам’ять через «тиск» біля
      комплексу; спершу зустрічає гравця з арбалетом і зве його «intruder», далі
      стає провідником по околиці в обмін на кістяний ніж.
    relationships:
      - "гравець — спершу «intruder», після ножа перехід до звертання на ім’я"
      - "Tchortists — «devils», панічний страх; Masked — «вони мене не чіпають»"
      - "згаданий безіменний супутник («my broth--») — обірваний спогад, не розкривати"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Лео вуличний, агресивний і панібратський: «Get outta here, intruder!»,
        «Move one finger and I’ll launch a bolt through your hollow skull!» —
        STYLE §3.2 дає «ти». Гравець дзеркалить, і сам зве його «old man»
        («Whatever. I’m off, old man») — STYLE §3.3.
      gender_cues: []
      note: >-
        Плейсхолдерів $(#…) у джерелі немає жодного, але українське минуле
        про гравця їх вимагатиме — див. pitfalls.
    voice:
      register: старечий, уривчастий, недовірливий; проста лексика, короткі речення
      idiolect:
        - "тотальне випадання g та h: 'ere, doin', somethin', rememberin', 'kay — потрібен послідовний український розмовний зріз, не літературна норма"
        - "подвоєння як тик: «Yes, yes», «No, no», «Fuzzy, fuzzy» — зберігати саме подвоєння, не замінювати одним словом"
        - "триразове проговорювання власного імені, щоб не забути: «*I* am Leo. I *am* Leo. I am *Leo*» — пряма мотивація в q108"
        - "зірочки *слово* — наголос, який щоразу переїжджає на нове слово; ставити на український смисловий відповідник, не за позицією"
        - "сміх «He-he-HA!» і «He-he» — стала форма, тримати однаковою в усіх юнітах"
        - "перепит «Eh?» як заповнювач пауз і як ознака збою пам’яті"
        - "самообрив і заїкання: «Tch-Tch-Tchort!?», «Tcho--Tch--Tchortists», «Nor-- North!», «s-south» — відтворювати на українському приголосному, STYLE §9"

