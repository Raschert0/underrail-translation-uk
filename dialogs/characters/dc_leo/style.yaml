pitfalls:
  - "Головна пастка вузла — троє синонімів, які персонажі свідомо не приймають один від одного. a73 «You mean burrowers?» → q74 «Burrowers? I mean diggers.»: burrowers — це глосарійні «копаки», а Leo's diggers мусить бути ІНШИМ словом, інакше репліка-виправлення втрачає сенс. Так само a168 «coil spiders» → q169 «I mean electric spiders»."
  - "«the Masked» у мові Лео — це Faceless (глосарій: Безликі), але він їх так не називає. a205/a207 гравець каже «Faceless», Лео відповідає про «Masked». Два позначення мають лишитися різними словами; ототожнювати не можна."
  - "$(context.player.Name) трапляється в q15, q57, q66, q89, q91, q94, q123, q159, q167, q177, q276, a257, a259, a275, a290 — не відмінювати всередині плейсхолдера. Лео вживає ім’я у кличних позиціях («Feelin' good, $(context.player.Name)?»), де українська просила б кличний відмінок: перебудовувати фразу під називний."
  - "Наголосні зірочки навколо плейсхолдера — *$(context.player.Name)* (q94, q123, q159) і *$(context.player.Name),* (q167): зірочки й кома поза дужками, сам плейсхолдер недоторканний."
  - "Гендер гравця в джерелі ніде не позначений, але українське минуле його вимагатиме: q212 «when you brought me the knife», q114 «You sound like it should» — там, де виникає минулий час про гравця, додавати $(#…) STYLE §2; це не вільність."
  - "q11 містить ::[Persuasion] :: з пробілом перед закривними двокрапками — пробіл зберегти дослівно."
  - "Літеральні \\n\\n усередині q3, q37, q67, q117, q145, q227, q252, q258, q260, q262, q273, q159, q154 — розділювачі абзаців, переносити як є."
  - "q2 «GET OUT!» і повторюване «YOU WILL NOT!» (q254, q258, q262) — капслок як крик, зберігати; так само GONE! у q188 і LOST IT! у q270."
  - "«old man» — це звертання гравця ДО Лео (a35, a96, a116, a250, a279), а не самоназва; в a13 «As if you can hit anything, old man» тон зневажливий."

