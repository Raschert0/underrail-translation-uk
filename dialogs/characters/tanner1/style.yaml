speakers:
  - slug: tanner
    name: Таннер
    units: default
    confidence: certain
    evidence: [q112, q171, q176, q203, q262]
    role: >-
      Гадріан Таннер — радник і фактичний голова ССГ, той, хто прийняв гравця до
      станції; він роздає всі перші завдання й пояснює політику станції. Говорить
      як керівник, що зважує наслідки: звідси довгі періоди, аналітична лексика
      й накази у формі прохання.
    relationships:
      - "Горський — соратник багатьох років; q173: «we've known each other for many years»"
      - "Гарольд, Паскуале, Вера, Ессі, Лукас, Брет — підлеглі, до яких він скеровує гравця"
      - "Роман веде перемовини з Сайласом за його дорученням (q2)"
      - "Ленокс — прохач, якому станція відмовила; Таннер говорить про нього співчутливо, але твердо (q118-q119)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова, а не приватна розмова: радник станції інструктує новоприбулого
        громадянина. Нарація прямо називає голос «calm and distant» (q2) і
        «deep voice feels distant and calming» (q263) — дистанція закладена в
        характеристику персонажа. Він звертається на повне ім’я через
        $(context.player.Name), а не пестливо, і жодного разу не вживає
        панібратських звертань. STYLE §3.2 — формальний, службовий мовець.
      gender_cues: []
      switches:
        - {unit: q21, to: ви, trigger: "офіційне попередження — регістр не змінюється, але тон стає санкційним: «you will find yourself no longer to be a part of this community»"}
        - {unit: q179, to: ви, trigger: "«His voice deepens slightly and becomes more commanding» — наказовий спосіб на «ви»: «Заходьте», «Вирушайте» (STYLE §3.4)"}
    voice:
      register: стриманий, книжний, аналітичний; ані теплого, ані ворожого
      idiolect:
        - "довгі складнопідрядні періоди з підрядними мети й наслідку — не дробити на короткі речення"
        - "латинізована й термінологічна лексика: profligate, de novo, prime directive, monolithic, encroach — українською теж книжний шар"
        - "пом’якшувальні застереження перед оцінкою: «As far as I am aware», «I’m afraid», «I reckon», «I predict»"
        - "накази подає як намір мовця: «I want you to retake them», «I want you to bring it to me» — не калькувати «Я хочу, щоб ви…» щоразу"
        - "ніколи не лається й не вживає сленгу, навіть коли гравець вживає (пор. a268 «Heck yeah!»)"

  - slug: player
    name: гравець
    units: []
    confidence: certain
    evidence: [a268, a303]
    role: >-
      Репліки гравця коливаються від службово-сухих до підліткувато-жартівливих,
      але базовий регістр дзеркалить Таннера.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        STYLE §3.3: дзеркалимо базовий регістр співрозмовника, а не емоційні
        зриви. Жартівливі варіанти (a268 «Heck yeah! Do I get to shoot stuff?»,
        a270 «Right on.», a101 «nothing’s too secret for me») лишаються на «ви» —
        грайливість передається лексикою, не переходом на «ти».

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Нарації тут багато, і вона двох типів:
    великі описові блоки від другої особи (q262, q263) і короткі вставки-ремарки
    всередині реплік (q35, q78, q98, q105, q161, q178). Підказки дій у репліках
    гравця — інфінітив (STYLE §3.5): «::Follow him.::», «::Give it to him.::»,
    «::Nod and leave.::».

