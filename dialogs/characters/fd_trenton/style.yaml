speakers:
  - slug: trenton
    name: Трентон
    units: default
    confidence: certain
    evidence: [q252, q8, q70, q129, q34, q259, q87]
    role: >-
      Корбен Трентон — співкерівник південної комірки Вільних Дронів, аналітик і
      стратег: пояснює гравцеві політичну картину, план операції та маршрути.
      Говорить довгими вибудуваними періодами, тому головна загроза перекладу —
      розсипати його лекції на короткі уривчасті речення.
    relationships:
      - "Елвін Бейт — співкерівник тієї самої комірки; говорить у цьому ж вузлі, згодом виявляється зрадником"
      - "Марселла Грін — третя керівниця комірки, зникла; Трентон визнає, що заздрив її харизмі (q206)"
      - "Гравець — новобранець, до якого Трентон звертається на ім’я і підкреслено поважно"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Трентон постійно кличе гравця на ім’я, а не прізвиськом, говорить
        службово-інструктивно («I must remind you again that this mission… is
        really important», q36) і без розмовних скорочень. Це керівник, що видає
        завдання підлеглому, а не свій зі своїх — STYLE §3.2 дає «ви».
      gender_cues: ["$(#him/her)", "$(#he/she)"]
    voice:
      register: стриманий, книжний, ораторський; емоцію тримає під контролем
      idiolect:
        - "сталий прощальний вислів «Stay free» (q230, q234) — формула Вільних Дронів, тримати одну й ту саму українську версію в усьому корпусі"
        - "«Mark my words» (q78, q99) — риторичне закріплення обіцянки"
        - "розлогі складнопідрядні лекції (q191, q195–q199) — не дрібнити на прості речення"
        - "зневажливе «the Cans», «those pigs», «those tyrants» про Протекторат"

  - slug: bate
    name: Бейт
    units: [q14, q18, q35, q45, q65, q86, q91, q114, q255, q257, q258, q260, q261, q262, q265, q266, q269, q277, q279, q280, q290, q293]
    confidence: certain
    evidence: [q252, q257, q269, q293, q35]
    role: >-
      Елвін Бейт — другий керівник комірки, балакучий і жартівливий; розряджає
      Трентонові лекції, підколює його й опікає гравця. Пізніше з’ясовується, що
      саме він зливав інформацію Протекторатові.
    relationships:
      - "Трентон — рівний співкерівник; Бейт кличе його на ім’я «Corben» і кепкує з його серйозності (q269, q293)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Бейт кличе гравця «kiddo» (q45, q65, q114, q255, q257, q290), жартує
        («Just joking, kiddo!», q266) і вступається за нього перед Трентоном
        («Give kiddo a break», q18). Панібратський, свійський тон — STYLE §3.2
        дає «ти».
      gender_cues: ["$(#he/she)", "$(#men/men and women)"]
    voice:
      register: теплий, гучний, жартівливий; батьківська поблажливість до новачка
      idiolect:
        - "звертання «kiddo» — постійний маркер; потрібен один сталий український відповідник на весь вузол"
        - "усічені форми й вигуки: «Bless ’em» (q269), «Okay, okay…» (q260), «Damn it» (q86, q91)"
        - "самоперебиви й театральні паузи: «A long time ago, in Junkyard…» (q258), «Unstable explosives…» (q265)"

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q9, q81, q105, q107, q113, q176, q183, q216, q217, q219, q220, q281]
    confidence: unknown
    reason: >-
      Це репліки з діалогів між двома NPC, де жоден із них не названий і немає
      мовного відбитка: короткі підтакування («Correct.», q81), обмін
      запереченнями («never heard of such a thing» q105 / «doesn’t ring a bell
      either» q107), спільна нарація «::The two men look at each other.::»
      (q111, q175) і репліки після неї (q113, q176, q183), а також блок про Каю
      (q216–q220). Порядок рядків у файлі не відповідає порядку в діалозі, тож
      чергування мовців із сусідства не виводиться.
    guidance: >-
      Перекладати нейтрально: без «kiddo»-подібних панібратських звертань і без
      Трентонових книжних зворотів. Уникати форм минулого часу й прикметників,
      що видали б стать мовця. Регістр щодо гравця не задавати взагалі — у цих
      рядках гравець здебільшого не адресат.

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1, навіть у рядках Бейта, який говорить «ти».
    Підказки дій усередині «::…::» — інфінітив (§3.5): «::Shrug.::», «::Give him
    the Acorn.::», «::Say nothing and let him continue.::».

