speakers:
  - slug: zilla
    name: Зілла
    units: default
    confidence: certain
    evidence: [q1]
    role: >-
      Молода власниця харчового лотка на верхній станції Центрального Міста —
      привітна балакуча продавчиня, що заразом торгує міськими плітками.
      Товар нав’язує м’яко, але наполегливо, і кожну тему зводить до їжі.
    relationships:
      - "Мо — власник лотка на нижньому рівні; згадка його імені викликає лють, причини не названо"
      - "Вілкос і Nimble — знає їх лише як міські постаті, переказує чутки"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        У першій же репліці звертається $(#mister/madam) — обслуга до клієнта,
        STYLE §3.2. Просторічна вимова не скасовує цього: вона панібратська за
        тоном, але за роллю продавчиня.
      gender_cues: ["$(#mister/madam)", "girl"]
      switches:
        - {unit: q33, to: ти, trigger: "коли гравець двічі згадує Мо — холодна погроза; допустимий зрив, не вирівнювати"}
    voice:
      register: гучний, усміхнений, вуличний; продає навіть тоді, коли просто балакає
      idiolect:
        - "нав’язливе hardcore — словесний тик, а не оцінка; має бути ОДНЕ українське слово в усіх 6 випадках"
        - "повторюване nonsense у значенні «дурниці» (q19, q26, q28)"
        - "розмовні стягнення: ain’t, ’cause, gonna, gotta, C’mon — просторіччя без згрубілості"
        - "зірочки навколо слова — інтонаційний наголос (*am*, *him*, *not*), зберігати"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; підказки дій у ::…:: інфінітивом (§3.5)"

new_names: ["Nimble", "Underrail Express"]

idioms:
  - unit: q10
    src: "don't quote me on anything"
    note: "не калькувати; розмовне «за що купила, за те й продаю»"
  - unit: q12
    src: "Beats me"
    note: "не калькувати; це «поняття не маю», а не про побиття"
  - unit: q30
    src: "erupting volcano of emotions"
    note: "розгорнута метафора вибуху й обвугленого обличчя тримається через увесь юніт — не розбивати на окремі образи"
  - unit: q46
    src: "what a hardcore catch"
    note: "catch — «здобич, вдала партія» про людину, не «улов»"

pitfalls:
  - "q8+q9 і q39+q40, q14+q15 — одне речення, розрізане між юнітами; порядок слів української фрази має лишитися складаним, не переставляти частини"
  - "a11 ::[Nimble]:: I'm nimble. — каламбур: тег навички збігається з іменем NPC; жарт живе тільки якщо ім’я та прикметник спільнокореневі. Ім’я ще не має канонічного варіанта, тому переклад цього юніта чекає на рішення щодо Nimble"
  - "q39/q40 і q46 — це гендерні варіанти однієї репліки на боці рушія; «girl» у q46 звернене до персонажки-жінки. Гендер тут ГРАВЦЯ, а не супутника"
  - "Underrail лишається латиницею й не відмінюється навіть у «Upper Underrail», «Underrail Express» (глосарій)"
  - "Praetorians (q27) — глосарій фіксує Praetorian Security латиницею, але демонім окремого рішення ще не має"
  - "Moe → Мо, Wilkos → Вілкос, Faceless → Безликі, tunnelers → Тунельники, Core City → Центральне Місто, Arena → Арена — брати з реєстру та глосарію"

