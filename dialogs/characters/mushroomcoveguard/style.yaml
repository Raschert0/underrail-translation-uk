    note: "не «кинь ставлення»; розмовний наказ припинити огризатися"
  - unit: q43
    src: "deserve a bullet between their eyes"
    note: "груба погроза — не пом’якшувати, STYLE §9"
  - unit: q29
    src: "Good hunting."
    note: "усталене напутнє побажання, не буквальне «доброго полювання» як опис заняття"
  - unit: q51
    src: "Don't you \"yeah, yeah\" me"
    note: "цитування слів співрозмовника як дієслово; перебудувати, а не калькувати"

pitfalls:
  - "q18 + (q19 або q23) + q20 — це ОДНЕ речення, розрізане на три юніти заради статі шукача: «Gerald, guard, found » + «him »/«her » + «dying in the Cove.». Кінцеві пробіли зберігати, гендерне слово лишати тільки в q19/q23 і не переносити його в сусідні юніти"
  - "q19 і q23 — односкладові юніти («him», «her»); перекладач бачить їх поза контекстом, читати разом з q18 і q20"
  - "q39 і q53 містять $(context.player.Name) — усередині плейсхолдера нічого не відмінювати; у q39 будувати називну конструкцію"
  - "q2 «Don't sneak up on me» і q52 ::Remain silent.:: — підказка дії всередині :: :: подається інфінітивом, STYLE §3.5"
  - "Глосарій: SGS → ССГ, Mushroom Cove → Грибна Бухта, psi beetles → псі-жуки, hoppers → стрибуни, scavenger → шукач, Old Jonas → Старий Йонас"
  - "q15 «the Crossroads» — глосарій має лише Crossroad Watch → Перехресна Варта; назва місця тут окрема, рішення централізоване"
  - "q47 «Lurker» з великої — фракція, а не описове «причаєний»"

