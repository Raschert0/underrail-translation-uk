speakers:
  - slug: mushroom_cove_guard
    name: вартовий Грибної Бухти
    units: default
    confidence: certain
    evidence: [q2, q29, q40, q42]
    role: >-
      Вартовий ССГ на проході до Грибної Бухти: перевіряє кожного, хто йде повз,
      і легко зривається на грубість. Для гравця він джерело напрямку та
      попереджень про псі-жуків, а не сюжетна фігура.
    relationships:
      - "Джеральд і Малком — інші вартові змін; він про них згадує, сам ним не є"
      - "Горський — начальство, на чию думку він покликається, коли зневажає новачків"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Солдатський жаргон без жодної ввічливої формули: «Are you derailed?»,
        «you idiot», «Drop the attitude», «Dig?». Гравця називає описово
        «the new $(#guy/girl)», а не «$(#sir/ma'am)» — STYLE §3.2, репліки
        гравця дзеркалять (§3.3).
      gender_cues: ["$(#guy/girl)", "$(#guys/girls)"]
    voice:
      register: різкий, службовий, зверхній до новачків
      idiolect:
        - "«Nasty buggers» про псі-жуків повторюється двічі (q14, q16) — той самий відповідник обидва рази"
        - "риторичне «Are you derailed?» замість лайки — з’являється і в q2, і в q43"

narration:
  present: true
  note: "«ви» без винятків, попри «ти» в прямій мові — STYLE §3.1"

new_names: ["Gerald", "Malcom", "Lurker", "Crossroads"]

