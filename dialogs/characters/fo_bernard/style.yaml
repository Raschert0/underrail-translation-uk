speakers:
  - slug: bernard
    name: Бернард
    units: default
    confidence: certain
    evidence: [q170, q105]
    role: >-
      Плавильник Ливарні, доглядач величезної печі, яку він називає Глорією й
      любить як живу істоту. Простий робітник без освіти — це визначає і лексику,
      і те, що складні пояснення в нього виходять через побутові порівняння.
    relationships:
      - "Глорія — плавильна піч; для нього істота жіночого роду, говорить про неї «вона», «моя красуня»"
      - "мер Маршалл — заборонив ремонтувати піч; Бернард говорить про нього з відкритою злістю"
      - "Енді — головний металург Ливарні, до якого Бернард передає знайдені дані"
      - "Вест — той, хто зрештою полагодив Глорію (q178)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Робітник біля печі, говорить сильним просторіччям, одразу переходить на
        панібратське звертання й розпитує ім’я вже після кількох реплік
        («By the way, yer name is...?»). STYLE §3.2 — свій, вуличний, отже «ти»;
        репліки гравця дзеркалять (§3.3).
      gender_cues: ["$(#guy/girl)"]
    voice:
      register: просторіччя, тепле й буркотливе водночас
      idiolect:
        - >-
          Наскрізний діалект: випадання приголосних і скорочення — ya/yer/ya’ll,
          ’ere, ’im, ’er, ain’t, dunno, lemme, whatcha, meltin’/fixin’/somethin’.
          Це не недбалість тексту, а мовна характеристика: відтворювати
          українським просторіччям послідовно, у ВСІХ його репліках.
        - "«golden» — словесний тик схвалення: «That’s golden!», «ya’ll be golden», окреме «Golden!»"
        - "«Ey» на початку репліки — звична частка привернення уваги"
        - "звертання до печі як до жінки, аж до голосіння (q125) — не знеособлювати"
        - "лайка в нього м’яка й внутрішньоігрова: «Muck.», «Damn ’im!», «son of a rat»"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1, навіть там, де сам Бернард каже «ти».
    Багато довгих нараційних вставок (q10, q168) із подвійним \n\n — структуру рядка зберігати.

new_names: ["Gloria", "Andy", "Bryan Honest"]

idioms:
  - unit: q129
    src: "I'm not breakin' my pick"
    note: >-
      Внутрішньоігрова ідіома «break one’s pick» = здатися, опустити руки.
      Наскрізна для Ливарні (є й у fo_chief, і в fo_bryan_honest) — переклад
      має бути ОДНАКОВИЙ у всіх трьох вузлах. Не калькувати «зламати кирку»
      буквально без збереження значення «здаватися».
  - unit: q190
    src: "Are ya derailed?"
    note: >-
      «derailed» — внутрішньоігровий синонім «божевільний», від залізничної
      метафори світу. Стала форма потрібна одна на весь корпус; не «зійшов з рейок»
      описово щоразу по-новому.
  - unit: q76
    src: "It's as easy as under pie!"
    note: >-
      Навмисно перекручена ідіома «easy as pie» (світ називає себе Underrail).
      Зберегти саме зіпсованість — правильний вислів тут був би втратою.
  - unit: q115
    src: "shut my tick hole"
    note: "грубе внутрішньоігрове «стули пельку»; грубість не пом’якшувати — STYLE §9"
  - unit: q77
    src: "So simple even a cackler wouldn't mind doin' it."
    note: "cackler — істота; канонічного українського варіанта немає ні в глосарії, ні в реєстрі — уточнити централізовано, не вигадувати"

pitfalls:
  - "q52, q57 — «charons» і «Stygian Coins»: глосарій дає «харон» (монета) і «стигійська монета»; не плутати з іменами"
  - "q44, q45, q68 — «Old Biocorp»: Biocorp лишається латиницею (глосарій, read-only), означення «Old» перекладається"
  - "q165 — «Foundry Guard» лишається латиницею (глосарій), тоді як саме місто Foundry → «Ливарня»"
  - "a173, q178, q183 — $(context.player.Name) не відмінювати й не чіпати всередині плейсхолдера; будувати фразу так, щоб потрібен був називний"
  - "q21 «up to three sets of plates per meltin’» — кількісні дані квесту, числа не округлювати (3000/6000/9000 харонів)"
  - "У джерелі є друкарські помилки (a144 «I dont’ understand») — не відтворювати їх в українському тексті"
  - "Технічний абзац q93–q94 (система регулювання потужності електродів) — Бернард пояснює просторіччям, але терміни мають лишитися термінами; не перетворювати на суцільну балачку"

