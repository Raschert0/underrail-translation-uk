pitfalls:
  - >-
    «imbecile» — це ім’я, присвоєне гравцеві ботом (q14), а не просто лайка.
    Потрібне ОДНЕ слово, однакове в усіх ~40 входженнях, зі справним кличним
    відмінком, і воно має бути жіночого чи чоловічого роду незалежно від статі
    гравця, бо гравець-жінка теж зветься так само. Джерело послідовно пише його
    з малої літери навіть на початку речення (q50) — це навмисно, зберегти.
  - >-
    Технічний префікс перед «\n\n» («Greeting; imbecile:», «Answer; imbecile:»,
    «Statement; imbecile:», «Taunt; target:», «Farewell; imbecile:») — службовий
    заголовок репліки. Структуру «Слово; ціль:» зберегти, «target» і «audience»
    не плутати з іменем.
  - >-
    «Playing(LargoAlFactotum); audience:» (q9) — ідентифікатор у дужках,
    не перекладати й не чіпати.
  - >-
    Текст арії в q9 — італійський оригінал («Largo al factotum», Россіні).
    Лишати як є: це спів, а не репліка.
  - >-
    q13 містить незвичний плейсхолдер $(#male1/female2) двічі — у заголовку й у
    тілі. Обидві гілки треба заповнити українською; кількість і порядок
    плейсхолдерів має збігтися з джерелом.
  - >-
    q13 містить UUID «[Target ID: cf4b158b-…]» — не чіпати; квадратні дужки
    й вміст лишити дослівно.
  - >-
    q50 — сто сорок з гаком повторів слова через крапку. Кількість повторів
    зберегти, слово те саме, що й скрізь.
  - >-
    q62 наводить список згенерованих імен: manure, clod, null, organichead,
    troglodyte. «null» — програмний термін і водночас образа; «organichead» —
    новотвір, потрібен український новотвір, а не опис.
  - >-
    «AI Core» (q1) — напис на панелі бота, технічна мітка в лапках; узгодити з
    рештою корпусу й тримати однаково в a3, a7, a11, a57.

