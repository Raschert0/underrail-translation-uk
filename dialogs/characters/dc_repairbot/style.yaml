speakers:
  - slug: repair_unit_7
    name: Ремонтний Блок 7
    units: default
    confidence: certain
    evidence: [q13, q15, q18]
    role: >-
      Ремонтний бот із червоним ШІ-ядром, чия особистість запрограмована на
      навмисну грубість: він перейменовує гравця на «imbecile» і вживає це слово
      як звертання майже в кожній репліці.
    address:
      npc_to_player: ви
      player_to_npc: ти
      basis: >-
        Бот тримає машинно-службовий реєстр без скорочень: «How may I be of
        service?», «I would recommend obtaining official documentation», «Do note,
        imbecile» — це «ви» за STYLE §3.2. Образа тут іде через саме слово
        «imbecile», а не через фамільярність, і згладжувати регістр до «ти» —
        значить убити контраст. Гравець же говорить із машиною зневажливо
        («you garbage can» a22, «you hunk of junk» a69) — «ти».
      gender_cues: ["$(#male1/female2)", "$(#himself/herself)", "$(#man/woman)"]
    voice:
      register: машинно-канцелярський, підкреслено ввічливий за формою і знущальний за змістом
      idiolect:
        - "нуль скорочень; звороти «I would recommend», «Do note», «It is recommended»"
        - "«imbecile» як звертання наприкінці або всередині майже кожної репліки — словесний тик, зберігати всі входження"
        - "системні вигуки капсом: ERROR!, Warning! — регістр зберегти"

  - slug: blue_core
    name: синє ШІ-ядро
    units: [q5]
    confidence: certain
    evidence: [q5]
    role: >-
      Окрема особистість, що звучить лише один раз, коли гравець вставляє синє
      ядро: єдина фраза-погроза капслоком.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: "чиста агресія без службових формул — STYLE §3.2"

  - slug: green_core
    name: зелене ШІ-ядро
    units: [q9]
    confidence: certain
    evidence: [q9]
    role: >-
      Друга окрема особистість: замість мовлення програє оперну арію. Реплік
      більше не має.

  - slug: narrator
