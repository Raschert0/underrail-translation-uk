speakers:
  - slug: todor
    name: Тодор
    units: default
    confidence: certain
    evidence: [q24, q78, q86]
    role: >-
      Найманий убивця Еверарда, який завалив замовлення й сидить у в’язниці
      Ливарні; гравець приходить або визволити його, або змусити замовкнути
      назавжди. Це наляканий злочинець, а не суворий професіонал — його мова
      весь час зривається на панібратську лайку й нервові повтори.
    relationships:
      - "Еверард — наймач і «друг»; Тодор чіпляється за нього як за гарантію (q25, q80)"
      - "Bolivar Daud — жертва, яку він застрелив; про вбивство говорить із насолодою (q35)"
      - "Micas — торговець зброєю, чия зустріч із жертвою була сигналом до пострілу"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Мова Тодора наскрізь вулична: «ain't gonna be no returning», «I'm outta
        here», «get the hell out of here», «this joint», «kiss my rear». За
        STYLE §3.2 такий персонаж — «ти»; репліки гравця дзеркалять базовий
        реєстр (§3.3), і гравець теж переходить на прізвище-ім’я без титулу
        («Goodbye, Todor», a48). Гендерних плейсхолдерів у вузлі немає.
      switches:
        - {unit: q86, to: ти, trigger: "перше знайомство в кімнаті побачень відбувається між чужими людьми, але Тодор і там одразу тримає вуличний тон («So... you're the one who wanted to talk to me») — «ви» тут не вводити"}
    voice:
      register: >-
        нервовий, вуличний, із частими вигуками й самоперебиваннями; у сцені
        отруєння падає в благання
      idiolect:
        - "«Hell,» на початку речення — головний словесний тик (q3, q8, q32, q35, q38); має лишитися повторюваним однаковим вигуком, а не щоразу новим"
        - "подвійне заперечення й розмовна граматика: «there ain't gonna be no returning»"
        - "«the joint» — арго на позначення в’язниці, вжите тричі (q3, q8, q72)"
        - "нервові повтори точною копією: «it's making me uneasy. Very uneasy.» — фігура, не редакторська помилка"
        - "обірвані фрази з тире й крапками: «What? I don-- », «I... I... Please...»"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Найдовший блок q86 веде гравця від другої особи
    («You are led into the small room»). Підказки дій усередині ::…:: — інфінітив
    за §3.5.

