        - {unit: q144, to: ви, trigger: "«Get out and do your bloody job! Dismissed!» — зрив на підлеглого; лишається «ви», грубішає лексика, а не регістр"}
        - {unit: q88, to: ти, trigger: "звертається сам до себе — «Get a hold of yourself, Archie»; самозвертання завжди «ти»"}
