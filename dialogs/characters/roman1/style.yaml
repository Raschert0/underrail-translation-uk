    rule: "STYLE §3.4 — наказовий і звертання успадковують «ти»"
    uk_fragment: "не час на балачки"
    status: proposed
  - unit: q15
    rule: "STYLE §3.2 — знижений розмовний регістр «свого»"
    uk_fragment: "Я тут за головного"
    status: proposed
