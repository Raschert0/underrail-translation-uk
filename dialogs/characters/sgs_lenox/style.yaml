speakers:
  - slug: lenox
    name: Ленокс
    units: default
    confidence: certain
    evidence: [q5, q12, q56, q237]
    role: >-
      Приїжджий, брат убитого Патріка Пірса; п’яний, виснажений горем, наймає
      гравця розслідувати смерть брата. Мова весь час зривається — це головне,
      що визначає добір слів.
    relationships:
      - "Патрік Пірс (Пат) — старший брат, загинув; Ленокс кличе його лише «Пат»"
      - "Таннер — радник ССГ, відмовився вести справу далі; Ленокс говорить про нього з гіркотою"
      - "Паскуале, Великий Брет, Квінтон, Мордре — підозрювані, яких називає гравець"
      - "Джек — посередник, який звів Ленокса з гравцем"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Гендерних плейсхолдерів у вузлі немає. Ленокс — колишній шукач і шахтар,
        говорить розхристано й панібратськи («you dig», «Just spill it» у відповідь),
        одразу переходить на особисте — за STYLE §3.2 це «ти». Репліки гравця
        дзеркалять (§3.3), зокрема різкі q-відповіді на кшталт a242.
      switches:
        - {unit: q5, to: ти, trigger: "перше знайомство звучить обережно, але без офіційності — «ти» від початку"}
    voice:
      register: п’яний, збивчивий, емоційно нестійкий; від тихого бурмотіння до крику
      idiolect:
        - "нав’язливе «um» у майже кожній репліці — відтворювати українським затинанням («е-е», «ну»), не викидати: це його головна прикмета"
        - "тег «you dig» (q25, q37, q38, q45) — стале розмовне звертання-перепит, вести однаковим варіантом крізь весь вузол"
        - "обриви й самоповтори: «I... I came here», «his, his job» — зберігати, не вигладжувати"
        - "лайка приглушена: «damn it», «bleeding», «frickin’» — грубе лишається грубим, але без посилення (STYLE §9)"

