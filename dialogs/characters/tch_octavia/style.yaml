  - "q1 «They... they are here!» — бойовий вигук, не частина розмови; регістр окличний, а не салонний"
  - "a77 «Tchort guide you, sister.» — тут «sister» без плейсхолдера, бо адресат жінка (Октавія); це не гендер гравця"
  - "«PI» (q71, q72) — абревіатура, яку персонаж тут же розшифровує; український відповідник має так само розшифровуватися"

