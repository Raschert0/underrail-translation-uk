speakers:
  - slug: octavia
    name: Октавія
    units: default
    confidence: certain
    evidence: [q2, q82]
    role: >-
      Слідча Октавія — хімікиня Інституту Тчорта, відповідає за склад реактивів
      і робить аналізи на замовлення. Говорить як фахова колега, але постійно
      зривається на сміх, згадуючи п’яну витівку гравця.
    relationships:
      - "Георгіс — головний слідчий її відділу, її безпосередній керівник (q67, q70)"
      - "Гравець — новоприбулий одновірець, якого вона бачить уперше (q2)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова особа в установі, до того ж торгує реактивами — STYLE §3.2
        відносить формальних і обслугу до «ви». Знайомляться щойно: «I don’t
        think we’ve met before» (q2). Сектантське «брате/сестро» тут не знак
        близькості, а обов’язкова форма звертання тчортистів і з «ви»
        не конфліктує.
      gender_cues: ["$(#brother/sister)"]
    voice:
      register: доброзичлива, фахова, з нападами нестримного сміху
      idiolect:
        - "нерішучі вставки в момент ніяковіння: «um», «em» — відтворювати як «ем», «е-е», не викидати"
        - "лайка-присяга «Magnificent Tchort!» — сталий вигук культу, тримати однаково в усьому корпусі"
        - "ритуальні формули «Tchort is evolution», «Tchort guide you» — не варіювати"

