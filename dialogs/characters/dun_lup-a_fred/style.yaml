pitfalls:
  - >-
    Заїкання відтворювати на українському приголосному (STYLE §9): дефіс і
    подвоєний перший звук українського слова, а не механічне копіювання
    англійських літер.
  - >-
    Джерело рясніє помилками автора: «dont» (q17, a24), «finnaly», «Hoplessness»,
    «.,,» (q30), «occassional». Це недбалість оригіналу, а не мовна риса —
    українською пишемо нормативно.
  - >-
    q22 «You know that, I'm Fred» — саме тут установлюється ім’я мовця;
    реєстр дає Fred → Фред і застерігає не плутати з Fredd → Фредд.
  - >-
    a29 «The plasma sentries are no more» — назва ігрового супротивника,
    звіряти з knowledge/, а не вигадувати тут.

