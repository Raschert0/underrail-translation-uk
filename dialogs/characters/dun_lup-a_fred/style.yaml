speakers:
  - slug: fred
    name: Фред
    units: default
    confidence: certain
    evidence: [q22, q17]
    role: >-
      Виснажений, заляканий працівник підземних переходів, якому заборонили
      говорити з чужими. Кожну відповідь дає з переляку й одразу відсилає
      гравця до когось іншого.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Він боїться й запобігає перед незнайомцем — благальне «P-please»,
        «Leave me alone, please» (q35), очі в підлогу. Це не панібратство, а
        дистанція знизу, тож «ви» (STYLE §3.2). Гравець базово дзеркалить;
        натиск у a16 — емоційний зрив, а не зміна бази (§3.3).
      gender_cues: []
    voice:
      register: тихий, зіщулений, з паузами й перепрошуванням
      idiolect:
        - "заїкання на початку слова: P-please, I-I, q-quiet, W-who (q17, q25, q28)"
        - "заповнювачі вагання: Uhh, Umm, Ahh, Huh"
        - "не договорює й відсилає далі: «just go talk to someone else» (q17)"

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q2, q3, q4, q5, q6, q7, q10, q11, q12]
    confidence: unknown
    reason: >-
      Дев’ять коротких барків — самі емоції (::Drools.::, ::Laughs.::,
      ::Rattles his teeth.::) і два репліки-роздуми (q10, q11), які ніяк не
      в’яжуться з переляканим Фредом і не мають жодної позначки мовця. Судячи
      з опису в q13, довкола є ціла громада таких самих виснажених людей; кому
      саме належать ці рядки, з файлу не видно.
    guidance: >-
      Перекладати як безадресні ремарки й короткі репліки: нарація в ::…:: —
      «ви» за STYLE §3.1, вимовлені q10 і q11 — нейтральною побудовою без
      гендерованого минулого часу й без звертань.

