    src: "spare me"
    note: "«позбав мене цього», а не «пощади»."

pitfalls:
  - "ПАСТКА АТРИБУЦІЇ: тека зветься cc_alex, але нарація двічі називає мовця Gorge (q48, q73). Мовець тут один; ім’я Alex у самому тексті не звучить жодного разу."
  - "Канонічної української форми для «Gorge» немає — не транслітерувати самотужки, чекати на централізоване рішення (new_names)."
  - "a15 «Gene told me you are…» — звертання до мовця, а не його репліка; Джин — інший персонаж і в цьому вузлі не говорить."
  - "$(#bud/sugar) у q34 і q40 записано як $(#bud/sister) — розбіжність джерела. Жіночу гілку тримати послідовною в межах файлу."
  - "КРИТИЧНО: a81 «Can you not call me \"bud\"?» і a84 «…\"sugar\"?» цитують гілки плейсхолдера голим словом, а q82/q85 повторюють його у відповіді. Ці чотири рядки й усі $(#bud/sugar) мають уживати ті самі два слова, інакше жарт розсипається."
  - "a6, a91 містять $(context.player.Name) — усередині плейсхолдера нічого не змінювати й не відмінювати; будувати фразу так, щоб ім’я стояло в називному."
  - "«Underrail Express» (a15, a78) — Underrail лишається латиницею й не відмінюється (глосарій)."
  - "a43 «::[Persuade]::» — глосарій: «::[Переконати]::»."
  - "Топоніми з глосарія: SGS → ССГ, South Gate Station → Станція Саут-Гейт, Core City → Центральне Місто, Rail Crossing → Залізничний Переїзд."
  - "q45 і q48 містять \\n\\n — розрив абзацу зберігати."
  - "q34, q40 звертаються до гравця в минулому часі й оцінках — перевірити, чи не потрібен $(#…) для українського роду там, де в англійському його немає (STYLE §2: додавати плейсхолдер — норма)."

