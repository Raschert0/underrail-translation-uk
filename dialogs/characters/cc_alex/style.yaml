speakers:
  - slug: gorge
    name: Gorge
    units: default
    confidence: probable
    evidence: [q48, q73]
    role: >-
      Машиніст потяга Underrail Express, який п’є в барі Центрального Міста; знає, що
      сталося з подружжям Бейкерів. За грубістю ховає горе за вбитим сином — і саме
      цей злам, а не сюжет, диктує різкість його реплік.
    relationships:
      - "Тімоті — загиблий син; тема, за яку мовець погрожує насильством (q45, q48)"
      - "Джин, шинкар, — розповів гравцеві про мовця; джерело хибної версії про «брата» (a15, a71, q72)"
      - "Террі й Лора Бейкери — подружжя, яке він бачив востаннє на Залізничному Переїзді (q29, q32)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Панібратське звертання-плейсхолдер $(#bud/sugar) у більшості реплік, лайливе
        «freakin’», пряма погроза «I’m gonna smash your freakin’ windpipe» — STYLE §3.2,
        грубий вуличний мовець на «ти»; §3.3 — гравець дзеркалить.
      gender_cues: ["$(#bud/sugar)", "$(#bud/sister)"]
    voice:
      register: різкий, п’яний, підкреслено байдужий
      idiolect:
        - "стале «Aight» замість «All right» (q22, q27, q49, q82) — словесний тик, тримати один короткий український відповідник у всіх входженнях"
        - "евфемістичне «freakin’» замість лайки — знижене, але не матюк; не пом’якшувати до нуля і не підвищувати до брутального"
        - "«I’ll bite» (q9) — «гаразд, спробую», згода знехотя"
        - "«People — they’re jerks, scum» — рубані називні конструкції з тире, зберігати уривчастість"
        - "капіталізоване «DROP OFF» (q48) — крик-евфемізм замість посилання; великі літери зберегти"

