speakers:
  - slug: wyatt
    name: Ваятт
    units: default
    confidence: certain
    evidence: [q12, q29]
    role: >-
      Єдиний уцілілий господар старого депо на Звалищі: колишній торговець, який
      через мутаген Biocorp перестав старіти й уже сотню років стереже свій дім
      серед мутантів. Тримає гравця на мушці, говорить сухо й владно, а спогад
      про отруєних собак — єдине місце, де голос зривається.
    relationships:
      - "Двоє науковців Biocorp — ті, хто підмінив йому «паливні комірки» контейнерами з мутагеном; він чекає на їхнє повернення, щоб убити"
      - "Scrappers — приходили з питаннями й гинули; зневажливо «jackass»"
      - "Його собаки — мертві; єдина емоційна прив’язка в усьому вузлі (q24, q25)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Погрожує з-за револьвера й одразу маркує гравця як чужинця-мародера
        («one stupid scrapper»); фамільярне гендерне звертання $(#boy/girl)
        задає позицію старшого над зайдою — «ти» за STYLE §3.2. Гравець
        дзеркалить (§3.3): «Take it easy, man», «pops».
      gender_cues: ["$(#boy/girl)"]
    voice:
      register: сухий, наказовий, з ковбойською погрозою; в оповіді — розмірений спогад
      idiolect:
        - "формули з вестерну: «That's far enough», «put some lead between your eyes», «yours truly» — тримати образність, не нейтралізувати"
        - "рублені стверджувальні речення поспіль (q34–q38) — ритм не склеювати в періоди"
        - "зірочковий наголос *all*, *you* — логічний акцент, зірочки лишати"
        - "єдиний вигук із зірваним голосом: «They messed with my mind!» (q29) — окличність зберігати, решта тексту рівна"

