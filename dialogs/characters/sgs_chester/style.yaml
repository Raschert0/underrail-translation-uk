pitfalls:
  - "ГОЛОВНЕ: репліки складаються рушієм із фрагментів. q7 («...my dead ») + q8 «brother» / q74 «sister» + q9 («. I *must* have it.») — це одне речення. Так само q29 «He » / q33 «She » + q30 «had a...». Українська вимагає узгодження прикметника й присвійного займенника ПЕРЕД іменником («мій мертвий брат» / «моя мертва сестра»), тож дослівний посегментний переклад дасть биту фразу. Не вирішувати наосліп у межах одного юніта — узгодити всі пов’язані фрагменти разом і винести питання на рівень проєкту."
  - "$(tempcontext.siblingName) (q23, q28, q30, q35, a24) — не відмінювати всередині плейсхолдера; будувати фразу так, щоб ім’я лишалося в називному"
  - "Стать брата/сестри визначає рушій — усі дієслова минулого часу й прикметники про цю особу залежать від неї; там, де фрагмент не дає розрізнення, шукати безрідну побудову"
  - "Реєстрові й глосарійні назви: Chester → Честер, charons → харони, burrowers → копаки, scavenger → шукач"
  - "::[Mercantile]:: (a49, a54, a56) — мітка навички у квадратних дужках; перекладати як назву навички, дужки й :: зберегти"
  - "q11, q51, q78 — самі лише ремарки без мовлення; це нарація, «ви», навіть якщо сусідні репліки на «ти»"
  - "Числівники в торзі (a44, a49, a52, a54, a56, q65) мусять лишатися взаємно узгодженими: сто, сто п’ятдесят, двісті, двісті п’ятдесят"

