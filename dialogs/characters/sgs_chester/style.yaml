speakers:
  - slug: chester
    name: Честер
    units: default
    confidence: certain
    evidence: [q2, q25, q59]
    role: >-
      Шукач, останній живий із родини, що все життя провела «на рейках»; сидить
      із респіратором над нечіпаним пивом і чекає звістки про зниклого брата
      чи сестру. Золотий перстень батька — єдине, що виводить його зі ступору.
    relationships:
      - "$(tempcontext.siblingName) — брат або сестра, зникли; ім’я підставляє рушій"
      - "Jasper Royce — батько, теж шукач, помер три роки тому"
      - "Karl — брат, загинув раніше; мати померла першою"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Не службовець і не обслуга: вуличний шукач із редукованою мовою («I
        gotta… I gotta have that ring») і прямою лайкою на адресу гравця («Give
        me the ring, you worm!») — STYLE §3.2 «свої, вуличні → ти». Гравець
        дзеркалить: «Hey, man», «Take it easy, fella», «You're in my spot,
        buddy» — STYLE §3.3.
    voice:
      register: пригаслий, монотонний, з різкими зривами в агресію
      idiolect:
        - "обриви й паузи через три крапки як ознака горя — зберігати позицію крапок, не склеювати речення"
        - "повтор слова замість підсилення: «We were all inseparable. Inseparable.»"
        - "у торзі мова коротшає до уривків; у спогадах — довші періоди"
      switches:
        - {unit: q59, to: ти, trigger: "перехід від апатії до погрози зі зброєю — регістр той самий, але тон різко грубішає"}
        - {unit: q61, to: ти, trigger: "пряма образа «you worm»; грубість не пом’якшувати, STYLE §9"}

