speakers:
  - slug: ola
    name: Ола
    units: default
    confidence: certain
    evidence: [q2, q38, q79, q85, q102]
    role: >-
      Оперативник JKK у Центральному Місті: постачає гравцеві спорядження, дає
      завдання в каналізації й видає нагороди. Вузол має злам — до середини він
      підкреслено дружній «свій хлопець», а після зникнення Вівіан зривається на
      відкриту зневагу й глум.
    relationships:
      - "Вівіан — колега по JKK; Ола підозрює її у подвійній грі, а згодом смакує її смерть"
      - "Едстром («the big man», «Mr. Edstrom») — начальник; Ола говорить про нього з підлеглою шанобливістю"
      - "Гравець — новачок у JKK, якого Ола зверхньо опікає"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Наскрізне панібратське звертання $(#bro/sis) у понад двадцяти репліках,
        сленг («Sweet», «groovy», «hardcore») і пряма лайка в другій половині
        вузла. Формальних маркерів немає жодного — STYLE §3.2.
      gender_cues: ["$(#bro/sis)", "$(#Bro/Sis)"]
      switches:
        - {unit: q87, to: ти, trigger: "від показної дружності переходить до відвертих образ — «you idiot», «moron»; регістр той самий, змінюється тон"}
    voice:
      register: панібратський, сленговий, показно розслаблений; під тиском — знущальний
      idiolect:
        - "«Sweet» як вигук схвалення — словесний тик, потрібен один сталий український відповідник"
        - "«groovy» — друге наскрізне слівце схвалення, відмінне від «sweet»; не зливати в одне"
        - "«dominate / dominating / keep on dominating» — корпоративний жаргон JKK, той самий, що в Оскара; тримати спільний відповідник по обох вузлах"
        - "нагнітання повтором: «She's gone! Gone! Gone! GONE!», «A lie! A LIE!» — капслок і повтори зберігати"
        - "«$(#bro/sis)» ставить у кінець або в середину речення як заповнювач, а не як справжнє звертання"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Нарація тут іменована («Ola seems unfazed…»,
    «Ola's smile slowly fades away…») і саме вона доводить атрибуцію мовця.
    Увага: у q2, q38, q58, q79, q85, q93, q98, q102 нарація і пряма мова Оли
    стоять в одному юніті — частина в ::…:: лишається на «ви», навіть коли
    сусіднє речення тієї самої репліки звучить на «ти». Не вирівнювати обидві
    частини під один регістр.

