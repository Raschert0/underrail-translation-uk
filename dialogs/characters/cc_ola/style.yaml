  - "q79 і q115 мають $(#Bro/Sis) з великої літери — обидві гілки в українському варіанті теж з великої (STYLE §2)"
  - "q94 і q96 мають *$(#bro/sis)* — зірочки-виділення лишаються поза плейсхолдером, не всередині"
  - "q108 має *not*, q93 — *was*: асиметричне виділення переносити на те слово, що несе наголос в українському реченні, а не механічно на позицію"
  - "«JKK», «Coretech», «Praetorian Security» — лишаються латиницею (глосарій, read-only); «Faceless» при цьому перекладається як «Безликі»"
  - "«Mr. Edstrom» — за реєстром Едстром; звертання «Mr.» не транслітерувати, а передавати українською моделлю"
  - "a59 містить теґ навички ::[Mercantile]:: — у глосарії його немає (є лише ::[Persuade]:: → ::[Переконати]::); не вигадувати варіант поодинці, узгодити централізовано"
  - "q7, q13, q19 — кома перед $(#bro/sis) як перед звертанням; в українському реченні звертання ставиться у кличний відмінок обох гілок"
  - "у q3, q58, q70, q79 всередині рядка стоїть літеральне \\n\\n — зберігати як є, це розрив абзацу, а не пробіли"

