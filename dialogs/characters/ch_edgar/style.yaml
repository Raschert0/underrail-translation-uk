speakers:
  - slug: edgar
    name: Едгар
    units: default
    confidence: certain
    evidence: [q13, q38, q149]
    role: >-
      Ватажок Табору Хатор, колишній мисливець, що дістав посаду за вислугу років,
      а не за походження. Говорить як людина, звикла ухвалювати рішення за інших:
      коротко, наказово, без прикрас.
    relationships:
      - "Бойд — заступник, «my right hand man»; Едгар його захищає й пояснює його минуле"
      - "Gideon Sud — попередній ватажок, загинув на полюванні; Бек — його син"
      - "Сарін — жінка Бека; Едгар обриває розмову про неї (q169, q173)"
      - "Великий Брет зі ССГ — давній знайомий, «good old Bret»"
      - "Rathound King — головний ворог табору; Едгар не називає його інакше як «savage»"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Попри посаду говорить суцільно розмовно: «ain't», «wanna», «gonna»,
        «them tattoos», «gun them bugs down». Це прикордонний мисливський табір,
        а не установа — STYLE §3.2 дає «ти».
      gender_cues: ["$(#man/woman)", "$(#men/men, or women in you case,)"]
      note: >-
        Холодність першої зустрічі (q13 «state your business quickly», q124
        «a complete stranger») передається лексикою, а не переходом на «ви» —
        інакше вузол розпадеться на два різні регістри.
    voice:
      register: різкий, командний, без люб’язностей
      idiolect:
        - "просторічна граматика попри посаду — не вирівнювати її до літературної"
        - "заклинальний повтор наприкінці тиради: «But we'll get rid of him. We will get rid of him.»"
        - "риторичне питання як докір: «Did a stalactite drop on your head?»"
        - "коротке рубане речення в наказі: «State your business.»"

  - slug: rathound_king
    name: "Rathound King — канонічної української форми немає, див. new_names"
    units: [q10]
    confidence: certain
    evidence: [q10]
    role: >-
      Ворог табору, з’являється в цьому вузлі рівно один раз — у сцені нападу
      на його лігво. Говорить зверхньо, як до комах.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Звертання «little one» і тон зверхності: це презирливе «ти», не ввічливе.
    voice:
      register: погордливий, урочистий, з паузою на власний титул
      idiolect:
        - "говорить про себе в третій особі: «the wrath of the Rathound King»"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Нарація тут довга й описова (q13, q26, q149),
    з фокусом на міміці Едгара; це не його мова, регістр не успадковується.

new_names: ["Garnham", "Gideon Sud", "Rathound King", "Carnifex"]

idioms:
  - unit: q34
    src: "Did a stalactite drop on your head recently?"
    note: >-
      Місцева ідіома підземелля, повторюється в q52. Сталактит зберігаємо —
      це прив’язка до світу, а не випадковий образ.
  - unit: q157
    src: "that's just my two charons"
    note: >-
      Перелицьоване «my two cents» на ігрову монету. Потрібна українська
      ідіома того ж типу з «хароном», не дослівний переклад.
  - unit: q68
    src: "That savage is like cancer"
    note: "порівняння лишається жорстким; не пом’якшувати до «біда» чи «лихо»"
  - unit: q164
    src: "Beneath all that coloring, something white was shining through."
    note: >-
      Метафора татуювань і чистоти водночас. Гра на «coloring» — не зводити
      до однієї з двох площин.
  - unit: q55
    src: "he might as well be floating through these caves"
    note: "про вміння не лишати слідів, а не про левітацію — не буквалізувати"
  - unit: q111
    src: "you are one of them... role-playing people"
    note: >-
      Едгар не знає слова й підбирає його вголос; затинання в пошуку терміна
      має лишитися, інакше зникне комізм.

