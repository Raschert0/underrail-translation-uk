pitfalls:
  - "Grim у реєстрі — «Грим», не «Грім»: збіг зі словом «грім» руйнує ім’я"
  - "Aegis у цьому вузлі — «Aegis Incorporated», військова компанія (q547), а НЕ бойовий препарат «Егіда» з глосарія; це різні референти"
  - "$(context.player.Name) трапляється щонайменше в 20 юнітах (q16, q35, q47, q62, q87, q91, q100, q123, q148, q254, q350, q454, q527, q573, q578, q617, q649, q654, q704, q711, q726, q744, q749) — не відмінювати всередині плейсхолдера; будувати фразу так, щоб ім’я стояло в називному, кличний неможливий"
  - "«Grim Jetters» містить ім’я капітана — рішення про назву банди має узгоджуватися з «Грим»"
  - "«The Rig» — глосарій дає «Платформа»; «Dreadpool» — «Жахлива Лагуна»; «Meatway» — «М’ясний Шлях»; «Chancer’s Bay» — «Затока Авантюриста»; «Core Ring» — «Центральне Кільце»; «Hell’s Gut» — «Нутро Пекла»; «Camp Hathor» — «Табір Хатор». Брати готове, не вигадувати"
  - "«Cap’n» — стягнена форма звертання, повторюється десятки разів; потрібен один стабільний український відповідник на весь вузол"
  - "Крузерів eye-dialect передавати українським просторіччям, а не транслітерацією англійських скорочень; «d’» не має українського аналога-артикля"
  - "теги навичок ::[Mercantile]::, ::[Biology]::, ::[Electronics]:: оформлювати як ::[Переконати]:: з глосарія — квадратні дужки й ::  зберігати"
  - "Biocorp і Underrail лишаються латиницею навіть усередині української фрази (глосарій)"
  - "«charons» (a168, a172, a174, a176) — глосарійне «харон», монета, з малої"
  - "у q3, q47, q83, q87, q99, q118, q121, q143, q147, q164, q289, q290, q312, q415, q421, q456, q457, q568, q611, q673, q707 є буквальне \\n\\n — зберігати як є"
  - "q163 і q289 обіграють побуквене A-C-o-N-R → Acorn: гра слів вимагає рішення про назву «Acorn» ДО перекладу цих юнітів"
  - "q30 «d’ Eels let us in» і q32 стосуються Чорних Вугрів — назва фракції потребує централізованого рішення (у new_names)"

