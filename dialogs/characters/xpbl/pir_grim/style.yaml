    role: >-
      Капітан ферій і розвідник Гримових Джеттерів, доповідає про Вугрів і сонар.
      Найгрубіший голос вузла — його репліки контрастують із мовою Грима і цей
      контраст має бути чутний.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: "груба вулична мова, кличе гравця «banga» і «Can» (q712) — STYLE §3.2"
      gender_cues: ["$(#'im/'er)", "$(#he/she)"]
    voice:
      register: грубий, портовий, зневажливий
      idiolect:
        - "суцільний eye-dialect: d’ = the, dey/der/dis/dan, ye/yer, fer, sum, an’, ’ere"
        - "усічення кінцевих приголосних: wors’, momen’, jus’, pas’, suspect’d"
        - "«Squeals» — зневажлива кличка протекторатців"
        - "«banga» — його звертання до гравця, не Гримове"
    note: >-
      Атрибуція probable: у файлі немає позначок мовця, підстава — суцільний
      eye-dialect, якого немає в жодного іншого персонажа. q519 («Aye, Cap’n.»
      після наказу «::he turns to D’ Flinger::», q518) належить D’ Flinger, а не
      Крузерові — його винесено окремо нижче.

  - slug: razor
    name: Бритва
    units: [q603, q642, q644, q650, q652, q655, q657, q672, q674, q694, q695, q697]
    confidence: probable
    evidence: [q604, q644, q655]
    role: >-
      Лейтенант і права рука капітана, іде з гравцем на рейд проти «Армстронга».
      Мова майже літературна, з легкою елізією — між Гримом і Крузером.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: "рівний по команді, звертається «mate» (q650, q675) — STYLE §3.2"
      gender_cues: ["$(#he/she)", "$(#'im/'er)"]
    voice:
      register: діловий, суховато-зухвалий
      idiolect:
        - "звертання «mate» до гравця"
        - "«diddly-squat» (q603) — знижена розмовність без eye-dialect"
        - "ремарка ::He flips his knife.:: (q644) — його впізнаваний жест"
    note: >-
      Ключовий доказ: q604 «Everyone was involved in this raid, Razor» — Грим
      звертається до Бритви, отже попередній q603 промовляє саме Бритва.
      Так само q673 «::He looks at you, but speaks to Razor.::» доводить, що
      q672 і q674 — Бритвині.

  - slug: flinger
    name: Флінгер
    units: [q519]
    confidence: probable
    evidence: [q518]
    role: >-
      Підручний, якому Грим наказує позбутися тіла. Одна репліка — коротке
      підтвердження наказу.
    address:
      npc_to_player: н/д
      player_to_npc: н/д
      basis: "до гравця не звертається; говорить до капітана"

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q525, q640, q641, q675]
    confidence: unknown
    reason: >-
      q525 («They’re attackin’!») — вигук тривоги без імені й без мовного
      відбитка. q640–q641 («Be quiet,» / «Can.») — обірвана репліка когось із
      двох лейтенантів: слово «Can» уживає Крузер (q712), але тон пасує й
      Бритві. q675 («The lootin’ waters will be yours, mate.») стоїть після
      обміну Грим — Бритва, і «mate» вказує на Бритву, а зміст — на капітана.
    guidance: >-
      Тримати базовий регістр вузла — «ти», нейтральна побудова. Уникати форм
      минулого часу й прикметників, що видають рід мовця. Не додавати
      eye-dialect, поки атрибуція не підтверджена: помилково «крузерівський»
      правопис читатиметься як інший персонаж.

