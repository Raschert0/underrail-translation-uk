speakers:
  - slug: grim
    name: Грим
    units: default
    confidence: certain
    evidence: [q456, q458, q461]
    role: >-
      Капітан Грим (справжнє ім’я — Cadmus Green, колишній кадет офіцерського
      корпусу Biocorp) очолює найбільшу піратську команду Півдня. Освічений
      стратег у піратському середовищі: повні складні речення, книжна лексика,
      але системне випадання кінцевого «g» — його мова має бути гладкою й
      владною, а не простацькою.
    relationships:
      - "Крузер — підлеглий, доповідає з моря; Грим відповідає йому спокійно й покровительськи"
      - "Бритва — «right hand of mine», лейтенант; після його загибелі місце пропонують гравцеві"
      - "Донні — торговець порту, до нього Грим відсилає по платню"
      - "Катя — цілителька, готує йому парфуми"
      - "Тодд, Останній Лемурієць — Грим ставиться до нього дбайливо, як до цінності"
      - "Перевізник — див. сусідній вузол dialogs/characters/xpbl/ferryman, Грим описує його з повагою"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Грим говорить із гравцем як капітан із членом власної команди — наказує,
        погрожує, кепкує: «Don’t make us look bad… I’ll find you and send you
        under myself» (q704), «I want that ship raided, pirate!» (q720). Це своє,
        вулично-командне середовище, отже «ти» — STYLE §3.2. Репліки гравця
        дзеркалять базу (§3.3); субординацію несе звертання «Cap’n», а не «ви».
      gender_cues: ["$(#man/woman)", "$(#he/she)", "$(#'im/'er)", "$(#his/her)", "$(#Gentlemen/Ladies and gentlemen)"]
      switches:
        - {unit: q605, to: ви, trigger: "звертання до зібраної команди — множина, урочистий тон"}
    voice:
      register: владний, стриманий, книжно-піратський
      idiolect:
        - "системне випадання «g»: interestin’, jettin’, lootin’ — але без вульгаризмів"
        - "нав’язливе «Interestin’. Real interestin’» — словесний тик (q9, q161, q307)"
        - "морська божба замість лайки: «By the sea», «Damn it to the sea’s depths!»"
        - "евфемізм «send under» = вбити/потопити (q228, q704)"
        - "схвальне «jettin’» як прикметник: «jettin’ work», «jettin’ guts»"
        - "часте «yes, yes» на початку відповіді"
        - "ремарка ::He half-smiles.:: повторюється як його фірмовий жест"

  - slug: cruzer
    name: Крузер
    # q519 належить Флінгеру: q518 — «::Furious, he turns to D' Flinger.::
    # Dispose of the body», тож «Aye, Cap'n.» відповідає саме адресат.
    units: [q30, q32, q34, q44, q49, q581, q587, q592, q593, q594, q595,
