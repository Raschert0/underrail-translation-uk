        - "розтягнуте «Yeeeeeah!» і регіт «bwahahaha!» — зберігати подовження й саме цю форму реготу"
        - "«pipeworkin’», «pipeworks!» — евфемістична лайка від pipeworker; груба, не пом’якшувати"
