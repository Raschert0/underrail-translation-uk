      Тоні Ладелман — південець, провідник і механік експедиції, балакун і хвалько
      з нескінченним запасом побрехеньок про кожне ремесло. Його голос — суцільний
      вуличний сленг і самореклама, тож майже кожен його рядок вимагає розмовного
      синтаксису, а не літературного.
    relationships:
