        Панібратський вуличний мовець: випадання g, «ain’t», «’cause», звертання
        «my friend», «you hardcore son of a rat», «neighbor». Дистанції не тримає
        від першого рядка — STYLE §3.2.
      gender_cues: ["$(#him/her)self", "$(#he/she)", "$(#'im/'er)"]
    voice:
      register: гучний, хвалькуватий, вульгарний вуличний південець
      idiolect:
        - "«hardcore» — головний словесний тик, і прикметник, і похвала, і лайка; має лишатися ОДНИМ сталим словом у всіх позиціях"
