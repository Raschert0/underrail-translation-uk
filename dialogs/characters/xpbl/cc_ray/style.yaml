speakers:
  - slug: ray
    name: Рей
    units: default
    confidence: certain
    evidence: [q5, q486]
    role: >-
      Власник єдиної крамниці гідроциклів у Південній Underrail: балакучий продавець,
      що тисне на панібратство й засипає покупця технічними подробицями. Весь вузол —
      його монолог, тож регістр і словесні тики тут вирішують усе.
    relationships:
      - "Гіб — механік, працює з ним у майстерні (q2, q470)"
      - "Отто — набридливий клієнт-мисливець, якого Рей ледве терпить (q467)"
      - "Преторіанці — патруль, до якого він звертається після пограбування (q513)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Від першої репліки зве покупця «friend», одразу випитує ім’я й переходить на
        нього, у q9 звертається «$(#, son/)». Мова суцільно розмовна («ya», «yer»,
        «Imma», «ain’t»). За STYLE §3.2 це однозначне «ти»; репліки гравця дзеркалять
        його (§3.3), зокрема фамільярне «Come on, Ray» у торгах.
      gender_cues: ["$(#, son/)"]
    voice:
      register: гучний, панібратський, торговельний; захоплений технікою
      idiolect:
        - "«hardcore» — головний словесний тик; те саме слово як похвала, вигук і прикметник (q9, q22, q255, q423, q508). Потрібен ОДИН український відповідник на весь вузол, не синонімічний ряд"
        - "«dominate / dominatin’ / domination / dominator» — другий тик, універсальний підсилювач і водночас евфемізм «убити» (q26, q595). Тримати спільний корінь у всіх формах"
        - "«Can’t deny that» — стала кінцівка-приспів (q206, q212, q222, q232, q511, q516). Перекладати щоразу однаково"
        - "«O-kay» з дефісом — розтягнуте вимовляння, не звичайне «окей»; дефіс зберігати (q34, q36, q452, q464)"
        - "систематичне випадання -g: fixin’, sellin’, drivin’ — відтворювати українською розмовною редукцією, а не апострофами всередині слів"
        - "стягнення whatcha / getcha / didja / betcha / Imma / lotta / buncha / ’cuz — суцільний просторічний шар"
        - "лайка-евфемізм на «ass» і «Pipeworks»: ass-joes, ass-juicers, sack-a-asses, son of ass, asshats, pipeworkin’ scum (q245, q467, q488, q515). Грубе лишається грубим — STYLE §9"
        - "«bom’» замість bomb — навмисно обрізане слово (q500, q505); обрізаність зберігати"
        - "виділення зірочками *the* fastest, *so* hardcore — розмітка наголосу, лишається на місці"

