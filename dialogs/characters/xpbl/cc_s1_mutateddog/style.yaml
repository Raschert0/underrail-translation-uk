pitfalls:
  - "репліки гравця — спотворена мова мутанта: «C-C-Cooookkkiii?», «Phhhhhiieee?», «Mrrrr… mmmhhhmmiiiitt?», «Bbbrrrnn… rrr… rrroooaaassteeed?», «Frrreeesh meeaat?», «Hhhhhhooooop… Hhhoooooppp», «Wwwwoo.. hrrr, drrrrr.. ddrrrriiiin?» — це впізнавані англійські слова (cookie, pie, meat, roasted, fresh meat, hopper, drink). Спотворювати треба УКРАЇНСЬКЕ слово, а не транслітерувати англійське: інакше загадка перестає розгадуватися"
  - "заїкання відтворювати на українському приголосному (STYLE §9): «C-C-…» → подвоєння першого звука українського слова"
  - "a29 «Hhhhhhooooop… Hhhoooooppp» і a30 «cave hopper meat» — це одне й те саме: спотворене слово має вгадуватися саме як «стрибун» (глосарій: hopper → стрибун)"
  - "рядки-підказки дій ::Try to pet the dog.::, ::Place the cave hopper meat on the plate.::, ::Leave.::, ::Pet all of the dogs.:: — інфінітив, STYLE §3.5"
  - "q29 закінчується подвоєним ::::  — не «зайві» символи, структуру юніта зберегти як є"
  - "«it» про пса — українською рід треба обрати один (пес, чоловічий) і тримати його на весь вузол; у q7 «a sad pup», у q31 «they» про зграю"

