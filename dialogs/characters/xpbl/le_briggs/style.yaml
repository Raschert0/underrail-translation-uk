    Нарації дуже багато, зокрема два довгі атмосферні блоки (q455, q456) і
    сцена задушення (q212, q220). Скрізь «ви» без винятків — STYLE §3.1,
    навіть коли поруч Ладелман каже «ти». Підказки дій усередині «::…::»
    (a4, a6, a57, a273, a541) — інфінітив, STYLE §3.5.

