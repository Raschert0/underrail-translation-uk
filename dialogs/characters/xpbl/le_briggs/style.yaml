pitfalls:
  - "Aegis Incorporated (q39, a133, a335) — компанія, тож латиницею за STYLE §6. Глосарійне «Егіда» стосується бойового препарату Aegis і сюди НЕ підходить."
  - "«expedition» у цьому вузлі — звичайне слово «експедиція», а не назва доповнення Expedition; глосарійна заборона перекладу тут не діє."
  - "Багато q-юнітів — це фрагменти однієї речення, що склеюються рушієм: q362–q388 (звіт про запаси), q404–q411 і q413–q421 (довідки про Перевізника й піратів), q442–q445, q485–q488, q512–q514, q558–q560. Порядок слів і відмінки мають працювати після склейки; q560 — це сама крапка. Переставляти члени речення між юнітами не можна."
  - "q136 «Coretech », q145 «JKK », q146 «Praetorian Security » — вставні назви компаній усередині репліки Ладелмана; за глосарієм лишаються латиницею й не відмінюються, отже українську рамку навколо них треба будувати так, щоб відмінок не був потрібен."
  - "$(context.player.Name), $(context.playerArenaTitle), $(context.global_xpbl_aegisSecTroopersAvailable) — усередині плейсхолдера нічого не змінювати й не відмінювати."
  - "q343 містить «Professor Edward Olfield» — очевидна помилка джерела (в решті файлу Oldfield). Передавати як Олдфілд, помилку не відтворювати."
  - "«sec-trooper», «navcom», «floatie-talkie», «jet ski» — повторювані технічні слова світу; вибрати один відповідник і тримати його в усіх 610 юнітах."
  - "q17 «You're a woman.» та a188 «You're talking to a Southern woman, sir.» — це окремі гілки за статтю гравця, а не плейсхолдер; жіночий рід тут обов’язковий."
  - "У Ладелмана $(#'im/'er) стоїть у скороченій формі — український відповідник теж має бути розмовним, а не літературним «його/її»."
  - "Реплік із заїканням і хрипом багато (a215, a218, a275, a304–a307): відтворювати на українському приголосному, STYLE §9."

