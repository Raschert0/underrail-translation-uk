speakers:
  - slug: flinger
    name: Флінгер
    units: default
    confidence: certain
    evidence: [q24, q233]
    role: >-
      Пірат-Джеттер із порту, тюремник і метальник ножів; сторожить камеру з
      гравцем і Профманом. Хизується титулом найкращого метальника й ладен
      закластися на гроші — звідси постійні виклики, кпини та погрози ножем.
    relationships:
      - "Cap’n — ватажок піратів; Флінгер посилається на нього як на вищу владу («til Cap’n says ye go»)"
      - "Крузер — товариш по банді, «got a heavy hand» (q152)"
      - "Бритва — інший пірат, об’єкт жарту гравця (a129, q131)"
      - "Профман — прізвисько професора, ув’язненого поруч"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний пірат-тюремник, який глузує, погрожує й панібратськи зве
        співрозмовника «banga»; жодного натяку на ввічливу дистанцію в тексті
        немає — STYLE §3.2. Репліки гравця дзеркалять це «ти» (§3.3), навіть
        коли гравець підлещується або погрожує.
      gender_cues: ["$(#boy/girl)", "girl", "hun"]
    voice:
      register: грубий, глузливий, панібратський; сленг Джеттерів
      idiolect:
        - "суцільний око-діалект: th → d (d’, dis, dere, dat), випадання g (flingin’, jettin’), ye/yer замість you/your, wit’, ’e’s"
        - "«banga» — постійне звертання-паразит до співрозмовника; тримати один варіант на весь вузол"
        - "сміх «tehe / tehehe / te-he-he» — упізнаваний тик, не згладжувати й не заміняти на «ха-ха»"
        - "«jettin’» як універсальний підсилювач: і «круто» (q136), і «дуже» (q76) — контекст вирішує"
        - "«ye dig?» — риторична кінцівка реплік; потрібен один сталий український відповідник"
        - "«send/go unda» — евфемізм «убити / померти», не буквальне «під»"
        - "лайливі клички: clod, dumbat, dryfoot, bastar’, floozin’"
        - "самоназва «D’ Flinger» з навмисним артиклем — у q28 обігрується як «*Dee* bes’»"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Нарація тут довга й натуралістична (q193,
    q202, q203, q206), від другої особи про дії гравця. Підказки дій усередині
    ::…:: — інфінітив (§3.5): ::Fight!::, ::Say nothing.::, ::Spit on him.::

new_names: ["Thrasher", "Jetters", "Scalers", "Profman", "Calamity", "Lurker", "creeper", "shroomberry", "banga", "dryfoot", "dumbat", "clod"]

