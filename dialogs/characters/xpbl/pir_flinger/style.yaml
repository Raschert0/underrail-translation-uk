    src: "Git jetted."
    note: "внутрішньобандитське відсилання, не «отримай реактивний» — потрібен сталий сленговий відповідник, узгоджений із «jettin’»"
  - unit: q25
    src: "’S been fun takin’ yer coins"
    note: "розмовне; не калькувати «було весело брати твої монети» дослівно — coins тут харони (глосарій: charon → харон)"
  - unit: q47
    src: "send yerself under fer losin’ all yer savin’s"
    note: "«go/send unda» = загинути; локалізувати як смертний евфемізм, а не просторову метафору"
  - unit: q98
    src: "Yer full o’ it."
    note: "«брешеш / заливаєш», не буквальне"
  - unit: q99
    src: "Git outta ’ere."
    note: "тут вигук недовіри, а не наказ вийти"
  - unit: q131
    src: "yer gunna git a bloody grin from ear to ear"
    note: "погроза перерізати горло; образ «усмішки» зберегти, бо він відсилає до прізвиська Бритва"
  - unit: q164
    src: "knock yerself out"
    note: "«та частуйся», не «вирубайся»"
  - unit: q187
    src: "if ye catch d’ way me jet’s floatin’"
    note: "авторський сленговий варіант «якщо розумієш, до чого я» — тримати зв’язок зі словом jet/jettin’"
  - unit: q215
    src: "Ye ain’ gunna outspit me, banga."
    note: "порівняльне дієслово-новотвір; потрібен український однослівний відповідник, а не описова конструкція"

pitfalls:
  - "q233 містить $(context.player.Name) — не відмінювати всередині плейсхолдера, будувати фразу так, щоб ім’я лишалося в називному"
  - "q197 містить $(#boy/girl) — обидві гілки перекласти українськими формами; регістр першої літери зберегти"
  - "гілка a171–q185 доступна лише персонажці: Флінгер зве її «girl», «hun» — там гендер жорстко жіночий, плейсхолдер не потрібен"
  - "минулий час і прикметники про гравця поза цією гілкою потребують $(#…) — українська гендерує там, де англійська ні (STYLE §2)"
  - "око-діалект передається просторічністю української репліки, а не спотвореним написанням кожного слова — інакше рядок стане нечитним"
  - "«Hell’s Gut» (q241) — глосарій: Нутро Пекла; «Junkyard» (q70) — Звалище; «Aegis» (q243) — Егіда; «zoner» (q136) — зонер; «rathound» (a119) — щурчак"
  - "q11 і q29 містять теги перевірок ::[Throwing]::, ::[Persuade]:: — формат квадратних дужок і :: зберегти"
  - "«Cap’n» — стягнена форма звертання до ватажка; тримати єдиний варіант у всьому вузлі"

