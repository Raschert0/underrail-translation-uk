  - slug: marcus
    name: Маркус
    units: default
    confidence: certain
    evidence: [q86, q120, q220, q221]
    role: >-
      Інтендант і технічний офіцер експедиції Aegis Incorporated на Чорному Морі:
      видає спорядження, платить, обмінює долари на харони, читає лекції про
      навігацію та системи оборони острова. Гравець — його підлеглий сек-боєць,
      тож Маркус говорить як старший за посадою, а не як приятель.
    relationships:
      - "Тоні (Ladelman) — сусід по наметі, зброяр; постійне джерело роздратування: «I've been stuck in this tent with you for far too long...»"
      - "шеф Бріггс — начальник експедиції, вищий за Маркуса"
      - "гравець — сек-боєць під його розпорядженням; Маркус видає йому наряди і платню"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова субординація і незмінно чемний тон: «Well, go get it for me,
        please. I need to have everything accounted for», «I must advise you not
        to interfere with our work here». Персонаж повними реченнями, без
        випадання g, без сленгу — STYLE §3.2 «формальні, службові» → «ви».
        Репліки гравця дзеркалять базовий регістр (STYLE §3.3).
      gender_cues: ["$(#him/her)", "$(#his/her)", "$(#His/Her)"]
    voice:
      register: стриманий, службовий; терпляча пояснювальна манера
      idiolect:
        - "довгі повні періоди без скорочень — лекції про navcom (q122–q124) і про APS (q215, q218, q219) читаються як інструктаж"
        - "любить точність формулювань і поправляє співрозмовника: розбір «over and out» у q149"
        - "зітхання й нахили голови у нарації як основний спосіб емоції: «::He sighs.::», «::He nods.::»"
        - "у фіналі експедиції тон пригнічений — джерело прямо каже «downhearted tone of voice» (q20, q254)"

