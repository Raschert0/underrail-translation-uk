pitfalls:
  - "Наскрізний X-сленг Гексагона (xit, xer, xcell, xtreme, xtra, xile, xem, xin’, xed, xterminated, xceptional, xcuse) — не окремі слова, а система: X підмінює початок слова або лайку. Потрібне ЄДИНЕ системне рішення на весь вузол, ухвалене централізовано; не перекладати кожен випадок окремо."
  - "q127/q130 — сам сюжет пояснює цей сленг («Oh, like xtreme and xit? It's... complicated. It's Hexagonian X-- *Slang*»). Українське рішення має робити цю сцену зрозумілою, інакше діалог розсиплеться."
  - "q165 «XR is short for mixed reality. That's *miXed Reality*» — абревіатура виводиться з великої X усередині слова. Це не гра слів на прикрасу, а механіка назви: XR, miXR, miXed Reality мають лишитися пов’язаними між собою."
  - "q324 «only one XeeGer» — прізвище перероблене під X-сленг; залежить від рішення про Seeger і про сам X-сленг."
  - "q268 і q288 містять $(context.player.Name) — усередині плейсхолдера нічого не змінювати й не відмінювати; фразу будувати так, щоб ім’я стояло в називному."
  - "q67 містить $(#he/she) і $(#him/her): це Сігер говорить про гравця з професором — третя особа, а не звертання."
  - "q98 $(#No man/No one) — асиметрична пара, гілки не дзеркальні; в українському варіанті обидві гілки мають лишитися граматично узгодженими з рештою речення."
  - "q54 «Not bying it» і q98 «He shakes his head in.» — помилки/обрубки в оригіналі. Перекладати за задуманим змістом, не відтворювати ваду."
  - "q311/q313/q314 «trainers» тут — штани, а не кросівки: «pulls down his trainers to his knees, revealing... underpants»."
  - "Багато рядків розрізано посеред речення (q17+q18, q113+q114, q116+q117, q186+q187, q275+q276). Перекладати як частини одного речення й стежити, щоб узгодження на стику збіглося; порядок слів у частинах не міняти місцями."
  - "Тик-слівце «’Kay» трапляється десятками разів (у q53 навіть як «Kay’»). Потрібен один стабільний український відповідник на весь вузол — це головна впізнавана риса персонажа."
  - "Назви за глосарієм: Biocorp і Praetorian Security — латиницею; Protectorate → Протекторат; Hell's Gut → Нутро Пекла (q243); hopper → стрибун (q239); Arena → Арена (q130); Expedition тут — звичайна експедиція, а не назва доповнення (q9)."

