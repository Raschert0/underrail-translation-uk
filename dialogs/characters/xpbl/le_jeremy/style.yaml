    evidence: [q242, q246, q226]
    role: >-
      Технік-айтівець експедиції: відновлення даних, дешифрування, аналіз; сидить
      у наметі з кавоваркою й двома комп’ютерами. Північанин із Гексагона серед
      південців, тому його мова навмисно чужа для решти табору.
    relationships:
