      - "Тодд — підопічний-простак; із ним Сігер говорить ламаною мовою («Professor *kill* Jeremy»), кличе «Toddo»"
      - "Гравець — колега-новачок; спершу «one of the new sec-troopers», згодом «we’re a team»"
      - "Маркус — технік, лагодить живлення; Бріггс — шеф охорони, до нього Сігер відсилає гравця"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Панібратський плейсхолдер $(#man/sis) у понад двадцяти рядках, суцільні
        скорочення й обрубане «’Kay», «See ya», «Yo, you need something?». Гравець
        дзеркалить — STYLE §3.3. «Sir» звучить лише в розмові з професором, не з гравцем.
      gender_cues: ["$(#man/sis)", "$(#No man/No one)", "$(#he/she)", "$(#him/her)"]

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q266]
    confidence: unknown
    reason: >-
      Рядок «Uh... why are you talking funny?» — репліка NPC (id q), а не гравця,
      і за змістом реагує на ламану мову Сігера в q265. Найімовірніше це Тодд,
      але в самому файлі немає ні нарації з іменем, ні звертання, що це підтвердили б.
