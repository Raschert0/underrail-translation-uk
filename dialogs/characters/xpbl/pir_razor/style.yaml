speakers:
  - slug: razor
    name: Бритва
    units: default
    confidence: certain
    evidence: [q244, q380, a189, a457]
    role: >-
      Лейтенант піратів Grim Jetters у Нутрі Пекла, одноокий ножовий боєць
      і тренер їзди на гідроциклі. Все, що він каже, проходить крізь густий
      піратський говір — це головна перекладацька задача вузла, а не сюжет.
    relationships:
      - "Cap'n Grim — капітан; Бритва викликав його на дуель, програв і втратив око, але лишився при пошані"
      - "Cruzer — другий лейтенант; внутрішні справи, тоді як Бритва тримає «фронтир»"
      - "D' Flinger — суперник по клинках; визнає його майстерність метання"
      - "гравець — спершу підозрюваний чужак, далі «mate», якщо вступив до Jetters"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Пірат-розбійник, вуличний і панібратський: суцільне «mate», «banga»,
        «clod», «dryfoot», жодного разу не звертається шанобливо. STYLE §3.2 —
        грубі й свої на «ти». Репліки гравця дзеркалять (§3.3).
      gender_cues: ["$(#'im/'er)", "$(#guy/girl)"]
    voice:
      register: хрипкий, глумливий, самовдоволений; погрози й побрехеньки одним тоном
      idiolect:
        - "суцільне випадання g: jettin', lootin', somethin' — тримати просторічну українську фонетику, але НЕ окати й не «сєкати» по-російськи"
        - "ye / yer / yerself замість you / your — не літературне «ви», а саме занижене «ти»"
        - "стягнення ain' / an' / wit' / jus' / don' / 'ere / 'im / 'is / thru — щільна, обрубана вимова"
        - "жести-рефрен ::He flips his knife.:: повторюється ~12 разів — має бути одна стала формула, не варіації"
        - "звертання Cap'n — стягнене, не повне «капітан»"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; підказки дій усередині :: :: — інфінітив (§3.5)"

