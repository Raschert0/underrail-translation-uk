idioms:
  - unit: q19
    src: "send ye under"
    note: "«відправити під воду» = вбити. Наскрізний евфемізм вузла (q370, q380, q400, q402, q274) — потрібна ОДНА стала українська формула, не переклад щоразу заново"
  - unit: q117
    src: "Pop $(#'im/'er)!"
    note: "pop = вколошкати/пристрелити; так само q276 «easy to pop alone», a335 «don' get popped»"
  - unit: q188
    src: "jettin'"
    note: "мінімізована лайка замість fucking — і як означення («jettin' work», «real jettin' shotgun»), і як самостійний схвальний вигук («Jettin'.» = «Клас.»). Не калькувати «реактивний»"
  - unit: q218
    src: "ye stay a dryfoot"
    note: "dryfoot = сухопутний, хто не вміє на гідроциклі; зневажливе прізвисько, потрібен стійкий український відповідник"
  - unit: q22
    src: "Is this banga yankin' my jet"
    note: "локальна переробка «yanking my chain» — «морочить мені голову», не калька"
  - unit: q22
    src: "ye better take the train"
    note: "погроза-жарт: пливти водою тобі не варто. Дослівний переклад втрачає сенс"
  - unit: q288
    src: "'is ass is grass now"
    note: "римована ідіома «йому кінець» — шукати українську розмовну, не описовий переказ"
  - unit: q84
    src: "Ye ain' such a clod after all."
    note: "clod = телепень; стала лайка Бритви, тримати один відповідник (q105 «dumbat», q247, q371)"
  - unit: q240
    src: "He's a real bladeslick."
    note: "авторський новотвір «slick» (майстерний) + blade; slick повторюється окремо (q192 «Ain' slick enough», q395 «he was slicker»). Потрібен новотвір і в українській, а не «майстер клинка»"
  - unit: q51
    src: "banga"
    note: "піратське звертання до чужого/будь-кого; внутрішньоігровий сленг — лишати запозиченням за зразком zoner (STYLE §9)"
  - unit: q333
    src: "Shockin' gen."
    note: "«gen» = покоління техніки, схвальна оцінка ножа; не «шокуючий»"

pitfalls:
  - "Вузол суцільно порізаний на фрагменти-склейки: q18+q19, q31+q32, q35+q36, q179+q180+q181+q182, q214+q215, q444+q445+q446. Українську фразу треба будувати так, щоб відмінки й порядок слів зійшлися ПІСЛЯ склеювання; перекладати фрагмент як самостійне речення — головна помилка тут"
  - "q17, q24, q120, q169, q229, q239, q301, q302, q309, q370, q381, q395, q455 містять літеральні \\n\\n — зберігати точно, не перетворювати на реальні переноси"
  - "Розмітка наголосу зірочками (*my*, *Corporal*, *better*, *did*, *that*) — переносити на слово, що несе наголос в українській, а не на позицію"
  - "q394: Бритва цитує капітана, починає своїм говором «Ye»…, обриває себе (Khm:) і переходить на правильне «*You*». Контраст двох регістрів у межах одного юніта — сюжетно значущий, згладжувати не можна"
  - "Aegis у глосарії — це бойовий препарат «Егіда». Тут Aegis Incorporated — корпорація й ворожа фракція; рішення про неї ще не ухвалене (див. new_names), а не «Егіда»"
  - "Gene в реєстрі — Джин, власник бару в Центральному Місті. «Slo Gene» у q250 — інший персонаж, мертвий побратим Бритви; не зводити їх"
  - "Grim у реєстрі — Грим (nickname), НЕ «Грім»; «Cap'n Grim» — стягнене звертання"
  - "q1, q3, q4, q5, q6 — бойові вигуки під час нальоту, без співрозмовника: короткі, окличні, без діалогової ввічливості"
  - "Теги навичок ::[Intelligence]::, ::[Mercantile]::, ::[Requires: Agility 7]::, ::[Requires: Melee 50]:: беруть назви з knowledge/ — звіряти там, не вигадувати"
  - "q6 «Can opener» — гра слів: Cans = броньовані бійці Aegis (пор. q135 «crushing the Cans»). Потрібне рішення, що зв'яже обидва юніти"

