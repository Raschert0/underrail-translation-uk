speakers:
  - slug: gritz
    name: Грітц
    units: default
    confidence: certain
    evidence: [q2, q7]
    role: >-
      Дужий найманець із засідки, який чекає на жертву й тішиться майбутнім
      убивством. Уся його мова — це передчуття розправи та хизування власною
      силою.
    relationships:
      - "Юрай — той, хто віддав гравцеві наказ; Грітц лише посилається на нього (q3), сам ним НЕ є"
      - "«старий дурень» із q6, q11, q20, q21 — їхня ціль, третя особа, не співрозмовник"
      - "спільники на зв’язку, до яких він говорить у вухо (q7)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний найманець: «Shoo...», «Get going.», «This is my corner.» —
        самі накази без пом’якшень, жодного маркера ввічливості (STYLE §3.2).
        Єдина репліка гравця — службова ::Leave.::.
      gender_cues: []
    voice:
      register: грубий, самовдоволений, фізіологічний
      idiolect:
        - "ремарки тіла замість слів: ::Picks nose.::, ::Grunts.::, ::Flexes his muscles.::"
        - "хрип ::wheeze:: врізається в мову навіть посеред хвальби"
        - "жорстока метафорика розправи: «trampled into dust», «dismantling», «bones will shatter»"

