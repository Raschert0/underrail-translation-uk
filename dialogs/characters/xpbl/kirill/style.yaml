  - slug: kharon
    name: Харон
    units: default
    confidence: certain
    evidence: [q10, q18, q19, q35, q96]
    role: >-
      Старий у лахмітті з палючими золотими очима, який називає себе перевізником
      «загублених душ» і забирає покалічених мутантів у «місце спочинку»;
      сам себе відрекомендовує в q96. Говорить піднесено й лагідно, і саме цей
      контраст із тим, що він насправді робить, тримає весь вузол.
    relationships:
      - "Wesley (Веслі) — давній приятель у притулку, до нього «my friend» (q19)"
      - "лікар — підлеглий, звертається до Кгарона «sir» (q31)"
      - "гравець-мутант — «lost soul», якого він приручає й використовує"
      - "Vitek — його людина в технічній секції (q114)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Попри врочистий книжний склад, стосунок до гравця — батьківсько-поблажливий:
        нарація прямо каже «like a parent encouraging a toddler» (q89), він гладить
        по грудях і плечу (q70, q82, q102), зве «my friend», «Poor soul».
        STYLE §3.2 — рішення за характером стосунку, не за пишністю лексики.
        Гнів у q66 регістру не змінює.
    voice:
      register: урочистий, майже проповідницький; довгі періоди, книжна лексика
      idiolect:
        - "архаїзми й біблійна інтонація: «rendered unto me», «go back whence you came», «It is good and proper for us to eat meat» — тримати високий шар, не спрощувати до розмовного"
        - "уникає скорочень там, де живий мовець їх ужив би: «Do not worry», «I cannot go» — в українській це відповідає повним, неусіченим формам"
        - "лагідні звертання-приманки: «my friend», «Come, now», «don't be afraid»"
        - "зневажливі назви для ворогів через застарілий шар: scallywags, scamps, rascals, hellions, roaches, pests — усі різні, синонімію зберігати"

