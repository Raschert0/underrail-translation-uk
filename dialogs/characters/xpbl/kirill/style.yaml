narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Вузол насичений довгими нараційними блоками
    (q35, q41, q91, q113, q114), де фокус — на відчуттях гравця; там «ви»
    особливо помітне й особливо легко зривається.

