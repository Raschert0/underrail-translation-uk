    rule: "затинання відтворюємо на українському приголосному, STYLE §9"
    uk_fragment: "Щ-що"
    status: proposed
  - unit: q20
    rule: "підказка-нарація всередині ::…:: — іменник/інфінітив без розгортання, STYLE §3.5"
