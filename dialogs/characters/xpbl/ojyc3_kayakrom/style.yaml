speakers:
  - slug: kaya
    name: Кая
    units: default
    confidence: certain
    evidence: [q69, q75, q157, q159]
    role: >-
      Сестра-близнючка ригмайстра Крома, колишня чільна фігура Black Eels, яку
      скинули до рядової й заманили в печеру на смерть. Вузол має дві сюжетні
      гілки: поранена й зламана Кая в печері та вона ж, повернена додому й
      піднесена, у сцені зустрічі з братом.
    relationships:
      - "Кром (Kromilus) — брат-близнюк; від нього залежить уся її лінія"
      - "Ion — посередник, який приводить гравця до неї"
      - "Silas — отримав док, коли її обійшли; джерело її образи"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вулична, бандитська, з дитинства печерна — STYLE §3.2 дає «ти». Перша
        сцена в печері — між чужими й під дулом рушниці, але регістр тримаємо
        «ти»: вона говорить різко й без дистанції («Who the hell are *you*?»).
      gender_cues: ["$(#guy/girl)"]
    voice:
      register: >-
        нормативна, майже книжна для печерної бандитки — це свідомий контраст
        із братом, і саме на нього прямо звертає увагу репліка a83
      idiolect:
        - "заїкання на зламі: «I-I...», «W-what», «H-how» — відтворювати українським приголосним"
        - "обриви думки трьома крапками — не згладжувати в цілі речення"
        - "«Hmph» як звук зневаги; «Ugh», «Argh» — лишати вигуками"
        - "у сцені вдома тон різко світлішає: короткі радісні речення, вигуки «Aww, come on. Cheer up!»"

  - slug: krom
    name: Кром
    units: [q8, q9, q12, q14, q16, q18, q19, q23, q30, q32, q38]
    confidence: certain
    evidence: [q30, q32, q38]
    role: >-
      Ригмайстер Платформи, брат-близнюк Каї, ватажок Black Eels. Говорить як
      господар становища: коротко, безапеляційно, з підрахунком втрат.
    relationships:
      - "Кая — сестра-близнючка; примирення з нею — вісь усього вузла"
      - "Ion — його вербувальник «на брудну роботу»"
      - "Protectorate — вимушено підтримує репутацію, зневажає («the bastards»)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Ватажок банди, панібратський і зверхній водночас; жодних формальних
        маркерів у джерелі немає — STYLE §3.2.
      switches:
        - {unit: q38, to: ти, trigger: "відмова від рукостискання — тон холоне, але не переходить у «ви»; різкість передавати лексикою, не регістром"}
    voice:
      register: грубий, вуличний, з відчутним просторіччям
      idiolect:
        - "послідовне випадання g: goin', nothin', recruitin', decidin', rescuin', huntin' — обов’язково відтворити просторіччям, а не нейтральною мовою"
        - "аферезис 'ere замість here — та сама функція"
        - "морська й лихварська образність: «Men drown for much, much less», «sunk us all to the bottom»"
        - "лаконічні присуди без пом’якшення: «That's a great shame»"

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q1]
    confidence: unknown
    reason: >-
      Пряма мова в q1 («There's no way we're going back in there again») звучить
      до того, як нарація назве когось на ім’я; належить одному з близнюків, але
      текст не дає розрізнити. Просторіччя там немає, тож механічний маркер Крома
      не спрацьовує.
    guidance: >-
      Перекладати нейтрально-розмовно, без просторічних маркерів Крома і без
      гендерованого минулого часу від мовця. Нарація в тих самих дужках — «ви».

  - slug: unknown_2
    name: мовця встановити не вдалося
    units: [q56, q57, q58]
    confidence: unknown
    reason: >-
      Блок фонових однорядкових реплік. q57 згадує Izumi як когось третього
      («They are constantly confusing me with Izumi»), q58 говорить про Darling
      як про рівню за долею — жодне з цього не пасує ні Каї, ні Крому. q56 —
      самі звуконаслідування.
    guidance: >-
      Короткі нейтральні фонові фрази, «ти» як базовий регістр вузла. Гендер
      мовця невідомий — уникати минулого часу або ставити $(#…). Звертання на
      ім’я всередині цих рядків указує на адресата, не на мовця.

