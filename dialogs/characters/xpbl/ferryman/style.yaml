    note: "разом із «dispensing hot lead» (q1146) і «extra lead in his system» (q1163) — один регістр бандитської погрози"
  - unit: q1032
    src: "No can do."
    note: "розмовна відмова; не буквальне «не можу зробити»"
  - unit: a1238
    src: "Ruins be ruins."
    note: "навмисна неграматичність у репліці гравця — відтворити просторіччям, не виправляти"
  - unit: a1193
