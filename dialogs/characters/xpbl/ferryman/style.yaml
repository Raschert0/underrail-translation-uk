idioms:
  - unit: q442
    src: "Now get off my boat."
    note: >-
      наскрізна формула вигнання, повторюється (q1197, q1248, q735, q1156). Один сталий
      український варіант на всі входження, з «ти»-імперативом
  - unit: q1178
    src: "I'll blow your head clean off"
    note: >-
      репліка-погроза, що повертається (q1102, q1198, q1247, q1144). Не калькувати
      «чисто знести» — потрібен усталений український зворот, однаковий усюди
  - unit: q823
    src: "They come with the flow and disappear with the ebb"
    note: >-
      приплив/відплив як образ зміни піратських команд; продовжується в q824 «their ebb
      too came». Метафора мусить лишитися морською, інакше зв’язок двох юнітів зникає
  - unit: q1056
    src: "wouldn't give a rotten fish"
    note: "евфемізм замість грубого; локалізувати розмовним зворотом, не калькувати рибу"
  - unit: q1247
    src: "Don't treat me like a bag of guano"
    note: "морська лайка з пташиним послідом; грубе лишається грубим — не пом’якшувати"
  - unit: q173
    src: "And I'm not selling it, kid."
    note: >-
      відповідь на a172 «I'm not buying it». Каламбур купівлі-продажу тримається на парі
      юнітів — перекладати a172 і q173 разом, інакше жарт розпадається
  - unit: q300
    src: "like a drowning man pulling both his rescuer and himself to a watery grave"
    note: "розгорнуте порівняння в межах морської образності — не скорочувати"
  - unit: q491
    src: "a fool's quest"
    note: "повторюється тричі в q491 і q500; один відповідник на всі входження"
  - unit: q1163
