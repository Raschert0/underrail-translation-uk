    note: "жартівлива назва дробовика; зберегти іронію, а не описувати зброю"
  - unit: q793
    src: "The *Serpentborn*"
    note: "автопереклад екзоніма Sørmirbæren; українська форма має читатися як переклад, а не як друга назва"

pitfalls:
  - >-
    Вузол рясніє обірваними юнітами, які гра склеює в одне речення: q2+q3 («We're » +
    «moving out, kid»), q4, q275+q276, q430+q431, q539+q540, q657+q658, q762+q763,
    q890+q891, q893+q894, q1055+q1056. Кожен такий фрагмент перекладати як частину фрази,
    а не як самостійне речення; порядок слів мусить дозволяти склейку з наступним юнітом.
  - >-
    a838/a888 «Sourmirbaren» і a840/a786 «Sørmirbæren» — це навмисно неправильна й правильна
    вимова. Відповіді q839 (мовчазний кивок) і q787/q841 («You got the pronunciation right»)
    залежать від різниці. Дві форми мусять відрізнятися і в українській, інакше репліка
    втрачає сенс. Те саме для a746 «Sjoersr» проти a749 «Sjörsr».
  - >-
    $(GiantSkerderHitBodyPart_DisplayName) (q702, a715, q747 — двічі, q716) підставляє назву
    частини тіла. Не відмінювати всередині плейсхолдера; будувати фразу так, щоб працював
    називний або прийменникова конструкція.
  - >-
    Контекстні плейсхолдери не відмінювати й не перекладати: $(context.player.Name) (a74),
    $(context.playerArenaTitle) (a634), $(context.npc_xpbl_as_todd_playerName) (a59),
    $(context.npc_xpbl_ferryman_realName) (q920),
    $(context.npc_xpbl_ferryman_firstNextLocation) і $(context.npc_xpbl_ferryman_secondNextLocation) (q981).
  - >-
    «kid» не має гендерно-нейтрального прямого відповідника: гравець може бути жінкою.
    Потрібен або гендерно-нейтральний іменник, або плейсхолдер $(#…). Обрати один варіант
    і тримати його в усіх ~80 юнітах — це найпомітніша риса персонажа.
  - >-
    q1030 «::He shrugs and puffs smoke.<end>» — у джерелі бракує закривальних «::».
    Це баг оригіналу; відтворити ту саму кількість маркерів, інакше tools/check-uk.ps1 впаде.
  - >-
    «Aegis Incorporated» (q860, q877, a878) — компанія, а не бойовий препарат Aegis → «Егіда»
    з глосарія. Різні референти: не переносити глосарійний відповідник автоматично.
  - >-
    «expedition» тут — внутрішньоігрова експедиція (q763, q766, q801, q813, a859), а не назва
    доповнення Expedition. За приміткою глосарія перекладається як «експедиція».
  - >-
    Терміни системи Перевізника з’являються в десятках юнітів і часто в означеннях
    (q232, q270, q419, q456, q462). Щойно обрано відповідник для Descent into Center,
    Spirit of Gravity, True/False Death, Origin, Center, Burden, Ascension — він
    незмінний по всьому вузлу; це 3 % корпусу й найбільший ризик розсинхрону.
  - >-
    q1011 «22.787 megahertz» — в українській десятковий роздільник кома. Число повторюється
    в тому самому юніті двічі — обидва входження однаково.

