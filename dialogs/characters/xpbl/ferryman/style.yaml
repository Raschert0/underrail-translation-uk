speakers:
  - slug: ferryman
    name: Перевізник
    units: default
    confidence: certain
    evidence: [q7, q912, q921, q936]
    role: >-
      Сімдесятирічний самітник-мисливець за реліквіями, що живе на поромі в Чорному Морі
      й обміняв власне ім’я на роль Перевізника. Викладає гравцеві свою філософію
      «Descent into Center» — і саме через неї, а не через сюжет, тримається весь вузол:
      це найбільший діалог гри, і більшість його обсягу — філософський трактат у формі
      бесіди.
    relationships:
      - "Гравець — «kid»: молодший, якого Перевізник поблажливо навчає й водночас випробовує"
      - "Тодд — лемурієць, якого гравець може прилаштувати до нього (q5, q6, q1256)"
      - "Гарланд Вардел — єдиний співрозмовник до гравця, з ким він обговорював Descent (q476, q908)"
      - "Sørmirbæren, пірати, мутанти — усі терплять його; він єдиний, кого вони підпускають (q858, q943)"
    address:
      npc_to_player: ти
      player_to_npc: ви
      basis: >-
        Плейсхолдерів звертання у вузлі немає, тож регістр визначає характер (STYLE §3.2).
        Перевізник — не обслуга й не службовець: самітник, який тримає дробовик на
        співрозмовникові й говорить згори вниз. Наскрізне «kid» (близько 80 юнітів),
        просторічна фонетика (`ain't`, `'cause`, `gotta`, `wanna`, `outta`, `'em`,
        `Talkin's over`), прямі накази й погрози («Now get off my boat», «Outta my boat,
        scum», «Get outta here or I'll blow your head clean off») — усе це в українській
        читається лише як «ти». Філософська піднесеність його лексики цьому не суперечить:
        це мудрець, що повчає юнака, а не чиновник за стійкою.
        Зворотний напрямок асиметричний і навмисно НЕ дзеркальний. Підстава просто в
        тексті: q441 — «because of your lack of respect towards an old man» — гра прямо
        називає нешанобливість до старого провиною, за яку розмову обривають. Базові
        репліки гравця витримано ввічливі («Can I ask you a few personal questions?»,
        «I'd like to ask you about their society»), а «old man» і «gramps» трапляються
        майже виключно в зневажливих гілках. Отже база гравця — «ви», а грубість —
        марковане порушення, а не норма (STYLE §3.3).
      switches:
        - {unit: a1155, to: ти, trigger: "«Go to hell, old man!» — навмисна образа, розмову обривають"}
        - {unit: a1165, to: ти, trigger: "«Put that thing away, gramps» — зневажливе звертання"}
        - {unit: a438, to: ти, trigger: "«I think you're derailed, old man» — після цього q441 карає за неповагу"}
        - {unit: a446, to: ти, trigger: "прокльон на адресу порома — прощальний зрив"}
    voice:
      register: >-
        двошаровий: просторічна морська говірка накладена на піднесений філософський
        трактат. Не вирівнювати ні вгору, ні вниз — суміш і є характером.
      idiolect:
        - "«kid» — наскрізний тик, ~80 юнітів; майже завжди в кінці або посеред фрази, як розділовий знак"
        - >-
          подвоєння як головна прикмета мовлення: «He'll do well. He'll do well.»,
          «Fine, fine», «I do, I do», «Little. Little.», «plenty to find here, kid, plenty»,
          «many Sørmirbæren, many», «To this day. To this day...». Не згладжувати —
          це ритм персонажа, а не недогляд редактора
        - "стягнені форми: `ain't`, `'cause`, `gotta`, `wanna`, `outta`, `'em`, `Talkin's`, `don't ya`"
        - >-
          термінологічні абстракції з великої літери — Reality, Origin, Center, True Death,
          False Death, Spirit of Gravity, Burden, Humanity, Ascension, Descent into Center.
          Це терміни його системи, а не риторика: велика літера й один сталий відповідник
          на весь вузол
        - "виділення зірочками (*higher*, *us*, *Never*, *Still*) — авторський наголос, зберігати"
        - >-
          морська метафорика проймає навіть абстракції: тонучий корабель, баласт, приплив
          і відплив, іскра в двигуні. Не замінювати на суходільні образи

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1, навіть там, де сам Перевізник каже «ти». Частина
    нарації звернена до гравця прямо (q6 «::You've already told him in advance…::»).
    Високочастотні формули ремарок — «::He puffs smoke.::», «::He takes a draw.::»,
    «::He takes a long draw.::», «::He chuckles.::», «::He shakes his head.::» — мають
    отримати по одному сталому відповіднику й далі повторюватися дослівно: вони
    трапляються десятки разів і будь-яка варіація читається як помилка.
    Підказки дій усередині «::…::» — інфінітив (STYLE §3.5): «::Barter.::» → «::Торгувати.::»,
    «::Attack!::», «::Say nothing.::», «::Keep listening.::», «::Nod.::».

