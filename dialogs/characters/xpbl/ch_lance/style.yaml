speakers:
  - slug: lance
    units: default
    confidence: certain
    evidence: [q1, q6, q24, q76]
    role: >-
      Сонний списоборець на розбитому катері: рибалить списом, б'ється на воді з
      піратами й за гроші вчить гравця морському списобою (50 монет за основи,
      150 за сам списобій). Майже весь час дрімає — розмова постійно його будить.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Суцільне випадання «g» (joustin', teachin', waitin'), «ya», «yer», «ain't»,
        «'n'», «Whaddaya», відверта грубуватість («Yer ass is gonna get flung outta
        jet») — свій, вуличний мовець, STYLE §3.2. Гендерний плейсхолдер у q24
        закріплює «ти».
      gender_cues: ["$(#buddy/sis)"]
    voice:
      register: сонний, буркотливий, мінімалістичний; говорить рівно стільки, скільки треба
      idiolect:
        - "мукання-заповнювачі «Mm», «Mmm», «Mhm», «Hmpf» — це репліки самі по собі (q52, q65, q81, q83), не викидати й не розгортати в слова"
        - "жорстке випадання кінцевого приголосного в дієприкметниках: joustin', teachin', nothin' — українською компенсувати розмовними формами й проковтуванням, не кальковим апострофом"
        - "«ya/yer» замість you/your — просторічна вимова, а не помилка"
        - "уривчасті односкладові відмови: «Because.», «Charons.», «Life's hard.»"
        - "сонне марення уві сні (q78, q84-q88) — беззв'язні уривки з трьома крапками, ритм обриву зберігати"

narration:
