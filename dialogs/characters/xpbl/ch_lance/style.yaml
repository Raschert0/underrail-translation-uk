pitfalls:
  - "q24 містить $(#buddy/sis) — обидві гілки перекласти українськими гендерними формами звертання, регістр літер зберегти (STYLE §2)"
  - "«naval jousting» / «naval combat» — центральний термін вузла, повторюється в q6, q11, q17, q66, q70, a10, a23, a58; обрати один варіант і тримати його в усіх появах"
  - "charons → харони, stygian coins → стигійські монети (глосарій); у a13/a44/a47 і q61/q72 це та сама валюта, узгодити"
  - "burrowers → копаки, Faceless → Безликі (глосарій); q86 «Rathound King» — власна назва без канонічного варіанта, у new_names"
  - "суми виділені зірочками: *Fifty*, *A hundred fifty* — розмітку наголосу зберегти разом із числом"
  - "a23 містить ::[Requires: Melee 70]:: і a41 ::[Mercantile]:: — це службові позначки перевірок, формат дужок не чіпати"
  - "«jet» тут — водний катер персонажа, а не літак; у q29, q38 «on a jet» означає «на катері»"
  - "хропіння q76/q77/q79 «Zzzzzz…» і вигук q33 «ZzzzzzzzKHHHH-- Uh!?» — звуконаслідування передавати українською графікою, довжину зберігати"

