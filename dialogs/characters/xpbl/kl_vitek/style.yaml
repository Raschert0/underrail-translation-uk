  - 'a45, a87, a128 (GRRRRAAAAAARRRRGHHH, RAAAA...) — нечленоподільний рев: лишати звуком, підбираючи українські літери, а не перекладати'
  - 'a70, a118 (Y-y-yiiiiiiiissss), a109, a82/a123 (V-v-veee-- Viiii--t-t-t-eeee) — заїкання відтворювати на українському приголосному (STYLE §9), довжину голосних зберігати'
  - 'q36, q60, q130 закінчуються порожнім рядком після ремарки — послідовність \n не чіпати'
