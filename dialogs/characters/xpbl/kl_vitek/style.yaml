speakers:
  - slug: vitek
    name: Вітек
    units: default
    confidence: certain
    evidence: [q84, q38, q63]
    role: >-
      Людина, замкнена в резервуарі-машині життєзабезпечення за склом: розпорядник
      комплексу, який стежив за гравцем через камери й тепер торгується з ним по
      той бік скла. Говорить з паузами, бо притомність йому дають хімікати з трубок.
    relationships:
      - 'Kirill (Кирило) — той, хто привів гравця сюди; Vitek без нього безсилий: «Without Kirill... it''s no use.»'
      - 'Anton — згаданий разом із Кирилом як винуватець того, що сталося (q40)'
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Vitek бачить у гравцеві не співрозмовника, а істоту: кличе «mutant»,
        «creature», «ABOMINATION», наказує («Turn on the generator»), торгується
        зверхньо. «Ви» тут неможливе в жодній гілці. Гравець майже не має
        артикульованої мови, тож його «ти» проявляється лише в поодиноких
        покручених словах — базовий регістр однаково «ти».
      gender_cues: []
    voice:
      register: уривчастий, здавлений; владність упереміш із безпорадністю й благанням
      idiolect:
        - 'фізіологічні звуки замість слів: Hnnnnnnn, nnnnn, hhhh — передавати українськими літерами, не лишати латиницею'
        - 'обриви на півслові через дефіси: «You-- cannnnn''t-- can''t hurt me--» — обриви зберігати на тому самому місці'
        - 'емфаза зірочками: *this*, *ruined*, *right*; поділ на склади *ge-ne-ra-tor* — відтворювати в українському слові'
        - 'звертання на «mutant» / «creature» замість імені гравця'

narration:
  present: true
  note: '«ви» без винятків — STYLE §3.1; нарації тут більше, ніж мови: майже кожна репліка починається ремаркою про трубки'

new_names: ["Vitek", "Anton"]

