speakers:
  - slug: sewer_mutants
    name: каналізаційні мутанти
    units: default
    confidence: probable
    evidence: [q2, q5, q17]
    role: >-
      Колектив покалічених мешканців каналізації — набір атмосферних барків
      без єдиного персонажа. Кожен рядок вимовляє інший мутант, тому картка
      описує спільний голос групи, а не окрему особу.
    relationships:
      - "спільнота, що чекає своєї черги вмерти — «When’s our turn?», «Waiting... for my turn.»"
    address:
      npc_to_player: ви
      player_to_npc: ти
      basis: >-
        Більшість рядків узагалі не звернені до гравця — це репліки в порожнечу
        або одне до одного. Там, де адресат таки з’являється, доречне «ви»:
        мутанти нікому не тикають, їхній тон покірний і виснажений, а не
        вуличний (STYLE §3.2). Реплік гравця у вузлі немає.
      gender_cues: []
    voice:
      register: змучений, уривчастий, майже безсилий
      idiolect:
        - "постійні трикрапки посеред фрази — задишка, а не пауза для ефекту"
        - "обірване слово з тире: «I almos... - decided», «Unease gro... aaahh...»"
        - "ремарка ::wheeze:: вплетена в речення, а не винесена окремо"
        - "покірний фаталізм: черга, чекання, «одного дня біль ущухне»"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; тут це короткі ремарки ::Looks away.::, ::Nods.::"

new_names: []

