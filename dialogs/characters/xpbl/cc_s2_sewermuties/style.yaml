  - "::wheeze:: — глосарій дає ::хрип::; форма всередині речення (q2, q17) і окремим юнітом (q5) має бути та сама"
  - "Трикрапки й тире — частина мовної характеристики; не «вичищати» пунктуацію"
  - "q13 «When’s our turn?» і q18 «Waiting... for my turn.» — той самий образ черги, лексику узгодити"

