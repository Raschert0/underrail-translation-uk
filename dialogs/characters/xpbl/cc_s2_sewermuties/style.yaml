      зіпсована формула «to be or not to be» — вибору немає; зберегти
      повтор того самого слова, у цьому й суть
  - unit: q11
    src: "So much... dread... - relief here."
    note: "обірвана конструкція, де бракує слова; не добудовувати речення за автора"
  - unit: q10
    src: "buried us alive"
    note: "«поховали живцем» — сталий вислів, не описове «засипали»"

pitfalls:
