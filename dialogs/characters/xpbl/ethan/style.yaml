speakers:
  - slug: ethan
    name: Ітан
    units: default
    confidence: certain
    evidence: [q66, q373, q395, q404]
    role: >-
      Мандрівний темпоральний маніпулятор, який за плату навчає гравця псі-здібностей
      і водночас відверто з ним фліртує. Уся його мова — вправно опанована світськість,
      під якою ховається те, що він насправді старий і вбив свого наставника.
    relationships:
      - "Артур Кейн — наставник, якого Ітан убив; про це він у ввічливій гілці бреше (q290), а в зірваній зізнається (q33)"
      - "Гравець — потенційний учень і об’єкт залицянь водночас"
      - "Капітан Растко — перевізник з анекдоту q247, канонічне ім’я в реєстрі"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Ітан тримає підкреслено ґречний регістр і сам його вимагає: «proper manners
        dictate that you should introduce yourself first» (q384), «let’s show some
        manners here» (q386), «May I help you?» (q63), «Ladies first» (q133).
        Він — сторонній, що знайомиться, і продає послугу; STYLE §3.2 дає «ви».
        Гравець дзеркалить базовий регістр (§3.3), а не разові грубощі (a58, a385).
      gender_cues: []
      switches:
        - {unit: q4, to: ти, trigger: "зрив у стані «старого»: маска ввічливості спадає повністю"}
        - {unit: q5, to: ти, trigger: "«YOU! Have you s-seen it?» — крик, не звертання"}
        - {unit: q53, to: ти, trigger: "«One of you bastards took it» — пряма лайка"}
        - {unit: q54, to: ти, trigger: "«You... you were close to me. *You* took it!» — звинувачення"}
        - {unit: q56, to: ти, trigger: "«We’ll see about that!» — погроза перед бійкою"}
    voice:
      register: >-
        вишукано-ввічливий, млосно-фліртівний, самозакоханий; повні речення,
        книжна лексика, багато вставних зворотів
      idiolect:
        - "подвоєне «Yes, yes» — головний словесний тик (q66, q93, q289, q294, q337)"
        - "подвоєне «Excellent, excellent», «Calm down, calm down» — та сама модель подвоєння"
        - "«Certainly.» як стандартна згода — тримати одне українське слово наскрізь (q153, q170, q189, q196, q275, q381)"
        - "анекдоти незмінно починає з «I remember...» — формула, зберігати дослівно однаковою (q247, q252, q256, q259, q263, q266)"
        - "«Mmm...» перед відповіддю на здогад гравця (q199, q201, q203, q207, q209)"
        - "«how shall I say» — манірна вставка (q77, q292)"
        - "у зірваному стані — заїкання на приголосному: W-where (q4), s-seen (q5), b-back (q19), G-give (q21), t-t-took (q53), C-- Correct (q45); відтворювати українським приголосним, STYLE §9"

narration:
  present: true
  note: >-
    Дуже великий обсяг нарації, включно з довгими описовими блоками (q62, q323, q412).
    «Ви» без винятків — STYLE §3.1, навіть коли поруч Ітан переходить на «ти».
    Підказки дій усередині «::…::» — інфінітив (§3.5): ::Attack::, ::Resist.::,
    ::Inspect the medallion.::, ::Let him leave.::

