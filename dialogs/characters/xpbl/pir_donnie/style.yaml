    «ви» без винятків — STYLE §3.1, навіть коли Донні поруч каже «ти».
    Нарація тут двох видів: ремарки про Донні («::He shrugs.::», «::He laughs.::»,
    «::He grabs onto his shorts…::») і підказки дій гравця («::Barter.::»,
    «::Play strippage.::»), які йдуть інфінітивом — STYLE §3.5.
