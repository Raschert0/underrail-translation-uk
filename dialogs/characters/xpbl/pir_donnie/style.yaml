speakers:
  - slug: donnie
    name: Донні
    units: default
    confidence: certain
    evidence: [q17, q58, q124]
    role: >-
      Донні Мерчант — корабельний торговець піратської команди Grim Jetters у Port Ceto,
      колишній мандрівний купець, якого пірати буквально викрали в скрині. Низькорослий,
      балакучий, самозакоханий; говорить безупинно й усе оцінює через торгівлю та власну
      значущість.
    relationships:
      - "Todd — його мовчазний помічник у крамниці; Донні бурчить на нього, але захищає"
      - "Cruz (Крузер) — той, хто його вкрав; давня образа переросла у взаємну повагу"
      - "Cap’n Grim (капітан Грим) — начальник, про якого Донні говорить із побожністю"
      - "Senda, Chalice, Ruth — жінки-піратки, з якими він грає в strippage і фліртує"
      - "Katya (Катя) — знахарка табору; Донні відсилає гравця до неї"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний пірат без жодної службової дистанції: кличе гравця гендерним
        панібратським звертанням і хвалить як дитину. STYLE §3.2 — «свій, вуличний» → «ти».
        Гравець дзеркалить (§3.3).
      gender_cues: ["$(#banga/sweet)", "$(#boy/girl)", "$(#Banga/Sweet)"]
      note: >-
        `$(#banga/sweet)` — не звертання на ім’я, а панібратське «свій/мила». Обидві гілки
        мають лишитися звертальними (кличний відмінок), а не описовими.

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q53]
    confidence: unknown
    reason: >-
      Рядок «Oh, Donnie, Donnie. Ye sayin’ it now…» — звертання на ім’я вказує на адресата:
      говорить НЕ Донні. За контекстом (q16, q18, q54) це одна з трьох піраток —
