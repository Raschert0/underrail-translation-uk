idioms:
  - unit: q151
    src: "if ya catch the way my jet's floatin'"
    note: >-
      Піратська переробка «if you catch my drift». Не калькувати — потрібен український
      розмовний відповідник із морським/катерним образом, однаковий у q151, q162, q171.
  - unit: q158
    src: "got sent under"
    note: >-
      Евфемізм «убитий» (пішов під воду). Наскрізний у файлі — потрібен один сталий
      український евфемізм, не «відправлений під».
  - unit: q23
    src: "By the sea!"
    note: "Божба замість «By God». Лишити морською, не замінювати на «Боже»."
  - unit: q33
    src: "ruth or bare"
    note: >-
      Каламбур на «truth or dare» + ім’я Ruth. Гру слів зберегти неможливо дослівно —
      потрібна українська назва салонної гри з роздяганням.
  - unit: q313
    src: "people goin' derailed"
    note: >-
      Внутрішньосвітове «з’їхати з рейок» = збожеволіти; тримати залізничний образ,
      бо це фірмова ідіома світу Underrail.
  - unit: q361
    src: "Who gives an eel?"
    note: "Піратський варіант «who gives a damn» із назвою ворожої банди. Замінник має лишитися морським."
  - unit: q83
    src: "what the hell's gut was wrong"
    note: "Каламбур на топонім Hell’s Gut (глосарій: Нутро Пекла) — лайка й назва місця збігаються."
  - unit: q171
    src: "make the toilet your best banga"
    note: "Грубий жарт про харчове отруєння — не пом’якшувати, STYLE §9."
  - unit: q196
    src: "rat-bangin' sons of slackjaws"
    note: "Лайка на істот світу; лишити грубою, не замінювати нейтральним «покидьки»."

pitfalls:
  - >-
    Головна пастка вузла — розрізані речення. Пари й трійки юнітів склеюються в один
    рядок: q7+q8+q9, q66+q67, q74+q75, q78+q79, q115+q116+q117+q118, q149+q150,
    q248+q249, q250+q251+q252, q255+q256, q362+q363/q364. Перекладати їх треба разом,
    стежачи за відмінком і порядком слів на стику; українська ділиться в іншому місці,
    ніж англійська.
  - >-
    Тензорні дублі «живий/мертвий»: q153 (Razor у минулому) проти q154 (у теперішньому),
    q163 проти q164 (Cruz), q160 проти q166, q251 проти q253. Час дієслова — це змінна
    стану гри, не стилістика; не уніфікувати.
  - "q89 і q90 містять $(context.player.Name) — не відмінювати всередині плейсхолдера."
  - >-
    «Expedition» тут — внутрішньоігрова експедиція (q105, q206, q272), а не назва
    доповнення: перекладати як «експедиція», попри запис у глосарії.
  - >-
    «Aegis Incorporated» (q275, q276) — північна охоронна фірма, а не бойовий препарат
    Aegis → Егіда з глосарія. Назву компанії не перекладати за зразком Praetorian Security.
  - >-
    «Cap’n» → «капітан» (пор. запис Svana в реєстрі); «Cap’n Grim» → «капітан Грим».
    «D’ Flinger» тримати за реєстровим Флінгер із його бренд-артиклем.
  - >-
    Донні заїкається потроєнням слів («and, and, and», «Cruz, Cruz», «no, no, no»,
    «these, these, these»). Це його головна прикмета — відтворювати повтором
    українського слова, а не викидати, STYLE §9.
  - >-
    Випадання g (jettin’, nothin’, 'ere, 'im, 'is, ya) — суцільний просторічний шар.
    Передавати українським просторіччям загалом, а не апострофами в окремих словах.

