      Тримати нейтральну побудову: без гендерованого минулого часу, без
      звертань, що видають «ти» чи «ви». Для групи (2) годиться «ви» — це
      відповідь родини гостеві. Для групи (3) — навпаки, НЕ згладжувати:
      речення має читатися так, ніби мовець збився й сам не знає, ким він
      зараз є; зберігати обірвані конструкції й три крапки як у джерелі.

narration:
  present: true
  note: >-
    Нарації дуже багато: описи міміки, боротьби, роботи з наручем. Завжди «ви»
    без винятків — STYLE §3.1. Підказки дій усередині «::…::» — інфінітивом
    (STYLE §3.5): «::Drag him away.::», «::Pretend to drink.::»,
    «::Leave him be.::». Окрема пастка: рід у нарації йде за ВІДІГРУВАНИМ
    персонажем, а не за тілом Тодда — «::She sighs.::» (q181),
    «::She turns to you again.::» (q245) стосуються Шеллі, тож форми жіночі,
    хоч фізично це чоловік.

