# КЛЮЧ ДО ВУЗЛА. Фізичний мовець тут один — Тодд. Але Тодд страждає на
# інфантильну регресію й дисоціацію (діагноз названо прямо в q719: «infantile
# regression») і ВІДІГРАЄ ГОЛОСАМИ чотирьох інших людей — своїх батьків і
# тестя з тещею. Розрізняє їх лише ремарка на початку юніта:
#   ::Tenor.::           — сам Тодд
#   ::Bass.::            — Ангус, батько
#   ::Hoarse falsetto.:: — Шеллі, мати
#   ::Baritone.::        — Стіг, тесть, лікар станції
#   ::Gentle falsetto.:: — Аста, теща
# Тому картка розписує п’ять різних ідіолектів і п’ять різних регістрів
# усередині одного вузла. Перекладати їх як «одного персонажа» — головна
# помилка, якої цей вузол може коштувати.

