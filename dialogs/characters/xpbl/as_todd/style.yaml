idioms:
  - unit: q457
    src: "By the depths!"
    note: >-
      Лемурійська божба замість «By God». Уся родина вживає її в десятках
      варіантів: «Damn it to depths!», «Curse it to depths», «sent it all to
      depths», «damned he be to the bottom of the abyss». Потрібна одна стала
      українська формула на «глибини» й похідні від неї — не калькувати кожен
      раз окремо.
  - unit: q432
    src: "It's not exactly robotic science"
    note: >-
      Переробка «rocket science» під світ, де ракет не знають, а роботів
      знають. Українська калька «робототехнічна наука» жарту не дає — треба
      знайти впізнаваний ідіом про «не бозна-яка премудрість» і так само
      підмінити в ньому слово.
  - unit: q387
    src: "my father died, may his spirit float freely"
    note: >-
      Підводний відповідник «хай спочиває з миром»: дух не спочиває, а вільно
      пливе. Зберегти саме водну метафору.
  - unit: q841
    src: "Make sons unless you want your last name extinct"
    note: >-
      Родинне прислів’я Ангуса, він цитує батька. Має звучати як прислів’я —
      ритмічно й коротко, а не як пояснення.
  - unit: q315
    src: "he manages to cup his bells in time to successfully prevent you from making them ring"
    note: >-
      Розгорнутий евфемізм-каламбур про удар у пах («дзвони» — «задзвонити»).
      Калькувати не можна: потрібен український евфемізм, у якому так само
      працює друга частина жарту.
  - unit: q722
    src: "A healthy mind in a healthy body"
    note: >-
      Латинське «mens sana in corpore sano» має усталений український вигляд —
      брати його, а не перекладати англійську фразу заново.
  - unit: q1042
    src: "hell and high water"
    note: "«Крізь вогонь і воду» — локалізувати, не описувати."
  - unit: q852
    src: "The ol' gal is still around."
    note: >-
      Ангус про робота-служницю Мод. Пестливо-панібратське про машину —
      зберегти саме теплувато-зневажливий відтінок, не нейтралізувати.

pitfalls:
  - "Ремарки-голоси ::Bass.::, ::Baritone.::, ::Hoarse falsetto.::, ::Gentle falsetto.::, ::Tenor.:: — це не проза, а система розрізнення мовців. Потрібен ЗАКРІПЛЕНИЙ набір п’яти українських термінів, однаковий у всіх ~470 юнітах. Юніти q1133–q1137 складаються з самої ремарки й нічого більше."
  - "q254 «::Hoarse bass-baritone falsetto.::» і q358 «::Bassy falsetto.::» — злиті ремарки; будувати їх із тих самих п’яти закріплених слів, інакше зв’язок із рештою вузла втрачається."
  - "q1138 «New Todd ::Tenor.::» — службовий підпис, а не репліка."
  - "Рід у минулому часі й прикметниках іде за ВІДІГРУВАНИМ персонажем: Шеллі й Аста — жінки, хоч говорить чоловіче тіло. Не вирівнювати за Тоддом."
  - "a51 містить $(#this is a one-man submarine/I like to lift my feet up) — це НЕ гендерна пара форм одного слова, а два різні жарти. Не втискати їх у чоловічий/жіночий рід одного дієслова."
  - "q32 містить $(context.npc_xpbl_as_todd_playerName_stuttered) — ім’я гравця вже із заїканням усередині плейсхолдера. Не додавати заїкання ззовні й не чіпати сам плейсхолдер."
  - "У вузлі три різні плейсхолдери імені: $(context.npc_xpbl_as_todd_playerName), $(context.player.Name) і $(context.playerArenaTitle). Не підміняти один одним і не відмінювати всередині дужок."
  - "a822 «the Acorn, spelled A-C-o-N-R» — навмисно переплутані літери, це сюжетна загадка. Послідовність літер має лишитися впізнаваною як перестановка того самого слова; мала «o» посеред великих — теж частина запису."
  - "Блок навчання з наручем (q412–q537) — це буквальні фізичні інструкції, за якими гравець реально обирає репліку: «tilt your hand up in line with the rivet», «rotate left or right», «the root of your thumb». Формулювання мають бути механічно однозначними й ОДНАКОВИМИ в усіх повторах, бо Ангус повторює ту саму вказівку по п’ять разів."
  - "Технічна номенклатура станції повторюється десятки разів і мусить бути єдиною: tool bracer, tool glove, strongman, handmaiden, Servants, sublifter, subsphere, substation, magnetic focuser, jack rivet, Huss wrench."
  - "q371 у джерелі «Shelly», всюди інде «Shelley» — друкарська помилка оригіналу; в українському тексті писати однаково."
  - "Biocorp, Underrail — лишаються латиницею (глосарій). Invictus → Інвіктус, Institute of Tchort → Інститут Тчорта, South Gate Station → Станція Саут-Гейт — брати з глосарія."
  - "«child» у мовленні Ангуса — звертання до ГРАВЦЯ, а не до Тодда, і воно поблажливе, а не лагідне."
  - "Escape-послідовності \\n\\n усередині цілей — розмежування реплік і абзаців; втрата хоч однієї злипає репліки різних людей в одну."

