pitfalls:
  - "q2 «Kharon. Welcome.» — звертання вказує на АДРЕСАТА, а не на мовця; говорить лікар, не Kharon"
  - "q196 показує, що Kharon — окремий персонаж (mutie ferryman); не плутати з глосарійним charon → харон, це монета"
  - "Ferryman — реєстрове «Перевізник» (title), з великої; Wesley → Веслі, Eustace → Юстас — брати з реєстру"
  - "Black Sea → Чорне Море, Junkyard → Звалище — глосарій"
  - "a84, a142, a143, q133 містять $(context.player.Name) — не відмінювати всередині плейсхолдера"
  - "q5 «Ma-ree-nov» — вимовне складування імені; відтворити складами українською, а не лишати латиницю"
  - "q230 має ::Wheeze:: з великої, решта — ::wheeze::; регістр усередині ::…:: копіювати з джерела"
  - "q47, q48, q96, q135, q159, q161, q172, q201, q203 містять \\n\\n — розрив абзацу зберігати"
  - "«muties» і «mutants» — у q175 лікар протиставляє їх як два різні ступені ураження; потрібні два різні українські слова, не синоніми"
  - "«the affected» — стала самоназва громади, а не описове «постраждалі»; тримати один відповідник по всьому вузлу"
  - "«the unaffected» — антонім до попереднього, будувати парно"
  - "q152, q155, q156, q159, q174 — точна медична термінологія (tumorigenesis, parietal cells, biosynthesis); не спрощувати до побутових слів"
  - "a157 «perchloric acid», «hydrochloric acid», «oxidation state» — хімічні терміни, звірити з фаховою нормою"
  - "a153 ::[Biology]::, a157 ::[Chemistry]::, a196 ::[Intelligence]:: — теги перевірок навички, формат як ::[Переконати]:: у глосарії"
  - "q50–q52 і q173, q183 — обірвані фрагменти одного речення, склеюються рушієм; перекладати як частини, не дописувати закінчення"
  - "q54, q55 «occassions» — одрук у джерелі, не відтворювати помилку"

