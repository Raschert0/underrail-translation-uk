speakers:
  - slug: doctor_m
    name: доктор М
    units: default
    confidence: certain
    evidence: [q5, q83, q230]
    role: >-
      Єдиний лікар мутантської громади на острові: старий, освічений медик, який
      пояснює гравцеві біологію мутації довгими клінічними монологами.
      Це визначає вибір слів більше за сюжет — у нього два регістри в одному
      голосі: лікарська ввічливість і наукова термінологія.
    relationships:
      - "Веслі — очільник громади; лікар постійно відсилає гравця до нього"
      - "Юстас — приймає вантаж від Перевізника; лікар радить розпитати саме його"
      - "Frank — мутант громади, лікар його опікає й захищає перед гравцем"
      - "Lucile — загибла асистентка; згадка про неї єдина, де голос зривається"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Лікар витримано ввічливий до незнайомця: «May I ask for more details?»,
        «Feel free to ask me anything», «if I may ask», «excuse me». Скорочень
        уникає в наукових пасажах, повні форми переважають. Це службовий,
        обслуговчий мовець за STYLE §3.2 — отже «ви». Репліки гравця дзеркалять
        базовий регістр (§3.3): вуличне «doc», «Gotta go», «See ya» — це тон,
        а не підстава переходити на «ти».
      gender_cues: []
      switches:
        - {unit: q43, to: ви, trigger: "«Dear, no.» — теплувато-фамільярний вигук, але регістр не змінює; не перекладати як звертання на «ти»"}
    voice:
      register: >-
        стриманий, старомодно ввічливий; у медичних пасажах — лекційний,
        з точною термінологією без спрощення
      idiolect:
        - "::wheeze:: — постійний фізіологічний тик, розриває речення в середині думки; глосарій дає ::хрип::"
        - "обірваність через три крапки посеред фрази — наслідок задишки, зберігати позицію розриву"
        - "«Very well.» — повторювана формула згоди, тримати єдиний відповідник"
        - "клінічні терміни подані з поясненням у тире: «analgesics - that's painkillers»; конструкцію зберігати"
        - "ремарки про половини обличчя: «half-smiles», «with half of his face», «one side more than the other» — наскрізний образ, не згладжувати"

