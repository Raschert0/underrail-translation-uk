  - "::wheeze:: (q2) — глосарій: ::хрип::"
  - "«he» у q3, q11 — спільна ціль групи, а не гравець; не переадресовувати репліки"
  - "q4 «No money will keep us quiet anymore» — про підкуп у минулому; не читати як обіцянку мовчати"

