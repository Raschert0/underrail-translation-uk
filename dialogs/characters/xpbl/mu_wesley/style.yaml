  - slug: wesley
    name: Веслі
    units: default
    confidence: certain
    evidence: [q129, q107, q131]
    role: >-
      Старійшина й провідник громади «уражених» мутантів у бункері на Чорному Морі;
      смертельно хворий, говорить із постійними задишками й паузами. Веде з гравцем
      довгу філософську суперечку про те, чи лишаються уражені людьми.
    relationships:
      - "Юстас — веде торгівлю й контакти з Перевізником; Веслі раз у раз відсилає до нього (q10, q50, q117)"
      - "Доктор Марінов («Doctor M») — лікар громади; до нього відсилає щодо довголіття й припасів (q113, q166, q181)"
      - "Перевізник — єдиний чужак, до якого громада має повагу (q44, q46)"
      - "Serpentines — сусіднє плем’я, тримають дистанцію; Веслі боїться, що співпраця з гравцем це змінить (q145)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Веслі — старий, книжний, підкреслено стриманий; звертається до гравця
        відсторонено («stranger», «outsider»), будує довгі періоди з підрядними
        («I understand... what you mean... but I disagree»). Навіть у гніві не
        переходить на лайку, а вживає високий регістр («Begone!»). Гравець дзеркалить —
        STYLE §3.3; грубощі окремих реплік («get a clean handkerchief, man») — це
        емоційний зрив, а не зміна бази.
      gender_cues: []
      switches:
        - {unit: q191, to: ви, trigger: "«Watch... your tongue» — різкість без зміни регістру; не переводити на «ти»"}
        - {unit: q207, to: ви, trigger: "«*Leave*» — наказ; імператив на «ви»: «Ідіть», STYLE §3.4"}
    voice:
      register: старечий, книжний, філософський; змучений хворобою
      idiolect:
        - "суцільні три крапки всередині фрази — задишка, а не пауза для ефекту; зберігати розрив на тому ж місці"
        - "::wheeze:: врізається просто в середину синтагми — не переставляти в кінець речення"
        - "самовиправлення з однини на множину: «I don't like you... We... don't like you» (q41), «It is... that I dislike. We... dislike» (q77) — підпис персонажа, зберігати обидві частини"
        - "абстрактна лексика без скорочень у філософських репліках: humanity, condition, subspecies, consensus"
        - "гравця називає stranger / outsider / pirate — не ім’ям і не «друже»"

