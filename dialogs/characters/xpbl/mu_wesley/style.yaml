pitfalls:
  - "Наскрізна пара affected / unaffected (q77, q94, q96, a73, a75) — це самоназва громади, а не прикметник за контекстом; вибрати один відповідник і тримати його в усіх юнітах"
  - "Репліки обриваються посеред речення й продовжуються в іншому юніті: q30 закінчується «and », q31 — «However, », q141 — «But », q165/q176 — половини однієї фрази. Не дописувати кінець і не ставити крапку"
  - "q11, q129, q131, q134, q151, q153, q155, q166, q177, q186 містять літеральні \\n\\n — зберігати як є, це розрив абзацу в рушії"
  - "Зірочки навколо слів (*dead* q40, *he* q44, *you* a24, *Leave* q207, *that* q152) — наголос рушія, зберігати позицію"
  - "Теги перевірок ::[Intelligence]::, ::[Biology]::, ::[Chemistry]::, ::[Persuade]::, ::[Intimidate]::, ::[Mechanics] or [Electronics]:: — службові мітки; ::[Persuade]:: уже закріплено глосарієм як ::[Переконати]::"
  - "q116 містить «::wheeze ::» із зайвим пробілом — відтворювати як у джерелі, не «виправляти» на канонічний ::wheeze::"
  - "Помилки джерела не виправляти мовчки, вони частина рядка: «gratitute» (q9), «soliva» (q29), «philosophycal» (q83), «youself» (q119), «a let us» замість «and let us» (q120)"
  - "q113 «Doctor M... Marinov» — це затинання на імені; відтворити на українському приголосному, STYLE §9"
  - "У файлі немає жодного $(#…), але українське минуле дієслово гравця його потребує: a6, a20, a24, a121, a133, a148 — додавати плейсхолдер там, де в англійському його не було, правильно, а не вільність"
  - "Black Sea → Чорне Море, Junkyard → Звалище, Underrail латиницею й без відмінювання — глосарій; Ferryman → Перевізник, Eustace → Юстас — реєстр"

