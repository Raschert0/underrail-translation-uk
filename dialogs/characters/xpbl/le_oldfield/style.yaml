pitfalls:
  - "$(context.npc_xpbl_oldfield_playerName) і $(context.player.Name) — імена гравця; усередині плейсхолдера нічого не відмінювати й не змінювати, будувати фразу так, щоб форма була називна"
  - "у q19, q268, q291, q680, q887 звучить «Richard» — це звертання до Бріггса, отже мовець там професор, а не Бріггс (пастка звертання, CARD-SPEC §3.3)"
  - "у q392, q397, q448, q571 звучить «Professor» — мовець там Грим, а не професор"
  - "«Aegis Incorporated» — фірма-підрядник охорони; глосарійний запис Aegis → Егіда стосується бойового препарату, а не цієї назви — не змішувати"
  - "Biocorp, Coretech, JKK, Praetorian Security, Underrail — лишаються латиницею (глосарій, read-only)"
  - "Black Sea → Чорне Море, Core City → Центральне Місто, Camp Hathor → Табір Хатор, Hell's Gut → Нутро Пекла, Protectorate → Протекторат, Faceless → Безликі, Invictus → Інвіктус — брати з глосарію"
  - "валюта: charons → харони (q265, q273), stygian coins → стигійські монети (q263) — це різні одиниці, не уніфікувати"
  - "теги навичок ::[Persuade]::, ::[Intimidate]::, ::[Mercantile]:: — брати з глосарію, дужки й :: не чіпати"
  - "координати K7, H7, I1, F12, L12 — не перекладати й не міняти латиницю"
  - "багато юнітів — обірвані уламки речення (q39 «Regardless, besides», q163, q660 «There»), що склеюються з сусідніми; не додавати крапок і не добудовувати фрази"
  - "у q9, q322, q574 обіграно напис «from capital A to capital R» на коробці ACoNR — літери напису лишаються латиницею, інакше пояснення розсипається"
  - "«sec-troopers», «sec-chef», «sec-medic», «navcom», «jet ski» — повторювані реалії, тримати єдиний відповідник по всьому вузлу"

