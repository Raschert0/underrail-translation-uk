speakers:
  - slug: oldfield
    name: Олдфілд
    units: default
    confidence: certain
    evidence: [q873, q21, q443]
    role: >-
      Едвард Олдфілд — професор історії суперкорпорацій Університету Дісу, керівник
      експедиції на Чорне Море; саме він видає завдання гравцеві й переказує майже всю
      лорну експозицію вузла. Мова — вимова освіченої людини старшого віку: повні
      форми без скорочень, вставні «I should say», «if you will», «I'd not go into».
    relationships:
      - "Річард Бріггс — начальник охорони, з часом близький друг; професор зве його на ім’я «Richard»"
      - "Джеремі Сігер — його асистент з ІТ, професор ставиться до нього поблажливо-іронічно"
      - "Тодд — лемурієць, якого професор сприймає як наукову сенсацію, аж поки гравець не осадить його"
      - "Капітан Грим — колишній слухач його гостьових лекцій, тепер тюремник"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Академічний, підкреслено чемний мовець: «Forgive me, but that is all I could
        share», «I ask of you to not insist on this matter any further», постійне
        звертання на ім’я через плейсхолдер. Гравець дзеркалить — усюди «Professor»,
        «Yes, sir» у службовому контексті (STYLE §3.2, §3.3).
      gender_cues: ["$(#man/woman)", "$(#He/She)", "$(#his/her)", "$(#gentlemen/both)", "$(#Gentlemen/Both of you)"]
    voice:
      register: книжний, доброзичливий, схвильований; емоційні зриви — плач, паніка в полоні
      idiolect:
        - "«By the caverns!» — головний вигук персонажа, потребує ОДНОГО сталого відповідника на весь вузол"
        - "«Goodness me» — другий постійний вигук, окремий від попереднього, теж сталий"
        - "«Jolly good» (q648, q662) — британська схвальна формула, не «весело»"
        - "звертання «my dear professor», «Mr. Ladelman» — тримає дистанцію ввічливості"
        - "у полоні мова розсипається на заїкання: «Y-you know why we're here», «T-that's why» — відтворювати на українському приголосному (STYLE §9)"

