    Нарації дуже багато (описи професора, його окулярів, сліз, боїв). Скрізь «ви»
    без винятків — STYLE §3.1, навіть коли поруч мовець каже «ти». Нерозписані
    між іншими мовцями юніти, зокрема всі суто наративні, потрапляють у запис
    oldfield (units: default).

