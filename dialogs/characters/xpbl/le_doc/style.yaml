speakers:
  - slug: brynn_savage
    name: Бринн Севедж
    units: default
    confidence: certain
    evidence: [q369, q389, q338, q421]
    role: >-
      Табірний лікар експедиції в Чорному Морі: єдиний медик на дедалі більшу
      кількість поранених, важкий нікотинозалежний, що поступово розпадається
      без цигарок. Говорить або як роздратована людина на межі, або як
      клінічний лектор — і ці два регістри в нього чергуються різко.
    relationships:
      - "шеф Бріггс — начальник експедиції; лікар його побоюється й прикривається ним у відмовах"
      - "Ладелман — постачальник; винен йому тим, що не привіз цигарок, постійна претензія"
      - "Кертіс — хірург, другий і останній член медичної команди"
      - "дружина — згадана один раз (q360), джерело єдиної щирої усмішки у вузлі"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Попри лікарський фах тримається різко й панібратськи, без службової
        ввічливості: «Shut up», «You got a problem with that?», «It's none of
        your business», «go and get treatment somewhere else». Гравець дзеркалить
        і зве його «Doc» — «док» (registry, kind: title).
      gender_cues: []
      switches:
        - {unit: q136, to: ти, trigger: "лекція про мегалоспелінкофобію — регістр не змінюється, змінюється стиль: повні речення, терміни, без скорочень; звертання лишається на «ти»"}
        - {unit: q328, to: ти, trigger: "те саме — науковий виклад про колективну тривогу"}
    voice:
      register: >-
        роздратований, грубуватий, уривчастий; медична термінологія без
        пом’якшення сусідить із лайкою
      idiolect:
        - "нескінченні зітхання в нарації — ::He sighs.:: повторюється десятки разів, це його підпис; не варіювати без потреби"
        - "заповнювачі «Mhm.», «Mmm.», «Yeah, yeah.» — словесні тики, зберігати як окремі короткі репліки"
        - "зачини «Now, …» та «Look, look, …» перед відмовою або поверненням до теми"
        - "заїкання під час ломки — N-n-nooo, W-what, I-I-I; відтворювати на українському приголосному (STYLE §9)"
        - "обірвана мова на пів слова: «How perceptive of y--», «Some did di--», «I'll show you un--!» — розрив має падати всередину українського слова"
        - "лайка помірна, але постійна: damn it, crap, bastard — не пом’якшувати (STYLE §9)"

narration:
  present: true
  note: >-
    Дуже багато нарації, часто розлогої (q75, q273, q368, q388). «Ви» без
    винятків — STYLE §3.1, навіть попри те, що сам лікар каже «ти».
    Підказки дій — інфінітив (§3.5): ::Barter.:: → ::Торгувати.::

new_names: ["Brynn Savage", "Ladelman", "Curtis", "Piggs"]

idioms:
  - unit: q377
    src: "It's quite... savage."
    note: >-
      каламбур на прізвищі Savage, підготовлений у q369 «don't even think about
      making any jokes». Транслітерація прізвища каламбур убиває — потрібне
      рішення на рівні проєкту; поки прізвище не закріплене, не імпровізувати
  - unit: a52
    src: "Chief Brigg's promotion to Major Piggs"
    note: "римоване глузування Briggs/Piggs; шукати українську риму до «Бріггс», а не калькувати"
  - unit: a145
    src: "Derailed."
    note: >-
      внутрішньоігровий сленг на позначення божевілля, побудований на «rail» у
      назві світу; лікар підхоплює його в q146 з погордою — обидва юніти мають
      узгоджуватися
  - unit: a379
    src: "Healthy as a hopper."
    note: "порівняння з ігровою істотою; hopper → стрибун (глосарій), порівняння зберігати, не заміняти питомою ідіомою"
  - unit: q222
    src: "sniff or lick psychoactive substances off a bill"
    note: "bill тут — банкнота, а не рахунок; образ нюхання з купюри"
  - unit: q258
    src: "spawns of evil"
    note: "пафосна лайка на адресу морських змій; не калькувати «породження зла» буквально, шукати живіший відповідник"
  - unit: q267
    src: "His mustache makes way for the appearance of glistening yellow teeth"
    note: "розгорнута метафора замість слова «усмішка»; зберігати обхідність, вона й є жартом"
  - unit: q422
    src: "with the likeness of one of those old-fashioned typewriters"
    note: "порівняння гризіння нігтів із друкарською машинкою — образ, а не штамп"
  - unit: q136
    src: "megalospelyncophobia"
    note: >-
      вигаданий термін; у q136 він розбитий дефісами по складах
      (*me-ga-lo-spe-lyn-co-phobia*) — українське членування має відповідати
      обраній транслітерації

pitfalls:
  - "q72, q89, q115 містять $(context.player.Name) — не відмінювати всередині плейсхолдера"
  - >-
    Кілька реплік склеюються з фрагментів і перекладаються окремими юнітами:
    q143 + q144, q157 + q158, q197 + q202, q208/q211 + q213, q233 + q234 або q250,
    q450 + q451/q452/q453. Не можна перекладати фрагмент як самостійне речення —
    порядок слів і відмінки мають зійтися після склейки
  - "q233 «It's Curtis, the surgeon» продовжується або q234 « and me», або q250 «, a couple of sec-medics and myself» — обидва хвости мають пасувати до однієї голови"
  - "зірочки навколо слів (*actual*, *You*, *sociogenic*, *crap*) — розмітка наголосу, зберігати"
  - "\\n\\n усередині рядків — розрив абзацу, не чіпати"
  - "Chief Briggs → шеф Бріггс (registry: Chief → шеф з малої, Briggs → Бріггс); Marcus → Маркус; Yahota → Ягота"
  - "Doc як звертання → док (registry, kind: title), не «докторе»"
  - "Invictus → Інвіктус, Black Sea → Чорне Море, Core City → Центральне Місто, charons → харони, hopper → стрибун — глосарій"
  - "South Underrail / North Underrail — Underrail лишається латиницею й не відмінюється (глосарій)"
  - "AquaClean, ActiFilter, Lucky Shot, Union Resources — бренди й назви компаній, лишати латиницею (STYLE §6)"
  - "hypercerebrix, irongut, coagulation shots — назви предметів; звіряти з knowledge/, не вигадувати тут"
  - "Dis (q140) — топонім Північної Underrail, канонічного варіанта немає; не імпровізувати"
  - "q338 «Brynn, get a hold of yourself» і q421 «You're strong, Brynn» — лікар звертається сам до себе, а не до гравця; це не інший мовець"
  - "sec-troopers, sec-medics — службові скорочення табору, тримати однаково в усьому вузлі"
  - "«muties» (a93, a121) — зневажлива назва тубільців у вустах експедиції; зневага має читатися"

