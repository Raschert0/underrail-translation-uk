pitfalls:
  - >-
    Головне: племінна говірка Інгвара НЕ перекладається і не переказується —
    гравець її не розуміє, і в цьому суть сцени. Рядки на зразок q11
    «Dur... hruknepönen ot meltønge lætta?» лишаються дослівно як у джерелі.
    Рішення про кирилізацію говірки не ухвалене — не приймати його поодинці
    в межах вузла.
  - >-
    Ламаний піджин гравця (a189 «Reter, yes. Big reters in Underrail.»,
    a192 «There rats big. Not good for nom nom.») має лишитися ламаним:
    без відмінків, без узгодження. Гладкий український рядок тут — помилка.
  - >-
    Спотворені гравцем варіанти імен — свідомі: a11/a13 «Forskar» → «Forskarr»,
    «Flotsourmir» проти «Flottsørmir», a445 «Sjoersr» проти q438 «Sjörsr»,
    a286 «Lysburgamen» проти q284 «Lysbørggamen». Це поступове вивчення слова —
    не уніфікувати написання.
  - >-
    Плейсхолдери $(context.npc_xpbl_yngwar_playerDiction_flotsormir) і
    $(context.npc_xpbl_yngwar_playerDiction_sormirbaren) підставляють ту форму,
    яку гравець уже засвоїв — усередині не перекладати й не відмінювати,
    речення будувати так, щоб плейсхолдер стояв у називному.
  - >-
    $(GiantSkerderHitBodyPart_DisplayName) (q30, q315) — назва частини тіла
    з іншого файлу; підпорядкованого відмінка їй не задавати.
  - >-
    Багато юнітів — уламки одного речення, зшивані рушієм: q312 «::Sjörsr ::» +
    q313, q493–q495, q516–q518, q527–q528, q397, q425. Кінцеві пробіли
    зберігати, порядок слів між юнітами не переставляти — українська рамка
    речення тут не поміститься, доводиться будувати кожен уламок автономним.
  - >-
    Позначки перевірок [Intelligence], [Perception], [Melee], [Fend],
    [Intimidate] всередині ::…:: — службові, за глосарієм; a449 має [DEBUG],
    його теж лишити як є.
  - >-
    Звуконаслідування в q142–q150: протиставлення «Woof-woof» (гравець) і
    «Bau-bau» (Інгвар) — сюжетне. Українське «гав-гав» ставити лише гравцеві,
    «Bau-bau» лишається словом Інгвара.
  - >-
    «savage» (a98, a361, a462, a548, a547) — образа з вуст гравця, лишається
    образою; це не нейтральне «дикун-етнограф».
  - >-
    Термінологія з глосарію: rathound → щурчак, siphoner → висмоктувач,
    hopper → стрибун, Black Sea → Чорне Море, Tchort → Тчорт,
    Institute of Tchort → Інститут Тчорта, Free Drones → Вільні Дрони,
    South Gate Station → Станція Саут-Гейт, Underrail лишається латиницею.

