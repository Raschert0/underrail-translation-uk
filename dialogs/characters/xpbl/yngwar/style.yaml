speakers:
  - slug: yngwar
    name: Інгвар
    units: default
    confidence: certain
    evidence: [q19, q20, q110, q111]
    role: >-
      Вигнаний воїн-Змієроджений із племені Чорного Моря, який живе сам у печері
      й готується піти до моноліту, бо зневірився у Шляху Змії. Майже не володіє
      мовою гравця: спілкується племінною говіркою, жестами й малюнками на піску,
      тож його прямі репліки — це чужа мова, а не проза.
    relationships:
      - "Флоттсьормір — божество-Змій, якому він досі служить; зневіра стосується жерців, не Його"
      - "жерці (spiriters) — вигнали його за вбивство великого змія списом; постійне джерело злості"
      - "Асмьогар — брат, загиблий від сліпучого світла; про це він розповідає лише під тиском"
      - "Перевізник — Отороджений, що вбив Сьорсра; єдиний чужинець, якого Інгвар поважає"
      - "гравець — Æterbæren, «Отороджений»: чужак, спершу ворог, потім співрозмовник"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Дикий воїн-вигнанець без жодної службової чи міської ролі — STYLE §3.2
        однозначно дає «ти». Гравець дзеркалить: його репліки — ламаний піджин
        із двох-трьох слів («There rats big», «Tell me about the rituals»),
        плюс прямі образи «savage», «Dumbass savage!». Формального регістру
        текст не має де взяти: у файлі жодного $(#…) і жодного sir/ma’am.
      gender_cues: []
    voice:
      register: >-
        уривчастий, різкий, майже без службових слів; гордість і зневага
        як базові інтонації, спалахи люті без переходу
      idiolect:
        - "чужа мова як норма — «Forskarr Flottsørmir!», «Jakke», «Nikke», «Krökø!», «Hvarga!?»"
        - "говорить про себе у третій особі: «Yngwar - Skærder», «Yngwar - trekker...»"
        - "рахує фалангами по шість, а не десятками — «Aen / Tvaa / Trä sppæteren»"
        - "плює на землю як знак зневаги — q126, q166, q427, q499"

narration:
  present: true
  note: >-
    Домінує кількісно: більшість q-юнітів — не мова Інгвара, а нарація про його
    дії й переказ його оповіді невласне прямою мовою («He drinks an imaginary
    potion again…»). Звертання до гравця в нарації — «ви» без винятків,
    STYLE §3.1, навіть там, де поруч Інгвар каже «ти». Час теперішній,
    як у джерелі.

