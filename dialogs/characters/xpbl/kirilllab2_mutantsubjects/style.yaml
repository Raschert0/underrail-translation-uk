speakers:
  - slug: mutant_subject
    name: піддослідний мутант
    units: default
    confidence: certain
    evidence: [q37, q39, q45]
    role: >-
      Безіменні піддослідні лабораторії — нарація зве їх «the mutant»,
      «the subject», «the hunchback». Свідомість розпадається: одні марять про
      зниклих товаришів, інші женуть гравця геть або кидаються на нього.
    relationships:
      - "гравець — такий самий мутант, тому вони його не бояться як людину, а бачать у ньому загрозу або свідка"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Здичавілі, без жодної соціальної дистанції, кричать і женуть:
        «Sta... sta awa... fr... me.» (q23), «Leave...» (q10).
        STYLE §3.2 — грубе, вуличне, своє → «ти». Плейсхолдерів $(#…) немає.
    voice:
      register: уривчастий, задиханий; від тихого марення до крику
      idiolect:
        - "обірвані слова з випадінням кінцівок: «Sta... sta awa... fr... me.», «I dema... sile...!» — головна прикмета вузла"
        - "заїкання «n-now», «I-I», «No-nobo...» — відтворювати на українському приголосному, STYLE §9"
        - "марення про вогонь і зраду образами-уламками: «Fire had taken them... away.», «Engulfed in treason.»"
        - "нелюдські звуки: RAAAAAAAGH!!!, WRAAAAA!, Grlgrrrglll..."

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Юніти q39, q45, q50 позначено як q, але це
    нарація наслідків дії гравця, а не мова мутанта; вони найбільше ризикують
    зісковзнути на «ти».

