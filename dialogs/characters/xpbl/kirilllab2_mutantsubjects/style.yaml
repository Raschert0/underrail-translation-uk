    note: "розтягнута голосна всередині слова — переносити на українське слово, а не ставити крапки"
  - unit: q45
    src: "It moves towards you with vile intent"
    note: "«vile intent» — лихий намір; не пом’якшувати до «недобрих намірів»"

pitfalls:
  - >-
    Головна складність вузла: слова обірвано посеред себе. Обрізати треба
    українське слово, а не відновлювати повне — і так, щоб воно ще впізнавалося.
    Крапки й пробіли всередині рядка зберігати позиційно
  - "«No-nobo... is allo... to sta... nex to m...» — обірвано ЧОТИРИ слова поспіль; українська перебудова речення не має зменшувати їхню кількість"
  - "a38 містить мітку навички ::[Intimidation] — брати готовий варіант із knowledge/, а не вигадувати; порівняй глосарійне ::[Persuade]:: → ::[Переконати]::"
  - "q17–q27 звернені до гравця в теперішньому часі й гендерного плейсхолдера не потребують — не додавати його там, де його не вимагає граматика"
  - "q37, q45 містять літерали \\n\\n перед криком — переносити без змін"
  - "Репліки гравця (a40, a41, a47) — нечленороздільні звуки; передавати українськими літерами з тією ж розтягнутістю, узгоджено з сусідніми вузлами xpbl"
  - "Крик RAAAAAAAGH та подібні — кількість повторів літери зберігати, це градація гучності між q37, q45 і q48"

