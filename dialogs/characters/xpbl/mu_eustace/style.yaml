pitfalls:
  - 'q95–q97, q112–q117, q122, q129–q133, q147–q151 — це не самостійні репліки, а вставки, які рушій склеює в одне речення залежно від фракції гравця; вставки «your mates», «the pirates», «the newcomers on jets» мусять стати в такому відмінку, що пасує до всіх речень-господарів («Unlike…», «But they love…»)'
  - 'жарт q78–q81 і q87 тримається на тому, що прізвисько Five Fingers — це число: транслітерація вб’є жарт, а переклад мусить дозволити перепитування «Five in total.»'
  - 'creeper тут — гігантський павук (q156); не плутати з crawler, для якого глосарій дає «повзун»'
  - '$(context.player.Name) у a21 та a23 — усередині плейсхолдера нічого не міняти й не відмінювати'
  - '::wheeze:: → ::хрип:: за глосарієм; ::sniff::, ::cough::, ::gurgle:: канонічних записів не мають — обрати по одній короткій формі й тримати її незмінно в усіх 119 репліках'
  - 'глосарій: Black Sea → Чорне Море, siphoner → висмоктувач, hopper → стрибун, ::Barter.:: → ::Торгувати.::; Expedition як назва доповнення не перекладається, але «the expedition» у q110 — звичайна експедиція'
  - 'q17 «::Wheeze::» і q141 з великої літери — це та сама ремарка на початку рядка; регістр рядка не робить її іншим словом'

