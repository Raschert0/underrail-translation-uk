speakers:
  - slug: eustace
    name: Юстас
    units: default
    confidence: certain
    evidence: [q4, q20, q49]
    role: >-
      Старий мутант-мисливець і торговець із притулку на острові Чорного Моря:
      продає мисливське спорядження та шкури й водночас є головним джерелом
      відомостей про околиці, Перевізника й сусідні фракції.
    relationships:
      - 'Перевізник (Ferryman) — єдиний чужак, з ким плем''я торгує; Юстас говорить про нього з обережною пошаною і не любить пліткувати за його спиною'
      - 'Веслі (Wesley) — інший мешканець притулку, «downstairs» (q9)'
      - 'Five Fingers і Rags — загиблі побратими-мутанти з історії про стрибунів (q78–q83)'
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Мова проста, неписьменна, без титулів і без $(#sir/ma''am); гравця він
        одразу міряє поглядом і питає «boy or girl?» — тобто бачить рівню, а не
        клієнта. За STYLE §3.2 це «ти»; репліки гравця (терсі «Well?», «Spit it out.»)
        дзеркалять той самий регістр.
      gender_cues: ["You... ::wheeze:: boy or girl? ::sniff.::"]
    voice:
      register: хрипкий, повільний, доброзичливо-насторожений; майже кожне речення розбите фізіологічною ремаркою
      idiolect:
        - 'випадання g: huntin’, makin’, explorin’, somethin’ — передавати просторічною українською, не літературним стандартом'
        - 'ain’t, ’cause, lotsa, getcha, outta, I reckon — стійке просторіччя'
        - 'говорить про себе в третій особі: «it’s too much for poor Eustace» (q49)'
        - 'самоназва mutie — внутрішньоігрове слівце, одне рішення на весь вузол'
        - 'думка часто уривається на «Uh...», «Um...», «Nah.» — паузи-заповнювачі зберігати'

