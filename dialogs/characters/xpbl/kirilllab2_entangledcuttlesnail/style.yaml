  - "«cuttlesnail» — істота, якої немає ні в реєстрі, ні в глосарії; не вигадувати назву самотужки"
  - "Підказки дій ::Try to free it.::, ::Pet it.::, ::Leave.::, ::Stand up.:: — інфінітив, STYLE §3.5"
  - "У q4/q9 важливо розрізняти праву й ліву руку — це сюжет сцени, не деталь"

