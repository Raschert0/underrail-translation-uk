pitfalls:
  - >-
    Багато рядків — НЕ речення, а склеювані фрагменти: q53+q54+q55, q61+q62/q64,
    q70+q71, q76+q77, q80+q81, q212+q213+q214, q223+q224+q225. Провідні й кінцеві
    пробіли зберігати дослівно, великих літер і крапок не додавати — інакше в грі
    зліпиться поламане речення.
  - >-
    Через склейку український порядок слів мусить лишити фрагмент граматично
    відкритим у тому самому місці; перекладати такі рядки тільки парами-групами,
    ніколи ізольовано.
  - "\\n\\n у q25, q68, q84, q124, q127, q130, q145, q153 — літеральна послідовність, зберігати як є"
  - "*crap*, *what*, *alone* (q134, q135, q154) — зірочки-акцент зберігати навколо відповідного українського слова"
  - "F12, D10 (q212, q213) — координати сітки, не перекладати й не відмінювати"
  - "$(#guy/girl) у q3, q5 та $(#man/sis) у q163, q164 — обидві гілки в українських гендерних формах"
  - "a67 ::[Perception] Look around.:: — назва навички у квадратних дужках, брати канонічний варіант, не вигадувати"
  - "Chief Briggs (q14, q123) — «шеф Бріггс», реєстр: Chief → шеф з малої, Briggs → Бріггс"
  - "Hell's Gut (q19, q184) → Нутро Пекла; Black Sea (q97) → Чорне Море — глосарій"
  - "Ferryman (a57) → Перевізник — реєстр, kind: title, з великої"
  - "«occassionally» у q215 — друкарська помилка джерела, у перекладі просто нормальне слово"
  - "«sec-specialist» (q153, q156) — самоназва посади, тримати однаково в обох рядках"

