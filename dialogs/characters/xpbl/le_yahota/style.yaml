speakers:
  - slug: yahota
    name: Ягота
    units: default
    confidence: certain
    evidence: [q18, q24, q135]
    role: >-
      Снайперка-безпековичка на даху маяка в Нутрі Пекла: усе, що вона каже, —
      це доповідь спостерігача, а не розмова. Розмову вона сприймає як перешкоду
      роботі, тому репліки короткі, обрубані й майже без ввічливих формул.
    relationships:
      - "Бріггс — командир; будь-який натяк на особисте між ними викликає холодну погрозу (q135)"
      - "Гравець — спершу «newbie», згодом терпимий напарник; теплішання мінімальне (q113, q115)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Військова, вулична, підкреслено груба: зве гравця «newbie», «fraggin’
        insect», гендерні плейсхолдери неформальні. STYLE §3.2 — «ти» без
        варіантів; на «ви» вона не переходить навіть у найформальнішій погрозі.
      gender_cues: ["$(#guy/girl)", "$(#man/sis)"]
    voice:
      register: холодний, обрубаний, армійсько-вуличний; без пом’якшення
      idiolect:
        - >-
          «frag / fraggin’ / fragged» — внутрішньосвітовий замінник лайки, наскрізний
          маркер саме цієї героїні (q12, q16, q77, q131, q138, q163, q175, q194).
          Потрібен ОДИН український корінь, придатний і як вигук, і як дієслово
          («frag it», «Looks fragged to me», «fragged all the muties»), і як
          означення. Розсинхрон кореня між рядками руйнує голос.
        - "випадання g та стягнення: outta, gotta, wanna, 'cause — розмовна, не недбала мова"
        - >-
          еліптичні речення без підмета в доповідях: «Not much activity lately.»,
          «Armed. Refused to cooperate.» — рубленість зберігати, не добудовувати
        - "нульова емпатія в оцінках: «Looks fragged to me», «Doc bought it», «Congratulations, you're alive»"

narration:
  present: true
  note: >-
    Дуже щільна: ремарки ::…:: несуть майже всю дію сцени. «Ви» без винятків —
    STYLE §3.1, попри те що сама Ягота звертається на «ти».

