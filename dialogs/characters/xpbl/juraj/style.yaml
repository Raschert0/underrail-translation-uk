speakers:
  - slug: juraj
    name: Юрай
    units: default
    confidence: certain
    evidence: [q23, q13, q17]
    role: >-
      Ватажок банди, що засіла в лабораторії Кгарона і готує на нього засідку;
      говорить як польовий командир — короткими наказами, з радіозв’язком і
      розподілом ролей. Вигорілий, злий на себе не менше, ніж на ворога.
    relationships:
      - "Кгарон — ворог; Юрай зве його «he», «the real scum himself», ніколи на ім’я в лице"
      - "LARS і VEN — його люди, до яких він кричить у радіо (q3)"
      - "гравець-мутант — знаряддя й несподіваний союзник: «You are our best... chance»"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний ватажок, який командує й лається просто в обличчя
        («freak!» q27, «scum!» q49, «Mutual benefit... my ass» q15).
        STYLE §3.2 — грубий, свій, вуличний → «ти». Плейсхолдерів
        $(#…) у джерелі немає взагалі, рішення спирається на характер.
      switches:
        - {unit: q23, to: ви, trigger: "юніт q23 — нарація дії гравця, а не мова Юрая; STYLE §3.1"}
    voice:
      register: хрипкий, командний, втомлений; мова рветься паузами
      idiolect:
        - "::wheeze:: усередині речення — головна прикмета; глосарій дає ::хрип::. Ставити рівно там, де в джерелі, і не «дочищати» речення"
        - "потрійна крапка як задишка, а не як недомовка: «take the matters... ::wheeze:: into your own... hands»"
        - "радіожаргон: «Do you read me!?», «get into position», «Move it, move it!»"
        - "жести описано в нарації і мова прив’язана до них — переклад має зберігати зв’язок слова з частиною тіла (q9)"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Особливо в q23, q6, q26: там нарація описує
    дії гравця й Юрая, а не є його реплікою.

new_names: ["Kharon"]

idioms:
  - unit: q17
    src: "ambush is my middle name"
    note: "не калькувати «моє друге ім’я»; шукати українську ідіому фаху («на засідках я з’їв зуби»)"
  - unit: q3
    src: "Do you read me!?"
    note: "радіоформула, а не «читаєш мене» — «Як чуєте?»"
  - unit: q15
    src: "Mutual benefit... my ass."
    note: "грубе лишається грубим, STYLE §9 — не пом’якшувати до «та де там»"
  - unit: q15
    src: "crawled next to his boots like limping dogs"
    note: "образ приниження зберегти дослівно — він тримає всю репліку"
  - unit: q12
    src: "Our fuse had burned out long ago."
    note: "метафора запалу/терпіння, не електротехніка"
  - unit: q9
    src: "That takes some guts ::He taps his stomach:: and smarts too ::He knocks on his head.::"
    note: >-
      подвійна гра: слова мусять називати живіт і голову, бо персонаж по них
      стукає. Абстрактні «сміливість/розум» рвуть зв’язок із жестом
  - unit: q27
    src: "I'll turn you to smithereens"
    note: "розмовна погроза, не технічне «на друзки»"
  - unit: q46
    src: "You become what you do."
    note: "афоризм — коротка карбована фраза, не розлоге пояснення"

pitfalls:
  - "Плейсхолдерів $(#масc/fem) у джерелі немає, але український минулий час їх вимагає: «you've made it here» (q17), «you refuse» (q26) — плейсхолдер треба ДОДАТИ, це не вільність (CLAUDE.md, STYLE §2)"
  - "LARS і VEN у q3 — капслок крику в радіо; реєстр дає Ларс і Вен, капслок зберігати"
  - "Kharon (q2, q10, q38, q59) канонічного варіанта ще не має — не транслітерувати самотужки, чекати на централізоване рішення"
  - "Репліки гравця (a8, a18, a30, a31, a33, a35, a37, a60, a62, a65, a68, a73, a77) — не слова, а нечленороздільні звуки мутанта. Передавати українськими літерами з тією ж розтягнутістю, а не перекладати як «так»/«ні»; варіант має бути однаковий у всьому вузлі"
  - "q23 позначено як q, але це нарація дій гравця плюс його ж рахунок — не приписувати Юраєві; він у цьому юніті лише спостерігає"
  - "Послідовності \\n\\n у q6, q16, q17, q36, q38 — літерали розмітки, переносити без змін"
  - "::Nod.::, ::Leave.::, ::Back away.:: — підказки дій, інфінітив: STYLE §3.5"

