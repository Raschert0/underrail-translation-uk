pitfalls:
  - "нарація й пряма мова часто в одному юніті (q11, q14, q23, q51) — межі ::…:: не переносити"
  - "у q60 роздільник зіпсований: «She’s here, you know.:: He pauses…» — відкривальні :: пропущені в джерелі; НЕ виправляти розмітку, зберігати кількість :: як є"
  - "q50 і q58 закінчуються літеральним \\n\\n після ::…:: — зберігати"
  - "a22 містить одруківку джерела «acept» — українською писати правильно, помилку не відтворювати"
  - "The Rig — глосарій: Платформа; «rigmaster» окремої статті не має, потребує узгодження з цим варіантом"
  - "тики «you know» / «okay?» — не викидати як шум: це головна риса голосу, має лишитися в тій самій кількості реплік"

