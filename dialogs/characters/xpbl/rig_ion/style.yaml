speakers:
  - slug: ion
    name: Іон
    units: default
    confidence: certain
    evidence: [q6, q26, q60]
    role: >-
      Охоронець на Платформі, який між змінами підробляє посередником: наймає гравця
      знайти зниклих товаришів і згодом передає запрошення нагору. Нервовий,
      говорить багато й непевно, тому мова має бути рвана, а не гладка.
    relationships:
      - "Kaya — зникла, потім повернулася; саме через неї Іон вдруге виходить на гравця"
      - "rigmaster — начальник, до якого Іон лише проводжає, сам лишається за дверима"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний, панібратський тон із першої репліки: тягне незнайомця в розмову
        («Hey, uhh. You up to make some coin?»), суцільні розмовні тики.
        STYLE §3.2 — «ти»; репліки гравця дзеркалять (§3.3).
      gender_cues: []
    voice:
      register: нервовий, метушливий, підкреслено неформальний
      idiolect:
        - "нав’язливе «you know» наприкінці речень — головний словесний тик"
        - "перепитувальне «okay?» як спосіб домогтися згоди"
        - "паразитне «like» усередині фрази: «that’s like, shame I guess»"
        - "розтягнуті голосні на письмі: huuuge, Soo, umm, uhhh"
        - "випадання g: openin’, walkin’, interestin’, talkin’"

