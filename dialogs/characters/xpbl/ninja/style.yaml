    name: Аран
    units: default
    confidence: certain
    evidence: [q33, q34, q140, q267]
    role: >-
      Замаскований емісар United Stations, родом із Hexagon, який приїхав на південь
      викупити артефакт Acorn у гравця. Веде переговори холодно й методично: спершу
      гроші, потім прихована погроза, і жодного разу не підвищує голосу.
    relationships:
      - "Professor Oldfield — здобувач Acorn; Аран говорить про нього шанобливо, але як про усунену перешкоду"
      - "Consul Oliver у Fort Apogee — офіційний канал, який Аран свідомо обходить"
      - "Hexagon — його справжня лояльність; визнає це відкрито, коли гравець ловить його на цьому"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Аран — офіційний представник, який тримає дистанцію: жодного панібратства,
        повні синтаксичні періоди, звертання на ім'я гравця замість прізвиськ
        (q6, q14, q294). Гравець дзеркалить цей регістр — STYLE §3.3. Гендерних
        плейсхолдерів-звертань у джерелі немає, тож рішення спирається на §3.2.
      switches:
        - {unit: q204, to: ти, trigger: "єдиний зрив — «You fool!» у відповідь на знищення Gloria; тут доречне грубе «ти»"}
        - {unit: q249, to: ви, trigger: "«Don't lie to me» — повернення до крижаної офіційності, не до фамільярності"}
    voice:
      register: >-
        стриманий, книжний, майже церемонний; погроза подається тим самим рівним тоном,
        що й ціна
      idiolect:
        - "«Very well» як маркер поступки — сталий зворот, тримати однаковим у q126, q138, q144"
        - "курсивні наголоси зірочками (*very*, *The*, *unrivaled*, *done*) — єдиний спосіб, яким він підвищує голос; зберігати зірочки"
        - "технічна точність у мові фехтування (q114, q116, q118) — термінологія, не поетика"
        - "риторичне питання замість прямої погрози: q148 «Do I look to you like someone who'd leave South Underrail without it?»"

