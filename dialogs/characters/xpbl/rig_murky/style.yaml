pitfalls:
  - "a35 «I know what number one and two are, but three…» — жарт про туалет (number one / number two); прив’язаний до «Number three’s available» у q22, тож обидва юніти треба перекладати разом, інакше каламбур зникне"
  - "q4 + q5 і q18 — один розрізаний рядок: q4 це самé «We», а q18 — вступ «Now here in the tavern, here we»; переклад мусить стикуватися граматично"
  - "q11 + q12 + q13 + q14 — розрізане речення, q14 це сама крапка; не переносити розділові знаки між юнітами"
  - "q26 + q27 і q122, q126 — короткі фрагменти-продовження, не самостійні репліки"
  - "q90, q95, q96, q103, q107, q119 містять літеральне \\n\\n — зберігати як розрив абзацу"
  - "глосарійні терміни в байках беруться готовими: burrower → копака, crawler → повзун, hopper → стрибун, Mindshroom → Гриб Розуму, Old Junkyard → Старе Звалище, Core City → Центральне Місто, Hell’s Gut → Нутро Пекла, Protectorate → Протекторат, charon → харон, Rig → Платформа"
  - "«Underrail» у q99 лишається латиницею й не відмінюється — глосарій, read-only"
  - "«Drag ’n’ Drop» — назва бару, побудована на комп’ютерному терміні; рішення централізоване, не перекладати самовільно"
  - "«Northerners» / «Southerners» у q105–q107 — протиставлення, що тримає всю байку; передавати однаковою парою в усіх трьох юнітах"

