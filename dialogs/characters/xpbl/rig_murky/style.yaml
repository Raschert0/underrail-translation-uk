speakers:
  - slug: murky
    name: Мутний
    units: default
    confidence: certain
    evidence: [q2, q70, q77]
    role: >-
      Шинкар, діджей і охорона Платформи в одній особі — сам себе так і представляє.
      Половина вузла — його довгі байки про завсідників, тож головне завдання перекладу
      не торгівля, а усний оповідний ритм.
    relationships:
      - "Stella — працює в тій самій таверні, згадана як свідок його історій"
      - "Валун (Boulder) і Сквізер (Squeezer) — торговці зовні, до яких він відсилає гравця"
      - "Black Eels — власники Платформи; Мутний працює під ними й обходить незручні питання"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Попри посаду обслуги (реєстр: Barkeeper → шинкар), мова суцільно вулична —
        «ya dig», «punk», «sons of rats»; STYLE §3.2 вирішує за характером, а не за
        посадою, тому «ти». Репліки гравця дзеркалять (§3.3).
      gender_cues: []
      switches:
        - {unit: q77, to: ти, trigger: "прихована погроза під виглядом дружньої поради — тон холоднішає, але звертання не міняється"}
    voice:
      register: розслаблений, іронічний, з готовою погрозою під сподом
      idiolect:
        - "тег-питання «ya dig» наприкінці думки — найпомітніший маркер, тримати сталим"
        - "«’n’» замість and у кожному переліку"
        - "«ya» замість you, випадання g: botherin’, swingin’, recordin’s"
        - "звертання до гравця «sailor» — рівно там, де воно є, не додавати"
        - "оповідний теперішній час у байках: «So one day he comes over…»"

