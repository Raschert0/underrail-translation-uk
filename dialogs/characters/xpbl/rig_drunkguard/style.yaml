pitfalls:
  - "У всьому вузлі немає жодного $(#masc/fem), але NPC двічі прямо називає гравця «woman» (q68, q220) — гілка розрахована на жіночого персонажа. Не додавати гендерні плейсхолдери в його репліки навмання; питання про минулий час у репліках гравчині винести на централізоване рішення."
  - "q13 «it was,,, gewd» і a88 «you're,,, unique» містять подвійну кому замість трикрапки — це навмисна п’яна друкарська помилка джерела, а не дефект; відтворювати, не виправляти."
  - "«Enought» (q195), «of couse» (q214), «temponorary» (q39) — так само навмисні спотворення, не одруківки для мовчазного виправлення."
  - "\\n\\n усередині q18, q26, q52, q92, q99 тощо — службовий розрив рядка; зберігати кількість і позицію."
  - "The Rig — глосарій дає «Платформа»; не транслітерувати як «Ріг»."
  - "hopper (q26, q99) — глосарій: «стрибун»; не «кузнечик» і не «хопер»."
  - "::[Persuade]:: (a121, a225) і ::[Intimidate]:: (a116), ::[Strength]:: (a185) — теги перевірок навички; форму брати з глосарію, дужки й :: не чіпати."
  - "q24, q38, q70, q154, q158, q196, q233 закінчуються пробілом перед <end> — не прибирати й не додавати."

