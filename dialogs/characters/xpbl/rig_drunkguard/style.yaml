speakers:
  - slug: rig_drunkguard
    name: п’яний вартовий
    units: default
    confidence: certain
    evidence: [q14, q21, q72, q78]
    role: >-
      Мертвецьки п’яний вартовий Платформи, рядовий боєць Чорних Вугрів, який
      цілими днями лежить обличчям на шинквасі. Уся розмова — це його спроба
      затягнути гравчиню в ліжко, а вона тим часом витягує з нього оборонну
      схему Платформи: сонар, турелі, електростанція, радіозв’язок.
    relationships:
      - "Чорні Вугрі — його фракція, говорить про них «ми»"
      - "«ригмайстер» — його начальник на Платформі, боїться його (q111, q118)"
      - "пірати — вороги, зневажає їх (q78, q109, q210)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний п’яниця без жодного натяку на ввічливість: панібратські
        звертання «sugar», «baby», лайка «filthy sow», накази «Shoo!»,
        «Get outta mah...!». STYLE §3.2 — грубий, свій, вуличний мовець
        отримує «ти». Репліки гравчині дзеркалять (STYLE §3.3), зокрема в
        глузливо-звабливому регістрі («Good boy...», «eelboy»).
      gender_cues: ["Get outta my f-face, woman!", "Yer a ssstrange woman", "sugar", "baby"]
    voice:
      register: >-
        безладна п’яна мова: заплітається язик, обриває речення, губить думку
        посеред фрази й починає нову
      idiolect:
        - "::hic:: — гикавка, вставлена просто в середину речення; лишати як службовий маркер, не переносити в кінець"
        - "випадання кінцевого g (lookin', hidin', drinkin') — передавати розмовним усіченням, не літературною формою"
        - "заїкання на першому приголосному (b-brew, t-that, s-sonar) — відтворювати на українському приголосному, STYLE §9"
        - "розтягнуті голосні (rrrrroom, Aaaaah, awesuuum) — зберігати довжину повтору"
        - "нав’язливе *action* — його головне слівце, має лишатися тим самим словом у всіх 20+ входженнях"
        - "«awesum», «gewd», «sumthin'», «werkers» — навмисні п’яні спотворення орфографії, відтворювати спотворенням, а не правильним словом"
        - "самовиправлення в один такт: «infected hopper's... infectid hoppa's...», «Did I s-say werkers?»"
    unattributed_note: >-
      Юніти-нарація (q14, q29, q99, q136, q137, q139, q161, q187, q191, q193,
      q222) не належать йому як мовцеві — це голос оповідача, див. narration.

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1, навіть коли сам вартовий поруч каже «ти».
    Нарація тут навмисно контрастує з ним: холодна, книжна, майже медична
    («his expression as serious as end-stage liver cirrhosis», q52) — цей
    іронічний зазор між високим стилем оповідача й белькотінням персонажа
    є основним комічним прийомом вузла й має зберегтися.

new_names: ["Black Eel", "Black Eels", "Rigotron", "rigmaster", "Scrapper-capper"]

