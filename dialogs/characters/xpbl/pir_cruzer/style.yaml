speakers:
  - slug: cruzer
    name: Крузер
    units: default
    confidence: certain
    evidence: [q30, q56, q70]
    role: >-
      Лейтенант капітана Грима, колишній ватажок піратської команди Spectral Grinners,
      яка влилася в Grim Jetters. Стежить за порядком і силою підкріплює слово капітана —
      звідси постійна погроза в тоні навіть у дружніх репліках.
    relationships:
      - "Cap’n Grim — капітан, якого Крузер поважає за розум, а не за силу"
      - "Бритва (Razor) — другий лейтенант, згаданий як рівня Крузера"
      - "гравець — новачок, якого Крузер визнає «своїм» лише після доведеної вартості"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Грубий пірат, який звертається до гравця вуличним прізвиськом і командує
        («Git outta me face», «Ye stay right dere»). STYLE §3.2 — «ти» без варіантів;
        репліки гравця дзеркалять (§3.3).
      gender_cues: []
    voice:
      register: гучний, агресивно-панібратський, самовпевнений
      idiolect:
        - "суцільний піратський діалект: d’ = the, ye/yer, den, dem, dere, wit’, ain’, gitta"
        - "випадання g в кожному дієприкметнику: gettin’, jettin’, talkin’"
        - "звертання «banga» до гравця — словесний маркер, має бути стабільним у всьому вузлі"
        - "регіт капслоком: HA-HA-HA-HA"
        - "говорить про себе в третій особі: «Cruzer ain’ jealous of no one»"

