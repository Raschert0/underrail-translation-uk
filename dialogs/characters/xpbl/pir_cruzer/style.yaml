  present: true
  note: "«ви» без винятків — STYLE §3.1; попри те, що сам Крузер каже «ти»"

new_names: ["Spectral Grinners", "Grim Jetters", "Isaac's River", "United Stations", "Aegis"]

idioms:
  - unit: q13
    src: "banga"
    note: >-
      піратський сленг на позначення свого; не калькувати й не перекладати описово —
      потрібен один сталий український відповідник на весь корпус
  - unit: q85
    src: "dryfoot"
    note: >-
      зневажливе «сухопутний», протилежне до banga; образа має читатися, не пом’якшувати
  - unit: q87
    src: "stinkin’ Can"
    note: "«Can» — сленгова назва бійця в броні; не «бляшанка» дослівно без рішення по терміну"
  - unit: q31
    src: "worth ’is salt"
    note: "локалізувати ідіомою, не калькувати «вартий своєї солі»"
  - unit: q31
    src: "sen’ under"
    note: "евфемізм «відправити на дно» — морський, а не «покарати»"
  - unit: q42
    src: "dem Union pansies"
    note: "презирлива назва чужинців; грубість зберігаємо (STYLE §9)"
  - unit: q82
    src: "Watch yer tongue, or ye’ll be *flattened*"
    note: >-
      гра слів flattered → flattened у відповідь на a81; шукати українську пару,
      а не перекладати обидва слова окремо
  - unit: q9
    src: "Ye beat D’ Flinger? HA-HA-HA-HA! Deserved."
    note: "Flinger — канонічно Флінгер; артикль «D’» частина бренд-псевдоніма, не перекладати як «той»"

pitfalls:
  - "q25 + q26 + q27 — один розрізаний рядок; q26 «back home» вставляється всередину речення, тому переклад має лишатися вставною обставиною без розділових знаків"
  - "q75 + q76 — так само розрізаний рядок: q76 «’round ’ere» — вставка, не самостійна фраза"
  - "q31 і q34 містять літеральне \\n\\n — зберігати як є, це розрив абзацу в рушії"
  - "«Cruz» у a56 і a70 — скорочення від «Крузер»; потрібна коротка форма, а не повне ім’я"
  - "«Cap’n» — звертання-посада; за зразком реєстру («Cap’n Svana» → «капітанка Свана») передавати як «капітан», з малої"
  - "Aegis тут — не бойовий препарат із глосарія (Егіда), а озброєна сторона («Pop ’em Aegis clods»); не підставляти глосарійний варіант автоматично"
  - "Dreadpool → Жахлива Лагуна, Meatway → М’ясний Шлях — беруться з глосарія, не перекладати наново"

