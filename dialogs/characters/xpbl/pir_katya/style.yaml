speakers:
  - slug: katya
    name: Катя
    units: default
    confidence: certain
    evidence: [q222, q242, q245]
    role: >-
      Стара знахарка при піратах Grim Jetters: лікує рани, торгує ліками
      й псі-стимуляторами, тлумачить сни та відчуває псіонічні емісії.
      Уся розмова тримається на її горі — сина Ніколу застрелили, і вона
      ховає його тіло в печері, вірячи, що зможе оживити.
    relationships:
      - "Нікола (Ніки) — син; його смерть — центр усього вузла, вона зривається на кожній згадці"
      - "Брайан — покійний співмешканець, батько сина, злочинець; згадує з гіркотою"
      - "Grim Jetters — прихистили її; Гриму вона переказує відмову через гравця (q279)"
      - "Black Eels — убивці сина; про них тільки прокльони («Rats upon the Black Eel»)"
    address:
      npc_to_player: ти
      player_to_npc: ви
      basis: >-
        Вона різка й зверхня з першої репліки — суцільний наказовий спосіб
        і пряма зневага («Get out!», «you rat!», «Fool.»), пом’якшення тут
        було б спотворенням характеру (STYLE §3.2). Гравець натомість тримає
        «ви»: перед ним стара жінка, а серед вступних реплік є пряме
        шанобливе звертання «Good day, madam» із поклоном (a306). Асиметрія
        тут свідома — це не порушення §3.3, а випадок, де базовий регістр
        співрозмовника задає вік і роль, а не грубість.
      gender_cues: []
    voice:
      register: >-
        уривчастий, майже телеграфний; літня жінка-іноземка, що говорить
        коротко й наказово, без тепла
      idiolect:
        - "часті односкладні відмови-формули: «Leave it.», «No.», «Yes.», «Fool.» — зберігати їхню куцість, не розгортати в повні речення"
        - "випадання підмета в розмовних відповідях: «Felt it.» (q26), «Doubt it.» (q199) — українською теж без «я»"
        - "у монолозі про сни (q76, q77, q84) регістр різко міняється на високий, майже проповідницький, із повторами («They reveal it. They reveal it.») — повтори зберігати"
        - "рідномовна лексика з «Батьківщини» подана курсивом сюжету, не англійською: «lekovnitze» (q216) — слов’янізм, не англійське слово"
        - "прокльон-образа через щурів: «Rats upon the Black Eel», «Ravenous rats!», «Eels... Rats.» — це наскрізний образ, тримати той самий корінь у всіх трьох місцях"
        - "надані емфази зірочками (*out*, *symbolism*, *Will*, *passed on*) — переносити на відповідне українське слово, не втрачати"

narration:
  present: true
  note: >-
    Дуже насичена нарація (близько третини q-юнітів) — «ви» без винятків,
    STYLE §3.1, попри те що сама Катя каже гравцеві «ти». Підказки дій
    усередині ::…:: — інфінітив (§3.5): ::Barter.::, ::Hug her.::,
    ::Say nothing.::, ::Nod.::, ::Fight!::, ::Leave her alone.::,
    ::Explain to her what you saw.::, ::Let her treat you.::

