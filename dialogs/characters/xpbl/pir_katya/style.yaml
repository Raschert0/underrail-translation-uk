pitfalls:
  - "a307 містить $(context.player.Name) — плейсхолдер не відмінювати й не чіпати всередині"
  - "q45 «Ten charons» і a46 «::Pay 10 stygian coins.::» — глосарій: charon → харон, stygian coin → стигійська монета; це та сама валюта, назви різні навмисно"
  - "q70/q97/q106 «U... Uyen... surm» — заїкання на власній назві; відтворювати на українському приголосному (STYLE §9), розрив у тому самому місці"
  - "q110 «Black Sea» — глосарій: Чорне Море, обидва слова з великої, у відмінках теж"
  - "a22 «I am the Invictus» — глосарій: Інвіктус, титул на Арені"
  - "q70 «when the expedition arrived» — тут це звичайна експедиція в прозі, а не назва доповнення Expedition; перекладати (глосарій, note)"
  - "a34 ::[Mercantile]::, a124/a133/a135 ::[Intelligence]:: — теги перевірок навички у квадратних дужках усередині ::…::, формат зберігати як у ::[Переконати]::"
  - "q216 «I left Fatherland» — тут це топонім-батьківщина персонажки, не загальне слово; рішення внесено до new_names, до нього не вигадувати варіант"
  - "q222 «Katarina became Katie» — гра на скороченні імені; обидві форми ще не мають канонічного варіанта, див. new_names"
  - "q245 «he is Niki - Nikola, my son» — уточнення повного імені через зменшене; обидві форми мають лишитися впізнаваними одна в одній"
  - "q80, q114, q132 — багаторядкові розбори сну з \\n\\n і двокрапками після ключових слів; структуру «Слово: тлумачення» та порожні рядки зберігати посимвольно"
  - "q96, q97, q184, q289 починаються або закінчуються \\n — службові переноси, не прибирати"
  - "q1, q26, q212 та інші містять \\n\\n перед <end> — лишати як є"

