speakers:
  - slug: broderick
    name: Бродерік
    units: default
    confidence: certain
    evidence: [q2, q29, q97]
    role: >-
      Човняр-перевізник, який за плату возить гравця між пристанями (ССГ, Табір Хатор,
      Центральне Місто, Мовчазний Острів). Просторічний, забобонний попри власні
      заперечення, і саме через це його мова — розмовна, з обірваними формами.
    relationships:
      - "Сайлас — той, хто надіслав гравця по загублений вантаж (q29)"
      - "пірати Grim Jetters — через них він підняв ціни (q109)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний просторічний мовець без жодної службової ввічливості: «Suit yourself»,
        «You must have been eating some raw mushrooms, man», «We going or what?».
        STYLE §3.2 — грубі й свої на «ти»; §3.3 — репліки гравця дзеркалять базовий регістр.
      gender_cues: []
    voice:
      register: просторічний, буркотливий, з байкарською жилкою
      idiolect:
        - "стале ain’t замість isn’t/am not: «I ain’t sailing anywhere far», «things ain’t right there»"
        - "випадання g: «towin’», «I ain’t towin’ that thing»"
        - "коротке «Suit yourself.» як відмова-відчепись (q59, q74)"
        - "риторичне «or what?» у кінці питання: «We going or what?» (q72, q75)"
        - "довга сольна оповідь q34–q46 — суцільний усний монолог, тримати розмовний синтаксис, не вирівнювати в літературний"

narration:
