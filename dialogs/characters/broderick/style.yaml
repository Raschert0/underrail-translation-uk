idioms:
  - unit: q29
    src: "someone derailed enough"
    note: >-
      Внутрішньоігровий сленг на рейковій метафорі: «derailed» = здурілий, зсунутий.
      Не калькувати «зійшов з рейок» буквально як залізничний термін, але рейковий образ
      варто зберегти — він наскрізний у грі (пор. q100 «cross to the other side of the rails»).
  - unit: q29
    src: "I'm no quaker"
    note: "Тут не релігійна громада, а «полохливий, боягуз». Перекладати за значенням."
  - unit: q31
    src: "eating too many mushroom cupcakes"
    note: "Натяк на дурман від грибів; не буквальні «кекси» — розмовний відповідник."
  - unit: q29
    src: "gives me the creeps"
    note: "«мороз по шкірі», «моторошно» — не калькувати."
  - unit: a47
    src: "gave me the heebie-jeebies"
    note: "Розмовне «аж мурашки»; регістр знижений, не літературний."
  - unit: a73
    src: "Save your story for barrel fire"
    note: "Багаття в бочці, біля якого травлять байки. Локалізувати образ, не термін."
  - unit: q100
    src: "you dig"
    note: "Сленгове «розумієш?», не «копаєш»."
  - unit: q100
    src: "cross to the other side of the rails"
    note: "Евфемізм переходу межі (смерть / божевілля) на рейковій метафорі — зберегти образ."
  - unit: q5
    src: "I don't ferry jet skis"
    note: "Гідроцикл гравця; у q6 те саме скорочено як «your jet» — тримати один термін в обох рядках."

pitfalls:
  - "q97, q101 містять \\n\\n — розрив абзацу зберігати дослівно."
  - "«charons» (q7, q12, q15) і «stygian coins» (a8, a11) — глосарій: «харон» і «стигійська монета». Це два різні написання однієї монети, обидва вживані."
  - "Топоніми з глосарія: SGS → ССГ, Camp Hathor → Табір Хатор, Core City → Центральне Місто, Chancer's Bay → Затока Авантюриста, Meatway → М’ясний Шлях, Black Sea → Чорне Море, Junkyard → Звалище."
  - "Silent Isle і Forsaken Island — сюжетно протиставлені (q103): «туди можу, а туди ні». Назви мають лишатися розрізнюваними."
  - "«Grim Jetters» (q109) — банда; Grim у реєстрі → Грим, але сполучення в цілому не вирішене, не вигадувати."
  - "Просторіччя мовця (ain’t, towin’) — навмисна характеристика, не помилка джерела; не «виправляти» на літературну норму."

