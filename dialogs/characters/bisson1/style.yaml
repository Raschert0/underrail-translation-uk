pitfalls:
  - "назви псі-здібностей (telekinetic punch, force field, force emission, electrokinesis) та дисциплін (psychokinetics, thought control, metathermics) — ігрові терміни; звірити з knowledge/ і вживати ту саму форму в q13, q16, q23, q31, q39 та в гілках гравця a15, a22, a30, a38"
  - "«::[Requires: Psychokinesis 25]::» в a22, a30, a38 — службова мітка інтерфейсу; число й формат зберегти"
  - "q18, q25, q33, q41 — чотири дослівно однакові репліки «Let's begin your training then...»; переклад має бути однаковий у всіх чотирьох"
  - "q27 і q43 однакові, q35 відрізняється лише доданим «friend» — розбіжність значуща, не вирівнювати"
  - "суми словами: fifty / one hundred / two hundred / one hundred fifty credits — лишати словами, не цифрами"
  - "a81, a85, q87 містять $(context.player.Name) — не відмінювати всередині плейсхолдера; фразу будувати так, щоб ім’я стояло в називному"
  - "«cerebral imprinting», «psionic mentors» — сталі терміни, узгодити з глосарієм проєкту"
  - "«scavenger» → «шукач», «Faceless» → «Безликі», «Core City» → «Центральне Місто», «Biocorp» латиницею, «Underrail» латиницею й без відмінювання — глосарій"
  - "q57, q59, q60 — тризгаданий «friend» лише в q60; не додавати звертання там, де його немає"

