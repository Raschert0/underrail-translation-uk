speakers:
  - slug: bisson
    name: Біссон
    units: default
    confidence: certain
    evidence: [q80, q53, q79]
    role: >-
      Псіонік у ССГ, платний учитель психокінетики; розчищає тунель телекінезом
      і живе з викладання. Половина вузла — навчальні пояснення здібностей, тому
      його мова тримається на точній термінології, а не на емоції.
    relationships:
      - "Езра і Квінтон — інші вчителі ССГ, називає їх без суперництва, як колег"
      - "Гарольд — знайомий із бару, з якого починається розмова"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Наскрізне звертання «friend» (q1, q35, q53, q60, q73, q79) ставить
        співрозмовника на один рівень із мовцем; він не обслуга і не службовець,
        а сусід по станції. Піднесеність його мови треба передавати добором слів
        і повними конструкціями, а не переходом на «ви».
      switches: []
    voice:
      register: спокійний, розважливий, майже проповідницький; повні речення без ковтання складів
      idiolect:
        - "звертання «friend» як постійний тик — має бути та сама українська форма в усіх шести випадках"
        - "пом’якшувальні зачини «I'm afraid», «If I would have to guess», «Again» — обережність, а не невпевненість"
        - "книжні формули «if memory serves me right», «I most certainly don't envy him» поряд із вуличним «if you dig» — суміш регістрів навмисна"
        - "афористичні кінцівки: «a shortcut to ability… not a shortcut to wisdom» — зберегти паралелізм"

