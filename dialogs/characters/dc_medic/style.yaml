  present: true
  note: "«ви» без винятків — STYLE §3.1; тут q1, q2, q7–q10, q20, q26"

new_names: []

idioms:
  - unit: q5
    src: "I may not offer medical assistance to you."
    note: >-
      Це відмова за приписом, а не «не можу». Українська має передати саме
      заборону («мені не дозволено»), інакше зникає рамка правил, у якій він живе.
  - unit: q13
    src: "if she were disconnected from her life-support"
    note: "умовний спосіб у клінічному прогнозі — тримати книжну побудову"

pitfalls:
  - >-
    q12 — суцільна медична термінологія (larynx, bronchial tubes, vocal folds,
    abdominal cavity, spleen). Потрібні точні українські терміни; побутові
    синоніми зруйнують голос персонажа.
  - >-
    «damage» у q12 — за глосарієм «шкода», не «ушкодження» й не «пошкодження».
  - >-
    Faceless за глосарієм — «Безликі», у тому числі коли вжито в однині про
    цього лікаря (q1, q2, q7).
  - >-
    q7, q8 і q10 — фрагменти одного речення-переліку, що склеюються в грі.
    q8 і q10 починаються з коми й малої літери; цю незавершеність зберігати,
    а порядок слів узгоджувати між усіма трьома юнітами.
  - >-
    Назви припасів (super health hypo, antidote, bandage, morphine shot,
    desaturated psionic inhalant, psi booster) — предмети інвентарю; звіряти з
    knowledge/, а не вигадувати тут.

examples:
