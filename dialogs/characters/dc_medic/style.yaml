  - slug: dc_medic
    name: лікар Безликих
    units: default
    confidence: certain
    evidence: [q1, q2]
    role: >-
      Медик Безликих, що доглядає тяжко поранену жінку й видає гравцеві
      обумовлені припаси. Говорить крізь синтезатор голосу — рівно, клінічно,
      без жодної емоції.
    relationships:
      - "командир Безликих — той, чий дозвіл гравець наводить у a6"
      - "«the woman» — пацієнтка, про стан якої йдеться в q12, q13, q15, q18"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова особа при виконанні, мова без жодного стягнення, з модальними
        формулами дозволу («I may not offer», «we may discuss») — STYLE §3.2,
        формальний мовець. Гравець дзеркалить діловим тоном.
      gender_cues: []
    voice:
      register: клінічний, безсторонній, книжно-медичний
      idiolect:
        - "жодних стягнень: послідовно «I am», «she is», «we are»"
        - "модальне «may» у значенні дозволу, а не можливості — це рамка правил, якою він себе обмежує"
        - "мова про себе в множині: «We do not do that», «we will release her» — він говорить від імені Безликих"
        - "анатомічна точність замість співчуття (q12) — жодного оцінного слова"

