        - "«hardcore-core» — його власне здвоєння банднoго слівця, є в q2, q29, q62, q73"
        - "НЕ згладжувати: рядок має лишатися на межі зрозумілості, інакше зникає сам персонаж"

  - slug: mullock
    name: Маллок
    units: [q32, q42, q88]
    confidence: probable
    evidence: [q33, q43, q89]
    role: >-
      Другий поплічник — говорить зрозуміло, але думає повільно; підкидає ідеї,
