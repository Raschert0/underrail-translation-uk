pitfalls:
  - "q42 містить «Johhny» — одруківка джерела; персонаж усе одно Джонні"
  - "q78 містить «alredy» — одруківка джерела; відтворювати як звичайне слово, це не мовна характеристика"
  - "валюта названа двояко: «charon(s)» (a6, a20, a25, q31, q33) і «stygian coins» (a11, a19) — за глосарієм «харон» і «стигійська монета» відповідно; не зводити до одного слова"
  - "Zone Boyz — навмисна орфографічна помилка в назві; якщо назву перекладати, перекручення має лишитися впізнаваним"
  - "Coretech (q32), JKK (a70), Praetorian (a79) — за глосарієм лишаються латиницею; «Praetorian enforcer» у a79 — демонім, окрема невирішена позиція глосарію"
  - "Invictus → «Інвіктус», Institute of Tchort → «Інститут Тчорта», Core City → «Центральне Місто», zoner → «зонер», rathound → «щурчак» — за глосарієм"
  - "a80 містить $(context.player.Name) — не відмінювати всередині плейсхолдера"
  - "$(#buddy/kitty) навмисно асиметричний: чоловіча гілка нейтрально-панібратська, жіноча — принизлива; асиметрію зберігати, не вирівнювати"
  - "q54, q55, q56 — три різні написання одного вигуку «Ooooh»; довжина й обрізаність розрізняють мовців, не уніфікувати"

