speakers:
  - slug: johnny_filth
    name: Джонні Філт
    units: default
    confidence: certain
    evidence: [q3, q43, q87]
    role: >-
      Ватажок банди Zone Boyz — здоровань із кувалдою, який тримає трьох людей
      на самій зухвалості. Веде всі перемовини сам, торгується про «плату за
      прохід» і здувається щоразу, коли гравець згадує когось сильнішого за нього.
    relationships:
      - "Дрек і Маллок — його поплічники; він обриває обох і говорить за всю трійцю"
      - "гравець — випадкова здобич, яку він намагається обібрати"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний бандит із суцільним просторіччям («whatcha doin'», «ya can't be
        comin'») і зневажливими звертаннями $(#buddy/kitty), $(#rat/kitty) —
        STYLE §3.2 однозначно дає «ти». Репліки гравця дзеркалять базовий регістр (§3.3).
      gender_cues: ["$(#buddy/kitty)", "$(#rat/kitty)", "$(#rathound/kitty)", "$(#guy/girl)", "$(#sir/ma'am)"]
      switches:
        - {unit: q74, to: ви, trigger: "після вдалого [Persuade] з JKK — злякано-запобіглива ввічливість, підкреслена $(#sir/ma'am)"}
    voice:
      register: гучний, хвалькуватий, з удаваною діловитістю під час здирництва
      idiolect:
        - "«hardcore» — слово-ідентичність банди, вжите як прикметник, прислівник і вигук; потрібен ОДИН український відповідник у всіх позиціях"
        - "формула-вихваляння «Well, kick my jaw and tell me I'm hardcore» (q1, q28) — та сама фраза двічі, тримати дослівно однаково"
        - "«dominate / dominatin' / zone-outting» — жаргон банди, повторюваний; так само один відповідник"
        - "звертання «little rathound», «Squeak, little rathound!» — гравець послідовно зводиться до дрібної тварини"
        - "суцільне випадання g і «ya» замість «you» — просторіччя, а не помилки"

