  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q46, q47, q52, q54, q56, q66, q67, q78, q85]
    confidence: unknown
    reason: >-
      Вигуки й підхоплення хором, які належать комусь із трійці, але текст не дає
      ознак: ані імені в нарації, ані звертання, ані характерного мовного відбитка.
      q54 і q56 — два з трьох «Ooooh» (третій, q55, упізнається за обрізаною формою
