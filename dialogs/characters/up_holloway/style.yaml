speakers:
  - slug: holloway
    name: Голловей
    units: default
    confidence: certain
    evidence: [q1, q9, q23]
    role: >-
      Сержант першого класу Тімоті Голловей — командир загону дезертирів
      Протекторату, який вивів своїх людей із Форту Апогей, бо його змушували
      вбивати цивільних. Зламаний служака, а не бунтівник: говорить статутно
      навіть тоді, коли зізнається у злочинах.
    relationships:
      - "гравець — капрал Протекторату, надісланий на перемовини; Голловей вищий за званням"
      - "«його люди» — взвод, що пішов за ним добровільно; заради них він і торгується"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Обидва — військові Протекторату, і Голловей у кожній репліці кличе
        гравця за званням («Corporal»), жодного разу не переходячи на панібратство;
        гравець вітає його «sir» і салютує. Це службовий регістр, не приязний.
      gender_cues: ["$(#man/woman)", "sir"]
    voice:
      register: >-
        стриманий, статутний; довгі сповідальні монологи, що зриваються на гіркий
        сарказм і лайку, але не на грубість до співрозмовника
      idiolect:
        - "звертання «Corporal» майже в кожній репліці — тримати як маркер, не вирізати заради милозвучності"
        - "гіркий рефрен «Good job, Sarge! Good job!» — самоцитата начальства, зберігати повтор"
        - "«Sarge» — коротка форма, якою його звуть свої; протиставлена офіційному «Sergeant»"
        - "лайка помірна й службова (damn it, hogwash, bastards) — не пом’якшувати й не посилювати"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; тут нарація описує позу й міміку Голловея"

new_names: ["Timothy", "Fort Apogee"]

idioms:
  - unit: q3
    src: "welcome to hell"
    note: "усталене; шукати український відповідник, не буквальне «ласкаво просимо до пекла» як канцелярит"
  - unit: q9
    src: "struck a chord with him"
    note: "не калькувати; «зачепило за живе»"
  - unit: q10
    src: "I'm all ears"
    note: "ідіома; український відповідник, не «я весь вуха»"
  - unit: q15
    src: "I felt like I'm crazy, derailed"
    note: >-
      derailed — внутрішньоігровий сленг зі значенням «схибнутий»; той самий
      термін є в інших вузлах, потрібне єдине рішення на весь корпус
  - unit: q20
    src: "Hogwash, Corporal!"
    note: "різке заперечення-вигук, не іменник; «дурня», «бридня»"
  - unit: q30
    src: "we'd bite the dust"
    note: "не калькувати; «полягли б»"
  - unit: q33
    src: "being shot like a pig"
    note: >-
      наскрізний образ вузла: q33 «shot like a pig», q43 «rot like a pig»,
      q46 «shot... like pigs». Тримати одну метафору в усіх трьох

pitfalls:
  - "q1, q3, q60 — звання Sergeant First Class / Corporal / colonel / lieutenant / Sarge: потрібна єдина система військових звань на весь вузол"
  - "a2, a58 містять $(context.player.Name) — не відмінювати всередині плейсхолдера, будувати фразу так, щоб ім’я стояло в називному"
  - "q3 і q60 — майже дублікати (різниця лише «I never met you before, so you must have enlisted after I left / after I had left»); перекладати паралельно, розбіжність між ними буде читатися як помилка"
  - "q38 і q45 — той самий абзац нарації з дрібними відмінностями; так само тримати паралельно"
  - "Underrail Protectorate: «Протекторат» за глосарієм, але «Underrail» лишається латиницею й не відмінюється"
  - "Free Drones → «Вільні Дрони», Core City → «Центральне Місто» — за глосарієм"
  - "q14, q15 — «ratters» як зневажлива назва мешканців тунелів; це лайка, а не нейтральна назва, і не термін глосарію"
  - "q7, q11, q17 — довгі періоди з крапками й трьома крапками; не рубати на короткі речення, ритм сповіді тут змістовий"

