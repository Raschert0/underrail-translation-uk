speakers:
  - slug: harold
    name: Гарольд
    units: default
    confidence: certain
    evidence: [q158, q11, q126]
    role: >-
      Завідувач майстерні ССГ — електронник, майстер і водночас торговець. Говорить
      двома шарами: свійським сільським просторіччям у побуті й точною технічною
      мовою, коли пояснює батареї; обидва шари мають лишитися відчутно різними.
    relationships:
      - "Гарланд — колега з нижніх воріт; Гарольд робить йому мінібота й кпинить із його нетерплячості (q43, q51, q149)"
      - "Патрік Пірс — покійний друг, якого Гарольд кличе скорочено «Pat» і згадує з теплом (q69, q72)"
      - "Великий Брет — сварився з Патріком через нагрівачі загонів; Гарольд його виправдовує (q72)"
      - "Езра, Паскуале, Горський, Таннер — станційне оточення, згадуються побіжно"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Попри посаду торговця, тон не службовий, а свійський: «Howdy» як стале
        вітання (q149, q155, q156, q158), «See ya around» (q94), «whatcha gonna do»
        (a90), «lemme», «gonna», «cause science is awesome» (q129). STYLE §3.2 —
        свій, а не обслуга. Гравець дзеркалить (§3.3), звертаючись на ім’я (a2, a159).
      gender_cues: ["$(#guy/girl)", "$(#guys/two)"]
    voice:
      register: доброзичливий, багатослівний; захоплюється поясненнями й сам це визнає
      idiolect:
        - "«Howdy» — вітальний тик, у q149 подвоєне «Howdy, howdy»; тримати той самий український відповідник у всіх юнітах"
        - "подвоєння на згоду: «yes, yes» (q45), «Right, right...» (q45), «Fine, fine» (q83), «Yeah, yeah» (q91)"
        - "«Right.» як односкладна відбивка на початку репліки (q54, q98, q139, q141)"
        - "у технічних поясненнях (q122, q127) — жодних скорочень і повні синтаксичні періоди; це свідомий контраст, не згладжувати"
        - "самоіронія щодо власної балакучості: «I can get carried away sometimes» (q144)"

