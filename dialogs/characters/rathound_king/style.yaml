speakers:
  - slug: rathound_king
    name: Король Щурчаків
    units: default
    confidence: certain
    evidence: ["q125", "q58", "q13"]
    role: >-
      Самопроголошений володар зграї щурчаків у печерах на південь від Табору Хатор:
      величезний, жорстокий, зациклений на власній величі й на зневазі до «слабаків».
      Веде багаторічну ворожнечу з мисливцями Табору Хатор і жадає Сарін собі за королеву.
    relationships:
      - "Сарін — бранка, яку він хоче зробити «королевою»; вона відповідає лютою ненавистю"
      - "Gideon (покійний ватажок Табору Хатор) — заклятий ворог; саме ім’я вимовляється з гарчанням"
      - "Beck — син Gideon’а, ненависний уже за походженням"
      - "щурчаки — «мої брати й сестри», зграя, а не звірі"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Мовець грубий, зверхній, звертається до гравця «weakling», «my amusing guest»,
        погрожує смертю в тій самій репліці — STYLE §3.2 однозначно дає «ти».
        Репліки гравця дзеркалять базовий регістр співрозмовника (§3.3), тому теж «ти»,
        навіть у поштивих за змістом рядках.
      gender_cues: ["$(#he/she)", "$(#man/woman)"]
      switches:
        - {unit: a133, to: ти, trigger: "«I bow down to you, Rathound King» — регістр лишається «ти», але лексика піднесена; не переводити на «ви»"}
    voice:
      register: гучний, пихатий, погрозливий; лексика проста й архаїчно-пафосна
      idiolect:
        - "постійно говорить про себе в третій особі: «the Rathound King», «I am the Rathound King»"
        - "вигук «HA!» капслоком як розділовий знак — зберігати капслок і окличність"
        - "«weakling»/«weaklings» — наскрізне лайливе означення ворогів і гравця"
        - "навмисно неправильна граматика: «I am more strong», «a man who lacks determination is a weaklings»"
        - "перекручує незнайомі слова: «Metasis? Geneticisist?» (q117) — спотворення відтворити на українських відповідниках"
        - "звертається до Сарін просто «woman» — знеособлено, зневажливо"

  - slug: sarine
    name: Сарін
    units: [q6]
    confidence: certain
    evidence: ["q6"]
    role: >-
      Викрадена бранка з Табору Хатор, замкнена в клітці; єдина її репліка в цьому вузлі —
      вибух люті на адресу Короля Щурчаків, а не гравця.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Звертається не до гравця, а до Короля Щурчаків, і то з прямою погрозою
        («I’ll rip your heart out») — тільки «ти».
    voice:
      register: криклива лють, пряма образа без пом’якшення
      idiolect:
        - "нанизує лайливі означення в зірочках: *repulsive*, *pathetic* — зірочки зберігати"
        - "випадання g: «touchin’» — розмовна вимова"

narration:
  present: true
  note: >-
    Великі описові блоки q1, q2, q124, q114 — «ви» без винятків, STYLE §3.1, попри те що
    сам Король каже «ти». Підказки дій ::Fight!::, ::Nod and leave.::, ::Bow down.::,
    ::Laugh.:: — інфінітив, STYLE §3.5.

