  - "Титул «Rathound King» вживається і як ім’я, і як звертання (a26, a64, a79) — форма має бути одна й та сама, кличний відмінок у звертаннях"
  - "rathound(s) → глосарний «щурчак/щурчаки», hoppers → «стрибуни», crawler → «повзун», Camp Hathor → «Табір Хатор» — не вигадувати нових варіантів"
  - "q8 «Welcome to the pack!» і q32 «Welcome to the Pack» — регістр літери в джерелі різний; в українському тексті звести до одного варіанта"
  - "a116 будується на грі слів «divided attention» (клітина ділиться / розділена увага) — потрібен свій український каламбур, калька зруйнує наступну репліку q117"
  - "q117 «Metasis? Geneticisist?» — навмисне перекручення слів персонажем, а не помилка джерела; перекручення обов’язково відтворити"
