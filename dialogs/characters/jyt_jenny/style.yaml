    role: >-
      Отруєна жінка при смерті, яку гравець знаходить у маренні: вона
      приймає його за когось на ім’я Кліфф. Її єдина репліка — уривчаста,
      з паузами, і має читатися як мова людини, що втрачає свідомість.
    address:
      npc_to_player: ти
      basis: >-
        Марення, звертання до близької людини на ім’я — інтимний регістр;
        офіційне «ви» тут неможливе. Обидві репліки гравця — самі підказки
        дій, тож зустрічного регістру у вузлі немає.
    voice:
      register: марення, уривчастий шепіт
      idiolect:
        - "три крапки як паузи знепритомнення — зберігати їх кількість і місце"

