speakers:
  - slug: eidein
    name: Ейдейн
    units: default
    confidence: certain
    evidence: [q198, q184, q6]
    role: >-
      Засновник і глава Інституту Тчорта, у масці, понад сто років віку — говорить
      як верховний жрець-науковець: розмірено, без скорочень, з проповідницьким
      пафосом. Його мова — головний носій стилю вузла, тож будь-яке спрощення
      синтаксису руйнує персонажа.
    relationships:
      - "Медіант Семюел — підлеглий; Ейдейн говорить із ним як наставник із учнем"
      - "Гармост Ставрос — рівня-соратник, згадується як «Harmost Stavros and I»"
      - "Епіскопос Лідія — керує розслідувачами, надсилає до нього гравця"
      - "Гравець — новіціат: Ейдейн тримає дистанцію зверхньої прихильності"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Ейдейн жодного разу не вживає скорочень («I am», «cannot», «do not»,
        «I would»), звертається до гравця на ім’я через плейсхолдер і будує
        періодичні речення з двокрапками — це мова сану, а не вулиці (STYLE §3.2).
        Гравець дзеркалить: «illustrious Eidein», «Tchort guide you» (STYLE §3.3).
      gender_cues: ["$(#brother/sister)", "$(#men/women)"]
      switches:
        - {unit: a14, to: ти, trigger: "розрив розмови й напад — свідома грубість гравця, не базовий регістр"}
        - {unit: a208, to: ти, trigger: "репліка-напад: «end the existence of this twisted cult»"}
    voice:
      register: урочистий, книжний, беземоційний; проповідь із науковим словником
      idiolect:
        - "«Most excellent» — словесний тик, повторюється щонайменше сім разів; потрібен ОДИН сталий український відповідник на весь вузол"
        - "«Tchort guide you» — ритуальна формула прощання; перекладати сталою формулою, не варіювати"
        - "«Tchort is evolution» — вітальний пароль, гравець відповідає дзеркальним «Evolution is Tchort» (a199); дзеркальність зберегти"
        - "двокрапка замість сполучника як фірмовий розділовий знак: «I cannot speak to you at this time: There is some data…»"
        - "інверсія архаїчного штибу: «time I haven’t» (q193), «If you need time, time you will have» (q79) — відтворювати інверсією, не вирівнювати"
        - "*зірочки* виділяють наголошене слово: «will *not* let Tchort down» — розмітку зберігати на відповідному українському слові"
        - "«the devolved», «the corrupted» — субстантивовані означення про Безликих; тримати як стале іменування, а не описовий зворот"

  - slug: samuel
    name: Семюел
    units: [q3, q5]
    confidence: certain
    evidence: [q3]
    role: >-
      Медіант, підлеглий Ейдейна; у вступній сцені присягає на вірність і лишається
      командувати обороною Інституту. Говорить палко й підлесливо — контраст із
      холодною розміреністю Ейдейна.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        До гравця не звертається зовсім — обидві репліки адресовані Ейдейнові,
        на «ви» (звертання на ім’я «Eidein» у q5 вказує на АДРЕСАТА, тому мовець
        тут не Ейдейн). Базовий регістр вузла лишається «ви».
    voice:
      register: запальний, фанатичний, із риторичними питаннями («no?»)

narration:
  present: true
  note: >-
    Розлога, майже літературна нарація (q197, q76, q6) — «ви» без винятків,
    STYLE §3.1. Підказки дій усередині `::…::` — інфінітив: `::Wait.::`,
    `::Give him the Acorn.::`, `::Attack!::` (STYLE §3.5).

