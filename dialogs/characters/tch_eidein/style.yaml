pitfalls:
  - "$(context.player.Name) трапляється в понад тридцяти юнітах — не відмінювати всередині плейсхолдера; будувати фразу так, щоб ім’я стояло в називному (звертання ставити після нього або перебудувати речення)"
  - "q123 «Bring $(context.player.Name) the amount he asked for» — англійське «he» про гравця; українською уникати гендерованого дієслова або додати $(#…) (STYLE §2)"
  - "q83 «$(#men/women)» і q144 «$(#brother/sister)» — єдині гендерні плейсхолдери вузла; регістр гілок має бути з малої, як у джерелі"
  - "q75 «You will be notified when--» і q93 «you’ll be notified wh--» — обрив на півслові; український обрив ставити теж на півслові, зберігши подвійний дефіс"
  - "«Tchort» — глосарій дає «Тчорт»; «Institute of Tchort» → «Інститут Тчорта», «Tchortist» відмінювати від тієї ж основи"
  - "«Faceless» → «Безликі» (глосарій, frozen); «Deep Caverns» → «Глибокі Печери»; «Free Drones» → «Вільні Дрони»; «Protectorate» → «Протекторат»; «Junkyard» → «Звалище»; «Rail Crossing» → «Залізничний Переїзд»; «Core City» → «Центральне Місто»; «charons» → «харони»; «stygian coins» → «стигійські монети»"
  - "«Underrail» лишається латиницею й не відмінюється, зокрема у сполуках «Upper Underrail», «Lower Underrail» (глосарій, read-only) — q189, q190, q115"
  - "«tunneler» у q27/q35/q212 — це бурова машина Безликих, а не істота; глосарійне «Tunnelers → Тунельники» стосується істот, тож тут потрібне окреме рішення, не автопідстановка"
  - "«rassophore» → «рясофор» (registry, примітка до Payam); «novitiate» — послушник/новіціат, потребує централізованого рішення разом із рештою санів"
  - "q95 містить лапки навколо «incident» — переводити в « » (STYLE §5), не лишати прямі"
  - "\\n\\n усередині юнітів — розділювач абзаців, зберігати дослівно й на тому самому місці"
  - "q104, q122, q124, q140, q142, q144, q201 закінчуються пробілом перед <end> — не «прибирати» його при редагуванні"
  - "::[Mercantile]:: у a120–a132 — назва навички в дужках, перекладається за глосарійним зразком ::[Persuade]:: → ::[Переконати]::"

