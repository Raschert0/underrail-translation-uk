speakers:
  - slug: zack
    name: Зак
    units: default
    confidence: certain
    evidence: [q18, q24, q30]
    role: >-
      Виснажений контрабандист із печерної схованки, відрізаної землетрусом:
      наляканий, запобігливий, говорить із чужинцем через силу й весь час
      озирається. Це визначає рвану, недокінчену побудову фраз, а не зміст сюжету.
    relationships:
      - "Ганна — інша мешканка схованки; наступна черга йти по батареї випадає їй або йому"
      - "решта контрабандистів — «ми», за яких він боїться сказати зайве"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Гравець для нього — озброєний незнайомець, що зайшов невідомо як;
        Зак вибачається («I'm sorry if they acted hostile towards you»),
        просить не зрозуміти хибно («please don't take this wrong») і не
        переходить на панібратство. Гендерних маркерів звертання в джерелі немає.
      switches:
        - {unit: q75, to: ви, trigger: "навіть у найрізкішій відсічі тримає дистанцію — «okay?», «alright?»"}
    voice:
      register: нервовий, заникуватий, півголосом; жодної розв’язності
      idiolect:
        - "нав’язливі заповнювачі «Uhh» і «Woah» — словесний тик, зберігати як тик, не вирівнювати"
        - "подвоєння першого складу на переляку: «W-woah», «I-I don't know» — відтворювати на українському приголосному, STYLE §9"
        - "обірвані речення з трьома крапками там, де він не наважується договорити"
        - "перепитування «Huh?» на початку репліки, коли не хоче відповідати"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; тут нарація довга, вплетена всередину реплік"

new_names: ["Lurkers"]

idioms:
  - unit: q24
    src: "all the bad stuff catches up to you"
    note: "не калькувати «наздоганяє»; розмовне «рано чи пізно все вилазить боком»"
  - unit: q30
    src: "the damn machines went berserk on us"
    note: "розмовний зрив машини, не термін; «показилися» природніше за «берсерк»"
  - unit: q70
    src: "it all went off the rails"
    note: "залізнична метафора випадкова; локалізувати як «пішло шкереберть»"
  - unit: q28
    src: "We invited chaos and it came for us."
    note: "коротка сентенція-самозвинувачення — тримати таку саму стислість"
  - unit: a53
    src: "rip the secrets out of your heart"
    note: "погроза гравця, навмисно пафосна; грубе лишається грубим, STYLE §9"

pitfalls:
  - "a19 і a59 містять $(context.player.Name) — не відмінювати всередині плейсхолдера"
  - "q18 і q62 містять \\n — розрив абзацу зберігати як є"
  - "«::Attack!::», «::Leave.::», «::Nod and leave.::», «::Turn around and leave.::» — підказки дій, інфінітив, STYLE §3.5"
  - "у q18 і q24 нарація вплетена всередину репліки (::he licks his lips ::) — межі :: не зсувати, зайвий пробіл усередині не «виправляти»"
  - "q96–q101 — амбієнтні вигуки в маренні («The walls, they are moving back and forth.»), без нарації-імені; лишаються за мовцем вузла, але це не діалог, а бурмотіння"
  - "q2–q6 — короткі післяквестові вітання без ідіолектних маркерів; той самий мовець, той самий регістр"
  - "Zack — варіант написання реєстрового Zach → Зак; окремої особи тут немає, нової транслітерації не вигадувати"
  - "Hannah у q33 — варіант написання реєстрового Hanna → Ганна"
  - "SGS у q20 → ССГ (глосарій); South Gate Station у a19 → Станція Саут-Гейт"
  - "«plasma sentries» — ігрова техніка, не «вартові» у військовому сенсі; тримати один варіант на весь вузол"

