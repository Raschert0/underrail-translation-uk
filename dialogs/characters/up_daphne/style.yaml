    evidence: [q3, q5, q11, q47, q58]
    role: >-
      Молода генетикиня з Ливарні, що чекає під Інститутом Тчорта на вступ до
      тчортистів. Балакуча й самоіронічна, але сторожка: тримається доти, доки
      гравець поводиться відкрито, і різко замикається, щойно відчує загрозу.
    relationships:
      - "батьки привезли її до Ливарні дитиною — говорить про це з образою («that dump», «that hole»)"
      - "тчортисти — потенційні роботодавці; ставиться прагматично, без побожності"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Знайомиться першою і одразу неформально: «Hi, stranger.», «join the line,
        hah!», сленг «outta», «gonna», «Nope.» Це не службовий і не обслуговчий
        регістр — STYLE §3.2 дає «ти». Репліки гравця дзеркалять (§3.3): вони так
        само розмовні («See ya some other time.»).
      gender_cues: ["$(#guy/woman)", "$(#his/her)"]
    voice:
      register: розмовний, теплий, із самоіронією; голос із хрипотою (q3)
      idiolect:
        - "кінцеве «hah!» — словесний тик, 8 входжень (q5, q13, q29, q36, q42, q58 тощо); не викидати й не перетворювати на сміх у ремарці"
        - "звертання на ім’я гравця всередині фрази як прийом близькості: «I'm not exaggerating, $(context.player.Name).»"
        - "побутові порівняння-саморобки: «like a... like a... fisherman on a train station»"
        - "самоцитування власних рішень у лапках: «\"No more will I waste my time in that dump,\" I said to myself»"
      switches:
        - {unit: q22, to: ти, trigger: "холоне й відмовляє, коли гравець не назвався, але форма звертання не змінюється — це тон, не регістр"}
        - {unit: q53, to: ти, trigger: "злякана, відступає й підвищує голос (q55); знову лише тон — на «ви» не переходить"}

