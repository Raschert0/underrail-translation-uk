  - slug: simmons
    name: Сіммонс
    units: default
    confidence: certain
    evidence: [q1, q8]
    role: >-
      Руперт Сіммонс — власник Coretech і один з Олігархів Центрального Міста,
      прямий начальник гравця. Підвищує гравця до особистого агента й посилає
      вбити Корнелла, приховуючи, що Едмунда вбив його власний син.
    relationships:
      - "Арчібальд Найт («Archie») — давній друг ще з Biocorp, шеф Praetorian Security; про нього говорить тепло і на прізвисько"
      - "Едмунд Найт — син Арчібальда, вбитий; офіційний привід для замовлення"
      - "Miland — власний син Сіммонса, справжній убивця; згадка цього імені зриває йому маску (q31, q93)"
      - "Гарлан — підлеглий, до якого відсилає по крам (q9, q49)"
      - "Едстром — згаданий як той, хто підняв популярність Арени (q91)"
    address:
      npc_to_player: ти
      player_to_npc: ви
      basis: >-
        Асиметрія навмисна. Сіммонс кличе гравця son у майже кожній репліці й
        сам пояснює, що так зве всіх молодших (q5) — це поблажлива зверхність
        начальника, отже «ти». Гравець відповідає «Thank you, sir!» (a7),
        «It will be done sir» (a37), «Goodbye, Mr. Simmons» (a50, a92) —
        службова субординація, отже «ви». STYLE §3.2; випадок, коли §3.3
        (дзеркалення) НЕ діє, бо стосунки нерівні за посадою.
      switches:
        - {unit: q31, to: ти, trigger: "маска спадає — погроза «you'll shut your damn mouth»; регістр той самий, але тон різко ворожий"}
        - {unit: q93, to: ти, trigger: "лють і підкуп водночас — «Take this and shut the hell up!»"}
    voice:
      register: гучний, самовдоволений, поблажливо-начальницький; зривається в лють
      idiolect:
        - "son у майже кожній репліці — головна риса; потрібне ОДНЕ стабільне українське слово на весь вузол"
        - "Beautiful! як вигук схвалення (q3, q24, q34, q38, q54, q123) — словесний тик, завжди той самий відповідник"
        - "That's what I like to hear! (q3, q107) — повторювана формула похвали"
        - "лайливі ярлики для ворогів: animals, rats, rathounds, scum, lowlifes, barbarians, Sons of rats — залишати грубими (STYLE §9)"
        - "корпоративний пафос у розповіді про Biocorp (q89, q90): «we used to be beautiful», «a rotten core» — риторика, не канцелярит"
        - "*Everything*, *the* Invictus, *before* — емфатичні зірочки, зберігати на слові-відповіднику"

