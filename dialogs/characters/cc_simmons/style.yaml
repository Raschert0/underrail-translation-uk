pitfalls:
  - "son — НЕ родинне звертання і НЕ залежить від статі гравця: a4 «Son? But, I'm a woman...» і q5 «That's how I call everyone younger than me» будують окремий обмін саме на тому, що слово чоловіче. Український відповідник має лишитися чоловічим навіть для персонажки, інакше a4+q5 стають безглуздими"
  - "q1 містить $(context.player.Name) — не відмінювати й нічого не дописувати всередині плейсхолдера; речення будувати так, щоб ім’я стояло в називному"
  - "a48 «Goodby--» і a51 «As you wi--» — обірвані на півслові репліки; українське слово теж має обриватися посеред слова, а не на межі слів"
  - "q68+q69, q70+q71+q72+q73, q74+q75, q76, q79 — фрагменти одного речення, порізані на юніти; збирати зв’язно, не переносячи слова через межу юніта"
  - "q6 «*the* Invictus» (титул, з великої, глосарій: Інвіктус) і q121 «become invictus» (з малої, загальніше) — регістр літери в джерелі різний, зберегти різницю"
  - "Coretech, Biocorp, Praetorian Security — лишати латиницею і не відмінювати (глосарій); Foundry Guard там само, але тут не трапляється"
  - "Knight — Найт (реєстр); Archibald Knight → Арчібальд Найт (глосарій); пестливе «Archie» в q89, q90 → Арчі (реєстр)"
  - "Drop Zone → Зона Скидання, charons → харони, rathounds → щурчаки, Protectorate → Протекторат, Faceless → Безликі, Arena → Арена (глосарій)"
  - "«the Surface» (a77) — велика літера в джерелі; це топонім-поняття, тримати з великої послідовно"
  - "q9 «There. That is all wanted to tell you» — у джерелі пропущено «I»; не відтворювати помилку, перекладати як нормальне речення"

