speakers:
  - slug: schteff
    name: Штефф
    units: default
    confidence: certain
    evidence: [q4, q3, q88]
    role: >-
      Головний дослідник (Principal Investigator) фізичного відділу Інституту Тчорта:
      захоплений науковець-теоретик, який посилає гравця розставляти T-променеві
      випромінювачі. Мова — освічена, розлога, з постійним почуттям провини за
      загиблого рясофора Павла.
    relationships:
      - "Рясофор Павло — доброволець, якого Штефф послав у Західне Крило й тим занапастив; тема, до якої він повертається щоразу"
      - "Медіант Семюел — начальник Сил Збереження; Штефф покладався на його рапорти й тепер виправдовується ними"
      - "Дослідник Кіро — підлеглий-математик і торговець; Штефф говорить про нього з теплим зверхнім гумором"
      - "Ейдейн — вища духовна інстанція, згадується у формулі «Eidein pardon me»"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Формальний науковець і посадовець, що звертається до незнайомця: «please -
        just call me Schteff. You are...?», «I have no objections to that», «By all
        means», «I am all ears». Жодних випадань «g», повні синтаксичні конструкції.
        Братське $(#brother/sister) тут — конфесійна формула тчортистів, а не
        панібратство, і «ви» не скасовує.
      gender_cues: ["$(#brother/sister)", "$(#man/woman)", "$(#guy/girl)"]
    voice:
      register: ввічливо-академічний, багатослівний, захоплений, легко вибачливий
      idiolect:
        - "«Well now» — вставка-перемикач теми, майже в кожній довгій репліці; тримати як один сталий зворот"
        - "«apex» — його особисте слівце на позначення «чудово/найвищий клас»; не «вершина», потрібен один сталий відповідник у всьому вузлі"
        - "«Magnificent Tchort!» і «By the Tchort» — вигуки-божіння; передавати однаково скрізь"
        - "«Eidein pardon me» — конфесійна вибачальна формула, не буквальне прохання пробачення"
        - "науковий жаргон у побутовій репліці: terahertz, triploidy, mitosis — не спрощувати"

