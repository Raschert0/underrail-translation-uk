    role: >-
      Старша за поведінкою сестра-псіонік, що веде переговори за двох: вітає,
      розповідає історію сестер і ухвалює рішення відпустити гостя чи вбити.
      Говорить крижано-ввічливо, повними реченнями, без скорочень.
    relationships:
      - "Беатріс — сестра-близнючка; Адіра її стримує («You wish nothing, Beatrice. Leave it be.»)"
      - "Гравець — чужинець, якого весь вузол називають лише «visitor», без імені"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Ворожа, але підкреслено церемонна дистанція: «Identify yourself, visitor»,
        «We *suggest* you answer our question first, visitor». Це не панібратство,
        а холод — STYLE §3.2 дає тут «ви».
      switches:
        - {unit: q121, to: ти, trigger: "пряма погроза вбити — «Stop right there!»"}
    voice:
      register: холодна церемонність, книжна побудова, погроза під ввічливою формою
      idiolect:
        - "звертання «visitor» замість імені — тримати однакове слово через увесь вузол"
        - "розповідь про себе веде в третій особі («A young girl was born…») — казковий тон"
        - "жодних скорочень і сленгу навіть у гніві"

