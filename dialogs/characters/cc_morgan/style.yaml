speakers:
  - slug: morgan
    name: Морган
    units: default
    confidence: certain
    evidence: [q45]
    role: >-
      Агент з нерухомості Core City Housing Corporation, який передає гравцеві
      подаровану містом напівзруйновану резиденцію. Увесь вузол — одна ділова
      зустріч: показ будинку, пояснення, чому руїни, і вручення ключа.
    relationships:
      - "Hank Wardell — попередній власник, що висадив будинок; Морган говорить про нього стримано-офіційно і відмовляється розкривати деталі"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Найформальніший тип мовця в грі: службовець при виконанні. Звертається
        виключно «$(#Mister/Miss) $(context.player.Name)», уникає скорочень,
        уживає книжні звороти («I bid you farewell», «I presume», «need I go
        on»). STYLE §3.2 — службові й обслуга на «ви» без варіантів. Гравець
        дзеркалить (§3.3), навіть коли хамить: грубість передається лексикою,
        а не переходом на «ти».
      gender_cues: ["$(#Mister/Miss)", "$(#man/gal)"]
    voice:
      register: підкреслено ввічливий діловий; довгі періоди з крапкою з комою
      idiolect:
        - "заповнювачі вагання «ehm», «mmm» — єдина тріщина в бездоганній мові; зберігати, не вичищати"
        - "«Why, yes it is!», «But of course» — старомодні ствердні формули"
        - "залишається ввічливим і під тиском: на хамство відповідає доганою, а не хамством (q39)"

