  - "q15–q16: Dr. Gratz — жінка («she might seem… strange»), рід у перекладі жіночий"
  - "Biocorp, Coretech, JKK, Praetorian Security, ArenaNow — латиницею, глосарій; Underrail не відмінювати"
  - "«Jon's special» — назва страви, не «спеціальний Джон»; тримати однаково в q33, q35, a42"
  - "«zoners» → «зонери» (глосарій, запозичення), «Drop Zone» → «Зона Скидання», «barrel soup» → «Бочковий суп»"
  - "q40 — довга нарація з «\\n\\n»: перенос рядків зберігати як є"

