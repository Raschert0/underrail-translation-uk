    evidence: [q46, q69, q71]
    role: >-
      Власник харчового ятка в Центральному Місті — зазивала, який продає їжу й
      водночас працює довідковим бюро для приїжджих. Балакучий торговець, а не
      сюжетний персонаж: майже кожна його репліка або рекламує їжу, або пояснює
      новачкові, куди йти.
    relationships:
      - "Зілла — колишня конкурентка з ятком навпроти; згадує її з відвертою злістю"
      - "Jon the Beautiful — постійний замовник «особливої страви»; Мо його боготворить через гроші"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Торговець за прилавком до незнайомого покупця — обслуга, STYLE §3.2.
        Звертання «friend», «traveler» ввічливо-дистанційні, імені гравця він не
        знає. Але «ви» тут гучне й привітне, а не канцелярське: не згладжувати
        його балаганний тон заради формальності.
      gender_cues: []
    voice:
      register: гучний, ярмарковий, невтомно доброзичливий; мова проста, з вигуками
      idiolect:
        - "«::He laughs.::» повторюється як розділовий знак — сміх після майже кожної теми"
        - "«Hardcore!» як вигук схвалення — те саме слово, що в назві Хардкор Сіті Бар; тримати впізнаваним"
        - "«Bless him!» про Джона — набожна формула, ужита корисливо"
        - "рекламні вигуки-зазивання (q69–q74) — окремий шар: короткі, з окличним знаком"

