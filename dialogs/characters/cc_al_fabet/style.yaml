    name: Аль Фабет
    units: default
    confidence: certain
    evidence: [q2, q10]
    role: >-
      Мандрівний збирач-мотлохівник, обвішаний лутом, який намагається збути гравцеві
      органи тварин і брухт. Усе, що він каже, крутиться довкола продажу, ваги на спині
      та «дурних торговців», які відмовляються купувати все підряд.
    relationships:
      - "дід Percy — пішов збирати в Глибокі Печери й не повернувся (q42, q44)"
      - "торговці Центрального Міста — постійний об’єкт обурення (q6, q13, q22)"
    address:
      npc_to_player: змішане
      player_to_npc: ви
      basis: >-
        База — «ви»: у q2 він відкриває розмову як торговець, із $(#sir/ma'am) і
        підкреслено ввічливою формулою пропозиції. Зривається на «ти», коли
        роздратований або збуджений — рішення закріплене STYLE §3. Репліки гравця
        дзеркалять базовий регістр, а не зриви, тому послідовно «ви».
      gender_cues: ["$(#sir/ma'am)"]
      switches:
        - {unit: q6, to: ти, trigger: "наказовий спосіб у образі: «Don't be such a zoner»"}
        - {unit: q13, to: ти, trigger: "спалах обурення: «Are you derailed?»"}
        - {unit: q16, to: ти, trigger: "збуджене визнання гравця «своїм»: «you proved me wrong»"}
        - {unit: q33, to: ти, trigger: "нетерплячий наказ: «stop teasing me»"}
    voice:
      register: >-
        збуджений, торохкотливий вуличний говір; неформальні стягнення (gotta, gonna,
        c’mon, ain’t-подібний тон), випадання g у lootin’, самоперебивання
      idiolect:
        - "нав’язливе yeah наприкінці думки — словесний тик, відтворювати як розмовне «ага»/«еге ж», не вирізати"
        - "самовиправлення на льоту: «my jun-- I mean loot. Loot!» — обірваність зберігати"
        - "торговельна формула-заклик у бойових і фонових репліках (q53–q56) — той самий нав’язливий заклик до купівлі"
        - "лічба парами: «bullet by bullet, heart by heart, battery by battery» — ритм важливіший за буквальність"

