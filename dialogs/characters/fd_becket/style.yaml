  - "q15, q43 — $(#psi-kinda-guy/psi-gal); q110 — $(#pal/gal): перекладати обидві гілки, а не лишати латиницю всередині дужок"
  - "«the Cans» — зневажливе прізвисько солдатів Протекторату, а не «бляшанки» в буквальному сенсі; потребує єдиного рішення на весь корпус"
  - "«Darling» у q57–q59 — прізвище Джулії Дарлінг (реєстр), а не пестливе звертання"
  - "«charons» (q48, q120) → «харони» за глосарієм; «Free Drones» → «Вільні Дрони»; «Protectorate» → «Протекторат»"
  - "a44, a47 — ::Barter.:: має канонічний переклад ::Торгувати.:: (глосарій); a45 ::[Mercantile]:: — назва навички, тримати єдиною з рештою корпусу"
  - "довгий блок видачі зброї (q80–q104) — це шаблон «Here you go. ::He gives you …::»; формулу тримати ідентичною в усіх юнітах"
  - "у q43, q56, q68, q109 є літеральне «\\n\\n» — зберігати розрив рядків без змін"

