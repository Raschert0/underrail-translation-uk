    src: "all these derailed peeps"
    note: "«derailed» — сленг світу гри (зійшов з рейок, здичавів), не калькувати буквально"
  - unit: q50
    src: "bigger than a Deep Caverns echo"
    note: "місцева гіпербола; Deep Caverns — «Глибокі Печери» за глосарієм"
  - unit: q51
    src: "that’s a lot of mud to eat"
    note: "образ приниження; локалізувати як ідіому, не дослівно про багно"
  - unit: q71
    src: "That git! That lying, Protectorate-loving git!"
    note: "британське «git» — грубе, різко негативне, на відміну від приязного «bastard» у цього ж мовця; контраст обов’язково зберегти"
  - unit: q74
    src: "two burrowers worth of mushroom brew"
    note: "burrower → «копака» за глосарієм; міра кількості — жарт, зберегти образ"
  - unit: q124
    src: "discount Izumi"
    note: "глузливе порівняння «дешевша версія когось»; калька «знижка Ізумі» неприпустима"
  - unit: q53
    src: "Why you call me bastard, you schklamanpz?"
    note: "цитата ламаної мови Кокошки; вигадане слово лишити як є, синтаксичну кривизну відтворити"

pitfalls:
