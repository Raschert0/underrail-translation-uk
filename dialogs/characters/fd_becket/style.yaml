speakers:
  - slug: becket
    name: Бекет
    units: default
    confidence: certain
    evidence: [q109, q10]
    role: >-
      Постачальник бази Вільних Дронів: видає гравцеві зброю, броню, псі-спорядження
      і вибухівку, торгує та переказує чутки про решту осередку. Він не боєць, а
      балакучий крамар — звідси нескінченні побрехеньки й регіт у нарації.
    relationships:
      - "Мора — давня знайома по контрабанді, вона привела його до Вільних Дронів; про неї говорить тепло й ніяково"
      - "Кокошка — покійний друг, з якого починався жарт про «bastard»"
      - "Трентон і Бейт — керівники осередку; Трентоном захоплюється, Бейта ненавидить як зрадника"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний крамар без жодної службової дистанції: звертається до гравця
        лайливо-приязно, розповідає про власну матір і туалетні звички товаришів.
        STYLE §3.2 — «свої, вуличні» беруть «ти»; репліки гравця дзеркалять (§3.3).
      gender_cues: ["$(#psi-kinda-guy/psi-gal)", "$(#pal/gal)"]
    voice:
      register: гучний, простацький, панібратський; мова з випадінням звуків
      idiolect:
        - "«bastard» — не лайка, а приязне звертання; у q53 персонаж прямо пояснює, що вживає слово «in a good way». Український відповідник має бути грубуватим, але теплим, і однаковим у всьому вузлі"
        - "постійні означення при «bastard»: magnificent, silly, clever, brave, vicious — зберігати варіативність"
        - "випадіння звуків: nuthin’, kidd’n, ’cause, ’ere, ’em, lookin’, Whacha/Whatcha — передавати українським просторіччям, а не орфографічною помилкою"
        - "«peeps» замість «people» — стале слівце, свій-народ"
        - "«bleedin’» як підсилювач роздратування"
        - "«Stay free!» — прощальне гасло Вільних Дронів, тримати сталу формулу в усіх вузлах"
        - "::He laughs.:: після майже кожної репліки — словесний тик, не скорочувати"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1, хоч сам Бекет каже «ти»"

