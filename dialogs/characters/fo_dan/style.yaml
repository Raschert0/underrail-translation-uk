speakers:
  - slug: dan
    name: Ден
    units: default
    confidence: certain
    evidence: [q125, q85, q23]
    role: >-
      Вартовий Ливарні, колишній бандит із Центрального Міста, старий напарник
      Горського. Йому смертельно нудно на посту, і майже кожна репліка так чи
      інакше зводиться до скарги на нудьгу або до спогаду про бійку.
    relationships:
      - "Горський — найкращий друг молодості; уся лінія тримається на ньому"
      - "Пронира та Зонні Щури — союзники в пізніх варіантах гілки"
      - "Маршалл і Кевін — «нудні придурки», про яких говорить зневажливо"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Свій, вуличний, панібратський — STYLE §3.2 дає «ти». Уже перше звертання
        неформальне, гравця він зве «friend» і плейсхолдером-приятелем, мова
        рясніє ain’t, ’cause, freakin’, damn.
      gender_cues: ["$(#man/girl)"]
    voice:
      register: гучний, лайливий, панібратський; коротка фраза, багато вигуків
      idiolect:
        - "нав’язливе bored/boring — наскрізний лейтмотив, зберігати повтор, не синонімізувати"
        - "Hell yeah! як маркер захвату"
        - "часті ::He laughs.:: / ::He chuckles.:: — сміх перебиває власну репліку"
        - "лайка-підсилювач damn / freakin’ — не пом’якшувати, STYLE §9"

narration:
  present: true
  note: "«ви» без винятків, навіть коли Ден каже «ти» — STYLE §3.1"

new_names: ["Forte", "Gloria", "Black Crawlers", "Lurker"]

idioms:
  - unit: q34
    src: "Hoppers. Hoppers, I tell ya!"
    note: >-
      тут це лайка зі значенням «боягузи», а не істота. Глосарійні «стрибуни»
      підходять лише тому, що зберігають той самий каламбур зі створінням —
      рішення має бути однакове в q33, q34, q39, q43.
  - unit: q77
    src: "relieving people of excess charons"
    note: "евфемізм грабунку; не калькувати — потрібен український жартівливий обхідний зворот"
  - unit: q11
    src: "to cook it black or grind munching"
    note: "вигаданий сленг старого Центрального Міста; має звучати як сленг, а не як зрозуміла фраза"
  - unit: q13
    src: "on to the next room"
    note: "новий сленг, якого Ден не розуміє; переклад має лишатися незрозумілим і для читача"
  - unit: q79
    src: "we used to be so close, like... erm... eyeballs"
    note: "порівняння навмисно невдале — Ден сам вибачається за нього; не поліпшувати"
  - unit: q57
    src: "Real men cry mercury"
    note: "жарт про «мужні сльози» в металургійному місті; образ металу зберегти"
  - unit: q101
    src: "scare a Lurker into becoming a fungivore"
    note: "гіпербола з назвою істоти; конструкцію «налякати так, що стане…» краще перебудувати"

pitfalls:
  - "q23, q110, q125 містять $(#man/girl) — гендерне звертання до гравця, обидві гілки українською"
  - "q14: Hard Bar… Harder Bar — Ден плутає назву «Хардкор Сіті Бар»; спотворення має лишитися впізнаваним спотворенням саме цієї назви"
  - "Foundry Guard лишається латиницею (глосарій), тоді як саме місто Foundry — «Ливарня»"
  - "Gorsky → Горський, відмінюється як прикметник: Горського, Горському"
  - "Biocorp у q120 — латиниця, не відмінювати"
  - "Sneaky → Пронира, Zone Rats → Зонні Щури, Tunnelers → Тунельники, charons → харони, crawlers → повзуни — брати з глосарію"
  - "q85, q88: Dan Forte — прізвище ще без канонічного варіанта, до new_names"
  - "\\n\\n у q4, q66, q91, q102, q125 — розрив рядка, зберігати як є"

