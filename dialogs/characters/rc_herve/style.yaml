    note: "«jack-in-office» — чванькуватий дрібний чиновник; калька неможлива, потрібен український відповідник із тим самим презирством"
  - unit: q101
    src: "get to the bottom of this"
    note: "«докопатися до суті», не «дістатися дна»"
