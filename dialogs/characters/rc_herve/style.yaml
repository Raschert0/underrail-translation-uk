    src: "a worm of doubt soon makes it slowly go away"
    note: "нарація; образ «черв’ячка сумніву» відтворити, не спрощувати до «засумнівався»"
  - unit: q135
    src: "I’ll throw in extra one hundred charons"
    note: "«throw in» — торгова формула «накину / докину зверху»"
  - unit: a139
    src: "your homeboy Buzzer"
    note: "вуличне «твій/ваш кореш»; репліка гравця навмисно збиває регістр — див. pitfalls"
  - unit: q141
    src: "Take it or leave it."
    note: "усталений ультиматум торгу — коротка формула, не пояснювальна фраза"

pitfalls:
  - "a139 («chief», «homeboy», «risking my neck») — емоційний зрив гравця, а не базовий регістр: за STYLE §3.3 дзеркалиться саме база («ви»), тож зухвалість передається лексикою, а не переходом на «ти»"
  - "q109 обриває слово посеред: «point us in the right direct... ion» — розрив усередині слова навмисний, відтворити на українському слові, а не переносити трикрапку в кінець"
  - "q1, q8, q43, q86, q89, q94, q110, q196 містять $(context.player.Name) — не відмінювати всередині плейсхолдера"
  - "суми то цифрами («400 charons»), то словами («three hundred charons») — у джерелі непослідовно; в українському тексті тримати один спосіб у межах сцени, бо q135/q140/q141/q164/q167/q168/q169 — це один торг"
  - "charons → «харони» (глосарій, з малої); Rail Crossing → «Залізничний Переїзд»; South Gate Station → «Станція Саут-Гейт»; SGS → «ССГ»; Ironheads → «Залізноголові»; Tunnelers → «Тунельники»; Free Drones → «Вільні Дрони»; Protectorate → «Протекторат»; Core City → «Центральне Місто»"
  - "«Underrail» у складі «North Underrail», «South Underrail», «Upper Underrail» лишається латиницею й не відмінюється (глосарій)"
  - "у джерелі є друкарські помилки — «milita» (q193), «reaquire» (a42), подвійна крапка «disappointment..» (q109), відсутня крапка в кінці q31: відтворювати їх не треба"
  - "q43/q86, q89/q94, q93/q96/q113 — майже дослівні дублікати різних гілок; переклад має бути ідентичним там, де ідентичний оригінал, інакше Weblate розсинхронить пам’ять"
  - "звання «Captain» і «Major» — з малої, як звання (пор. registry: Chief → «шеф»); «de facto mayor» — «фактичний мер»"

