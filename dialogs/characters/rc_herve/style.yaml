speakers:
  - slug: herve
    name: Герве
    units: default
    confidence: certain
    evidence: ["q190", "q193", "q1"]
    role: >-
      Капітан ополчення і фактичний мер Залізничного Переїзду: відповідає за станцію,
      якій бракує людей і зброї, і саме тому пішов на угоду з Протекторатом про поставку.
      Увічливий службовець під постійним тиском — від його реплік залежить увесь квест про потяг.
    relationships:
      - "майор Кліфтон із Південної Залізничної Застави — контакт у Протектораті, від якого залежить поставка"
      - "Дзижчик — крамар станції, якого захопили Безликі; Герве платить за його порятунок окремо"
      - "Майлз — його людина, знає, як вивести з ладу плазмових ходунів"
      - "Таннер і ССГ — сусідня станція, до якої Герве надіслав заклик про допомогу"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова особа при виконанні: повні речення без скорочень, «Please», «I would be
        grateful», «Thank you so much», офіційне «Hello, traveller» і представлення за
        званням (q190, q194). За STYLE §3.2 формальні й службові мовці — «ви»; репліки
        гравця дзеркалять базовий регістр (§3.3), тому теж «ви».
      gender_cues: ["$(#boy/girl)"]
      switches:
        - {unit: q141, to: ти, trigger: "обірваний торг — «Forget it, $(#boy/girl)»: єдине панібратське звертання у вузлі, свідомий зрив із службового тону"}
        - {unit: q38, to: ви, trigger: "зрив після втрати потяга — гнів є, але звертання лишається на «ви»: холодна офіційність тут різкіша за «ти»"}
    voice:
      register: стриманий, ввічливо-офіційний; під тиском переходить у коротку різкість, не в лайку
      idiolect:
        - "мова управлінця: «reports», «relations», «the core of the issue», «I will not interfere»"
        - "просить, а не наказує: «Would it be a problem for you to…», «Please, be quick»"
        - "рідкісні емоційні зриви капслоком: «What? WHAT? Damn it!» (q36) — контраст із базовим тоном, не згладжувати"
        - "самовиправдання з паузами й трикрапками, коли говорить про угоду з Протекторатом (q69, q48)"
        - "мовний збій «Even one simple information would suffice» (q54) — незграбність під тиском; в українському тексті може лишитися легка неоковирність"

