speakers:
  - slug: sarah_allene
    name: 'вербувальниця Вільних Дронів (ім’я Sarah Allene — див. new_names)'
    units: default
    confidence: certain
    evidence: [q16, q17, q59, q7]
    role: >-
      Вербує гравця до Вільних Дронів і дає перше завдання — вбити посланця
      Протекторату. Говорить як агітаторка підпілля: пафос про «родину» та
      свободу впереміш із вуличною говіркою, тому висока риторика тут не
      книжна, а мітингова.
    relationships:
      - 'Вільні Дрони — її фракція, вона говорить від імені «нас»'
      - 'Протекторат — ворог; про його солдатів каже зневажливо Cans'
      - 'Lurkers — сусіди бази в підпереходах, не союзники'
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Звертається $(#brother/sister) і весь час веде мову про «нашу родину» —
        це вербування в побратимство, не службова розмова. Підсилюють вуличні
        форми gotta, gonna, stinkin’, see ya. STYLE §3.2 — своя, вулична → «ти».
        Гравець дзеркалить (§3.3), навіть у ворожих репліках a75, a83.
      gender_cues: ["$(#brother/sister)"]
    voice:
      register: палка, панібратська; агітаційний пафос упереміш із вуличним просторіччям
      idiolect:
        - 'нав’язливе «family» про фракцію — тримати одне слово в усіх випадках'
        - 'обриви думки трьома крапками: It’s Sarah... / Only... filth...'
        - 'емфатичні повтори: You did it… You did it. / Well done! Well done!'
        - 'риторичне huh?/Hmm? наприкінці питань — лишати як окремий вигук'

