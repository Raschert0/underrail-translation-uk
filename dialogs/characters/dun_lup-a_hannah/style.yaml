pitfalls:
  - "У вузлі немає жодного $(#…), але українська його вимагає: репліки гравця з минулим часом потребують доданого плейсхолдера — це правило, а не вільність (STYLE §2)."
  - "q54 і q79 містять літеральні «\\n\\n» — переносити в ціль дослівно, не замінювати справжніми переносами."
  - "a33 містить «::[Persuasion]::», тоді як глосарій фіксує «::[Persuade]:: → ::[Переконати]::» — узгодити з глосарієм, не вигадувати третій варіант."
  - "«lurker(s)» (q45) і «plasma sentry» (q45, q54) канонічного варіанта не мають — не закріплювати переклад тут поодинці."
  - "Джерело рясніє друкарськими помилками автора: «dont» (q16), «shorty» (q23), «Mubmles» (q67), «adresses» (q79), «nowehere» (q54). Українська ціль пишеться правильно — помилки не відтворюємо."
  - "Кількість «::» у цілі має точно збігатися з джерелом — це перевіряє tools/check-uk.ps1."
  - "q3, q27, q45 — про Fred у минулому часі; Fred за реєстром «Фред», відмінювати."

