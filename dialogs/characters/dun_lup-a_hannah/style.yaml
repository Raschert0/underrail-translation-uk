speakers:
  - slug: hannah
    name: Ганна
    units: default
    confidence: probable
    evidence: [q9, q10, q34, q36, q44, q79]
    role: >-
      Уціліла колоністка з поселення, яке після землетрусу захопила зграя нападників;
      говорить від імені всієї громади («we», «us»), а не від себе. Наскрізь налякана,
      тож будь-яка різкість у перекладі руйнує персонажа.
    relationships:
      - "Zack — прибув сюди разом із нею першим рейсом (q26, q44, q53)"
      - "Fred — загиблий товариш; про нього говорить у минулому часі (q3, q27, q45)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Гравець для неї — чужа озброєна людина, від якої вона чекає насильства.
        Мова без сленгу, без випадання «g», повні речення, ввічливе «P-please» —
        це формальний, дистанційований регістр, STYLE §3.2. Гравець дзеркалить, §3.3.
      switches:
        - {unit: q57, to: ви, trigger: "після порятунку теплішає, але на «ти» не переходить — вдячність не скорочує дистанції"}
    voice:
      register: тиха, боязка, книжна; довгі складнопідрядні речення навіть у паніці
      idiolect:
        - "заїкання на першому складі: P-please, H-home, C-close — відтворювати на українському приголосному, STYLE §9"
        - "обриви думки через три крапки: «I ... I have nothing better to do» (q44)"
        - "постійне «we/us/our» — вона мовець від громади, не про себе"
        - "піднесене «We shall endure» (q4), «We shall recover» (q75) — не знижувати до розмовного"

  - slug: hannah_drugged
    name: Ганна під дією галюциногену
    units: [q62, q64, q65, q67, q68, q69, q70, q71, q72]
    confidence: probable
    evidence: [q68, q70, q71, q72]
    reason: >-
