      dialogs/characters/dun_lup-a_threelurkers пояснює, що бранців труять
      забрудненими відходами з галюциногенним ефектом («You haven’t seen them
      when they are “awake”»).
    guidance: >-
      Той самий регістр «ви», але мова розпадається: односкладні вигуки, дитяче
      «Mom? Dad?», сенсорні уривки. Не добудовувати речень і не додавати сполучників.
    voice:
      register: розпад мовлення, дитячі й тілесні образи

