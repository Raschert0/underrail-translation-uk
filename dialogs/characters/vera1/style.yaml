    evidence: [q13, q34, q42, q129, q137, q162]
    role: >-
      Радниця Станції Саут-Гейт; пропонує гравцеві місце в раді й веде його через
      справу зниклих Бейкерів та зникнення Таннера. Говорить як посадовиця, що
      зважує слова, — навіть коли вражена, зривається не в лайку, а в паузу.
    relationships:
      - "Таннер — голова станції; вона перебирає частину його обов’язків після зникнення"
      - "Горський — колега-радник; «may have had... disagreements», але з повагою"
      - "Езра — до нього вона відсилає гравця по доступ"
      - "Паскуале — станційний лікар, її джерело про стан Лори"
      - "Терр і Лора Бейкери — «two of our own», їхня доля рухає весь вузол"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова особа при виконанні обов’язків — STYLE §3.2. Тримає повні форми
        без скорочень («I cannot believe it», «You do not have to answer right
        away»), звертається на ім’я через $(context.player.Name) навіть у
        напруженні. Гравець дзеркалить — §3.3.
      gender_cues: ["$(#man/woman)"]
    voice:
      register: стримано-офіційний, тепліший у горі, ніж у справах
      idiolect:
        - "«Certainly» як звична згода — не «звісно ж», а рівне «безумовно»"
        - "потрійні повтори в шоці: «This is horrible, horrible»"
        - "обірвані речення з крапками, коли не дає волю емоціям: «but since he... is not with us anymore»"
        - "оцінює політично, а не емоційно: «position ourselves advantageously», «retain a high degree of independence»"

