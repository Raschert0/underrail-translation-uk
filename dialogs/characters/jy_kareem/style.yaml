speakers:
  - slug: kareem
    name: Карім
    units: default
    confidence: certain
    evidence: [q167, q155, q80]
    role: >-
      Шинкар Звалища і головний рознощик чуток у місті: за монету віддає
      інформацію, за монету наймає ловити вугрів. Говорить коротко й зверхньо,
      а довгі абзаци видає лише тоді, коли переказує новини.
    relationships:
      - "Абрам — передає через Каріма гроші (q1, q162) і погрозу (q163); Карім лише посередник, не має свого ставлення"
      - "Гровер — згадує зневажливо: «that weasel Grover» (q40)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Звертається до гравця як до чергового відвідувача, без жодної
        сервісної ввічливості: «$(#jack/lady)», «$(#jack/sis)», «I ain't your
        secretary». Шпилька «For a simple patron, you sure ask a lot» (q155) —
        це рівний до рівного, не обслуга до клієнта.
      gender_cues: ["$(#jack/lady)", "$(#jack/sis)", "$(#jack/sister)", "$(#guy/woman)", "$(#man/woman)"]
    voice:
      register: >-
        буркотливий, лаконічний, з сухою іронією; за словами джерела —
        «deep, rumbling voice», і не зрозуміло, чи він злий, чи просто нудьгує
      idiolect:
        - "репліки-обрубки як основний прийом: «Maybe.», «It's a surprise.», «Could be.», «Me too.», «You'll be back.» — не розгортати їх у повні речення"
        - "дзеркалення реплік гравця як форма шпильки: «For a simple barkeep, you sure know a lot» → «For a simple patron, you sure ask a lot» (a154/q155); синтаксис відповіді має повторювати синтаксис запитання"
        - "у режимі чуток регістр піднімається до майже газетного переказу (q20, q21, q35, q48) — це свідомий контраст із його ж однослівними відповідями"
        - "розмовне зниження в емоційних місцях: «ain't», «crapless», «son of a rat», «freakin'»"

