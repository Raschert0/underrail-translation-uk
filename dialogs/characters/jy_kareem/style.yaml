pitfalls:
  - >-
    ГОЛОВНЕ: вузол широко використовує СКЛЕЮВАННЯ юнітів у одне речення під час
    гри. Ланцюги: q32 + (q33 | q38 | q39) + q34; q66 + (q67 | q84) + q68;
    (q70 | q83) + q71; q122 + q123; q165 + один із рядків-чуток; q55 і q59 —
    рядки-заголовки перед блоками. Пробіли на початку й у кінці таких юнітів
    значущі — не прибирати. Українська вимагає узгодження за відмінком і родом
    через шов, тому кожен фрагмент слід будувати так, щоб він працював з УСІМА
    можливими продовженнями; за потреби перебудовувати речення, а не
    підганяти під одну гілку.
  - "q32 «Some lone rat caused » має стикуватися і з «a bloodbath…» (q33), і з «a lot of trouble…» (q38), і з «some trouble…» (q39) — керування дієслова мусить підійти всім трьом"
  - "q68 закінчується на «J-J-J...», а продовження задає гравець: Joshua (a69) або Jennifer (a82). Заїкання має відтворюватися на тому приголосному, з якого починаються ОБИДВА українські імені, інакше підказка розсинхронізується з відповіддю — STYLE §9"
  - "q1, q7, q166 містять $(#jack/lady), q80 — $(#jack/sis), q163 — $(#jack/sister): три різні пари в одного мовця; кожну перекладати окремо, не зводити до однієї"
  - "q43 «the $(#man/woman) who lead the charge» — плейсхолдер стоїть у підметі, тож і дієслово, і означення далі мають бути гендерно нейтральними або також у плейсхолдері"
  - "q24 «some scavenger $(#guy/woman) came in and wasted…» — минулий час після плейсхолдера гендерний; потрібен додатковий $(#…) на дієслові, і це правильно, а не вільність"
  - "q40 згадка «Grover», «Silas»; q52 «Elwood»; q53 «Kimi»; q163 «Abram» — це персонажі, про яких мова, а не мовці"
  - "глосарій: The Rig → «Платформа», Camp Hathor → «Табір Хатор», Old Junkyard → «Старе Звалище», Junkyard → «Звалище», Core City → «Центральне Місто», Free Drones → «Вільні Дрони», Faceless → «Безликі», Rail Crossing → «Залізничний Переїзд», Protectorate → «Протекторат», siphoners → «висмоктувачі», rathounds → «щурчаки», charons → «харони», SGS → «ССГ»"
  - "q142, q146, q147, a145 містять суми (100, 150) — числа не чіпати; торг має лишитися арифметично послідовним"
  - "q39 пише «the Rig» з малої, тоді як q31, q33, q37, q38 — «The Rig»; це різнобій джерела, в перекладі назва єдина"

