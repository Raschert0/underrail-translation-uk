    rule: "заїкання відтворюємо на українському приголосному, а не переносимо латинські літери (STYLE §9)"
    uk_fragment: "П-п-під... Піддайтеся..."
    status: proposed
  - unit: a2
    rule: "підказка дії всередині ::…:: — інфінітив, STYLE §3.5"
    uk_fragment: "::Битися!::"
    status: proposed
  - unit: q11
    rule: "множинне «we» гурту зберігати як «ми», навіть коли говорить один"
    uk_fragment: "Ми знаємо"
    status: proposed
