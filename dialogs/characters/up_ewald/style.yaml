speakers:
  - slug: ewald
    name: мовець за текою — Ewald
    units: default
    confidence: probable
    evidence: [q5, q9, q12]
    role: >-
      Похмурий мешканець Верхньої Underrail, який демонстративно не хоче
      розмовляти. Уся його мова — це ескалація відмови, від сухого «не цікавить»
      до відкритої погрози.
    relationships:
      - "гравця називає лише «zoner» — чужак, не вартий імені"
    address:
      npc_to_player: ти
      player_to_npc: ви
      basis: >-
        Ewald відкрито зневажає й погрожує («I’ll zone you out on the spot»),
        зневажливе «zoner» замість імені — STYLE §3.2 дає «ти». Гравець же
        починає підкреслено чемно («Excuse me», «if you have the time»),
        тож його базовий регістр — «ви»; наступні кпини цього не змінюють
        (STYLE §3.3 — дзеркалиться базовий регістр, а не емоційні зриви).
      gender_cues: []
    voice:
      register: роздратований, саркастичний, з холодною погордою
      idiolect:
        - "нав’язливе «zoner» — його єдине звертання до гравця"
        - "риторичні питання замість відповідей: «Deaf, stupid or both?»"
        - "любить розкладати власну фразу на слова й пояснювати їх по одному (q10)"

narration:
  present: true
  note: "«ви» без винятків, навіть коли Ewald тикає — STYLE §3.1"

new_names: ["Ewald", "Tchortists"]

idioms:
  - unit: q5
    src: "Go bug someone else"
    note: >-
      не калькувати «йди дошкуляй іншому»; розмовне «чіпляйся до когось іншого».
      Формула повторюється у q9 і q20 — переклад має бути тим самим рядком,
      бо q10 його розбирає по словах
  - unit: q13
    src: "*lower* myself to your intellectual level"
    note: "зірочки — авторський наголос, зберігати; «опуститися до твого рівня»"
  - unit: q14
    src: "Duh... Duh duh..."
    note: >-
      імітація недоумкуватого мукання, а не слово — український відповідник
      на кшталт «Гм... гм-гм...», але саме як звук

pitfalls:
