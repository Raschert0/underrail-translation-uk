speakers:
  - slug: gorsky
    name: Горський
    units: default
    confidence: certain
    evidence: [q7, q41, q42, q73]
    role: >-
      Керівник вилазки ССГ до комплексу GMS: командує загоном, наймає гравця
      знайти ключ-картку від сховища й платить за роботу. Говорить як старший,
      що не пояснює наказів двічі й не має часу на сентименти.
    relationships:
      - "загін — свої, звертається «boys»; гравець для нього виконавець, не побратим"
      - "Omega — стара ворожа станція, з якою ССГ воювало за Південну Браму; згадує з презирством"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Різкий, командний, фамільярний: «It's your worthless hide», «you ninny»,
        «Now get out of here!», «Let's pack it up, boys». За STYLE §3.2 це
        однозначно «ти». Наказовий спосіб успадковує вибір (§3.4): «Go back out
        there» → «Вертайся туди», а не «Поверніться». Гравець дзеркалить (§3.3);
        обурене «You killed half of them?!» — емоційний зрив, не привід міняти регістр.
      gender_cues: []
    voice:
      register: різкий, командний, з чорнуватим прагматизмом
      idiolect:
        - "звертання до загону «boys» — рефрен «Let's pack it up, boys» повторюється тричі (q7, q11, q36); тримати одне формулювання"
        - "британське підсилювальне «bloody» як лайка-затичка: «bloody history», «bloody door»"
        - "нехитрі афоризми замість пояснень: «Life is tough», «Dying man has no use for gold»"
        - "зневажливі ярлики для чужих бід: «some random nobodies», «Tough.»"

