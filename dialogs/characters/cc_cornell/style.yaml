pitfalls:
  - "q39 («We ») і q40 — один розрізаний рядок; так само q46 і q47. Переклад має стикуватися по слову, інакше в грі вийде граматичний брухт. Не переносити слова між юнітами."
  - "a3 містить $(context.player.Name) — усередині плейсхолдера нічого не відмінювати; будувати фразу так, щоб ім’я стояло в називному."
  - "a3 «I’ve been looking for you… Cornell» — це гравець звертається до Корнелла; мовець q-рядків від цього не змінюється."
  - "$(#man/sister) — асиметрична пара в оригіналі; в українському варіанті потрібні дві повноцінні гендерні форми, а не одна на дві статі."
  - "q76 $(#him/her) — Корнелл говорить про гравця в третій особі до своїх; узгодити з дієсловом, а не з адресатом."
  - "Coretech лишається латиницею (глосарій, read-only), Core City → «Центральне Місто», Faceless → «Безликі», Tunnelers → «Тунельники»."

