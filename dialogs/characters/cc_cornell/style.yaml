speakers:
  - slug: cornell
    name: Корнелл
    units: default
    confidence: certain
    evidence: [a3, q31, q100]
    role: >-
      Ватажок банди шукачів «Acid Hunters», що переховується в Центральному Місті
      після смерті сина одного з олігархів. Затиснутий у кут і торгується за життя:
      мова коливається між нахабством напоказ і панічним виправдовуванням.
    relationships:
      - "Двоє поплічників поруч — мовчазні, зброю виймають за ним"
      - "Phreak — давній спільник, у його схованці Корнелл ховається"
      - "Арчібальд Найт — батько вбитого хлопця, шукає помсти"
      - "Coretech — замовник убивства самого Корнелла"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний бандит, з першого рядка агресивний і панібратський
        («Drop off, I ain’t talkin’ to ya!»), звертається до гравця зневажливими
        прізвиськами. STYLE §3.2 — «ти»; репліки гравця дзеркалять (§3.3).
      gender_cues: ["$(#man/sister)", "$(#boy/girl)", "$(#him/her)"]
    voice:
      register: грубий, вуличний, з постійним випаданням кінцевого g
      idiolect:
        - "тотальне випадання g: talkin’, tellin’, hidin’, squabblin’ — потрібен розмовний український відповідник, не літературна норма"
        - "ya / yer замість you / your, ain’t, ’cause, tryina, outta, gotta"
        - "зневажливе pipeworker як звертання до гравця — глосарій «труболаз»"
        - "внутрішньоігрове zone out / dominate у значенні «вбити», «розібратися»"
        - "обриви й самовиправлення під тиском: «me... us... me?»"
        - "лайку через *зірочки* автор ставить як евфемізм — лишати грубим, не пом’якшувати"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1, навіть коли Корнелл каже «ти»"

new_names: ["Acid Hunters", "Miland", "Edmund", "Phreak", "Terry", "Baker", "Cube"]

