  - "Core City → Центральне Місто, Institute of Tchort → Інститут Тчорта, Tchort → Тчорт (глосарій)"
  - "«Tchortists» — похідне від Тчорт; узгодити з рештою вузлів tch_*"
  - "«that bleeding cylinder on his arm» у q2 — деталь спорядження Безликих, не метафора"
  - "q6 «I still live because of you» — теперішній час навмисний, не «я вижив»"

