speakers:
  - slug: saved_faceless
    name: "врятований Безликий"
    units: default
    confidence: certain
    evidence: [q2, q3]
    role: >-
      Безликий, якого гравець колись урятував у Центральному Місті; приходить
      попередити про навалу на Інститут. Говорить синтезованим голосом —
      беземоційно, майже протокольно.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Мова цілком позбавлена скорочень і розмовності, побудована як
        офіційне повідомлення («That is my message») — формальний регістр
        за STYLE §3.2. Синтезований голос виключає фамільярність.
    voice:
      register: рівний, беземоційний, ультимативний
      idiolect:
        - "жодних скорочень: «This conversation is over», «I still live because of you» — не стягувати"
        - "крапка з комою всередині репліки — риса цього мовця, зберігати (q6)"
        - "короткі рубані накази наприкінці реплік: «Now leave.»"
        - "не ставить запитань узагалі — лише твердження й накази"

