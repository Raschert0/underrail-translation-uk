    evidence: [q2, q13, q17]
    role: >-
      Науковець у сліпучо-білому халаті, який вважає співрозмовника нижчим за
      себе й не приховує цього. Його мова — це поєднання книжної правильності
      з відвертою зневагою.
    relationships:
      - "гравця називає «imbecile» і «random... person» — принципово знеособлює"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Попри грубість, Yussel тримає книжний, повносинтаксичний регістр —
        «I beg your pardon!?», «there is no purpose in this», жодних скорочень
        вуличного типу. Це формальний мовець, який ображає саме на «ви»
        (STYLE §3.2); згладжене «ти» зруйнувало б ефект. Гравець починає
        підкреслено чемно (a3) — дзеркалить «ви», STYLE §3.3.
      gender_cues: []
      switches:
        - {unit: q20, to: ви, trigger: "навіть у найгрубішій репліці регістр не падає — зневага лишається холодною"}
    voice:
      register: пихатий, книжний, роздратований
      idiolect:
        - "«imbecile» як рефрен — відкриває вузол (q1) і закриває його (q20)"
        - "повні складнопідрядні конструкції там, де вистачило б фрази — ознака самозамилування"
        - "цитує уявну ввічливу відповідь, щоб її висміяти (q17)"

