      Кіборгізований чотириногий Безликий, що видає гравцеві боєприпаси за
      квотою. Уся його мова — це видача нормативів, тому потрібен реєстр
      інтенданта, а не характер.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Синтезований голос і повна відсутність скорочень: «You are entitled to»,
        «I may not give you any more», «That is acceptable», «No, you may not» —
        службовий, безособовий мовець, STYLE §3.2. Гравець дзеркалить: «May I ask
        you a few questions?» (a79).
    voice:
      register: службовий, беземоційний, канцелярський
      idiolect:
        - "нуль скорочень: cannot/do not/I may not замість can't/don't"
        - "«You are entitled to…» — повторювана формула квоти, тримати однаковою в q6, q16–q18"
        - "«That is acceptable» замість звичайного прощання — не згладжувати до «Гаразд»"

