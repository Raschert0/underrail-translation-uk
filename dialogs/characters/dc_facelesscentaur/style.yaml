pitfalls:
  - >-
    Faceless → Безликі (глосарій, frozen). Тут ідеться про одного представника,
    тож потрібна однина «Безликий»; узгодження чоловічого роду підтверджує
    англійський «he» у q2.
  - >-
    «Centaur» у назві теки — технічна мітка розробника, у тексті не звучить.
    Перекладати нічого не треба.
  - >-
    Калібри й позначення набоїв не перекладаються й не транслітеруються: 5mm,
    7.62mm, 8.6mm, 9mm, .44, 12.7, W2C, JHP. Крапка в «.44» — частина позначення,
    не пунктуація.
  - >-
    «Twelve gauge» (q7) — калібр рушниці, а не «дванадцять». «six-pellet /
    twelve-pellet / twenty-pellet shot» — тип дробу; числівник має лишитися
    прив’язаним до типу набою в a62, a64, a66.
  - >-
    Рядки q14, q21, q23, q25, q27, q29 та їхні відповідники в гілках W2C і JHP —
    дослівні повтори «::He gives you one ammo package.::». Переклад має бути
    ідентичним у всіх, інакше в грі з’явиться безпричинна різниця.
  - >-
    q2, q6, q7, q8 закінчуються порожнім рядком або «\n\n» перед <end> —
    структуру рядків зберегти як є.
  - >-
    «batteries — plasma or standard fusion cells» (q8, a70, a72): термінологія
    предметів, узгодити з knowledge/ і не вигадувати паралельних варіантів.

