    evidence: [q2, q5, q7]
    role: >-
      Вуличний торговець питною водою в Ливарні: усі вісім рядків — це викрики-зазивання
      до перехожих плюс одна репліка сам до себе. Розмови як такої немає.
    address:
      npc_to_player: ви
      player_to_npc: н/д
      basis: >-
        Гравець тут не відповідає (жодного a-юніта), тож регістр видно лише з викриків.
        Це обслуга, що зазиває незнайомців на вулиці — STYLE §3.2 дає «ви». Заклики
        безадресні, тому переважно природніше звучатимуть безособові або наказові форми
        множини, а не пряме звертання.
    voice:
      register: гучний вуличний зазивала; короткі рублені вигуки з окличним знаком
      idiolect:
        - "стягнення 'n' замість and; випадання складів — просторічна швидка вимова"
        - "рекламний тон із гарантією: «Guaranteed!»"
        - "q7 випадає з ряду — це втомлена репліка сам до себе, тон інший, не викрик"

