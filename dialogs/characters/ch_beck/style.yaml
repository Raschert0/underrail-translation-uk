speakers:
  - slug: beck
    name: Бек
    units: default
    confidence: certain
    evidence: [q2, q6]
    role: >-
      Ватажок озброєного загону, що вривається в лігво, щоб визволити Сарін і
      помститися за батька. Говорить криком, суцільними наказами й тваринними
      образами.
    relationships:
      - "Сарін — його жінка, яку тримають у лігві (q2, q4)"
      - "Гідеон — його батько, убитий Королем Щурчаків (q3, q5)"
      - "Король Щурчаків — кровний ворог, з яким він веде весь цей обмін"
    address:
      npc_to_player: ти
      basis: >-
        До гравця Бек звертається лише в q6, і це погроза вбити («you
        treacherous worm») — зневага виключає «ви», STYLE §3.2.
      gender_cues: []
    voice:
      register: розлючений крик; короткі наказові речення, капслок
      idiolect:
        - "тваринні образи як лайка: animal, beast, vermin, worm, filthy rats"
        - "повторюване «filthy» (q2, q4, q6) — словесний тик люті"
        - "капслок для крику: «NOW!» (q2) — зберігати як капслок"

  - slug: rathound_king
    name: Король Щурчаків
    units: [q3, q5]
    confidence: certain
    evidence: [q3]
    role: >-
      Господар лігва, що зустрічає нападників глумливим сміхом. Тримає себе як
      той, хто вже переміг, і б’є не погрозами, а описом смерті Бекового батька.
    relationships:
      - "Бек — син убитого ним Гідеона; глузує з нього адресно"
    address:
      npc_to_player: ти
      basis: >-
        Звір-ватажок без жодної ввічливої дистанції; глузливо-зверхній тон до
        всіх присутніх — STYLE §3.2.
      gender_cues: []
    voice:
      register: глибокий, глузливий, розважливо-жорстокий
      idiolect:
        - "удавана похвала перед ударом: «Well done!»"
        - "розтягнута пауза перед найжорстокішим словом: «slowly... disemboweling»"
        - "мова про свій рід: «my own kind», «us» — він мислить себе часткою зграї"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; тут q1, а також вставні ремарки в q2, q3, q6"

new_names: ["Gideon", "Rathound King"]

idioms:
  - unit: q3
    src: "Gideon's wretched spawn"
    note: "«spawn» тут — зневажливо про людське потомство, не про ікру чи появу"
  - unit: q5
    src: "hated us with his whole black heart"
    note: "образ книжний і навмисно пафосний — не зводити до «дуже ненавидів»"
  - unit: q6
    src: "let's get this over with"
    note: "стала розмовна формула «покінчімо з цим»; не калькувати послівно"

pitfalls:
  - >-
    Головна пастка вузла: q4 звучить як звинувачення на адресу Короля
    Щурчаків — отже, це говорить Бек, а не той, кого названо. Так само q3
    згадує Бека, але належить Королю.
  - >-
    «Rathound King» — glossary дає rathound → щурчак, але сам титул канонічно
    не закріплений; винесено в new_names, не вигадувати на місці.
  - >-
    q2 і q6 містять розлогі вставки нарації всередині репліки — усередині
    одного юніта співіснують «ти» персонажа і «ви» нарації.
  - >-
    a7 — єдина репліка гравця, підказка дії ::Fight!::, отже інфінітив,
    STYLE §3.5.

examples:
  - unit: q6
    rule: "капслок як крик — зберігати, STYLE §4"
    uk_fragment: "ЗАРАЗ ЖЕ!"
    status: proposed
