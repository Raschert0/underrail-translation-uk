speakers:
  - slug: milton
    name: Мілтон
    units: default
    confidence: certain
    evidence: [a24, q2]
    role: >-
      Озброєний одинак, що отаборився в печерах і тримає гравця на мушці від
      першої репліки. Йому потрібен ключ від скрині з тіл двох загиблих; платить
      п’ятдесят харонів і торгується лише під загрозою.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний, панібратськи-погрозливий мовець: гендерне звертання
        $(#buddy/girl), пряма лайка «you dirty rat», «worm», обіцянка «a bullet
        between your eyes». Гравець дзеркалить тим самим регістром — «don’t
        shoot, man», «Sorry, buddy, no deal», «doing business with ya».
      gender_cues: ["$(#buddy/girl)", "$(#gentlemen/human beings)"]
      switches:
        - {unit: q47, to: ти, trigger: "удавана ввічливість «both civilized $(#gentlemen/human beings)» — не перехід на «ви», а іронічна показна чемність усередині того самого «ти»"}
    voice:
      register: спокійна, контрольована погроза; рівний тон навіть у момент, коли цілиться
      idiolect:
        - "нарація q2 прямо задає ключ: «a voice that seems rather calm and relaxed considering the tense situation» — погрози звучать буденно, без крику"
        - "«none of your business» як відмова-рефрен (q8, q35); повторне питання обриває різко (q37)"
        - "зірочки навколо наголошених слів — авторська розмітка наголосу, зберігати: «*yes* it is», «*waiting*»"
        - "у q22 голос свідомо грубішає — нарація це називає («drops in pitch and becomes grittier»); контраст із базовим спокоєм має читатися"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1, навіть там, де Мілтон у тій самій репліці
    каже «ти» (q2, q13, q15, q22, q47, q51).

