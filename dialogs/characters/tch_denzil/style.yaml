  - "Praepostor"
  - "Lunatics"
  - "Emporion"

idioms:
  - unit: q41
    src: "Are your ears vestigial?"
    note: >-
      біологічний жарт (рудиментарний орган), а не «глухий»; зберегти саме
      псевдонауковий регістр — це його фірмова зневага
  - unit: q41
    src: "Now buzz off!"
    note: >-
      грубе «згинь»; гравець підхоплює це слово в a42 і a88 — переклад мусить
      бути той самий у всіх трьох місцях, бо на ньому тримається перепалка
  - unit: q45
    src: "turning into a ball of plasma"
    note: "розгорнута наукова гіпербола нарації, зберігати образ, не згортати в «розлютився»"
  - unit: q73
    src: "as mentally derailed as one can be"
    note: "залізнична метафора («зійшов з рейок») доречна у світі Underrail — не втрачати"
  - unit: a56
    src: "the damn figurine"
    note: "лайка гравця; грубе лишається грубим, STYLE §9"

pitfalls:
  - "$(context.player.Name) у q2, q19, q63 (тричі в одному юніті), a62 — не відмінювати всередині плейсхолдера; будувати фразу так, щоб ім’я стояло в називному"
  - "q12, q19, q21, q22, q29, q45, q61, q69, q99 містять літеральний \\n\\n — зберігати"
  - "Institute of Tchort → «Інститут Тчорта», Faceless → «Безликі», Foundry → «Ливарня», scavengers → «шукачі» (глосарій)"
  - "Underrail у a88 лишається латиницею й не відмінюється (глосарій)"
  - "«Tchort is evolution» / «Evolution is Tchort» (q21, q22, q36) — обрядова формула-дзеркало; переклад має лишатися оборотним в обидва боки"
  - "«Tchort guide you» / «Tchort guide me» (q26, q27, q63) — та сама формула у двох особах, узгодити"
  - "a56 ::[Intelligence]:: — назва здібності в дужках, з глосарію, не перекладати вільно"
  - "q48 $(#brother/sister) — гендер ГРАВЦЯ, не Дензіла; кличний відмінок в обох гілках"

