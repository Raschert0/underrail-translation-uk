speakers:
  - slug: denzil
    name: Дензіл
    units: default
    confidence: certain
    evidence: [q32, q8, q22]
    role: >-
      Ефрейтор Інституту Тчорта, що стереже вхід і командує рясофорами у дворі.
      Нервовий, зверхній службовець під тиском: провалене доручення з викраденою
      фігуркою робить його дратівливим із кожним, хто затримує його час.
    relationships:
      - "рясофори у дворі — підлеглі; з ними він на «брате» й уривчастими наказами"
      - "Eidein — засновник Інституту, згадується з побожністю"
      - "медіант — вища ланка, до якої Дензіл мусить іти по дозвіл"
      - "Lunatics — зневажені вороги, постійний об’єкт лайки"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службовець при виконанні, що говорить із невідомим цивільним: канцелярські
        формули «I am not at liberty to reveal that information to you», «you are
        standing at the entrance to Institute of Tchort», холодний наказовий
        «Do not speak to me unless you have the figurine» — STYLE §3.2 дає «ви».
        Гравець дзеркалить (§3.3). Звертання $(#brother/sister) у q48 — орденська
        формула ордену, а не панібратство, і базу не змінює.
      gender_cues: ["$(#brother/sister)"]
      switches:
        - {unit: q41, to: ти, trigger: "зрив у відкриту зневагу — «Are your ears vestigial?», «Now buzz off!»"}
        - {unit: q43, to: ти, trigger: "лайка в обличчя — «some inbred bastard»; повертається до «ви» вже в q45, коли охолоне"}
    voice:
      register: напружений службовий; від сухої формальності до вибуху й назад
      idiolect:
        - "«Magnificent Tchort!» — божба-вигук, словесний тик (q15, q43, q87); тримати той самий український відповідник усюди"
        - "cull / culling — його фахове слово про вбивство, не пом’якшувати до нейтрального «знищити»"
        - "лайка через «devolved», «inbred» — біологічна зневага, ключова для його голосу"
        - "розділяє слова крапками для натиску: *We. do. not. accept. new. members!*"
        - "обриви на пів слові, коли себе спиняє: «Yo-- ::He pauses.::», «Tchort gu-- Bah!»"

  - slug: rassophore_guard
    name: рясофор із варти
    units: [q21, q23, q26]
    confidence: certain
    evidence: [q21, q22]
    role: >-
      Середній із трьох вартових, що доповідає Дензілові про безрезультатний
      пошук. Виструнчений підлеглий: звертається «Efreitor», говорить коротко
      й винувато.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Говорить не до гравця, а до Дензіла — сцена спостерігається збоку. До
        командира — підкреслено субординаційне «ви»; ця розмова гравця не
        стосується, тож регістр звертання до гравця тут не реалізується.
    voice:
      register: уставний, стислий, з нотою виправдання
      idiolect:
        - "«I'm afraid not, Efreitor» — уставна ввічливість підлеглого"

narration:
  present: true
  note: >-
    Розлогі описові блоки (q8, q18, q29, q45, q55, q61, q92) — «ви» без
    винятків, STYLE §3.1. Це найдовші юніти файлу і несуть основну характеристику
    Дензіла; писати літературною прозою, не телеграфно.

