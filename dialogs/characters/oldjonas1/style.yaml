speakers:
  - slug: old_jonas
    name: Старий Йонас
    units: default
    confidence: certain
    evidence: [q2, q210, q211]
    role: >-
      Старий шукач-мандрівник із ССГ, торгує зібраним мотлохом і виступає
      усним довідником про тунелі, істот і Глибокі Печери. Говорить як бувалий
      оповідач біля багаття, тому його репліки — суцільна розмовна мова, а не
      довідкова стаття.
    relationships:
      - "Гравця називає youngster — поблажливо-тепле звертання старшого"
      - "Блейн — давній приятель, про якого Йонас говорить неохоче й з підозрою (q182, q193)"
      - "Таннер — авторитет станції, Йонас його рішення визнає (q123)"
      - "Паскуале — «Doc», лікар станції, згадується з повагою (q201)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Свій, вуличний, панібратський тон — STYLE §3.2. Постійне «youngster»,
        випадання g, «ya dig», груба відсіч «Get out of my sight». Гравець
        дзеркалить, звертаючись «old man» і «old geezer» (a15, a27, a162).
      gender_cues: []
      switches: []
    voice:
      register: >-
        просторічний, теплий, балакучий; оповідач-хвалько, що легко переходить
        на різкість, коли його дражнять
      idiolect:
        - "суцільне випадання g — runnin', scavengin', crawlin', throwin': відтворювати розмовністю (нема чого «докать»), а не апострофами на кожному слові"
        - "«ya dig?» / «Dig?» — повторюване перепитування, тримати один сталий український відповідник у всіх юнітах (q58, q191, q202)"
        - "«youngster» — стале звертання, теж один відповідник на весь вузол"
        - "«'cause» замість because, «ain't», «somethin'/nothin'/anythin'» — знижений регістр, не вирівнювати до літературного"
        - "у розповіді про Глибокі Печери (q79–q93) — довгі речення з вставками «як я казав», зберігати збивчивість"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1, попри те що сам Йонас каже «ти». Стосується
    q1, q2, q12, q26, q33, q35, q76, q96, q101, q121, q150, q180, q182, q190,
    q211. Підказки дій у репліках гравця — інфінітив (§3.5): a28 «::Leave without
    saying a word.::», a44 і a207 «::Barter.::», a106 «::Listen intently.::».

