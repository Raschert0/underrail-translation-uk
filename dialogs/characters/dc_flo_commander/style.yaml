speakers:
  - slug: flo_commander
    name: командувач Безликих
    units: default
    confidence: certain
    evidence: [q48, q33, q224, q34]
    role: >-
      Командувач загону Безликих у Глибоких Печерах; вимагає в гравця Куб і
      веде всі перемовини від імені свого народу. Говорить синтезованим голосом
      і майже завжди від «ми», а не від «я», — це головне, що визначає добір слів.
    relationships:
      - "Безликі (Безликі — фракція, registry) — його народ, він мовить від їхнього імені: «We made us», «our goals»"
      - "Лора Бейкер — полонена/врятована, яку він погоджується повернути до ССГ (q198, q251)"
      - "Ейдейн і Тчорт — предмет аналітичних монологів q82–q102, ставлення холодно-дослідницьке"
      - "Rahm-Umbra — союзник, про якого говорить із рідкісною для себе повагою (q139, q141)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Мовець максимально формальний і дистанційований: майже повна відсутність
        скорочень («We cannot allow that», «You may not receive a further answer»,
        «I am telling you what you need to know»), книжковий синтаксис, звертання
        на повне ім'я через $(context.player.Name). Це службово-офіційний голос
        (STYLE §3.2 — формальні на «ви»). Репліки гравця дзеркалять базовий
        регістр — «ви» (STYLE §3.3), навіть у грубих зривах на кшталт q243 і a261:
        це емоція, а не зміна регістру.
      gender_cues: []
      switches: []
    voice:
      register: >-
        холодний, аналітичний, беземоційний; мова наукового звіту, а не розмови
      idiolect:
        - "стале «ми» замість «я» — Безликі мислять колективно: «We know», «our goals», «we grieve»"
        - "модальне may як дозвіл, а не можливість: «You may ask», «That I may not say», «but further than that I may not go» — це відмірювання дозволеного, і в українському має лишатися дозволом, а не ввічливістю"
        - "категоричне однослівне заперечення на початку репліки: «No.», «Correct.», «Unnecessary.», «Possibly.», «Yes.» — рубані речення не зрощувати з наступним"
        - "наказовий спосіб без пом'якшення: «Speak.», «Leave.», «Ask.», «Take this.» — одне слово, крапка"
        - "термінологізована лексика замість побутової: «unit», «data», «neural activity», «assignment» — не заміняти розмовними синонімами"
        - "жодних скорочень у власній мові (cannot, do not, we are not); поодинокі «aren't», «haven't», «I'm afraid» (q157, q166, q220) — свідомі проблиски, не згладжувати в жодний бік"

narration:
