  - unit: q102
    src: "Every mind is more than the sum of its parts"
    note: "усталена формула «більше, ніж сума складників» — не перебудовувати"
  - unit: q84
    src: "One's intentions are best understood through observing one's actions"
    note: "сентенція-максима; безособова побудова, без «ви»/«ти»"
  - unit: q86
    src: "under the mask of secrecy"
    note: "образ маски навмисний — Безликі й тчортисти обидва закриті; зберегти"
  - unit: q126
    src: "Memories could have been imprinted in your mind"
    note: "«imprinted» тут технічно — про втручання в пам'ять, не «відбилися»"
  - unit: a134
    src: "a.k.a ACoNR"
    note: "скорочення «a.k.a» розгортати українською («відомий як»), абревіатуру ACoNR лишати як є"

pitfalls:
  - "q248 містить $(context.player.Name) — не відмінювати всередині плейсхолдера; будувати фразу так, щоб ім'я лишалося в називному"
  - "у джерелі немає жодного $(#…) — але українське минуле й прикметники гендеровані, тож плейсхолдери доведеться ДОДАВАТИ (STYLE §2): q221 «you helped him», q244 «You have fully cooperated», q257 «You have cooperated», a63 «I just defeated», a192 «I have already been»"
  - "«the Cube» у джерелі непослідовне: то з великої (q68, q155), то з малої (q37 «the cube», q186, q188, q211) — в українському тримати один варіант"
  - "Underrail і Biocorp — латиницею, не відмінювати (глосарій); «Lower Underrail» у q243 і «South Underrail» у q114 будувати як «Нижня Underrail», «Південна Underrail»"
  - "SGS → ССГ, South Gate Station → Станція Саут-Гейт (глосарій); в a55 і a197 стоїть SGS, в a201 — повна назва: різні форми в джерелі, різні й у перекладі"
  - "Deep Caverns → Глибокі Печери, Core City → Центральне Місто, Institute of Tchort → Інститут Тчорта, Tchort → Тчорт, Oculus → Окулус, Faceless → Безликі, Tunnelers → Тунельники (глосарій)"
  - "Tchort у джерелі послідовно «it», а не «he» (q88, q90, q170) — знеособлення навмисне; українське «Тчорт» чоловічого роду, тож дистанцію тримати лексикою, а не займенником"
  - "q252 «a quadrupedal» — це чотириногий Безликий-істота, а не прикметник; іменник"
  - "q168 «the unit» означає організм, а не підрозділ; у q251 «tunneler units» — навпаки, загін"
  - "\\n\\n у q3, q13, q30, q33, q39, q48, q99, q126, q141, q155, q224, q236, q248, q251, q252 — літеральна послідовність, копіювати як є"
  - "q236 закінчується \\n\\n перед <end> — порожній хвіст зберегти"
  - "лапки в джерелі прямі (\"the Cube\", \"knew\") — в українському « » (STYLE §4)"
  - "q13 і q154 мають пробіл перед <end> — не «чистити»"
  - "a109 має подвійний знак питання («events??») — авторська недбалість джерела, відтворювати не треба"

