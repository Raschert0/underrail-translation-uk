speakers:
  - slug: nicolas
    name: Ніколас
    units: default
    confidence: certain
    evidence: [q86, q2]
    role: >-
      П’яний робітник Ливарні, який ненавидить власну дружину Олівію й наймає
      гравця вбити її так, щоб це скидалося на нещасний випадок на виробництві.
      Мова розсипається від алкоголю: обірвані фрази, самовиправлення, гикавка.
    relationships:
      - "Олівія — дружина, двадцять років шлюбу; говорить про неї виключно з ненавистю («that muck-woman», «that witch»)"
      - "мер — згадує його страхову виплату за смерть на роботі як мотив"
      - "Мессер — сусід зі свинями; привід для п’яного реготу (q76)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Грубий, панібратський, з місця переходить на образи («idiot», «you
        dimwit», «Get lost»). Найманця для вбивства він тримає за свого —
        STYLE §3.2, «свої, вуличні — ти».
      gender_cues: ["$(#man/woman)", "$(#He/She)"]
      switches:
        - {unit: q16, to: ти, trigger: "єдиний момент ділової зібраності — тон твердішає, але регістр не змінюється"}
    voice:
      register: п’яний, брутальний, розхристаний
      idiolect:
        - "нав’язливе «you» причепкою в кінці звертання: «Nice to meet you, you.», «Bye, you!» — п’яний тик, відтворити українським зайвим «ти» на місці, де воно не потрібне"
        - "«Golden» як схвалення (q12, q21, q42) — місцевий сленг Ливарні, той самий, що й в Олівії; тримати один відповідник у всьому вузлі"
        - "«muck», «mucked up», «Muck damn!» — цензурний замінник лайки; має лишатися лайкою, не пом’якшувати (STYLE §9)"
        - "«pffft», «he-he», «Upffff» — звуконаслідування, передавати українськими"
        - "самовиправлення й переставляння слів: «I don’t wanna vomit in my die... pffft... die in my vomit.»"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; вставки ::hic.::, ::He points to the door.::, довгий опис q82"

