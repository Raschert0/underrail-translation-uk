speakers:
  - slug: hanna
    name: Ганна
    units: default
    confidence: certain
    evidence: [q3, q25]
    role: >-
      Ефрейторка Інституту Тчорта, комірниця зброярні «Preservation»; молода,
      народжена в Інституті й щиро ним захоплена. Продає спорядження й видає
      гравцеві обрядову рясу перед посвятою.
    relationships:
      - "Mediant Samuel — прямий командир; про нього говорить із пієтетом, «His Notability»"
      - "Nevil — рясофор, якого шукають; для неї просто мовчазний клієнт зброярні"
      - "Harmost Stavros — «His Excellency», найвища ланка, зараз у Глибоких Печерах"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова особа при видачі майна, що діє «under Mediant Samuel's direct
        orders» і озвучує розпорядження начальства (q5, q54, q56), — STYLE §3.2
        дає «ви». Її теплота виражена лексикою («Hey», «Lucky you», сміх), а не
        зміною регістру; гравець дзеркалить (§3.3). Увага: звертання гравця
        «sister» (a49) і «See ya later, Hanna» (a51) — орденське побратимство,
        а не перехід на «ти».
      gender_cues: ["$(#him/her)"]
    voice:
      register: світлий, жвавий, службово-привітний
      idiolect:
        - "нав’язливе totally / totally apex — головний словесний тик (q16, q26, q28, q29, q34, q43, q53); потрібен ОДИН стабільний український відповідник-паразит, що працює і як прислівник, і як окреме «Totally.»"
        - "apex — її оцінне слівце найвищої похвали, окреме від totally; тримати сталим"
        - "молодіжна недбалість проривається крізь службову мову: «that I ain't got a clue», «Gotta», «Hey»"
        - "часто називає співрозмовника на ім’я — ознака привітності, зберігати всі входження"
        - "сміх і хихотіння в нарації — її наскрізна характеристика (q42, q43, q45, q48)"

narration:
  present: true
  note: >-
    ::She nods.::, ::She chuckles.::, ::She waves at you.:: та розгорнутий
