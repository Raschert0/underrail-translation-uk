  - "q3, q9, q10, q11, q12, q14, q16, q39, q57 містять літеральний \\n\\n — зберігати"
  - "Institute of Tchort → «Інститут Тчорта», Faceless → «Безликі», charons → «харони», Deep Caverns → «Глибокі Печери» (глосарій)"
  - "South Underrail / Upper Underrail — Underrail лишається латиницею й не відмінюється; означення українською («Південна Underrail»)"
  - "a20 ::[Mercantile]:: — назва навички в дужках, з глосарію"
  - "q14 містить пряму цитату з інструкції в лапках — усередині цитати технічний, знеособлений регістр, відмінний від голосу Ганни"
  - "«Tchort is evolution» / «Evolution is Tchort» (q3, a4) — обрядова формула-дзеркало, узгодити з dialogs/characters/tch_denzil"
  - "Ганна — жінка: минулий час і прикметники в її репліках жіночого роду; «Efreitor Hanna» — жіноча форма звання"

