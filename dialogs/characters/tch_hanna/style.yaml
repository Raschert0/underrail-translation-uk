idioms:
  - unit: q16
    src: "that I ain't got a clue"
    note: >-
      різкий спад у просторіччя посеред службової мови — свідомий контраст,
      не вирівнювати в нейтральне «не знаю»
  - unit: a41
    src: "I hope I have your divided attention!"
    note: >-
      каламбур на мітозі: undivided attention (нероздільна увага) проти поділу
      клітини. Калька не спрацює — потрібен український каламбур на «поділ/
      неподільний», і він мусить лишити впізнаваним обрив «Undivid--» у q43
  - unit: q25
    src: "Institute-born here."
    note: "самопредставлення однією фразою, не розгортати в підрядне речення"
  - unit: q29
    src: "totally apex armory"
    note: "не описувати як «чудова» — це саме її сленгове слівце, а не оцінка"
  - unit: q11
    src: "one of their most apex hours"
    note: "apex тут витісняє звичне «finest hours» — зберегти неоковирність її мови"

