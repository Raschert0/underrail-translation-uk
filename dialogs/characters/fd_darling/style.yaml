pitfalls:
  - >-
    q40 містить $(context.player.Name) — плейсхолдер не відмінювати й не чіпати
    всередині; речення будувати так, щоб ім’я стояло в називному.
  - >-
    Прощання q37 має ІНШИЙ плейсхолдер — $(#chief/sis), скорочений, тоді як
    решта вузла вживає $(#chief/sister). Різницю зберегти: коротша, тепліша
    форма на прощання.
  - >-
    q32–q35 — взаємовиключні гілки про Бейта: у q32/q33 він зрадник («that...
    pig»), у q34/q35 він душа компанії. Це різні стани квесту, тому тон
    вирівнювати між ними НЕ можна.
  - >-
    q29 називає Трентона іменем «Corben» — це та сама людина. Не «виправляти»
    розбіжність і не зводити до одного імені.
  - >-
    Глосарні одиниці: Free Drones → Вільні Дрони, Protectorate → Протекторат,
    Junkyard → Звалище, Underrail — лишається латиницею й не відмінюється.
  - >-
    q19 «Yerslovekzdinianschnik Slavorad Kokoschka» — навмисно непроговорюване
    ім’я, весь жарт у його довжині. Українська форма має лишитися так само
    важкою для вимови; прізвище Кокошка канонічне.

