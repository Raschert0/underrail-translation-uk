speakers:
  - slug: darling
    name: Дарлінг
    units: default
    confidence: certain
    evidence: [q38]
    role: >-
      Джулія Дарлінг, кухарка осередку Вільних Дронів і головне джерело чуток
      про всіх його мешканців. Утратила родину через Протекторат і тепер годує
      тих, хто воює; говорить тепло, з утомленою іронією.
    relationships:
      - "Кокошка — закоханий у неї; вона вивчила напам’ять його довге ім’я (q19, q20, q21)"
      - "Бекет — тутешній торгівець, з якого вона по-доброму кепкує за хвальбу (q16, q17)"
      - "Гатч — загиблий або втрачений товариш, про якого вона говорить із жалем (q13, q14)"
      - "Марселла, Бейт, Трентон — керівники осередку, про яких вона розповідає (q26–q35)"
      - "Мора — повернулася зі Звалища завдяки гравцеві (q23, q24)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вона зве гравця $(#chief/sister) чотирнадцять разів, вітає як свого
        («Look who decided to pay us a visit»), одразу пропонує їсти й ділиться
        родинною історією без запиту — STYLE §3.2, своя, панібратська. Гравець
        дзеркалить, прощаючись просто «Bye, Darling» (a36).
      gender_cues: ["$(#chief/sister)", "$(#chief/sis)"]
    voice:
      register: теплий, балакучий, з утомленою іронією; кухонна прямота
      idiolect:
        - "«Heck» як постійний пом’якшувач замість лайки (q2, q10, q21, q23, q27, q33, q35, q37) — головний словесний тик"
        - "«Cans» — її зневажлива назва солдатів Протекторату"
        - "саморедагування вголос: «Everything is... was» (q6), «Ignore that last comment» (q17)"
        - "розмовне стягнення «ya» в кінці фрази: «pleasure to meet ya» (q38)"
        - "риторичне «I don't know» після власної похвали (q8) — самоприниження як звичка"

