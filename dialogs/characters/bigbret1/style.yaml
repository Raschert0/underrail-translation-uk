speakers:
  - slug: big_bret
    name: Великий Брет
    units: default
    confidence: certain
    evidence: [q152, q34, q99, q101]
    role: >-
      Завідує агрономічним сектором ССГ і розведенням стрибунів; для новоприбулого
      гравця це перший наставник, який роздає чорну роботу й повчає. Говорить як
      практик, що пишається своєю справою: «I'm feeding the station».
    relationships:
      - "Ньютон — молодий підлеглий, якого Брет послав по стрибунів і за якого переживає"
      - "Таннер — начальник станції; спершу Брет ним захоплюється (q164), після зникнення різко зневажає (q128)"
      - "Патрік Пірс — покійний технік, з яким Брет сварився через обігрівачі (q53, q54)"
      - "Ленокс — намагався його вбити (q147); Лора після того лежить у медпункті (q148)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        STYLE §3.2 прямо зараховує Великого Брета до «своїх, вуличних». Текст це
        підтверджує: панібратське звертання на ім’я з першої репліки, лайка
        («freakin'», «bastards», «son of a hopper's ass»), випадання звуків
        («Give 'em here», «gonna»), прямі накази («So get going and don't come
        back without those hoppers»). Репліки гравця дзеркалять базу — «ти»
        (STYLE §3.3), навіть у зухвалих відповідях на кшталт a159.
      gender_cues: ["$(#boy/girl)"]
      switches:
        - {unit: q162, to: ти, trigger: "«citizen» — жартівлива офіційність усередині «ти», не перехід на «ви»"}
    voice:
      register: гучний, панібратський, повчальний; говорить як господар свого господарства
      idiolect:
        - "тик «What can I do you for?» — навмисна перекрутка «What can I do for you?»; повторюється у q151, q156, q158, q162, q166, q168, q172, q177"
        - "формула-погодження «So be it!» тричі поспіль (q34, q36, q38) і варіант у q40 — має звучати однаково"
        - "розмовні стягнення: «gonna», «'em», «should've», «couldn't have been easy»"
        - "риторичні звороти-заповнювачі на початку репліки: «Well…», «So anyway…», «Oh, I see, I see»"
        - "пафос про власну роботу: «this is serious work», «maybe the most important»"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1, попри те що сам Брет каже «ти». Юніти нарації:
    q20, q34, q99, q101, q124, q131, q160. Підказка дії a11 «::Barter.::» — інфінітив
    за STYLE §3.5, канонічно «::Торгувати.::» (глосарій).

new_names: ["Pat", "Huey", "Dewey", "Louie", "Celeritas River", "Isaac's River", "the Pens", "the Union", "Athos", "Porthos", "Aramis", "Epicurus", "Schopenhauer", "Nietzsche"]

idioms:
  - unit: q151
    src: "What can I do you for?"
    note: >-
      Не питання, а словесний тик — перекручене «What can I do for you?».
      Потрібна ОДНА стала українська перекрутка на всі вісім входжень: беремо
      звичну ввічливу формулу й ламаємо в ній керування (знахідний замість
      давального), щоб схибленість чулася, а зміст лишався прозорим. Нейтральне
      «Чим можу допомогти?» знищує тик — так перекладати не можна.
  - unit: q54
    src: "for crying out loud"
    note: "не калькувати; розмовний вигук роздратування, «на Бога», «чорт забирай»"
  - unit: q128
    src: "one lying son of a hopper's ass"
    note: >-
      лайка, вигадана під місцеву фауну — стрибуна зберегти, не підміняти
      звичайним українським прокльоном; грубе лишається грубим (STYLE §9)
  - unit: q110
    src: "They are speedy little bastards"
    note: "не пом’якшувати до «створіння»; це схвальна грубість мисливця"
  - unit: q174
    src: "we need all capable hands to pull their weight"
    note: "локалізувати ідіому — «тягнути свою лямку», а не калькувати «вагу»"
  - unit: q13
    src: "Give 'em here."
    note: "стягнення передає розмовність — коротка проста форма, не «Передайте їх мені»"
  - unit: q42
    src: "Suit yourself."
    note: "не «вдягайся сам»; розмовне «як хочеш», «діло твоє»"
  - unit: a159
    src: "It was a breeze."
    note: "ідіома легкості — «як два пальці», не «це був вітерець»"
  - unit: q78
    src: "I'm not sold on that"
    note: "не калькувати «не проданий»; «не дуже в це вірю»"
  - unit: q160
    src: "you're the next Tanner"
    note: "не пояснювати — сарказм тримається саме на імені"
  - unit: q146
    src: "the errand $(#boy/girl) of this station"
    note: "усталений зворот «на побігеньках»; гендер розводиться плейсхолдером"

pitfalls:
  - "q1, q150, q152 містять $(context.player.Name) — не відмінювати всередині плейсхолдера й не додавати закінчень ззовні"
  - "q3 і q4 — одна розірвана фраза: q3 закінчується на «Now,», q4 починається з пробілу (« you've heard of…»). Те саме з q140, q142, q144. Переклад має лишитися незавершеним фрагментом, який стикується, а не окремим реченням; початковий пробіл зберегти"
  - "зірочки авторського наголосу — розмітка тексту, зберігати: *you* (q128), *that* (q137), *something* (q140, q142), *and* (q164)"
  - "буквальні \\n\\n у q54, q78, q83, q90, q99, q108, q110, q111, q152, q156, q158, q162 — переносити як є; q111 закінчується \\n\\n перед <end>"
  - "кінцевий пробіл перед <end> у q68, q69, q72, q105, q136, q145, q176 — не прибирати"
  - "q76 і q88, q77/a89 і q90 проти q78 — майже дублікати з дрібною різницею у фіналі (q78 «I'm not sold on that» проти q90 «I'm not sure I believe that»). Перекладати паралельно, але різницю зберегти"
  - "q34, q36, q38 — та сама відповідь «So be it!»; має бути дослівно однаковою в усіх трьох, інакше зникає комічний повтор"
  - "клички стрибунів (a33, a35, a37, a39) мусять читатися як імена тварин, а не як опис страв чи перелік філософів"
  - "«mail» тут — внутрішньостанційна пошта (q1, q139, q140, q142, q144); «e-mail» у q144 — той самий об’єкт, тримати один термін"
  - "«burrower issues» (a68) — про копак (глосарій), не про будь-яких землериїв"
  - "«Camp Hathor» → «Табір Хатор», «Mushroom Cove» → «Грибна Бухта», «Crossroad Watch» → «Перехресна Варта», «Deep Caverns» → «Глибокі Печери», «Meatway» → «М’ясний Шлях», «Junkyard» → «Звалище» — глосарій, не перекладати наново"

