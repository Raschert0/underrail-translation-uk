pitfalls:
  - >-
    ГОЛОВНЕ: комізм персонажа тримається на помилках слов’яномовного в АНГЛІЙСЬКІЙ —
    випадання дієслова-зв’язки («It good puschka», «I not talk», «My money safe»),
    брак артиклів, хибні форми («I was fool six times»). В українській ці помилки
    зникають самі собою. Ламаність треба відтворювати іншими засобами
    (плутанина відмінків і роду, кальки, надлишкові вказівні слова), а НЕ лишати
    рядок гладким. Це рішення для всього вузла, не для окремих реплік.
  - >-
    Слова-паразити «errr», «ehehe», «how you say» — фірмовий тик, трапляються десятками.
    Тримати єдиний варіант кожного від початку до кінця вузла.
  - >-
    Вигадана мова «Батьківщини» (q1, q4, q43, q81, q104, q251-q253, q341, q346, q352)
    НЕ перекладається — це псевдослов’янська тарабарщина. Транслітерувати кирилицею,
    зберігаючи звучання; змісту в ній немає.
  - >-
    q259-q267: гра «polydrome/palindrome» — Кокошка не вимовляє слово. Ланцюжок
    q261, q263, q265 — це послідовне наближення до правильної форми; перекручення
    мають ступенево наближатися до «паліндром», інакше сцена розсипається.
  - >-
    q259: «"griz" means "to bite"» — етимологічне пояснення назви grizozirg.
    Українське «гриз-» працює, але пояснення має лишитися послідовним із тим,
    як транслітеровано саму назву.
  - >-
    Персонаж відверто сексистський (q232, q233, q291, q324, q379). STYLE §9:
    грубе лишається грубим — не пом’якшувати й не іронізувати від себе.
  - >-
    q5, q30, q275, q301, q336, q370, q388 містять $(context.player.Name);
    q58 і q69 — $(context.npc_fd_kokoschka_moneyForExchange). Усередині плейсхолдера
    нічого не відмінювати; будувати фразу так, щоб називний відмінок не різав.
  - >-
    Термінологію брати з глосарію: charon → харон, rathound → щурчак, crawler → повзун,
    Free Drones → Вільні Дрони, Protectorate → Протекторат, Core City → Центральне Місто,
    Junkyard → Звалище, Camp Hathor → Табір Хатор. «Underrail» лишається латиницею
    й не відмінюється навіть усередині української фрази.
  - >-
    q112 звернена до Кокошки, а не до гравця — звертання на ім’я вказує на адресата.
    Мовець там — Дарлінг.

