    src: "put you out of your misery"
    note: "усталений евфемізм добивання; український відповідник має лишитися евфемізмом, не прямим «вбити»"

pitfalls:
  - "Позивні в q49 — назви сузір’їв (Vela, Andromeda, Carina, Coma, Sagitta, Ara), і половина з них обірвана: «Sagitt--», «C-carina», «An-dromeda F-five». Українські відповідники мають лишатися впізнаваними саме як сузір’я навіть в обрубаному вигляді — обирати форму так, щоб уламок читався."
  - "Заїкання відтворювати на українському приголосному, а не переносити англійський: «Invad-d-d…», «T-they are dead», «C-carina» — STYLE §9."
  - "Обриви на «--» стоять там, де слово ще можна вгадати: «Perimeter breached at--», «Requesting--», «Com-prom--», «Re-inforcem--m--», «Psycho--phrac--». Український обрив має падати на аналогічно впізнаване місце слова, інакше репліка стає шумом."
  - "«Invaders» у нього — не опис, а стала назва ворога, часто з великої (q49). Один варіант на весь вузол; у q98 і q61 це односкладна репліка-присуд, тож слово має працювати самотою."
  - "«The War» з великої (q26, q81 «The War... is our war.») — конкретна війна, не абстракція."
  - "«cognator» — самоназва (q19 «I... am the cognator»), звучить у вузлі як титул і як вид істоти водночас; у q53 «Cognator compromised» це вже позивний у радіообміні. Потрібне одне слово, що витримує всі три вжитки."
  - "Biocorp — латиниця, не відмінювати (глосарій). Black Sea → Чорне Море (a13, глосарій)."
  - "У a15 в джерелі одрук «Etheral Torch», у a73 правильне «Ethereal Torch» — це той самий предмет, перекладати однаково."
  - "a40 і a41 — дослівно однакові репліки-дублікати; переклад мусить бути ідентичним, інакше в грі буде видно розбіжність."
  - "Теги ::[Psi Empathy]::, ::[Second Sight]::, ::[Debug]:: — UI-мітки: брати готові назви з knowledge/. ::[Debug]:: (a46) — службовий рядок розробників."
  - "У q74–q77 когнатор пропонує передати гравцеві частину керування ротою; «I cannot command them alone» і «Some... I can transfer to you» — військове «командувати», а не «наказувати»."

