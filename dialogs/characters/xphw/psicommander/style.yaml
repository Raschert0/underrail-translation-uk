speakers:
  - slug: cognator
    name: Когнатор
    units: default
    confidence: certain
    evidence: [q19, q20]
    role: >-
      Штучно створений псіонік-командир покинутого комплексу Biocorp: сліпий, у шоломі,
      століттями подумки веде роту таких самих створених солдатів проти сутностей, яких
      називає Invaders. Це визначає все — він говорить не як людина, а як інстанція,
      що звітує про виконання обов’язку.
    relationships:
      - "рота створених солдатів — підпорядковані, чиї думки він чує: «while they have will, my will is supreme»"
      - "взвод «більш незалежних» солдатів — приспані ним після того, як Invaders обернули їх проти своїх"
      - "creators and protectees — зниклий персонал комплексу, перед яким він досі вважає себе відповідальним"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Мова гранично формальна, без жодного скорочення й без побутової лексики; гравець
        звертається до нього «sir» (a32). Службовий, неособистий мовець — «ви» за STYLE §3.2,
        репліки гравця дзеркалять (§3.3).
    voice:
      register: врочистий, уставний, знеособлений; короткі рубані періоди
      idiolect:
        - "лексика обов’язку: duty, command, compromised, requesting, engage, withdraw, displace"
        - "у притомному стані — повні періоди («The invaders, they are ineffable entities»); у маренні розпадається на уламки радіообміну"
        - "жодних скорочень (cannot, do not, I am) — стягнені форми зруйнували б голос"
        - "заїкання й обриви слів у маренні: Invad-d-d…, T-they, Com-prom--, Re-inforcem--m--"

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q3, q5]
    confidence: unknown
    reason: >-
      Це не когнатор. У q3 мовець питає «What happened, partner? You two just suddenly…
      went out», а в q5 каже «he started moving» — тобто говорить про когнатора в третій
      особі й про гравця як про одного з двох, хто знепритомнів. Отже, це третя присутня
      особа (супутник із команди), яку джерело ніде не називає.
    guidance: >-
      Розмовний, стурбовано-дружній тон, «ти» до гравця (звертання «partner»); не
      переносити на нього врочистий регістр когнатора. Уникати форм, що видають рід
      мовця, поки особу не встановлено — перевірити за вузлами екіпажу xphw.

