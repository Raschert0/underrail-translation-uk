speakers:
  - slug: buck_nimble
    name: Бак Німбл
    units: default
    confidence: certain
    evidence: [q105, q128]
    role: >-
      Літній підприємець, двадцять років машиніст Underrail Express, тепер наймає власну
      команду для першої ходки дрезиною в темну територію на північ. Говорить повними
      реченнями, без скорочень і без випадання «g» — це головний контраст із рештою екіпажу.
    relationships:
      - "Wilkos — помічник, «he is like a son to me»; Нимбл довіряє його судженню"
      - "Torrence — найманий кулеметник, приведений Вілкосом; Нимбл терпить його грубість"
      - "Spanner — молодий механік, син давнього знайомого"
      - "четвертий охоронець — мовчазний професіонал, спорядження «не з Coretech»"
      - "Marjorie — новонароджена онука; її іменем названо дрезину"
    address:
      npc_to_player: ти
      player_to_npc: ви
      basis: >-
        Асиметрія прописана в тексті: він раз у раз кличе гравця «kid», а гравець звертається
        «sir» (a101) і «Mr. Nimble» (a58). Старший наймач до молодого найманця — «ти»;
        назад — «ви». STYLE §3.2.
      gender_cues: ["$(#/lady and )gentlemen"]
      switches:
        - {unit: q57, to: ви, trigger: "коли різко зачиняє тему («there is a limit to the depth of inquiry I'm willing to allow») — тон офіційнішає, але базу «ти» не втрачає"}
    voice:
      register: спокійний, поважний, старомодно-ввічливий
      idiolect:
        - "звертання «kid» до гравця — наскрізний тик, ~15 входжень"
        - "формули чемності на місці, де інші лаялися б: «Why thank you», «Very well», «the pleasure is all mine»"
        - "жодного випадання «g» і майже жодних скорочень — свідома протилежність Торренсу"
        - "любить розважливі приказки й обережні формулювання: «I'd rather», «I don't think», «I'm not sure»"

  - slug: torrence
    name: Торренс
    units: [q126, q132, q134, q135, q137, q139, q162]
    confidence: probable
    evidence: [q132, q133]
    role: >-
      Найманий кулеметник, грубий і нетерплячий; єдиний, хто торгується про гроші вголос
      і поводиться з гравцем зневажливо-фамільярно.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: "вулична мова, звертання $(#bud/cheeks) до гравця (q135) — STYLE §3.2"
      gender_cues: ["$(#bud/cheeks)"]
    voice:
      register: грубий, гучний, панібратський
      idiolect:
        - "випадання «g»: turnin', gettin', takin' — відтворювати просторіччям, не пом’якшувати"
        - "'ere замість here, ain't, wanna, yer, yerself"
        - "кличе Нимбла «senior» — власна панібратська кличка, не «сеньйор» і не «сер»"
        - "сексуалізоване «nice cheeks» на адресу гравця (q126) — грубе лишається грубим, STYLE §9"

  - slug: wilkos
    name: Вілкос
    units: [q133, q138]
    confidence: probable
    evidence: [q133, q138]
    role: >-
      Помічник Нимбла, вгамовує Торренса й ручається за нього перед наймачем. Мова
      правильна, без просторіччя — за регістром він ближчий до Нимбла, ніж до Торренса.
    address:
      npc_to_player: невідомо
      player_to_npc: невідомо
      basis: >-
        В обох його репліках він звертається не до гравця, а до Торренса й до Нимбла
        («Mr. Nimble»), тож прямих доказів регістру щодо гравця немає — не домислювати.

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q102, q127, q140]
    confidence: unknown
    reason: >-
      q102 («We're not broken down…») звучить у сцені, де присутні двоє, і жодна ознака
      не вказує, хто саме з них відповідає. q127 — одне слово «Please.» як докір після
      грубості Торренса: так міг обірвати і Нимбл, і Вілкос. q140 — безіменна нарація
      про того, хто спостерігає за суперечкою й хитає головою.
    guidance: >-
      Тримати базовий регістр вузла й нейтральну побудову; уникати форм, що видають рід
      мовця (минулий час, узгоджені прикметники), і не додавати просторіччя, бо помилкове
      приписування Торренсу зіпсувало б контраст регістрів.

narration:
  present: true
  note: >-
    «ви» без винятків, навіть коли мовець у тій самій репліці каже гравцеві «ти» —
    STYLE §3.1. Тут нарація часто вклинюється всередину репліки (q49, q51, q52, q128, q164).

