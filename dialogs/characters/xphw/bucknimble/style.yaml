  - unit: a118
    src: "trouble is my middle name"
    note: "поняття «середнє ім’я» українською не працює — локалізувати ідіому цілком"

pitfalls:
  - "«kid» — наскрізне звертання Нимбла до гравця (q16, q19, q32, q42, q83, q86, q88, q90, q94, q99, q119, q145, q171, q173). Український відповідник на кшталт «малий» має рід, а гравець може бути будь-якої статі: або гендерно нейтральне слово, або $(#…) — і тоді однакове рішення в усіх ~15 місцях."
  - "q125 містить $(#/lady and )gentlemen — masc-гілка ПОРОЖНЯ навмисно. Не заповнювати її; українською порожньою лишається та сама гілка."
  - "«senior» у Торренса (q132, q134, q137, q162) — його кличка для Нимбла, не посада й не іспанське звертання. У q162 вона обривається на «sen--» і виправляється на «Mr. Nimble» — обраний український варіант мусить давати впізнаваний обрив на початку слова."
  - "q162: нарація каже «He approaches Torrence», але зміст репліки («Sorry about earlier, sen--») належить самому Торренсу — у джерелі неузгодженість. Не «виправляти» її в перекладі."
  - "Назви бізнесу в гілці q19–q40 (BuckRail, Dark Territory Express, Nimble Transit, Regioline, N.I.M.B.L.E., Marge Travel, Upper Rail, ReRailed Territory, South-North Railway) — вигадані бренди, кожен із яких Нимбл далі коментує по суті: акронім у a31 він відкидає саме як акронім, ReRailed у q38 — за натяк на будівництво, а не перевезення. Переклад назви і переклад коментаря треба узгоджувати парами."
  - "Underrail, Underrail Express, Biocorp, Coretech — латиниця, не відмінювати (глосарій)."
  - "Core City → Центральне Місто, charons → харони (глосарій)."
  - "Теги перевірок ::[Electronics]::, ::[Persuade]::, ::[Strength]:: — це UI-мітки навичок: брати готові назви з knowledge/, а не перекладати на місці."
  - "«dark territory» — наскрізний термін вузла (q25, q108, q130, q144, q145, q159) і водночас можлива назва бізнесу (a24). Один варіант на весь вузол."
  - "У q108 протиставлені North / South Upper Underrail — «Upper Underrail» тут топонім, а не опис."

