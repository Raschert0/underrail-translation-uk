speakers:
  - slug: rag
    name: Ганчірка
    units: default
    confidence: certain
    evidence: [q115, q123]
    role: >-
      Торговець забороненою зброєю з підвалу в Центральному Місті, з навушниками у вухах
      і ломом під рукою; вербує гравця на терор проти звичайних містян, яких зве «cogs».
      Кожна його репліка або продає товар, або проповідує цю ідею — іншого регістру в нього немає.
    relationships:
      - "зонери-покупці в його крамниці — зневажає їх, «buncha zoners perpetually zonin' all round»"
      - "Jon the Beautiful — той, хто здав гравцеві його таємницю (a146, q147)"
      - "мутант із каналізації — набив йому татуювання, з яких «все почалося» (q36)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вулична мова без жодного винятку, звертання «man», «dude», «pal», гендерне
        $(#fella/doll) до гравця (q42, q103). STYLE §3.2 — свій, грубий, вуличний;
        репліки гравця дзеркалять базовий регістр (§3.3).
      gender_cues: ["$(#fella/doll)", "$(#Hello/Heya)"]
      switches:
        - {unit: a56, to: ви, trigger: "гравець уперше відкривається як оперативник JKK — можливий свідомий перехід на офіційний регістр"}
        - {unit: a59, to: ви, trigger: "формула затримання від імені Praetorian Security — українською арешт природно звучить на «ви»"}
        - {unit: a61, to: ви, trigger: "заява від імені Coretech"}
        - {unit: a73, to: ви, trigger: "заява від імені Протекторату, з відкритою погордою до співрозмовника"}
    voice:
      register: збуджений, крикливий, вуличний; стрибки від захвату до люті в межах одної репліки
      idiolect:
        - "суцільне випадання «g»: collectin', gearin', zonin', turnin' — просторіччя тримати наскрізно, не вирівнювати"
        - "'ere замість here, 'em, 'round, ya, ya'll, ain't, lemme, gotta, lotsa, 'kay"
        - "розтягнені голосні як спосіб кричати: graaave, aaaall, thiiiis, neeew, useeeed, Faaaantastic — відтворювати подвоєнням українських голосних"
        - "паразити man і dude в кінці речення — не звертання, а вигук; гендерно нейтральний відповідник"
        - "самовдоволені вигуки: Dominatin'!, Bull's eye!, Ta-daaa!"
        - "коли ігнорує гравця — самі вокалізи: «Um, um, um», «Tsk, tsk, tsk», «Mhm, mhmm» (q6, q9, q11, q96)"

narration:
  present: true
  note: >-
    «ви» без винятків, хоча сам мовець каже гравцеві «ти» — STYLE §3.1. Нарація тут
    майже вся дієва (він хапає, кидає, тицяє зброєю) і вклинюється всередину реплік:
    q34–q38, q60, q62 — по кілька вставок на репліку.

new_names: ["Gale", "Jon the Beautiful", "Acid Hunters", "Black City"]

idioms:
  - unit: q42
    src: "Add two and two"
    note: "українською рахунок в ідіомі інший — локалізувати, не калькувати «додай два і два»"
  - unit: q43
    src: "play his old buds like a fiddle"
    note: "музичний образ у нас не працює — шукати український вислів про те, як обводять довкола пальця"
  - unit: q45
    src: "Bull's eye!"
    note: "влучання в ціль, не бик і не око"
  - unit: q49
    src: "Derailed son of a rat"
    note: "«derailed» тримає залізничну метафору (зійшов з рейок = здурів), а «son of a rat» — його стала лайка замість звичної; обидва шари варто зберегти"
  - unit: q57
    src: "JKK... More like JK-DEAD"
    note: "каламбур на абревіатурі, яка лишається латиницею (глосарій) — потрібне рішення, що обіграє саме JKK, а не переклад"
  - unit: q60
    src: "the boogeyman is poof - gone"
    note: "дитяче страховисько зі сну; не «бугімен» — український відповідник із того самого дитячого регістру"
  - unit: q74
    src: "Tin cans takin' trip to the Drop Zone"
    note: "«tin cans» — зневажливо про броньованих протекторатців; Drop Zone → Зона Скидання (глосарій), тож жарт має зчепитися з готовим топонімом"
  - unit: q107
    src: "Like flies drawn to a turd"
    note: "навмисно бридке порівняння — не пом’якшувати до «як мухи на мед», STYLE §9"
  - unit: q123
    src: "stink up my shop"
    note: "буквальна вонь як зневага, зберегти грубість"
  - unit: q34
    src: "Filthy muties and all that jack"
    note: "«all that jack» — просторічне «і все таке»; «muties» — зневажлива форма від мутантів, має звучати як лайка"

pitfalls:
  - "«cog» — центральна метафора персонажа й наскрізний термін вузла (q1, q41, q42, q43, q62, q66, q67, q77, q78, q87, q107, q135, a44). Разом із нею працює ціле гніздо: «gearin'» (a106, q101), «cogs stop spinnin' in place» (q66), «Let the cogs spin again» (q64), «cog-wreckin'» (q67, q83). Це один механізм із шестернями, а не окремі слова — переклад треба будувати як систему, інакше розсиплеться і образ, і дотепи."
  - "«zone out» у нього означає «вбити» (q37, q38, q51, q77, q83) і водночас у вузлі є «zoner» → зонер (глосарій, q73, q107, q123). Гра слів між ними навмисна — по змозі зберегти спорідненість."
  - "«fat rat» / «fat rats» (q42, q64) — багатії й боси, протиставлені «cogs»; а «son of a rat» (q49, q57, q123, q127) — його лайка. Один щурячий корінь тримає обидва — не розводити на різні слова без потреби."
  - "Ім’я. Registry дає Rag → Ганчірка, і воно мусить читатися як образа: у q115 персонаж просить так його не звати. Але a118 «Raaag! I'll call you Rag just like the rest of them!» вимагає, щоб обране слово ще й розтягувалося у крик — перевірити, що український варіант це витримує у кличному відмінку."
  - "Справжнє ім’я персонажа — Gale (a12, a126), і воно вжите лише у двох репліках гравця. Канонічного варіанта немає — див. new_names; не вигадувати на місці."
  - "Звертання «man» і «dude» гендерно нейтральні в англійській, а українські відповідники — ні. Гравець може бути будь-якої статі: або нейтральний вигук, або $(#…). Рішення однакове на весь вузол."
  - "q97 містить $(#Hello/Heya) — гілки різняться не родом слова, а фамільярністю; українською природніше передати саме родом привітання. Велика літера на початку обох гілок обов’язкова."
  - "q37, q80 і q38 частково збігаються дослівно (абзац про бак, який ви кладете на землю); q83 повторює кінець q38, а q84 і q85 повторюють сцену зникнення зброї. Перекладати збіжні частини ідентично."
  - "Глосарій: zoner → зонер, Junkyard → Звалище, Core City → Центральне Місто, Free Drones → Вільні Дрони, Protectorate → Протекторат, Drop Zone → Зона Скидання, Faceless → Безликі, charons → харони. Латиницею: JKK, Praetorian Security, Coretech, Underrail."
  - "Теги перевірок: a130 позначено ::[Persuasion]::, тоді як глосарій має ::[Persuade]:: → ::[Переконати]::. Не вигадувати третій варіант — звірити з knowledge/. Те саме для ::[Mercantile]::, ::[Disabled]::."
  - "a88 і a99 містять ::Barter.:: → ::Торгувати.:: (глосарій) всередині репліки — підказка дії лишається інфінітивом, STYLE §3.5."
  - "q35–q36 — довгий опис татуювань із двома дзеркальними машинами; терміни механізму (springs, gears, contraption) підтримують ту саму шестеренну метафору, що й «cogs», і мають бути з нею узгоджені."
  - "У джерелі є одруки: «purposfully» (q6), «disguist» (q43), «arest» (a59), «profesionalism» (a130), «inaudble» (q105), «upen up» (q91), «moves towards you will vile intent» (q62). Перекладати за змістом, помилок не відтворювати."

