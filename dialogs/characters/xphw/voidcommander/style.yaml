speakers:
  - slug: voidcommander
    name: командувач
    units: default
    confidence: probable
    evidence: [q5, q31, q48, q51]
    role: >-
      Зламаний війною командир псіонічного загону в Порожнечі: передає гравцеві
      під команду залишки свого підрозділу й пояснює правила битви. Говорить
      наказами й зведеннями, майже без побутової лексики.
    relationships:
      - "гравець — підлеглий у званні «subcognator», щойно підвищений з «corporal» (q5, a6)"
      - "власний загін тримає північний фронт і гравцеві не підпорядкований (q34, q52)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова субординація в чистому вигляді: звертається до гравця званням
        («subcognator»), а не на ім’я, видає накази й перепитує про остаточність
        рішення. Гравець послідовно відповідає «sir» — STYLE §3.2 і §3.3.
      gender_cues: []
      switches:
        - {unit: q22, to: ви, trigger: "зрив у спогад про поразку — обірвані фрази, але регістр не змінюється"}
    voice:
      register: >-
        уривчастий, майже літургійний; короткі речення, багато трикрапок,
        лексика світла й темряви («illuminate all fronts», «Tainted. By them.»)
      idiolect:
        - "розділяє думку на однорядкові абзаци через \\n\\n — членування зберігати"
        - "заїкання й обірвані слова у зривах: «We're losin-- We've los--», «V-v-victory...»"
        - "формулювання наказів шаблонне («North frontline will *attack*.») — тримати однаковий шаблон в усіх 16 варіантах"

