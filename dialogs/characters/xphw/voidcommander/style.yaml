pitfalls:
  - "Позивні (q58–q150) — це імена в реєстрі відсутні; до централізованого рішення не транслітерувати самотужки"
  - "«the Void» тут — простір/стихія, а не персонаж на прізвисько Void (реєстр: Порожнеча, kind: nickname). Рішення для топоніма ще не ухвалене"
  - "«subcognator», «exosoldier», «technomedic», «intercessor» — вигадані звання й спеціальності доповнення Heavy Duty; у глосарії їх немає, потрібне єдине рішення на весь корпус"
  - "«Heavy Duty» як назва доповнення — не перекладати (глосарій, read-only)"
  - "q134 містить друкарську помилку джерела «Techomedical» — перекладати за смислом, помилку не відтворювати"
  - "Напрямки повторюються у ~60 юнітах (north/east/south/west, frontline/squad) — плутанина в одному місці ламає ігрову логіку бою"
  - "q186/q193/q196/q197 подають напрямок прикметником (north frontline), а q188/q190/q192/q195 — формою eastern/southern; в українській різниці немає, вирівнювати на один варіант"

