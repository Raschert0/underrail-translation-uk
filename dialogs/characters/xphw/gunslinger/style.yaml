    units: default
    confidence: certain
    evidence: [q100, q102, q83]
    role: >-
      Найманець-стрілець із енергетичним пістолетом і окулярами-візором, якого гравець
      витягає з розстріляної дрезини; далі — напарник на весь маршрут і оповідач власної
      історії про DETeK. Голос спокійний, небагатослівний, з підкресленою ввічливістю
      бувалої людини — це визначає добір слів більше, ніж сюжет.
    relationships:
      - "Гравець — спершу рятівник, потім рівний напарник: «partner», «friend», «buddy»"
      - "Nimble і решта загону — загиблі товариші, згадуються стримано (q61, q175)"
      - "Diane Emerson — колишня підопічна й кохана; David Englund — її чоловік, ворог"
      - "Зілла — торговка за прилавком, до неї він звертається згори-фамільярно «hon» (q132)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Бойове побратимство і спільна пиятика: постійні «partner», «buddy», «friend»,
        тост на двох, розповідь про власну ганьбу. Це «свій» у розумінні STYLE §3.2,
        тож «ти». Його ввічливість («Much obliged», «Have a good one», «There is more
        to it») — лексична риса, а не дистанція, і не є підставою для «ви».
      gender_cues: []
      switches:
        - {unit: q132, to: ти, trigger: "звертання «hon» до Зілли — фамільярно й трохи згорда, не до гравця"}
    voice:
      register: стриманий, небагатослівний; вестернова ввічливість поверх грубого ремесла
      idiolect:
        - "«partner» / «friend» як стале звертання (q3, q80, q94, q197, q211) — тримати один український відповідник наскрізь"
        - "«Much obliged» — повторюваний знак подяки (q183, q214); один сталий переклад"
        - "«Have a good one» — його формула прощання (q3, q90, q141, q170); один сталий переклад"
        - "рідкісні розмовні зриви на тлі книжної рівності: «ain't got a problem» (q39), «'em» (q200), «gonna» (q49)"
        - "лайка тільки в межах світу: «Sons of rats» (q10), «son of a rat» (q122), «ratbags» (q13) — щуряча лінія, не замінювати на побутову лайку"
        - "уникає прямої емоції; біль подається констатацією: «I failed.» (q125)"

