  - slug: wilkos
    name: Вілкос
    units: default
    confidence: certain
    evidence: [q11, q14, q26]
    role: >-
      Помічник оператора потяга й водночас «м’язи», коли треба; майже весь вузол варить
      свій «вічний суп». Голос практичний і господарський — кулінарія витісняє пафос.
    relationships:
      - "Містер Німбл — начальник, до якого ставиться з відвертою повагою"
      - "Торренс — давній напарник; лається на нього, але тримається поруч"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Єдине пряме звертання до гравця — $(#mister/ma'am) (q5), тобто ввічлива форма;
        решта реплік нейтральні, без панібратства. STYLE §3.2 — службова роль, «ви».
      gender_cues: ["$(#mister/ma'am)"]
      switches:
        - {unit: q22, to: ти, trigger: "коли ображається на кпин із супу і зривається на familiar «you»"}
    voice:
      register: рівний, побутовий, з побутовою гордістю кухаря
      idiolect:
        - "Fool! як окрик до напарника — його стала реакція"
        - "whatcha, 'cause, ain't — просторіччя проривається попри ввічливу форму"
        - "«Mr. Nimble» вимовляє послідовно з титулом — повага передається послідовно"

  - slug: torrence
    name: Торренс
    units: [q8, q10, q17, q32]
    confidence: probable
    evidence: [q8, q10]
    role: >-
      Напарник-кулеметник, який тут лише вставляє репліки в чужу розмову: відповідає
      про долю Клінкера, хвалиться вогневою міццю і кепкує з нелюбові Вілкоса до човнів.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Ці репліки адресовані Вілкосові, не гравцеві. Базовий регістр Торренса беремо
        з його власного вузла dialogs/characters/xphw/torrence.
    voice:
      register: та сама вулична говірка, що й у власному вузлі
      idiolect:
        - "випадання g: durin’ — механічна прикмета, що відрізняє його від Вілкоса"

