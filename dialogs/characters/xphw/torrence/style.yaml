speakers:
  - slug: torrence
    name: Торренс
    units: default
    confidence: certain
    evidence: [q1, q12, q63]
    role: >-
      Найманий стрілець-охоронець при потязі, власник старого кулемета «The Warthog».
      Грубий, самовдоволений, у розмові постійно зісковзує на хвальбу зброєю та жінками —
      це визначає добір слів більше, ніж будь-який сюжет.
    relationships:
      - "Вілкос — давній приятель і суперник; постійно піддражнюють один одного"
      - "Монiка й Таммі — сестри-близнючки з давньої історії про бійку"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Звертається до гравця виключно фамільярно-загравально; жодної ввічливої форми
        в цілому вузлі немає. Гравець дзеркалить — STYLE §3.3.
      gender_cues: ["$(#bud/cheeks)"]
    voice:
      register: вулична говірка, розв’язна, з хвальбою і фліртом
      idiolect:
        - "тотальне випадання g: haulin’, stickin’, firin’, gettin’ — передавати розмовним стилем, а не апострофами"
        - "стягнення yer, nonna, 'ere, ya — просторічна вимова, не літературна норма"
        - "ain’t, lotsa, easy-peasy — знижена лексика, не пом’якшувати (STYLE §9)"
        - "звертання cheeks / big boy — загравання, а не нейтральне «друже»"

  - slug: wilkos
    name: Вілкос
    units: [q36, q39, q48, q50, q52, q54, q58, q62]
    confidence: probable
    evidence: [q39, q58, q62]
    role: >-
      Другий охоронець, який увесь час вузла вариться біля казана — усі його репліки
      супроводжує нарація про суп. Тут він не звертається до гравця, а перебиває й
      кепкує з Торренса.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        У цьому вузлі Вілкос до гравця не говорить — репліки адресовані Торренсові.
        Базовий регістр беремо з його власного вузла dialogs/characters/xphw/wilkos.
    voice:
      register: сухіший і спокійніший за Торренса, короткі кпини
      idiolect:
        - "Fool! — його характерний окрик, той самий, що в його власному вузлі"
        - "кулінарна нарація ::He stirs the pot.:: — механічна прикмета мовця"

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q45, q59]
    confidence: unknown
    reason: >-
      Обидві репліки — короткі кпини всередині спільної історії двох чоловіків, без
      імені в нарації, без випадання g і без звертання. Належати можуть будь-кому з двох.
    guidance: >-
      Базовий регістр вузла — «ти». Будувати нейтрально, без гендерованого минулого
      часу від першої особи, щоб рядок звучав природно за обох атрибуцій.

