speakers:
  - slug: voidfighter
    name: боєць-порожнечник
    units: default
    confidence: certain
    evidence: [q25, q46, q67, q88, q109, q130, q151, q172, q193, q214, q235, q256]
    role: >-
      Рядові бійці штурмового підрозділу, вирощені як «продукт» і психічно
      зламані Порожнечею; кожен доповідає власним кодовим ім’ям із каталогу
      зір (Almach, Rigel, Altair, Naos, Caph, Thuban, Castor, Mirfak, Enif,
      Algol, Vega, Saiph). Гравець виступає щодо них як командир.
    relationships:
      - "гравець — командир: «Order us to strike!», «By your will»"
      - "cognator — вища ланка, якій вони підпорядковані"
      - "інші бійці — «brothers», «your own»: підкреслено братерство однакових"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Субординація: боєць звертається до командира — статутне «ви».
        Командирські репліки гравця («What troubles you, soldier?»,
        «Control yourself, soldier!») теж на «ви» — це звертання по службі,
        а не панібратство. Грубість гілок ::[Intimidate]:: передається
        лексикою, а не переходом на «ти».
      gender_cues: []
    voice:
      register: >-
        уривчастий, надламаний; короткі речення, багато трикрапок, суміш
        казарменої формули та маячні
      idiolect:
        - "рапортна формула «X ready» / «X reporting» — стала, однакова для всіх"
        - "самоозначення «I am a product» — технічне, не метафора"
        - "звертання до товаришів через «brothers», «our own»"

