pitfalls:
  - "Шаблон із 15 реплік повторюється дослівно 12 разів (q2–q25, q27–q46, q48–q67 і далі). Усі копії мають бути перекладені ідентично — розбіжність між копіями читатиметься в грі як помилка."
  - "Літерали \\n\\n у джерелі — це escape-послідовності гри, а не текст: переносити в ціль без змін і не міняти їх кількість."
  - "«cognator», «intercessor», «technomedic» — вигадана термінологія доповнення Heavy Duty; потребує єдиного рішення на весь корпус, у картці варіанти не закріплені."
  - "Кодові імена бійців — назви зір (Rigel, Altair, Vega, Algol…). Рішення про транслітерацію ухвалюється централізовано; не брати астрономічні українські назви навмання."
  - "«Heavy Duty» як назва доповнення лишається латиницею (глосарій)."
  - "Нарація подає бійців у чоловічому роді («He turns away», «his body») — минулий час і прикметники в ::…:: тільки чоловічого роду."
  - "::[Persuade]:: та ::[Intimidate]:: — сталі мітки перевірок; у глосарії закріплено «::[Переконати]::», мітка Intimidate має бути так само однакова в усіх 24 входженнях."

