  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q302, q303, q304, q305, q306, q307, q308, q309]
    confidence: unknown
    reason: >-
      Хорові бойові вигуки в кінці файлу, не прив’язані до жодного кодового
