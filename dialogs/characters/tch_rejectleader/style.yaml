speakers:
  - slug: reject_leader
    name: ватажок Відкинутих
    units: default
    confidence: certain
    evidence: [q8, q56]
    role: >-
      Найстарша з піддослідних істот, яких «Хранителі» тримають у клітках
      Інституту; говорить від імені всіх «siblings». Наприкінці називає себе
      прізвиськом Sharp, яке дали йому свої.
    relationships:
      - "Хранителі — наглядачі, які годують, «беруть шматки» і вбивають (q46, q49, q50)"
      - "siblings — решта Відкинутих, за яких він говорить постійним «ми»"
      - "Swifty — той, кого вбили за спробу втечі (q38)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Істота виросла в клітці й не має уявлення про мовний етикет: словник
        обрізаний, ввічливих формул немає жодної, питання прямі — «What will
        you do to me?» (q11), «I am me» (q6). Це не грубість, а відсутність
        регістру, і українською природно передається «ти». У вузлі немає
        ЖОДНОГО плейсхолдера $(#…) — гендерних підказок не існує, рішення
        спирається на STYLE §3.2.
    voice:
      register: наївний, прямий, з дитячою будовою фрази й тваринним страхом
      idiolect:
        - "власна система часу: «rests» замість годин/днів (q49) — не замінювати на звичні одиниці"
        - "евфемізм «ended» замість «killed» (q50, q76) — зберігати мʼяке слово, бо істота не має слова «вбити»"
        - "«since the day we began» (q46) замість «were born» — химерність навмисна"
        - "«How will we feed?» (q40) — неперехідне «годуватися», а не «нагодувати»; калічену граматику зберігати"
        - "постійне «ми» замість «я»: говорить за всіх siblings"
        - "лапки навколо чужих слів: «somewhere else», «tests», «year» — слова, які він чув, але не розуміє"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Нарація описує істоту переважно як «it»,
    двічі зривається на «he» (q35, q54) — див. pitfalls.

new_names:
  - Keepers
  - Rejects
  - Sharp
  - Swifty

idioms:
  - unit: q4
    src: "a wet, gurgly voice"
    note: "фізіологічний опис голосу; не згладжувати до «хрипкого»"
  - unit: q2
    src: "like worms emerging from a handful of dirt"
    note: "порівняння тримає огиду — зберігати образ, не пом’якшувати"
  - unit: q56
    src: "pretty sharp for a Reject"
    note: >-
      прізвисько Sharp виростає прямо з цієї репліки; переклад репліки і
      переклад прізвиська мають бути одним словом, інакше q56–q57 розсипаються

pitfalls:
  - "джерело хитається між «it» і «he» (q35, q54) — українською рід треба обрати ОДИН на весь вузол і тримати; «істота» жіночого роду тягне за собою узгодження, якого в оригіналі немає"
  - "q9+q10+q11 та q79 — одне речення, розрізане на кілька юнітів і склеєне в грі; будувати порядок слів під склейку"
  - "a55 містить $(context.player.Name) — не відмінювати всередині плейсхолдера"
  - "q2, q8, q18, q42, q57, q73 містять \\n\\n — розрив абзацу між нарацією і реплікою, зберігати"
  - "«Reject, Bastard, Freak, Inbred» (q56) — перелік образ; грубе лишається грубим, STYLE §9, і «Reject» тут має збігатися з назвою виду в q8"
  - "a17 «::[Persuasion]::», a26 «::[Stealth]::» — назви навичок; Stealth як навичка — «Непомітність» (глосарій), не «Скрадання»"

