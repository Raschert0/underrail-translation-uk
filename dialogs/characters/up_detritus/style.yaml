    name: Детрітус
    units: default
    confidence: certain
    evidence: [q2, q27, q30, q35, q81]
    role: >-
      Молодий зонер із Зони Скидання, що втратив усю родину під час чуми й
      вижив сам; приїхав під Інститут Тчорта шукати кращого життя і згодом
      стає для тчортистів цінним піддослідним. Простак із теплим, довірливим
      голосом — уся мова тримається на вуличній фонетиці й вірі в удачу.
    relationships:
      - "гравець — доброчинець і єдиний тут «свій»; наприкінці називає його «friend» і дякує (q15)"
      - "батько, мати, дід, п’ять сестер і два брати — усі померли від чуми (q32, q47)"
      - "рясофори — тчортистська варта; говорить про них із острахом і повагою (q70, q72)"
      - "«derailed geezer» надворі — сусідній NPC, про якого він відгукується зневажливо (q69)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний, свій, без жодної офіційності: «Hey... Need somethin'?»,
        «Hey, I don't know if you've been told...». STYLE §3.2 однозначно дає «ти».
        Репліки гравця дзеркалять (§3.3) — «Hey, Detritus, how's it going?»,
        «Stop being such a wimp, Detritus!»
    voice:
      register: вуличний, простацький, емоційно відкритий; довгі речення розсипаються на уламки
      idiolect:
        - "«hardcore» як універсальний підсилювач — 9 входжень (q8, q10, q35, q55, q65, q66, q72, q77); один сталий український відповідник на всі"
        - "«dominates!» / «Dominatin'!» як вигук захвату (q4, q8) — окремий тик, не змішувати з «hardcore»"
        - "«pipeworks» / «pipeworkin'» як лайка-замінник (q35, q53) — від назви локації Pipeworks, має читатися як евфемізм лайки"
        - "суцільне випадання -g: goin', somethin', 'cause, workin', anythin', rottin', guessin' — передавати розмовною українською морфологією, а не апострофами"
        - "«ya» замість «you» (q32, q47)"
        - "самовизначення-рефрен «I'm a simple zoner» (q30, q39, q77)"

