speakers:
  - slug: svana
    name: Свана
    units: default
    confidence: certain
    evidence: [q115, q174, q202]
    role: >-
      Перевізниця з ССГ, що возить гравця стандартними маршрутами й за великі гроші
      погоджується на Забутий Острів. Її довга розповідь про Чорне Море — головний
      масив тексту вузла й водночас сповідь про боягузтво, яке вона досі соромиться.
    relationships:
      - "Гравець — постійний клієнт; вона зве його «kid» від першої репліки до останньої"
      - "Старий у спорядженні спелеолога (Hank) — пасажир, якого вона покинула біля Пащі"
      - "Інші перевізники — професійна спільнота, на яку вона посилається як на джерело чуток"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Наскрізне фамільярне «kid», суцільні ain’t / ’cause / gonna / whatcha /
        betcha, пряме «dig that?» — вулична, панібратська мова без жодної службової
        дистанції (STYLE §3.2). Репліки гравця дзеркалять базовий регістр (§3.3),
        зокрема й у грубих рядках a173, a194.
      switches:
        - {unit: q174, to: ти, trigger: "зрив на образу — «I’m a respected ferrywoman»; лишається «ти», але тон різкіший, не пом’якшувати"}
    voice:
      register: >-
        хрипкувата, розхристана, з чорним гумором; фахова впевненість моряка
        поруч із відвертим зізнанням у страху
      idiolect:
        - "«kid» у майже кожній репліці — вокатив-паразит, українською не однослівний штамп, а живе звертання (мала, малий — вимагає гендерного плейсхолдера)"
        - "«You betcha» (q104, q135) — та сама формула двічі, тримати однаковою"
        - "«dig that?» / «Dig?» (q17, q158) — перепит-виклик, не «розумієш?» офіційне"
        - "«Mm-hmm.» (q66, q100) — байдуже гмикання, не згода"
        - "нанизування «No. No. Shut up. No.» (q169) і «Do. You. Swear?» (q163) — рубана емфаза, крапки зберігати"
        - "морська образність у переносному значенні наскрізна: oars, currents, river, throttle"

