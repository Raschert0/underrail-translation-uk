idioms:
  - unit: q25
    src: "You ain’t rowing with both oars"
    note: "не калькувати «гребти двома веслами»; ідіома «у тебе не всі вдома», але тримати весловий образ, бо він повторюється"
  - unit: q31
    src: "derailed as a Lunatic rowing with half an oar"
    note: "подвійний образ: «derailed» — світобудовний каламбур на рейках Underrail, «half an oar» продовжує q25; шукати український відповідник, що зберігає обидва, і тримати «derailed» однаково в q27 і q31"
  - unit: q38
    src: "sent you down the right river"
    note: "«скерувати на правильний шлях» у річковій метафорі — не калькувати дослівно"
  - unit: q116
    src: "as cool as iceshrooms"
    note: "порівняння з ігровим предметом; зберегти предмет, а не міняти на побутове «холодний як лід»"
  - unit: q127
    src: "the most cowardly quaker in the entire Underrail"
    note: "«quaker» тут — сленгове «боягуз», не релігійна течія; Underrail лишається латиницею й не відмінюється (глосарій)"
  - unit: q23
    src: "no one with a brain bigger than slackjaw’s"
    note: "непрозоре: або прізвисько, або родова назва тупака — не вигадувати транслітерацію, поки не вирішено централізовано"
  - unit: q174
    src: "some random schmuck who thinks he’s got it all"
    note: "грубе лишається грубим (STYLE §9); не пом’якшувати до «людина»"
  - unit: q200
    src: "more luck than brains"
    note: "усталене «більше щастя, ніж розуму» — не дослівна калька"

pitfalls:
  - "q127 «*corroded* it» — це звичайне дієслово про кислоту, а НЕ ігровий дебаф Corroded → «Корозія» з глосарія"
  - "q113, q119, q120 «the Jaws» — топонім-арка з поясненою етимологією («it’s got teeth. Hence - Jaws»); переклад мусить тримати зв’язок «зуби → назва», інакше пояснення розсипається"
  - "q212 «the Eel’s» — апостроф у джерелі помилковий, це множина угруповання, не присвійний відмінок"
  - "q144 «I ain’t bying it» — друкарська помилка джерела замість «buying»; перекладати за змістом «не куплюся»"
  - "q80, q76 «fourty» — друкарська помилка замість «forty»; числа: сорок харонів, сорок п’ять кредитів"
  - "У всьому вузлі немає жодного $(#…): звертання «kid» і гендерне минуле в репліках гравця (a15 «Still angry with me?» → відповіді, a183 «I’ve already been there») потребують ДОДАНИХ плейсхолдерів, бо українська рід показує, а англійська ні (STYLE §2)"
  - "Топоніми з глосарія беруться готовими: Black Sea, Hell’s Gut, Core City, Junkyard, Camp Hathor, Chancer’s Bay, The Rig, Core Ring, Meatway, SGS, Faceless, Protectorate, Invictus, charon, stygian coin; Biocorp (q119) лишається латиницею"
  - "q11, q12, q23 «Damn this place» / «damn spooky» / «damn pirates» — лайливий підсилювач у неї частотний і стертий; не підвищувати щоразу до сильної лайки"
  - "q159 «Anyway, » та q161 «After all that » і q207 «Damn, kid, » — обірвані фрагменти, що склеюються з сусідніми юнітами; кінцевий пробіл і відсутність крапки зберігати"

