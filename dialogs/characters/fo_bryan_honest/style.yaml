speakers:
  - slug: bryan_honest
    name: мовця встановлено
    units: default
    confidence: certain
    evidence: [q8, q19]
    role: >-
      Власник єдиної в Ливарні крамниці механічних компонентів; говорить
      суцільним рекламним монологом і сам себе постійно називає повним іменем.
      Комізм персонажа — у розриві між пафосом продавця й дріб’язковістю товару,
      і саме цей розрив має вціліти в перекладі.
    relationships:
      - "«that crazy man yelling outside» (q18) — вуличний проповідник Ливарні; Браян підкреслено з ним не конфліктує"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Обслуга, що обробляє клієнта: наскрізне звертання «valued customer»,
        улесливий продажний регістр. STYLE §3.2 — обслуга «ви». Панібратство
        Браяна («Well, hello stranger») передається лексикою й напором, а не
        переходом на «ти»: перехід зруйнував би комічну офіційність «шановний
        покупець». Репліки гравця дзеркалять (§3.3), включно з глузливими —
        сарказм гравця (a26, a34) лишається на «ви».
      gender_cues: ["$(#he/she)", "$(#man/woman)"]
    voice:
      register: гучний зазивала, безперервний рекламний напір
      idiolect:
        - >-
          «valued customer» — нав’язливий тик, 8 входжень (q1, q3, q4, q13, q18,
          q25, q31, q45). Переклад мусить бути ОДНАКОВИЙ щоразу: тик працює лише
          через дослівний повтор, синонімізація його вбиває.
        - "називає себе повним іменем у третій особі: «I, Bryan Honest», «Foundry needed Bryan Honest», «I am ready to accept your purchase; I am Bryan Honest»"
        - "наказовий спосіб як прийом продажу: «Feel it.», «Feel the quality; feel the need to buy.» — короткі рубані імперативи, не розтягувати"
        - "вигадані цитати уявних людей у лапках (q1, q12) — чужий голос усередині його монологу"
        - "емфаза зірочками: *life*, *any-thing*, *in* my store — зберігати позицію наголосу"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Нарація тут переважно вкраплена в репліки
    (q1, q6, q8, q23), а не окремими юнітами.

new_names: ["Bryan Honest"]

idioms:
  - unit: q1
    src: "Don't break your pick, valued customer"
    note: >-
      Внутрішньоігрова ідіома «break one’s pick» = здатися, опустити руки.
      Наскрізна для Ливарні (є й у fo_bernard, і в fo_chief) — переклад має бути
      ОДНАКОВИЙ у всіх трьох вузлах.
  - unit: q4
    src: "You're thinking I'm pulling your leg"
    note: "локалізувати, не калькувати: «морочити голову», а не «тягнути за ногу»"
  - unit: q21
    src: "a person - a boss - came in here"
    note: >-
      «boss» тут — внутрішньоігровий сленг на позначення визначної, показної
      людини, а не начальника. Те саме вживання є в fo_chief (q70, з прямою
      ремаркою «to use a colloquial expression») — рішення має збігтися.
  - unit: q15
    src: "And they felt golden."
    note: "«golden» у сенсі «чудово, як слід» — розмовне схвалення, не про золото"
  - unit: q8
    src: "they don't call me Honest for no reason"
    note: >-
      Жарт тримається на тому, що «Honest» — водночас прізвище й характеристика.
      Якщо ім’я вирішать транслітерувати, каламбур тут зникне — рядок потребує
      компенсації; узгодити з рішенням щодо імені.

pitfalls:
  - "q21, q23 — гендерні вилки стосуються ГРАВЦЯ, а не Браяна: він переказує, як до нього прийшов відвідувач, і лише в q23 виявляється, що це був сам гравець. Не переплутати, хто якого роду"
  - "a10 — ::Barter.:: має точний глосарний відповідник, звіряти дослівно"
  - "q12, q30 — «Foundry» → «Ливарня» (глосарій)"
  - "a40 — «baby hopper»: hopper → «стрибун» (глосарій), тут у зменшувальному контексті іграшки"
  - "a33–a43 — це ланцюг абсурдних здогадів гравця; вони мають лишитися смішними й різнорідними, не вирівнювати їх до однакової конструкції"
  - "a41 «You see--», a42 «I just--», a43 «I'm lea--» і a2 «I'd--» — обірвані репліки: Браян перебиває. Зберегти саме обрив на пів слова, подвійний дефіс не перетворювати на три крапки"

