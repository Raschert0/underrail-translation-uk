  - unit: a14
    src: "The only thing you're about to eat is dirt from my boots"
    note: >-
      Погроза-каламбур, побудована на дієслові «їсти», яке підхоплює q15 і q33.
      Український відповідник має зберегти саме це дієслово, інакше відповідь
      людожера втрачає зачіпку.
  - unit: q26
    src: "blah blah"
    note: "передражнювання; український розмовний відповідник, не транслітерація"

pitfalls:
  - >-
    Вузол розгалужений за статтю гравця, і гілки різняться цілими реченнями, а
    не плейсхолдерами. Гілка q5–q23 звертається до жінки («I caught a woman»,
    «a girl», «you're a pretty one»), гілка q24–q41 — до чоловіка («Some man
    you are!», q35). Не додавати сюди $(#…) і не робити гілки нейтральними:
    рід усередині кожної гілки має бути витриманий послідовно.
  - "«Darling» тут — знущальне пестливе звертання (q13, q19), а НЕ прізвище Дарлінг із реєстру"
  - "q1 «Another mutant» і q2 «You things are just... inedible» — зневажливе знеособлення гравця; не пом’якшувати до нейтрального звертання"
  - "Опис поїдання (q7, q19, q21, q23, q26, q37, q39) навмисно натуралістичний — грубе лишається грубим, STYLE §9, без евфемізмів"
  - "q23 обривається на «warm, bloody succulent» без іменника — це вада джерела; відтворювати як обрив, не дописувати"
  - "\\n\\n у q1, q2, q10, q13, q15, q17, q29, q31, q33, q35 — розрив абзацу, переносити як є"

