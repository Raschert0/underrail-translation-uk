speakers:
  - slug: zaman
    name: "Zaman — канонічного українського варіанта немає, див. new_names"
    units: default
    confidence: probable
    evidence: [q1, q5, q24]
    role: >-
      Людожер, який тримає гравця в пастці за склом і смакує подробицями того,
      як його з’їсть. Один-єдиний голос на весь вузол: однакові словесні тики,
      однаковий садистичний реєстр у кожній q-репліці.
    reason: >-
      Ім’я встановлене лише за назвою теки — у самому тексті персонаж жодного
      разу не називає себе, і гравець теж його не називає (a25 «Who are you?»
      лишається без відповіді).
    guidance: >-
      Атрибуція голосу надійна, невизначена саме транслітерація імені. Поки
      немає канонічного варіанта, ім’я в тексті не з’являється — перекладати
      нічого; якщо трапиться в сусідньому вузлі, брати рішення централізовано.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Тюремник і людожер, який знущально сипле пестливими звертаннями
        («sweetheart», «darling», «honey», «sweetie») — це фамільярність
        зверхності, не ввічливість. Гравець-бранець відповідає викликом
        («you rat!», «you'll regret it!») — теж «ти», STYLE §3.3.
    voice:
      register: улесливо-садистичний; знущальна лагідність поверх погрози
      idiolect:
        - "«Mhm» — головний словесний тик, у 13 із 23 q-юнітів; передавати одним сталим українським відповідником у всьому вузлі, ніколи не викидати"
        - "подвоєне заперечення для наспівності: «yes, oh, yes!», «no, no!»"
        - "пестливі звертання як знущання: sweetheart / sugar / darling / honey / sweetie"
        - "меню з тіла жертви повторюється майже дослівно в q7, q19, q21, q23 — це навмисний рефрен, тримати ті самі слова в тих самих місцях"
        - "капслок на одному слові: «the party's about to get STARTED!» (q17) — зберігати"

narration:
  present: true
  note: >-
    Крім коротких ремарок ::He laughs.:: є розлога нарація q4 — суцільний абзац
    про відчуття гравця. «Ви» без винятків, STYLE §3.1, попри те що сам мовець
    каже «ти».

new_names: ["Zaman"]

