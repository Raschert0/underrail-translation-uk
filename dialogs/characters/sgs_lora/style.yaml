speakers:
  - slug: lora
    name: Лора
    units: default
    confidence: certain
    evidence: [q4, q99, q109]
    role: >-
      Торговиця ССГ, яку викрали й важко скалічили; лежить прикута до апаратури
      в Глибоких Печерах і дає ключові свідчення про пакунок і Куб. Говорить
      через голосовий протез, тому мова уривчаста, з повторами й паузами.
    relationships:
      - "Террі — чоловік; вона вважає його загиблим і питає про нього першим"
      - "Таннер — послав їх по пакунок і збрехав про вміст; вона його не звинувачує вголос"
      - "Віра — зазвичай саме вона видає їм списки закупівель"
      - "Корнелл і Acid Hunters — нападники; згадка про них викликає лють"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Вони незнайомі: гравець прибув до ССГ уже після її зникнення (a5, a110 —
        «we hadn’t had the chance to meet»). Мова Лори без сленгу й без
        просторічних скорочень, будована повними реченнями навіть у маренні.
        Репліки гравця дзеркалять (STYLE §3.3), включно з різкими — грубість
        передається лексикою, а не переходом на «ти».
      switches:
        - {unit: q57, to: ви, trigger: "сцена ненависті — регістр НЕ змінюється, змінюється тільки лексика"}
    voice:
      register: >-
        вимучений, надламаний; синтезований металевий голос, який вона ліпить
        губами — звучить рівно навіть тоді, коли зміст емоційний
      idiolect:
        - "повтор слова наприкінці думки як тик протеза: «painful. Painful.», «I’m tired. I’m so tired.»"
        - "обрив трикрапкою посеред фрази: «It’s... Lora... Baker.»"
        - "формульний зачин переказу: «I’ll start from the beginning...»"

