speakers:
  - slug: olivia
    name: Олівія
    units: default
    confidence: certain
    evidence: [q6, q63]
    role: >-
      Єдина хімікиня Ливарні, виготовляє тротил для шахти; дружина Ніколаса,
      яку той замовив убити. Говорить стримано й освічено, охоче й фахово
      пояснює хімію, зривається лише коли мова заходить про чоловіка.
    relationships:
      - "Ніколас — чоловік, двадцять років шлюбу; від «blissful love» до відвертої ненависті, дзеркальна пара до вузла fo_nicolas"
      - "шеф Баннер — до нього вона відсилає гравця з доносом (q46)"
      - "мер — згадує його страхову виплату за смерть на роботі як джерело грошей"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Перша репліка до незнайомця — «May I help you?»; тримає ввічливу
        дистанцію, до самого кінця не переходить на панібратство. Освічена,
        не вулична — STYLE §3.2.
      switches:
        - {unit: q60, to: ви, trigger: "лють після провалу («You barren-headed imbecile») — образа різка, але регістр не падає на «ти»"}
    voice:
      register: ввічливий, діловий; у гніві — різкий, але не вуличний
      idiolect:
        - "хронічний кашель: ::She coughs.:: пронизує майже кожну репліку — ритмічний маркер персонажа, не декоративна вставка, зберігати кожне входження"
        - "«golden» як схвалення (q10, q87) — той самий сленг Ливарні, що в Ніколаса; тримати спільний відповідник"
        - "«muck» як цензурна лайка (q2, q53, q60) — не пом’якшувати, STYLE §9"
        - "у фаховому фрагменті q69–q70 переходить на точну технічну мову без розмовності"
    gender_note: >-
      Мовиця — жінка: минулий час і прикметники в її репліках у жіночому роді.
      Це стосується лише її власної мови; звертання до гравця гендеронезалежні.

