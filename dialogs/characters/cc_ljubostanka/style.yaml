    note: "звинувачення в тому, що гравчиня краде чужих чоловіків; жіноче за адресатом навіть без плейсхолдера"
  - unit: q10
    src: "rip your loose heart out"
    note: "«loose» тут — про розпусність, а не про те, що серце ослабло"
  - unit: q1
    src: "a boulder of a woman"
