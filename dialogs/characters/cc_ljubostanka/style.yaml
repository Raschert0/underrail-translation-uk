pitfalls:
  - "Svetlana → Світлана (реєстр, питома форма)"
  - "q5 звертається до гравчині як до жінки, а q1/q2 — до гравця як до чоловіка («You filthy male pig!»); це дві різні гілки для різної статі, не зводити їх до спільного формулювання"
  - "«sledgehammer» / «my sledge» (q11) — кувалда; скорочена форма в q11 має лишитися скороченою й пестливою"
  - "q1 і q4 містять той самий блок нарації — переклад мусить бути дослівно однаковим в обох"

