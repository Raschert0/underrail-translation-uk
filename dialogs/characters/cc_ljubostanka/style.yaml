speakers:
  - slug: ljubostanka
    name: мешканка з кувалдою
    units: default
    confidence: probable
    evidence: [q1, q5, q8]
    name_note: "англ. Ljubostanka — слов’янське ім’я з назви теки, у самому тексті не звучить; канонічного варіанта немає, див. new_names"
    role: >-
      Величезна розлючена жінка з кувалдою, яка щойно вбила чоловіка за зраду
      і виганяє з дому кожного, хто зайде. Дві версії зустрічі — до і після
      того, як гравець дізнається про вбивство, — майже дослівно однакові.
    relationships:
      - "Стєпаніціє — чоловік, якого вона вбила ударом по голові; водночас «любов мого життя» і «покидьок»"
      - "Світлана — коханка чоловіка, якій вона заочно погрожує (q10)"
    address:
      npc_to_player: ти
      player_to_npc: —
      basis: >-
        Суцільна лайка й накази без пом’якшення («Get out of my house!»,
        «I said, OUT!») — «ти», STYLE §3.2. У гравця тут лише одна репліка,
        і та є підказкою дії.
    voice:
      register: криклива лють упереміш із раптовим плачем
      idiolect:
        - "балканське слівце-паразит «bre» наприкінці або всередині фрази (q1, q2, q4, q5, q7, q9) — головна прикмета голосу"
        - "випадання h: «'is head» — просторічна вимова"
        - "нагромадження образ ланцюжком: «pigs, cheaters», «bastards, cheaters, selfish good-for-nothings»"
        - "кувалда згадується з ніжністю («my most faithful») — той самий тон, що й про чоловіка"

narration:
  present: true
  note: >-
    q1 і q4 починаються однаковим розлогим описом, далі через \n\n іде пряма
    мова: межа регістру проходить усередині юніта — опис на «ви» (STYLE §3.1),
    мова на «ти». «::She sobs.::» (q8), «::Leave her alone.::» (a3) — так само.

