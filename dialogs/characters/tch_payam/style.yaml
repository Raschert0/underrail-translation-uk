pitfalls:
  - "q6 і q76 — це урок етикету: «Tchort is evolution» / «Evolution is Tchort» мають бути дзеркальним переставлянням тих самих слів, інакше правило в тексті стає неочевидним"
  - "«Tchort guide you» (q10, q20, q30, q67, q69) — стала прощальна формула культу, однакова в усіх юнітах і в сусідніх вузлах"
  - "q45 містить $(#he/she), що вказує на гравця у ТРЕТІЙ особі — «як $(#йому/їй) заманеться», а не звертання"
  - "q5 і q73 закінчуються на \\n\\n і продовжуються наступним юнітом; q10, q59 — короткі склейки. Порядок слів має витримати склеювання"
  - "q45 «question notability» — у джерелі покруч замість «notables» (поважні особи); перекладати за змістом, не за буквою"
  - "a4, a11, a68, a77 — гравець каже «brother» без плейсхолдера, бо адресат чоловік (Паям); це не гендер гравця"

