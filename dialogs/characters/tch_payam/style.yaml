speakers:
  - slug: payam
    name: Паям
    units: default
    confidence: certain
    evidence: [q7, q53, q73]
    role: >-
      Рясофор Паям відповідає за спостереження й охорону головної брами
      Інституту Тчорта: реєструє всі входи й виходи та випитує причину.
      Абсолютно процедурна людина без почуття гумору.
    relationships:
      - "Гравець — «novitiate», нижчий за саном, тому підлягає допиту (q45)"
      - "Невіл — рясофор, чиє зникнення Паям коментує (q64, q65)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службовець на посту, який говорить протоколом: «I am simply following
        the proper procedure» (q41), «Everything you said has been noted» (q30),
        «Negative» (q64). STYLE §3.2 — формальні й службові беруть «ви».
        Виправляє гравцеві форму привітання (q6, q76), тобто сам є носієм
        етикету.
      gender_cues: ["$(#brother/sister)"]
    voice:
      register: повільний, беземоційний, канцелярсько-статутний
      idiolect:
        - "нарація двічі підкреслює темп: «slow, unhurried voice» (q5, q73) — фрази довгі, без обривів"
        - "уникає скорочень і розмовності; «Negative» замість «ні» — армійсько-диспетчерське"
        - "процедурна лексика: «noted», «egress», «proper procedure», «false statements» — тримати підкреслено офіційний шар"
        - "нуль реакції на жарт: «statue-like stillness» (q57) — не додавати іронії, якої в тексті немає"

