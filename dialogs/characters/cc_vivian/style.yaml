speakers:
  - slug: vivian
    name: Вівіан
    units: default
    confidence: certain
    evidence: [q246, q6, q31, q127]
    role: >-
      Вівіан Янг — координаторка операцій JKK, вербує гравця в оперативники й
      супроводжує його на ремонт генератора. Веде розмову як подруга, а не як
      начальниця: жартує, сміється мало не в кожній репліці й сама себе перебиває.
    relationships:
      - "Ола Халідорсон — близький друг і колега; на питання про роман сміється і заперечує (q125)"
      - "батько — механік у Центральному Місті, посварилися через її роботу в JKK (q129, q131)"
      - "Гуннар Едстром — власник JKK, вона говорить про нього шанобливо-іронічно (q228, q230)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Попри службове становище тримається підкреслено неофіційно: зве гравця
        «silly», «girl», кепкує, сама називає атмосферу в JKK неформальною (q153).
        Формального регістру немає навіть у вербувальній частині.
      gender_cues:
        - "$(#friend/girl)"
        - "$(#my friend/girl)"
        - "$(#mister/girl)"
        - "$(#silly/girl)"
        - "$(#silly/crazy girl)"
        - "$(#manly man/super girl)"
        - "$(#man/woman)"
        - "$(#guy/girl)"
      switches:
        - {unit: q147, to: ви, trigger: "офіційне звільнення за роботу на іншу організацію — корпоративна формула, не її звичайний голос"}
    voice:
      register: тепла, балакуча, самоіронічна; сміх і жарт як норма, а не виняток
      idiolect:
        - "нав’язливе lovely — головний словесний тик, трапляється в десятках реплік; потрібне ОДНЕ українське слово, повторюване так само настирливо, і воно має працювати і як оцінка, і як вигук"
        - "Drats — її пом’якшена лайка; теж стале, скрізь однакове слово"
        - "звертається до себе в третій особі на ім’я: «Okay Vivian, let's see», «Good job, Vivian!», «Be serious Vivian!», «Damn it Vivian!», «serious Vivian steps in»"
        - "dominate / dominates it — улюблене перебільшення про роботу й розваги (q31, q7)"
        - "обриває себе на півслові й коментує сказане: «Em, I don't think \"lovely\" is the right word here» (q59)"

