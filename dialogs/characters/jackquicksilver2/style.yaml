speakers:
  - slug: jackquicksilver
    name: мовця встановити не вдалося
    units: default
    confidence: probable
    evidence: [q1, q8, q13]
    role: >-
      Контрабандист-торговець, який щойно використав гравця як приманку і спокійно
      в цьому зізнається. Ключ до голосу — незворушна ввічливість людини, яка
      вважає обман частиною чесної угоди.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Показово уникає скорочень там, де розмовна мова їх вимагає: «I honestly did
        not expect», «I always honor the deal», «Farewell» — підкреслено вибудувана,
        майже старомодна мова (STYLE §3.2). Гендерних плейсхолдерів у вузлі немає.
    voice:
      register: рівний, чемний, стримано-іронічний; жодної грубості навіть у зізнанні в обмані
      idiolect:
        - "повні форми замість скорочень — головна прикмета, що відрізняє його від решти торговців корпусу"
        - "звертання на ім’я гравця через $(context.player.Name) — знак навмисної ввічливості"
        - "формульні звороти: «I'm a man of my word», «Farewell»"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1"

