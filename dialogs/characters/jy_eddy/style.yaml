    name: Едді
    units: default
    confidence: certain
    evidence: [q88, q8, q30]
    role: >-
      Ватажок банди Скраппери, що контролює Старе Звалище: наймає гравця на
      крадіжку й замовне вбивство, платить харонами й відкрито погрожує тим,
      хто лізе на його територію.
    relationships:
      - "Скраппери — його банда: «That’s my gang»"
      - "Чорні Вугри — вороги, що потай пролізли на Старе Звалище (q15)"
      - "Елвуд — власник ключ-картки, якого Едді й сам збирався прибрати (q49)"
      - "Блейн — голова за винагороду, тисяча харонів (q83)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Кримінальний ватажок, що говорить із гравцем як із найманцем: грубі
        накази, погрози й панібратське $(#jack/sister) — STYLE §3.2 дає «ти»,
        репліки гравця дзеркалять базу (§3.3).
      gender_cues: ["$(#jack/sister)"]
    voice:
      register: різкий, наказовий, брутально-діловий, без сентиментів
      idiolect:
        - "інструкції подає списком коротких наказів: «Go to the slums… Look for a guy named Elwood…»"
        - "розмовні відмови формулою — «No dice», «Suit yourself», «Too bad»"
        - "зневажливе звертання замість імені: «genius» (q54)"
        - "гроші як єдиний аргумент: «Nothing expresses gratitude like money»"
        - "на відміну від сусіднього вузла jy_colton, g не випадає — Едді говорить грубо, але не по-простацькому; ця різниця має чутися"

