  - "У всьому вузлі немає жодного $(#…), але українська вимагає їх додати там, де гравець говорить про себе в минулому часі (a33, a50, a54, a64) — додавання плейсхолдера коректне, STYLE §2"
  - "«Doc» тут — і посада, і форма звертання: за реєстром «док» з малої, крім початку речення (q10, a20)"
  - "Реєстрові й глосарійні назви: Jared → Джаред, Buzzer → Дзижчик, Rail Crossing → Залізничний Переїзд, Faceless → Безликі, Free Drones → Вільні Дрони, Ironhead → Залізноголові, charons → харони, stygian coins → стигійські монети"
  - "Друкарські помилки джерела («stich», «anitbiotics», «the eliminate», «I don’t trust him one but» = one bit) — перекладати за змістом, помилку не відтворювати"
  - "a50 має *friendly* у зірочках — це сарказм-наголос; зірочки зберегти на відповідному українському слові"
  - "«hypo» (q26) — ігровий ін’єктор, не «гіпотеза» й не «гіпс»"

