speakers:
  - slug: aliza
    name: Аліза
    units: default
    confidence: certain
    evidence: [q10, q9, q43]
    role: >-
      Єдина лікарка станції Залізничний Переїзд, хронічно перевтомлена; просить
      звати її просто «док». Веде розслідування крадіжки медикаментів і платить
      гравцеві безкоштовним лікуванням.
    relationships:
      - "Джаред — свій, знайомий роками; вона захищає його навіть після викриття"
      - "капітан станції — начальство, до якого вона звертається у крайньому разі"
      - "Дзижчик, Макс — мешканці станції, згадує їх мимохідь"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Медична службовиця, звертається до незнайомця «Hello, traveler», тримає
        професійну дистанцію навіть у роздратуванні («Please don’t waste my
        time») — STYLE §3.2 «обслуга, службові → ви». Репліки гравця дзеркалять
        базовий регістр, STYLE §3.3.
    voice:
      register: втомлений, стриманий, професійно ввічливий
      idiolect:
        - "«Oh my…», «Oh dear» — постійний зойк-вигук; тримати однаковим у всьому вузлі"
        - "повтори-подвоєння від виснаження: «yes, yes…», «Don’t know, don’t know», «Great! Great.»"
        - "розмовне «you betcha» — єдиний зрив у неформальність, не згладжувати"

  - slug: jared
    name: Джаред
    units: [q2, q4, q6]
    confidence: certain
    evidence: [q1, q2]
    role: >-
      Мешканець станції, який крав медикаменти через залежність від знеболювальних
      після поранення. У цих трьох юнітах він кається перед Алізою, а не перед гравцем.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Ці репліки звернені до Алізи («I have been stealing the supplies from
        *your* office»), а не до гравця, тож пряме звертання до гравця тут
        відсутнє; до Алізи він говорить винувато й шанобливо — «ви».
    voice:
      register: зламаний, плаксивий, самопринизливий
      idiolect:
        - "обірвані самозасудження: «I know, it’s pathetic», «I have been…»"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; тут нарація в третій особі про Алізу («::She sighs.::»), адресат опису — гравець"

