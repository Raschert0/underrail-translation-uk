speakers:
  - slug: heidi
    name: Гайді
    units: default
    confidence: certain
    evidence: [q3, q124]
    role: >-
      Лікарка в Центральному Місті, представляється як «Doctor Gratz»; лікує за
      десять харонів і сама називає процедуру болісною. Ексцентрична до
      гротеску — це визначає добір слів більше, ніж її фах.
    relationships:
      - "чоловік — колишній «enforcer» Praetorian Security, загинув; єдине місце, де вона говорить тихо (q64, q65)"
      - "Даніел Арда — торговець, пропонував їй Hercules; вона його вигнала (q94, q95)"
      - "Максим Талоскі — колишній пацієнт, з якого вона глузує (q75, q76)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Медична обслуга при виконанні обов’язків — STYLE §3.2 велить «ви».
        Вона тримає лікарську рамку навіть у знущальних репліках: «my dear
        patient» (q124), «allow me to diagnose your illness» (q3). Гравець
        дзеркалить (§3.3): звертання «doc» (a9) панібратське за тоном, але не
        скасовує базового «ви».
      gender_cues: ["$(#boy/girl)"]
      switches:
        - {unit: q10, to: ви, trigger: "сюсюкання «a brave little $(#boy/girl)» — не перехід на «ти», а глузлива педіатрична манера; лишати «ви»"}
    voice:
      register: >-
        висока, дзвінка, театральна; лікарський словник упереміш із
        балаганом
      idiolect:
        - "подвоєння кінцевої фрази — головний тик: «Not a charon more! Not a charon more!», «Ask away. Away!», «It is fun!». Відтворювати щоразу, це її впізнаваність"
        - "ремарка «::She cackles.::» — 20+ разів; однаковий переклад в усіх юнітах"
        - "заперечення подвійне й уривчасте: «No, I can’t! I can’t!», «Nope. No.»"
        - "риторичні самозапитання з окличним знаком: «doesn’t it? Does it not!?», «Why not?»"
        - "сама зізнається, що римує (q53), — рими треба відтворювати, а не переказувати"

