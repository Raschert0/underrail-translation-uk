  - "q102 «Pneumonoultramicroscopicsilicovolcanoconiosis» — реальний термін-рекордсмен; жарт саме в довжині, коротшати не можна"
  - "q56 Coretech, Praetorian Security, JKK — латиниця без відмінювання (глосарій); Arena → Арена"
  - "q61 «Underrail» лишається латиницею навіть усередині української фрази (глосарій)"
  - "q45 «zoners» → «зонери»; q99 «rathound» → «щурчак» (глосарій)"
  - "q9, a9 — «charons» / «stygian coins»: «харони» і «стигійські монети» (глосарій), не плутати"
  - "q70 «Scientists, not cultists!» — вона підкреслює, що це рима; шукати українську пару, а не буквальність"

