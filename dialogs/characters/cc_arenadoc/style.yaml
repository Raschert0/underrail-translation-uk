        Медик при виконанні, звертається до відвідувача як до пацієнта
        («Do you have any spare kidneys», «Watch your step!») — службовий
        регістр, STYLE §3.2. Реплік гравця у вузлі немає.
    voice:
      register: жвавий, безтурботний; моторошний зміст подано як світську бесіду
      idiolect:
