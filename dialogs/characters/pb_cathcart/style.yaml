speakers:
  - slug: cathcart
    name: Каткарт
    units: default
    confidence: certain
    evidence: [q254, q245, q15]
    role: >-
      Полковник Фредерік Каткарт, комендант Форту Апогей і головнокомандувач
      операціями Протекторату на Півдні; гравець служить особисто йому.
      Кадровий військовий, який зневажає дипломатію і говорить наказами.
    relationships:
      - "Консул Олівер — цивільний співрозмовник; взаємна повага з постійним тертям через «дипломатичні» методи"
      - "гравець — його безпосередній підлеглий у званні капрала, звертається виключно «Corporal»"
      - "штаб-сержант Фрейзер — відповідає за виплати гравцеві"
      - "міс Трей — секретарка, до неї звертається підкреслено ввічливо"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Статутні стосунки командира й підлеглого: він сам вимагає звертання
        «sir» і посилання на військовий етикет (q266), гравець відповідає
        «sir» у переважній більшості a-рядків. STYLE §3.2 — службовий,
        формальний мовець.
      gender_cues: ["$(#He'll/She'll)", "$(#He/She)", "$(#his/her)", "$(#Mister/Miss)"]
      switches:
        - {unit: q168, to: ви, trigger: "роздратування («Speed it up»); лишається «ви», але наказовий тон різкішає"}
        - {unit: q170, to: ви, trigger: "«Spill it already» — грубий наказ без зміни регістру"}
        - {unit: q210, to: ви, trigger: "«My patience is at an end» — межа терпіння"}
    voice:
      register: командний, гучний, статутний; довгі періоди без сленгу
      idiolect:
        - "«That's what I like to hear» — наскрізний словесний тик (q41, q48, q55, q57, q256, q268, q284); має бути ОДНА стала українська формула в усіх входженнях"
        - "«Listen up» перед кожним інструктажем (q9, q17, q48, q57, q66, q206, q263) — теж стала формула"
        - "подвоєння як схвалення: «very good, very good», «yes, yes», «not yet, Corporal, not yet»"
        - "звертання «Corporal» вставляє в середину й кінець речень майже щоразу — не викидати"
        - "«Am I clear so far?» як контрольне питання наприкінці інструктажу (q53, q266)"

  - slug: oliver
    name: Олівер
    units: [q8, q14, q19]
    confidence: certain
    evidence: [q15, q19]
    role: >-
      Консул Олівер, цивільний дипломат Протекторату; наполягає, щоб гравцеві
      розповіли більше, і цим дратує полковника. Говорить м’якше й обережніше,
      без наказів.
    relationships:
      - "Каткарт — формально рівний партнер, фактично суперник у методах"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Дипломат при виконанні обов’язків; про гравця говорить у третій особі
        («the corporal»), звертається стримано-офіційно. STYLE §3.2.
      gender_cues: ["$(#He'll/She'll)"]
    voice:
      register: стриманий, дипломатичний, з обережними формулами
      idiolect:
        - "«Don’t you agree?» — питання-пастка, адресоване полковникові, а не гравцеві"
        - "«alas», «let’s not forget» — книжніші звороти, ніж у Каткарта"

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q17, q18]
    confidence: unknown
    reason: >-
      Свідчення суперечать одне одному. За q17 говорить Каткарт: «listen up» —
      його стійкий тик, а «Yes…» читається як поступка після власної відмови в
      q15. Але q18 змістовно тягнеться далі в q19 («would also be a lot easier,
      let’s not forget»), а q19 закінчується ремаркою «::He turns to Colonel
      Cathcart.::», тобто Каткартом бути не може. Хто саме веде цей уривок —
      з тексту не встановлюється.
    guidance: >-
      Перекладати нейтрально-офіційним «ви», без гендерованого минулого часу
      в самоописі мовця й без словесних тиків Каткарта («що я і люблю чути»),
      щоб атрибуція не закріпилася хибно.

