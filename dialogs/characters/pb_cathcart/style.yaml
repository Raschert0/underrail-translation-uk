pitfalls:
  - "q1, q93, q254, q256, q257, q259, q262, q264, q278 містять $(context.player.Name) — не відмінювати й нічого не дописувати всередині плейсхолдера; будувати фразу так, щоб ім’я лишалося в називному"
  - "q115 + q116/q124/q125/q126/q127 + q117 — це ОДНЕ речення, розрізане на юніти («Send a sum of » + «thirty-six hundred dollars » + «to my office»). Сума має стати в потрібному відмінку так, щоб склейка лишилася граматичною; кінцеві пробіли зберігати"
  - "q157 + q158 так само склеюються («In the meantime, » + «I'll wait for…»)"
  - "q114 і q132 закінчуються порожнім рядком і продовжуються далі — не «дочищати» їх до самостійного речення"
  - "q266 «You will refer to me as \"sir\"» — сама формула звертання є предметом репліки; переклад «sir» тут має збігатися з тим, як гравець звертається в усіх a-рядках"
  - "звання (colonel, corporal, captain, staff sergeant, consul, major, general, lieutenant) — з малої, крім початку речення; реєстр §title фіксує цей принцип на прикладі «Chief»"
  - "«SFC Holloway» (a189, a195) — скорочення звання перед прізвищем; розкривати чи лишати абревіатурою, вирішити один раз на весь вузол"
  - "GMS (q74) лишається латиницею — на відміну від SGS → ССГ (глосарій)"
  - "Biocorp (q51, q68, q100, q172) — латиницею, не відмінювати"
  - "Underrail (q17, q18, q49, q258, q264, q291) — латиницею й без відмінювання навіть у складі фрази «Lower Underrail»"
  - "«Free Drones» → «Вільні Дрони», «Faceless» → «Безликі», «Protectorate» → «Протекторат», «Core City» → «Центральне Місто», «Epione» → «Епіон», «burrowers» → «копаки», «hopper» → «стрибун» — усе за глосарієм"
  - "::[Persuade]:: → ::[Переконати]:: за глосарієм; ::[Mercantile]:: у глосарії немає — узгодити з назвою навички в knowledge/, а не вигадувати тут"
  - "«Dreads» (q85) — розмовне скорочення від Dreadnought; скорочення має впізнаватися як те саме слово, що й повна форма в q71"

