speakers:
  - slug: evelyn
    name: Евелін
    units: default
    confidence: certain
    evidence: [q7, q5, q1]
    role: >-
      Молода вдова колишнього шефа Варти Ливарні, зовні витончена й самотня, а
      насправді вбивця, яка присипляє гостя й нападає з ножем. Уся її мова —
      доглянута світська оболонка, і саме контраст із q1–q3 має працювати.
    relationships:
      - "Michael Ingram — покійний чоловік, шеф Варти; тема, довкола якої вона будує образ жертви"
      - "Мессер, місцевий різник — єдина людина, про яку говорить тепло"
      - "мешканці нетрів — про них говорить з холодною зневагою"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Ввічлива, тримає дистанцію з незнайомцем: «Good day. May I help you
        somehow?», пряма відмова обговорювати особисте зі сторонніми (q18, q19).
        За STYLE §3.2 це «ви»; гравець дзеркалить (§3.3), бо гілка спокуси
        побудована саме на підкресленій чемності.
    voice:
      register: м’яка, доглянута, з паузами й напівнатяками; повні речення, майже без скорочень
      idiolect:
        - "часті недомовки з трикрапкою — прийом спокуси, зберігати всі трикрапки"
        - "курсивні наголоси через *зірочки* (*that* beautiful, *I* know) — зберігати зірочки й місце наголосу"
        - "у q3 та сама витончена ввічливість озвучує погрозу — жах саме в тому, що тон НЕ змінюється; не переводити її на грубу лайку"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; q2, q3, q5 — довгі описові блоки"

