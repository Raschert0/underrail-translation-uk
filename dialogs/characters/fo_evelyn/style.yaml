  - "q2, q3 — минулий час і дієприкметники про гравця («undressed», «you have been…»): гендерні форми, потрібні $(#…)"
  - "$(context.player.Name) у q3, q7, q41, q56 і в репліках гравця — не відмінювати всередині плейсхолдера"
  - "Evelyn → Евелін, Messer → Мессер — з реєстру; Ingram, Michael, Stevenson поки без канонічного варіанта"
  - "Foundry Guard лишається латиницею (глосарій), місто Foundry — «Ливарня», Underrail — латиницею й без відмінювання (q34)"
  - "a4 ::End Dialog.:: та a22 ::Have a drink with Evelyn.:: — підказки дій, інфінітив, STYLE §3.5"
  - "\\n\\n у q2, q3, q5, q21, q41 — розрив рядка, зберігати"

