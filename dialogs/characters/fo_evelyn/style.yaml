    note: "розгорнуте порівняння; локалізувати образ, зберігши контраст «коштовність — вугілля»"
  - unit: q2
    src: "her transformation from beauty into beast"
    note: "формула «красуня — чудовисько»; потрібен сталий український відповідник, бо образ тримає всю сцену"
  - unit: q2
