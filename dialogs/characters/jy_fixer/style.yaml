speakers:
  - slug: fixer
    name: Фіксер
    units: default
    confidence: certain
    evidence: [q1, q24, q61]
    role: >-
      Єдиний лікар Звалища — брудний, моторошний, з дикими очима; «лагодить» людей
      без наркозу й вважає це нормою. Говорить повільно, короткими рубаними
      реченнями, і смерть та кров для нього робочий матеріал, а не жах.
    relationships:
      - "Едді — бос Скраперів; Фіксер говорить про нього обережно, без оцінок"
      - "Блейн — зниклий; Фіксер спокійно припускає, що його вбили"
      - "United Stations — користався їхньою «щедрістю», але тримає дистанцію"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний, грубий, панібратський мовець без жодної службової дистанції —
        STYLE §3.2. Гендерних плейсхолдерів у вузлі немає взагалі, тож рішення
        спирається на характер, а не на $(#…).
      gender_cues: []
    voice:
      register: повільний, рівний, моторошно спокійний; вуличне просторіччя
      idiolect:
        - "випадання g наскрізь: feelin', everythin', fixin', helpin', doin', guardin', scavengin' — передавати розмовною формою, не літературною"
        - "ain't і them замість those: «them guys ain't stupid», «them folks» — стійка ознака мовця"
        - "рваний сміх «Ha... Ha... HA-HA!» — не згладжувати в «Ха-ха-ха», ритм із крапками зберігати"
        - "ехо-повтор ключового слова окремим рядком: «Eddy...», «Colton...», «Coins...», «Food...», «Gory...» — це окремі юніти, повтор навмисний"
        - "мінімум сполучників; речення по два-три слова: «Dead. Probably.», «Yes.», «No.»"

narration:
  present: true
  note: "«ви» без винятків, навіть коли Фіксер каже «ти» — STYLE §3.1"

new_names: ["Carnifex", "United Stations", "Scrappers", "Eels", "Core City Housing Corporation"]

idioms:
  - unit: q24
    src: "If you're havin' trouble thinkin', I can fix that too."
    note: >-
      Не медична пропозиція, а прихована погроза лоботомією. «Полагодити» має
      лишитися тим самим дієсловом, що й у q1, — це наскрізний мотив вузла.
  - unit: a64
    src: "You're derailed."
    note: >-
      Внутрішньоігрове «здурів», побудоване на залізничній метафорі. Не калькувати
      дослівно й не заміняти нейтральним «божевільний» — образ рейок тримає світ гри.
      Те саме слово повертається в q82 («Derailed folks them Core City people») —
      обидва місця перекладати однаково.
  - unit: q53
    src: "We got a quaker here."
    note: >-
      «Боягуз, тремтун» — внутрішньоігрове лайливе слівце, не релігійна назва.
      Повторюється у сусідньому вузлі jy_ford (q81), тож потрібен єдиний варіант.
  - unit: q54
    src: "Just rub some dirt on it."
    note: "Ідіома зневаги до чужого болю; локалізувати розмовним відповідником, не калькувати «потри землею»."
  - unit: q26
    src: "Woulda known better had I used it."
    note: "Стягнене would have; передавати розмовною конструкцією, не книжним умовним способом."

pitfalls:
  - "Ім’я «Фіксер» у самому вузлі жодного разу не звучить — воно з registry.yaml; не вигадувати іншого варіанта й не перекладати як «Лагодій»."
  - "q1 містить і нарацію ::…::, і пряму мову після \\n\\n — регістр у цих двох частинах різний: у нарації «ви», у репліці «ти»."
  - "a3 закінчується підказкою дії ::Barter.:: — глосарій дає ::Торгувати.::, інфінітив (STYLE §3.5); так само a48, a51, a83."
  - "Ціни й монети: charon → харон, stygian coins → стигійські монети (глосарій). У q31 обидва слова стоять поруч — не зливати їх в одне."
  - "Invictus (q15, q16) — титул Арени, глосарій дає «Інвіктус»; Carnifex поки без канонічного варіанта."
  - "a11 несе тег навички ::[Mercantile]:: — дужки й :: не чіпати, лише слово всередині."

