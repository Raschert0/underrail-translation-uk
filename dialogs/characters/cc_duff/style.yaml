idioms:
  - unit: q6
    src: "could’ve had us zoned out like nothing"
    note: >-
      «zone out» = вбити, прибрати; сленг Зони. Не калькувати як «вивести з зони» —
      потрібен український кримінальний евфемізм, сталий на весь вузол (також q15, q129).
  - unit: q6
    src: "Fat rats with lotsa money"
    note: "образ багатіїв із верхнього рівня; повторюється в q167 — тримати один відповідник"
  - unit: q49
    src: "how about you just drop off"
    note: >-
      «drop off» тут = відчепися, згинь (також q51). Не «висадитися» й не «заснути»;
      мусить лишитися грубим, STYLE §9.
  - unit: q167
    src: "You are derailed to carry that much coin"
    note: >-
      внутрішньоігрове «derailed» = здурілий (від Underrail). Зберегти залізничний
      образ, якщо вдасться, але не калькувати дослівно.
  - unit: q80
    src: "Deathhammer just killed forty-five burrowers"
    note: "burrowers — глосарій: «копаки»"

