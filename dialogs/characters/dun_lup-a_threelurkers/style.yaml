# УВАГА: вузол багатомовцевий попри одну теку. Основний обсяг тексту належить
# НЕ вартовим із назви теки, а кухареві, що труїть власну зграю. Сусідство рядків
# у файлі не означає сусідства в діалозі.

speakers:
  - slug: cook
    name: кухар (імені в джерелі не названо)
    units: default
    confidence: probable
    evidence: [q51, q57, q59, q63, q65, q82]
    role: >-
      Ізгой усередині зграї, що взяв на себе роль судді й підмішує бранцям забруднені
      відходи до їжі; вважає це очищенням, а не помстою. Говорить як людина, що
      виправдовується перед собою, тому лексика в нього піднесена й моралізаторська.
    relationships:
      - "зграя («they») — колишні свої, тепер його жертви; про них тільки в третій особі й з огидою"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Тримає дистанцію й зверхність: «It’s none of your matter», «I’m not pleased with
        your pressence here», «Go back where you came from». Жодного сленгу, скорочень
        майже немає, будова речень книжна — формальний мовець, STYLE §3.2. Гравець дзеркалить, §3.3.
      switches:
        - {unit: q79, to: ви, trigger: "зрив у лють («Death to the foul!») — гучнішає, але на «ти» не переходить; не згладжувати гасло"}
    voice:
      register: книжний, проповідницький, з афоризмами й риторичними питаннями
      idiolect:
        - "сентенції замість пояснень: «Action and reaction.» (q59), «The line was crossed.» (q57)"
        - "лапки навколо «alive» (q59) і «awake» (q63) — іронія, зберігати лапки « »"
        - "самозвинувачення в номінативних конструкціях: «A terrible mistake, that’s what I am.» (q47)"
        - "уривання на півслові перед зізнанням: «Despite all what they did to me, I...» (q63)"

  - slug: greg
    name: Грег
    units: [q3]
    confidence: probable
    evidence: [q2, q3]
    reason: >-
      Ім’я звучить у q2 як звертання, тобто вказує на АДРЕСАТА: у q2 говорить не Ґрег.
      Ґрегу належить відповідь q3 («Uhhh, okay man»), що підтверджується ремаркою про
      речі гравця, які він щойно підібрав за наказом із q2.
    guidance: >-
      Ім’я в реєстрі відсутнє — до ухвалення централізованого рішення не закріплювати
      написання в цілі; винесено в new_names.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: "вуличний бандит, звертається до напарника «man»; грубий свій — «ти», STYLE §3.2"
    voice:
      register: тупувато-буркітливий, скарги вголос

  - slug: guard_orders
    name: вартовий
    units: [q2]
    confidence: probable
    evidence: [q2]
    reason: "звертається до Ґрега на ім’я, отже сам не Ґрег; другий із пари вартових"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: "тілесна грубість і командний тон — «ти», STYLE §3.2"
    voice:
      register: грубий, фізіологічний, без сорому

  - slug: ambusher
    name: нападник із ножем
    units: [q10, q17]
    confidence: probable
    evidence: [q10, q17]
    role: >-
      Той, хто оглушує гравця на початку; у діалозі присутній лише як загроза.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: "пряма погроза відрубати руки, скорочення «’em» — «ти», STYLE §3.2"

  - slug: cross_eyed_guard
    name: косоокий вартовий біля ґрат
    units: [q23, q25, q31, q37, q38, q39, q40]
    confidence: probable
    evidence: [q20, q23, q40]
    role: >-
      Вартовий, який через косоокість не бачить гравця; сцена з ключем будується
      на тому, що він говорить у порожнечу.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: "«I’ll make you suffer», «What are you on about in there?» — вуличний грубіян, «ти», STYLE §3.2"
    voice:
      register: розгублений, коли не бачить; вибухово злий, коли зачепили
      idiolect:
        - "говорить сам до себе, не знаючи, що його чують: «Did I drop it again?» (q23)"

  - slug: narrator
    name: нарація від другої особи
    units: [q12, q20, q22, q28, q29, q34]
    confidence: certain
    evidence: [q20, q29]
    role: >-
      Суцільні ремарки без мовця: опис дій гравця в другій особі (крадіжка ключа,
      удар, добивання). Мовця тут немає взагалі.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: "нарація — завжди «ви», STYLE §3.1, без винятків"
    voice:
      register: детальний, тілесний, майже клінічний опис насильства — не пом’якшувати

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q5, q9]
    confidence: unknown
    reason: >-
      Обидві репліки належать одному з двох вартових зі сцени q2–q3, але джерело не
      каже, котрому: ремарка в q9 говорить «They both turn around and leave», тобто
      присутні обидва, а імені не названо.
    guidance: >-
      Перекладати в спільному для обох регістрі: «ти», груба вулична лексика, жодних
      форм минулого часу з родовою ознакою мовця. Образу «Hey, food!» зберегти дослівною.

narration:
  present: true
  note: >-
    Нарації тут більше, ніж мови: цілі бойові сцени — самі ремарки. «Ви» без винятків,
    STYLE §3.1. Підказки дій («::Fight!::», «::Stay silent.::», «::Leave.::») — інфінітив, §3.5.

unattributed_units: [q5, q9]

new_names: ["Greg"]

idioms:
  - unit: q2
    src: "I gotta take a leak"
    note: "груба фізіологія — не пом’якшувати до «вийти»; STYLE §9"
  - unit: q9
    src: "Hey, food!"
    note: "звертання до бранця як до їжі — образа має читатися, не замінювати на «гей, ти»"
  - unit: q39
    src: "we'll be feasting on one of you next"
    note: "натяк на канібалізм; «бенкетувати» зберігає зловісну піднесеність, «жерти» її втрачає"
  - unit: q57
    src: "The line was crossed."
    note: "ідіома; «межу перейдено» — безособово, як у джерелі"
  - unit: q67
    src: "Easier said than done."
    note: "локалізувати сталим українським відповідником, не калькувати"
  - unit: a78
    src: "You are derailed."
    note: >-
      Гра слів із залізничним світом Underrail: «derailed» — і «схибнутий», і «зійшов
      з рейок». Залізничну метафору варто зберегти, вона тут не випадкова.
  - unit: q63
    src: "Sanity? They are the definition of the opposite."
    note: "риторична фігура, не спрощувати до «вони божевільні»"
  - unit: q79
    src: "Death to the foul!"
    note: "гасло високого регістру; «foul» — субстантивований прикметник, зберегти узагальненість"

pitfalls:
  - "q2 містить $(#him/her) — це про ГРАВЦЯ у третій особі, вартові говорять між собою: «$(#нього/неї)», а не звертання."
  - "q12 у джерелі має непарну кількість «::» — відкривальна ремарка без закривальної. Ціль має повторити ту саму непарність, інакше tools/check-uk.ps1 упаде."
  - "Літеральні «\\n\\n» у q2, q10, q23, q25, q31, q34, q51 — переносити дослівно."
  - "Мітки перевірок у джерелі непослідовні: «::[Dexterity]::» (a21), «::[Melee] and [Strength]::» (a27), «::[Persuation]::» з помилкою (a81). Приводити до глосарію («::[Переконати]::»), а не до джерела."
  - "Друкарські помилки автора — «precission», «casuing», «pressence», «enviroment», «would» замість «wound», «Persuation» — у цілі виправляються мовчки."
  - "Кухар говорить про зграю «they/them» без імен; не підставляти «лутери» чи «бандити» там, де джерело навмисно знеособлює."

examples:
  - unit: q2
    rule: "гендер гравця в третій особі, STYLE §2"
    uk_fragment: "$(#нього/неї)"
    status: proposed
  - unit: a7
    rule: "підказка дії — інфінітив, STYLE §3.5"
    uk_fragment: "::Мовчати.::"
    status: proposed
  - unit: q59
    rule: "іронічні лапки джерела передаємо « », STYLE §4"
    uk_fragment: "«живими»"
    status: proposed
  - unit: q86
    rule: "формальний мовець тримає «ви» навіть у грубості, STYLE §3.2"
    uk_fragment: "Забирайтеся туди, звідки прийшли."
    status: proposed
