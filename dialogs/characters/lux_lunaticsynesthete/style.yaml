speakers:
  - slug: lunatic_synesthete
    name: синестет-лунатик
    units: default
    confidence: certain
    evidence: [q2, q131, a83]
    role: >-
      Провідник культу Transfinity, якого послідовники звуть All-seeing One:
      синестет із п’ятикутним самоцвітом на чолі, що ним він утримує сплутані
      чуття в керованому стані. Веде обряд «трансформації» на силовому помості
      й умовляє гравця ступити на нього.
    relationships:
      - "Formedicator — інший провідник культу, до якого він відсилає гравця (q5) і який опікується тілами (q71)"
      - "гравцеві він сам дає ім’я-колір: Orange, після Соку — Cyan"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Проповідницький, урочистий регістр без жодного вуличного маркера: «Do
        not be afraid», «You must open your mind» — формули казання, а не
        побутова мова. Гравець відповідає титулом «oh All-seeing One» (a83,
        a93, a110, a140), тобто тримає дистанцію знизу вгору. Плейсхолдерів
        роду у вузлі немає взагалі, тож рішення спирається на STYLE §3.2.
      switches:
        - {unit: q32, to: ти, trigger: "зрив після викрадення самоцвіта — «Give that back to me!»; допустимо й у q34 («Keep your profane form away from it!») та q115 («You... are not one of us!»), де він відмовляє гравцеві в приналежності. Базовий регістр вузла від цього не змінюється"}
    voice:
      register: піднесений, лагідно-екстатичний; мова провидця, що вмовляє, а не наказує
      idiolect:
        - >-
          перехресні чуття — не метафора, а буквальна норма його сприйняття:
          «You sound... orange», «what the tongue tastes the ear hears»,
          «sensing back into Finity». Не згладжувати в звичайне порівняння
        - >-
          розтягнені й подвоєні приголосні, обірваний склад, мукання:
          «Shay-mmmm», «soOOOoo», «ssssoundss», «frag--rance», «mmmm».
          Відтворювати на українському приголосному — STYLE §9
        - "«::He readjusts his gem.::» — наскрізна ремарка-рефрен (q4, q13, q38, q60, q68, q71, q73, q79, q94); тримати однаковою в усіх входженнях"
        - "зірочки навколо слів — авторська розмітка наголосу: «*existence*», «*unified*», «*Transfinite*»; зберігати"
        - "Finity й Transfinity вживає як власні назви — з великої, у будь-якому відмінку"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Кілька q-юнітів є чистою нарацією без
    жодної репліки (q15, q31, q34, q44, q133); вони лишаються за цим мовцем як
    ремарки про нього, але перекладаються як нарація.

new_names: ["All-seeing One", "Transfinity", "Finity", "Formedicator", "Orange", "Cyan", "Juice"]

idioms:
  - unit: a88
    src: "It's not easy being green"
    note: >-
      цитата з пісні Кермі́та; в українському культурному полі не впізнається —
      локалізувати як жарт про зелений колір, не калькувати рядок
  - unit: a84
    src: "I'm a depressed person, so blue's more fitting"
    note: >-
      англійське blue = сумний; українське «синій» цього значення не несе.
      Жарт треба перебудувати на колір, що в українській тягне за собою сум
  - unit: a109
    src: "Now's not the time to be a quaker"
    note: "«quaker» тут — боягуз, той, хто тремтить; не релігійна громада"
  - unit: a10
    src: "First one's free."
    note: "формула наркоторговця; зберегти саме її впізнаваність"
  - unit: a92
    src: "Brown, nice to meet you."
    note: "жарт будується на тому, що колір подано як прізвище; тримати обидва прочитання"
  - unit: q73
    src: "That's why we're here, isn't it?"
    note: "розділове питання-вмовляння; в українському — питальна частка, не дослівна калька"

pitfalls:
  - "Orange і Cyan — це ім’я, яке він дав гравцеві, а не колір-прикметник: з великої, відмінюване як звертання (q2, q4, q28, q43, q45, q62, q94)"
  - "Finity / Transfinity — терміни культу, не «скінченність» і не «нескінченність»; рішення централізоване, див. new_names"
  - "Oculus (a59) — глосарій: Окулус"
  - "Underrail (a61) — глосарій: лишати латиницею й не відмінювати"
  - "q60 «*Octahedron*!» — він виправляє гравцеве «pyramid»; протиставлення двох геометричних слів має вціліти, інакше репліка втрачає сенс"
  - "q130 — замкнений ланцюг чуттів (око → тіло → язик → вухо → слово → ніс → око) з наростанням спотворення в другій половині; ланцюг має лишитися замкненим, а розпад — поступовим"
  - "::[Intelligence]:: (a26, a39), ::[Persuade]:: (a102, a135), ::[Dexterity]:: (a29, a82) — теги перевірок; ::[Переконати]:: уже в глосарії"
  - "a26 і a39 — той самий текст, скорочений у a39; спільна частина має збігатися дослівно"
  - "q5, q96, q108, q119, q123, q128 повторюють формулу «Do not be afraid» / «Step up!» — тримати їх однаковими між собою"

