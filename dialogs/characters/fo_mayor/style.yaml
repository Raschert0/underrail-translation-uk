    note: "внутрішньоігрове порівняння; «coil spider» не має канонічного українського варіанта — узгодити перед перекладом"
  - unit: q74
    src: "stopped the Foundry Guard dead in its tracks"
    note: "локалізувати як «спинив… як укопаних», не дослівно"
  - unit: q74
    src: "It's hard rock."
    note: "буквальна констатація про камінь, а не музичний жанр"
  - unit: q70
    src: "the most remote cave known... unknown to humanity"
    note: "самовиправлення мовця — обірваність зберегти"
  - unit: q117
    src: "a Southgater who thinks he's better than everyone"
    note: "демонім від South Gate Station; канонічної форми немає — див. pitfalls"

pitfalls:
  - "$(context.player.Name) і $(context.PlayerNameCaps) не відмінювати й не чіпати всередині плейсхолдера; будувати фразу так, щоб ім’я стояло в називному"
  - "Foundry Guard за глосарієм лишається латиницею, тоді як саме місто Foundry — «Ливарня»; в одному реченні q4 трапляється і те, і те"
  - "Chief — звання, з малої: «шеф Баннер» (registry, kind: title)"
  - "q58 «Institute of *Tchort*? You mean just the Institute?» — гра на тому, що мер уникає повної назви; зберегти обидві форми"
  - "q143 передражнює гравця лапками: «I \"run\" this \"place.\"» — лапки іронічні, передати як « » зі збереженням глузування"
  - "q114 «invictus» — титул на Арені, глосарій дає «Інвіктус»; у q111 гравець ужив його як самоназву"
  - "\\n\\n усередині q27, q31, q84, q86 — розрив абзацу, не переносити й не прибирати"

