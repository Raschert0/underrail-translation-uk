speakers:
  - slug: martin_marshall
    name: Мартін Маршалл
    units: default
    confidence: certain
    evidence: [q30, q143]
    role: >-
      Мер Ливарні — марнославний, дратівливий адміністратор, який говорить
      про місто як про власне досягнення. Публічно виступає високим штилем,
      наодинці зривається на зверхність і відверту грубість.
    relationships:
      - "шеф Баннер — командир Foundry Guard; мер тримається з ним підкреслено ввічливо, називає «sir»"
      - "Бернард — мер прямо застерігає його не слухати (q45, q67)"
      - "Сабан Мулов, Маркос Банті — підлеглі, до яких мер відсилає гравця"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Посадовець, який від початку тримає дистанцію й вимагає представитися
        (q27, q32). Навіть образи в нього канцелярсько-зверхні, а не вуличні,
        тож роздратування не переводить його на «ти» — STYLE §3.2.
      gender_cues: ["$(#man/woman)", "$(#he/she)", "$(#man/lady)"]
      switches:
        - {unit: q3, to: ви, trigger: "публічна промова до натовпу — урочистий регістр, множина «громадяни Ливарні»"}
    voice:
      register: пишномовний на публіці, дратівливо-зверхній наодинці
      idiolect:
        - "повторюване «Well and good» (q34, q69, q89) — словесний тик, тримати один український відповідник"
        - "риторичні триплети в промові: «We couldn’t let… We couldn’t let… We couldn’t let…» (q4)"
        - "зневажливе «that piece of junk» про піч (q44, q66) — повторюється дослівно"
        - "емфатичні зірочки *extreme*, *really*, *your* — інтонаційний наголос, не форматування"

  - slug: banner
    name: шеф Баннер
    units: [q6, q79, q81, q82, q84]
    confidence: probable
    evidence: [q79, q80]
    role: >-
      Командир Foundry Guard: стриманий, зібраний, говорить коротко й по суті —
      пряма протилежність меровому темпераменту (описано в нарації q31).
    relationships:
      - "мер Маршалл — начальник за посадою; шеф просить дозволу втрутитися («Mind if I interrupt you for a second, sir?»)"
      - "Сабан Мулов — єдиний уцілілий з його підрозділу; шеф говорить про нього з повагою"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова особа, звертається до гравця як «young $(#man/lady)» —
        поблажливо-старша, але офіційна манера. STYLE §3.2.
      gender_cues: ["$(#man/lady)"]
    voice:
      register: спокійний, військово-діловий, без пишноти

