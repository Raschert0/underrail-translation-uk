      Побудований на тому самому «outta», що й репліка гравця про заряд —
      гра слів, а не два випадкових образи.
  - unit: a22
    src: "you old fart"
    note: "стала образа; локалізувати, не калькувати"

pitfalls:
  - >-
    Головна риса вузла — око-діалект. Він має бути системним і українським:
    послідовне розмовне стягнення в усіх його рядках, а не випадкові
    апострофи в кальку до англійських.
  - >-
    Грубість не пом’якшувати (STYLE §9). q23 — відверто непристойна відповідь;
    вона має лишитися такою ж непристойною.
  - >-
    Кілька q-рядків обриваються пробілом і не мають крапки (q4, q5, q7, q9,
    q11, q12, q14, q16, q24, q30) — це склейка речення з наступного юніта.
    Кінцевий пробіл і незавершеність зберігати.
  - >-
    a25 містить «Uh,,,» — потрійна кома є в джерелі; це недбалість оригіналу,
    в українській пишемо звичайне трикрапкове вагання.

