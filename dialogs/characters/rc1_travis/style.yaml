speakers:
  - slug: travis
    name: Тревіс
    units: default
    confidence: certain
    evidence: [q2, q19, q46]
    role: >-
      Механік і торговець на станції Залізничний Переїзд, флегматичний до
      байдужості навіть під час нападу Безликих. Продає механічний верстак і
      колекціонує биті квадроцикли.
    relationships:
      - "Дзижчик — сусід-крамар, за якого Тревіс говорить найохочіше"
      - "Майлз — власник іншої крамниці станції, згадується побіжно"
      - "Микола — механік із Центрального Міста, чиє ім’я викриває брехню про «новий» верстак"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Суцільно вулична, редукована мова («Howdy», «Whatcha need?», «ain’t»,
        «’n’» замість and) — STYLE §3.2 «свої, вуличні → ти». Плейсхолдер
        $(#man/girl) — панібратське звертання, сигнал на «ти».
      gender_cues: ["$(#man/girl)"]
    voice:
      register: протяжний, лінивий, сільсько-технічний; ніякої ввічливої дистанції
      idiolect:
        - "стягнення: whatcha, outta, gonna, ain’t — передавати розмовними стягненнями, а не літературною нормою"
        - "«Nope» / «Yup» замість no/yes — тримати сталу пару коротких відповідей у всьому вузлі"
        - "«’n’» замість «and» — редукція сполучника, ознака вимови"
        - "подвійне заперечення «there ain’t nothing I can do» — просторіччя, не виправляти на норму"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; це стосується q2 і ремарок ::He grins.:: попри те, що сам Тревіс каже «ти»"

new_names: ["Travis", "Terry Baker", "Core City Housing Corporation"]

idioms:
  - unit: q33
    src: "One kent three wrenches."
    note: >-
      Внутрішньоігровий грошовий сленг: kent = тисяча харонів, wrench = сотня
      (a12 «eight wrenches» = 800 після знижки з 1300). Потрібне стале
      українське рішення на весь корпус; не перекладати wrench як «гайковий ключ»
  - unit: q2
    src: "swineshrooms"
    note: "вигадана назва гриба, мотивована свининою; словотвір відтворити, не калькувати"
  - unit: q27
    src: "Hot as hell."
    note: "захоплення технікою, не температура"
  - unit: q29
    src: "Way outta my league."
    note: "«не мого рівня», не спортивна ліга"
  - unit: q49
    src: "the old geezer"
    note: "грубувато-тепле про Дзижчика; згрубілість зберегти, STYLE §9"
  - unit: q28
    src: "Junkyard's where it's at now."
    note: "розмовна конструкція «оце там воно тепер і є»; не буквалізувати"
  - unit: q41
    src: "so many unusual people that it's become pretty usual to see unusual people"
    note: "навмисна тавтологія — жарт; повтор кореня зберегти, інакше репліка втрачає сенс"

