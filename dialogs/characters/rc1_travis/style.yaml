  - "Реєстрові й глосарійні назви: Mykola → Микола, Myles → Майлз, Buzzer → Дзижчик, Lora → Лора, Core City → Центральне Місто, Rail Crossing → Залізничний Переїзд, Junkyard → Звалище, SGS → ССГ, Free Drones → Вільні Дрони, Faceless → Безликі, charons → харони"
  - "«Underrail Protectorate» (q55) — «Underrail» лишається латиницею й не відмінюється, «Протекторат» перекладається"
  - "«S-750», «S-750k» — модель техніки, лишати латиницею без відмінювання"
  - "Друкарська помилка джерела «everthing» (q27) — перекладати за змістом"
  - "q6 «One kent-- One thousand three hundred» — обрив із самовиправленням: персонаж переходить зі сленгу на зрозумілі цифри; обрив зберегти"

