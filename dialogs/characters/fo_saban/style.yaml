speakers:
  - slug: saban
    name: Сабан
    units: default
    confidence: certain
    evidence: [q13, q15, q22]
    role: >-
      Вартовий Foundry Guard, єдиний, хто вцілів у сутичці зі Звіром, де загинуло
      дев’ять його побратимів. Говорить як службовець на посту: спершу статутно й
      закрито, далі — з дедалі більшою особистою люттю, тож картка має тримати
      обидва шари, а не зводити його до «злого вартового».
    relationships:
      - "Загиблі дев’ять вартових — побратими; про них говорить із виною, що вижив"
      - "Alp — вартовий, який вигадав назву bladelings; згадується побіжно"
      - "Ден — третій учасник плану зі Звіром (a47)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Сабан на службі й спершу випроваджує гравця статутно: «it's very unsafe to
        be in this area and you should leave», «it's classified». Знайомство
        відбувається офіційно, через шефа, з обміном іменами (q13, a14). За
        STYLE §3.2 службовець за обов’язком — «ви»; репліки гравця дзеркалять
        (§3.3). Гендерних плейсхолдерів-звертань у вузлі немає, рішення спирається
        на характер ролі.
      switches:
        - {unit: q48, to: ви, trigger: "зривається на крик («Are you telling me you planned all this pretty much on your own!?»), але базове «ви» не змінюється — це емоція, не перехід реєстру, за §3.3 не згладжувати й не переводити на «ти»"}
    voice:
      register: >-
        стриманий, статутний; під тиском теми Звіра переходить у різку, майже
        клятвену патетику з образами насильства
      idiolect:
        - "звертається до гравця на ім’я — $(context.player.Name) у q3, q15, q34, q51, q64"
        - "любить перелічувати через тире: «Gun - check. Ammo - check. Shield - check!»"
        - "у пам’ятних монологах будує довгі складені періоди з двокрапкою й переліком"
        - "«we're in a lot of muck» — повторювана евфемістична лайка, той самий зворот у q24 і q27; має бути тим самим виразом і українською"

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q2, q3, q4, q5, q6]
    confidence: unknown
    reason: >-
      П’ять коротких вигуків-барків перед боєм біля печі, без імені в нарації та
      без звертання на ім’я до мовця. Тематично пасують Сабанові (згадка щита
      перегукується з його прикметним щитом), але q7 прямо каже, що щит і однострій
      мають усі вартові Foundry Guard, тож це може бути будь-хто з групи біля печі.
    guidance: >-
      Базовий реєстр вузла («ви» до гравця), коротка уривчаста фраза, без
      гендерованого минулого часу й без гендерних форм першої особи — мовець може
      виявитися будь-ким із вартових.

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Довгі описові блоки q7, q16, q24, q44 — прозова
    нарація від другої особи; q7 звертається до гравця напряму («your approach»,
    «your inspection»).

