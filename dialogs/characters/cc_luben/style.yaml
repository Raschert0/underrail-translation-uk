pitfalls:
  - "У вузлі немає жодного $(#…) — але українське минуле часу в зверненнях до гравця гендерне; де Любен говорить гравцеві про його дію (q39 «You tricked me!»), плейсхолдер треба додати. STYLE §2: додавання — не вільність."
  - "«Coretech» лишається латиницею й не відмінюється (глосарій, read-only)."
  - "«Drop Zone» → «Зона Скидання», «zoner» → «зонер» — обидва є в глосарії, брати звідти."
  - "«Mister Halidorson» (q41) — прізвище Ola Halidorson, канонічно «Халідорсон»; звертання «Mister» до цієї шанобливості Любена, тримати запобігливий тон."
  - "q34 починається з пробілу перед текстом — не чіпати провідний пробіл, він відтворює паузу після q33."
  - "«slanted roofs» (q11, q20, q36, q45) — це квестова прикмета локації; формулювання має бути ідентичним у всіх чотирьох, інакше гравець не впізнає підказку."
  - "q9 і q26, q11 і q36, q20 і q45 — майже дослівні дублікати з різних гілок; розбіжність у перекладі читатиметься як помилка."

