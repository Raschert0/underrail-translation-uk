speakers:
  - slug: luben
    name: Любен
    units: default
    confidence: certain
    evidence: [q1, q9, q41]
    role: >-
      Дрібний злодій, якого загнали в кут: він викрав ICPD на замовлення й одразу
      втратив пристрій, а тепер тримає гравця на мушці й торгується за власне життя.
      Кожна його репліка — це або погроза, або скиглення, або спроба вимінятися.
    relationships:
      - "Ола Халідорсон (Coretech) — замовник, якого Любен зве «Mister Halidorson» і боїться"
      - "Зонер із трьома дівками із Зони Скидання — ті, хто його пограбував"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Мовець вуличний і від початку ворожий — зве гравця «scumbag», «you scum»,
        погрожує зброєю. STYLE §3.2: грубий, вуличний мовець — «ти». Репліки гравця
        дзеркалять (§3.3), зокрема наказові «Speak.», «No deal.».
      gender_cues: []
    voice:
      register: панічний, уривчастий, злодійський
      idiolect:
        - "нав’язливе «Damn it!» — головний словесний тик, повторюється в q6, q9, q11, q20, q24, q26, q33, q36, q45, q47; варіювати українські вигуки, але не глушити"
        - "обірвані на півслові речення з подвійним тире: «I mean, I don't-- Damn it!», «Do you think I'm an id--» — обрив зберігати, це ознака переляку"
        - "потрійні повтори від нервів: «Wait, wait, wait!», «Deal? Deal?», «Really? Really!?», «just... just»"
        - "божіння як опора: «I swear» майже в кожній поступці"

narration:
  present: true
  note: >-
    «Ви» без винятків — STYLE §3.1, попри те що сам Любен каже гравцеві «ти».
    Нарація тут майже вся — повторюваний бойовий тригер про його погляд перед
    пострілом (q17, q22, q39, q43, q47); формулювання має бути тотожним у всіх п’яти.

