  - "Oculus — за глосарієм «Окулус»; похідне «oculite» канонічного варіанта не має"
  - "crawlers (q18, q22, q28) — за глосарієм «повзуни»; Ironheads (q34) — «Залізноголові»"
  - "q22 майже дослівно повторює q18 — переклад спільної частини має збігатися посимвольно"
  - "q46 і q48 — той самий абзац про кіборга у двох гілках; тримати ідентичними"
  - "a3 «::Barter::» без крапки, a8 і a69 «::Barter.::» з крапкою — крапку не додавати й не прибирати, вона частина рядка"
  - "«bloody» в q12 стоїть двічі поспіль («cramped bloody, freaking bloody») — це навмисна плутанина мовця, не помилка джерела"

