speakers:
  - slug: constantine
    name: Константин
    units: default
    confidence: certain
    evidence: [q1, q67]
    role: >-
      Квартирмейстер Окулуса — торговець спорядженням на нижній платформі.
      Ключ до голосу: чемний фасад, що раз у раз лускає гучним нападом
      роздратування, після якого він відкашлюється й вибачається.
    relationships:
      - "Азіф — старший, до нього Константин відсилає всі незручні питання"
      - "Абрам — згадка імені викликає в нього вибух; причина не названа"
      - "Філліс — на її ім’я реакція така сама, дослівно дзеркальна (q59, q60)"
      - "Шестипалий кіборг («Six») — клієнт, якого радить не чіпати"
    address:
      npc_to_player: змішане
      player_to_npc: ви
      basis: >-
        Базово «ви»: він обслуга при посаді (STYLE §3.2), тримає повні форми
        («I apologize», «I suggest you do not bother the cyborg») і зустрічає
        гравця церемонним «Welcome ... I'm Constantine, the Oculus quartermaster».
        У нападах гніву фасад падає — там доречне «ти». Гравець тримає рівне «ви»
        весь вузол: його репліки нейтральні навіть у шпильці a20.
      switches:
        - {unit: q15, to: ти, trigger: "перший зрив, докір гравцеві просто в обличчя"}
        - {unit: q42, to: ти, trigger: "«ME to answer your stupid questions!?» — образа адресована гравцеві"}
        - {unit: q52, to: ти, trigger: "вибух на згадку про Абрама"}
        - {unit: q59, to: ти, trigger: "той самий вибух на згадку про Філліс — переклад дзеркалить q52"}
    voice:
      register: чемно-крамарський, що зривається на крик і повертається назад
      idiolect:
        - "«bloody» як наскрізний підсилювач — має звучати однаково брутально в усіх вживаннях"
        - "«Khm.» / «::Clears throat.::» — ритуал повернення до чемності після зриву"
        - "«Arrrgh!» з розтягнутим голосним — зберігати довжину"
        - "«I apologize» дослівно повторюване — це формула, не варіювати синонімами"
        - "рвані самоперебиви з комами: «this, this orb of annoyance», «all sorts of, of infuriating things»"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1, навіть коли сам Константин зривається на «ти»"

new_names: ["Six", "Jack Quicksilver", "Lunatics", "Lurkers", "Whisperers", "Khazum Morakht", "EDS", "Electric Defense System", "oculite", "oculites"]

