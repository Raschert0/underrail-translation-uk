    note: "порівняння з опроміненням — образ технічний, зберегти саме його, не замінювати побутовим"
  - unit: q30
    src: "this orb of annoyance that flies around my head"
    note: "абсурдний образ, вигаданий на ходу; не згладжувати в звичне «мене дістали»"
  - unit: q35
    src: "thick-headed cretins"
    note: "грубе лишається грубим — STYLE §9"
  - unit: q47
    src: "I wouldn't put my charons on getting an answer"
    note: "букмекерська формула «не ставив би»; charon — за глосарієм «харон», монета"
  - unit: q39
    src: "they end up as ashes scattered all over the cave floor"
    note: "він смакує деталь — тримати зловтішний тон, не нейтралізувати"
  - unit: q31
    src: "WHAAAAAAAAAAAA!"
    note: "передражнювання лунатиків; зберегти довжину розтягнутого голосного"

