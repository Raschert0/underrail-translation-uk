  - "«Tchort is evolution», «Adapt and overcome!» — ритуальні гасла культу, узгодити з tch_curator, tch_prevlic, tch_vladan"
  - "q2, q3, q4, q12, q14, q16 містять $(context.player.Name) — не відмінювати всередині плейсхолдера; будувати фразу так, щоб називний відмінок був природним"
  - "a23 «Let's get this over with as already» — граматична помилка джерела; у перекладі не відтворювати як помилку"
  - "«sister» у a10, a24, a25 — сан-звертання побратимів, кличний відмінок"
  - "a9 ::End Dialog.:: — службова підказка, інфінітив за STYLE §3.5"

