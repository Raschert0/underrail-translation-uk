speakers:
  - slug: theresa
    name: Тереза
    units: default
    confidence: certain
    evidence: [q4]
    role: >-
      Рясофорка служби безпеки Інституту, що під приводом «кількох запитань»
      веде гравця вглиб. Підкреслено ввічлива; ввічливість — інструмент тиску,
      і зривається вона миттєво, щойно гравець відмовляє.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова особа при виконанні, формули «Would you be so kind»,
        «Would you kindly follow me» — «ви» за STYLE §3.2. Гравець дзеркалить
        базовий регістр (§3.3), навіть коли грубить.
      gender_cues: ["$(#brother/sister)"]
      switches:
        - {unit: q18, to: ви, trigger: "тон холоднішає до крижаного, але регістр не змінюється — зрив передається лаконічністю, не переходом на «ти»"}
    voice:
      register: рівна професійна ввічливість, що дає тріщину
      idiolect:
        - "нав’язливе «please» — q6 не має, а q12, q14, q16 тримають; наростання тиску"
        - "звертання на ім’я гравця майже в кожній репліці — q2, q3, q4, q12, q14, q16; це прийом тиску, не вирізати"
        - "запевняння-повтори «It won't take long», «This won't take too long», «It won't take too much of your time» — три варіації однієї формули, тримати їх схожими, але не тотожними"
        - "остання репліка стискається до одного слова: «No?»"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; ремарки q4 і q20"

