idioms:
  - unit: a7
    src: "let's get this over with"
    note: "«покінчімо з цим швидше»; повторюється в a23 у зіпсованій формі"
  - unit: a22
    src: "Whatcha gonna do about it?"
    note: >-
      Навмисно вульгарне стягнення — виклик. Зберегти зниження регістру
      (STYLE §9), не вирівнювати в літературне «що ви зробите».
  - unit: q20
    src: "concealed stare"
    note: "погляд з-під маски; не «прихований погляд» буквально"

