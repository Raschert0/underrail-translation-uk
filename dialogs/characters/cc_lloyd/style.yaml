    evidence: [q2, q37, q45]
    role: >-
      Вартовий-солдат, що не пускає гравця до службової будівлі й перевіряє
      перепустку. Увесь вузол — одна сцена біля дверей: або гравця викривають,
      або він видає себе за свого. Ім’я в тексті жодного разу не звучить,
      мовець установлений за текою й за нарацією «The soldier…» у q2, q33.
    relationships:
      - "Bob — власник украденої перепустки, товариш вартового; саме за нього мовець приймає гравця (q22)"
      - "Captain Wilkins — його безпосередній командир (q47)"
      - "Colonel Cathcart — офіцер, на якого гравець марно посилається (a42, q43)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова особа при виконанні; тричі вживає $(#sir/ma'am) (q1, q45, q51)
        і формулу «Move along, citizen» — сильний сигнал на «ви», STYLE §3.2.
      gender_cues: ["$(#sir/ma'am)", "$(#Sir/Ma'am)"]
      switches:
        - {unit: q8, to: ти, trigger: "викриття — переходить на команду й лайку «zoner»"}
        - {unit: q19, to: ти, trigger: "відверта зневага: «You're one dumb zoner, aren't you?»"}
        - {unit: q22, to: ти, trigger: "приймає гравця за товариша Боба — панібратське «man», службова дистанція зникає (q22–q26)"}
        - {unit: q36, to: ти, trigger: "«Alright, buster, the jig is up» — зброя піднята, ввічливість скінчилася"}

