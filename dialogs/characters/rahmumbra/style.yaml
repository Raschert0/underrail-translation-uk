  - unit: a174
    src: "your mumbo-jumbo"
    note: "розмовна зневага гравця до незрозумілої мови; шукати живий український відповідник, не транслітерувати"
  - unit: a248
    src: "you cybernetic freak! I ain't answering"
    note: "грубість плюс просторічне ain’t — грубе лишається грубим (STYLE §9), знижений регістр гравця тут свідомий"
  - unit: q275
    src: "Lower your tone before it gets you killed"
    note: "погроза через формулу «поки це тебе не вбило»; зберегти безособовість погрози"
  - unit: q222
    src: "I could see that lie as it pulsed through your brain, neuron to neuron"
    note: "квазінауковий образ, не спрощувати до «я бачу твою брехню»"

