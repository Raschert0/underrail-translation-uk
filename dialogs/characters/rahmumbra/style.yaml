  - "Звертання «Rahm-Umbra» в a7 адресоване NPC — це репліка гравця, а не мовця; ім’я в q-рядках не вказує на мовця"
  - "q193 називає його «Six» — це друге іменування того самого персонажа, а не інший мовець; форму погодити централізовано разом із Rahm-Umbra"
  - "Терміни з глосарію: Tchort → Тчорт, Faceless → Безликі, Tunnelers → Тунельники, Deep Caverns → Глибокі Печери, Oculus → Окулус, Black Sea → Чорне Море, Rail Crossing → Залізничний Переїзд, Foundry → Ливарня, South Gate Station → Станція Саут-Гейт, Azif → Азіф"
  - "«Lower Underrail» (a139, a147) — Underrail лишається латиницею й не відмінюється (глосарій)"
  - "q2, q183, q186, q189, q264 містять \\n\\n — послідовність зберігати дослівно"
  - "Тчорт послідовно «it», а не «he» (q17, q20, q50) — в українському тексті не наділяти його чоловічим родом там, де це руйнує образ безособової сутності"
  - "q59, q64, q84 закінчуються пробілом перед <end> — не «виправляти» структуру рядка"
  - "Мовлення гравця тут коливається від холодно-ввічливого до відвертої лайки (a164, a233, a248); базовий регістр — «ви», емоційні зриви регістру не змінюють (STYLE §3.3)"

