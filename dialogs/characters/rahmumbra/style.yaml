speakers:
  - slug: rahm_umbra
    name: Rahm-Umbra
    units: default
    confidence: certain
    evidence: [q1, q6, q193]
    role: >-
      Нелюдська кіборгізована істота «не з цього світу», що чекає на гравця біля входу
      до володінь Тчорта й скеровує його на знищення Тчорта та повернення артефакта
      Безликим. Говорить як вища сутність, яка пояснює недорозвиненому співрозмовникові
      те, чого той не здатен осягнути.
    relationships:
      - "Азіф — «наш спільний друг», єдиний, кого він визнає компетентним серед людей"
      - "Безликі / Тунельники — союзники його роду, артефакт має повернутися саме їм"
      - "Тчорт — сутність, знищення якої і є метою розмови"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Повна відсутність скорочень і розмовних форм — «I do not know», «It is unlikely»,
        «That is none of your concern» — плюс книжний синтаксис. Це формальний, дистанційований
        мовець, а не свій-вуличний. Зверхність передається лексикою («little $(#man/woman)»,
        «your deficient language», «your fragile mind»), а НЕ переходом на «ти»: якщо його
        перекласти на «ти», зникне саме те, що робить його чужим і холодним.
      gender_cues: ["$(#man/woman)"]
    voice:
      register: >-
        холодний, книжний, беземоційний; довгі складнопідрядні періоди, жодних скорочень,
        нуль вигуків
      idiolect:
        - "«event» / «events» — його ключове слово-термін для перебігу подій (q9, q20, q23, q25, q173); перекладати ОДНИМ сталим словом наскрізь, не варіювати синонімами"
        - "«your kin» про людей і «my kin» / «my people» про свій рід (q42, q45, q49, q86) — сталі протиставні пари, тримати послідовно"
        - "«oculite» — його назва для гравця через зв’язок з Окулусом (q9, q176, q186, q195)"
        - "покірливо-наказові однослівні відповіді: «Do so.», «Go on.», «I am listening.» (q38, q117, q103) — коротко й безособово"
        - "лапки навколо людських слів, значення яких він не приймає: «savages», «torch», «complex», «kind» — зберігати як « », це маркер його відстороненості"

narration:
  present: true
  note: >-
    Дуже великий обсяг нарації, зокрема довгі описи зовнішності (q187, q188, q251) і
    відчуттів гравця під тиском аури (q194, q200, q241). «ви» без винятків — STYLE §3.1.
    Підказки дій усередині «::…::» — інфінітив (§3.5): «::Fight!::», «::Give up.::»,
    «::End Dialog.::», «::Leave him be.::».

