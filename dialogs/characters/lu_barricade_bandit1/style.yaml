speakers:
  - slug: lu_barricade_bandit1
    name: бандит на барикаді
    units: default
    confidence: certain
    evidence: [q5, q8, q16]
    role: >-
      Здирник на барикаді, який править мито за прохід. Уся його
      характерність — у перепадах: від хамства «maggot» до запобігливого
      мимрення «Um... um...», щойно на нього натиснуть, і до масного
      загравання, коли гравця вмовляють.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        «punk», «maggot», «Hop along little hopper» — вуличне хамство,
        це «ти», STYLE §3.2. Гравець відповідає так само, STYLE §3.3.
      gender_cues: ["$(#jack/sister)", "$(#sir/ma'am)"]
      switches:
        - {unit: q8, to: ви, trigger: "глумливо-ввічливе $(#sir/ma'am) після отриманих грошей — іронія, а не справжня шанобливість; підкреслена ввічливість має контрастувати з «Now get movin'!» у тому ж рядку"}
        - {unit: q3, to: ти, trigger: "переляк після залякування — той самий «ти», але з мимренням і паузами"}
    voice:
      register: хамський, боягузливий під тиском, масно-загравальний
      idiolect:
        - "«maggot» як стала образа (q5, q13, q18) — тримати один переклад в усіх трьох"
        - "«Um... um...» і «Um...» — мимрення переляку в q3, q16, q17; кількість пауз зберігати"
        - "пестливі звертання-загравання: sweetcakes (q21), sweetheart (q25) — масні, не ніжні"
        - "звуконаслідування «BLAM!» капслоком (q2) — лишати вигуком, капслок зберігати"

