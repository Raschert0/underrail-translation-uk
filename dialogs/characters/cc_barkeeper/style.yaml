    note: "грайливий евфемізм; §9 — грубувате лишається грубуватим, не пом’якшувати"
  - unit: q145
    src: "Poor woman crossed the tracks"
    note: >-
      внутрішньоігровий евфемізм смерті (рейки метро); зберегти образ,
      не замінювати нейтральним «померла»

pitfalls:
  - "q1 містить $(#you/your pretty face) — обидві гілки треба розгорнути українською"
  - >-
    Hardcore City Bar → Хардкор Сіті Бар (глосарій); слово hardcore у мові Джина
    поза назвою — не бренд, перекладається за контекстом
  - "Core City → Центральне Місто, Faceless → Безликі (глосарій)"
  - "q128 «listen carefuly» — друкарська помилка джерела, не відтворювати"
  - >-
    у вузлі є $(#She's married, mate. Just so you know./) — ціле речення в
    чоловічій гілці й порожня жіноча. Порожню гілку лишати порожньою:
    це задум (репліку чує лише гравець-чоловік), а не втрачений переклад

