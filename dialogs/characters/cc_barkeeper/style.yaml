# Вузол на двох мовців. Пастка: кожне звертання «Gene» в q-рядку означає, що
# говорить НЕ Джин, а Гаррієтта. Питання власності знято дослівно в q1.
speakers:
  - slug: gene
    name: Джин
    units: default            # усі q-юніти, не заявлені іншими мовцями
    confidence: certain
    evidence: [q1]            # «I'm Gene, the owner, and this here is my beautiful wife Harriette»
    role: >-
      власник Хардкор Сіті Бар у Центральному Місті; вузол торгівлі, чуток і
      наводок на половину міських квестів
    relationships:
      - "Гаррієтта — дружина, працює поруч; постійно кепкує з нього, він піддається"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        гучний, панібратський шинкар; кличе гравця $(#mate/love) — приятельське,
        не службове звертання; жодного $(#sir/ma'am) у вузлі немає
      gender_cues: ["$(#mate/love)", "$(#you/your pretty face)"]
    voice:
      register: гучний, хвалькуватий, добродушний
      idiolect:
        - "нав’язливе Absolutely — словесний тик, варто зберегти сталим відповідником"
        - "hardcore як універсальний епітет: бар, чоловіки, справи"
        - "переходить на шепіт, коли йдеться про Олігархів чи Motion — ::He whispers.::"

  - slug: harriette
    name: Гаррієтта
    units: [q15, q64, q83, q132, q226, q230, q238, q240, q243, q247]
    confidence: certain
    evidence: [q1, q56, q64, q230, q243]
    role: дружина Джина; уточнює й підколює його, зрідка сама дає інформацію
    relationships:
      - "Джин — чоловік; звертається до нього на ім’я, звідси й атрибуція"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: "кличе гравця sweetie; той самий домашній тон, що і в cc_harriette"
      gender_cues: ["$(#gentleman/lady)"]
    voice:
      register: тепла іронія, сухі шпильки
      idiolect:
        - "виправляє Джина конструкцією «What Gene meant/wanted to say is…» (q230, q238)"
        - "звертається до гравця sweetie"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1, попри те що обидва мовці кажуть «ти»"

