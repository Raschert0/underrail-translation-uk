    src: "Name your poison"
    note: "усталене барне; не калькувати «назви свою отруту» — питання «Що наливати?»"
  - unit: q65
    src: "Gives me collywobbles"
    note: "розмовне «аж вивертає»; collywobbles — не медичний термін"
  - unit: q243
