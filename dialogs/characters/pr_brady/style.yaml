speakers:
  - slug: brady
    name: Брейді
    units: default
    confidence: certain
    evidence: [q4]
    role: >-
      Рядовий Брейді Гоман — виснажений вцілілий із заблокованого об’єкта,
      єдиний, хто говорить за цілу групу. Знесилений, вдячний до нестями,
      мова уривається на півслові.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Рядовий до капрала-рятівника: суцільне $(#sir/ma'am) майже в кожній
        репліці — найсильніший можливий сигнал на «ви» (STYLE §3.2).
        Гравець відповідає статутно («Time to go home, soldiers») — дзеркалить §3.3.
      gender_cues: ["$(#sir/ma'am)", "$(#Sir/Ma'am)", "$(#man/woman)"]
    voice:
      register: знесилений, захеканий, надміру шанобливий
      idiolect:
        - "повтори від виснаження: «for... for... for a month», «falling... falling rocks»"
        - "трикрапки в середині речення — брак дихання, а не роздуми; зберігати всі"
        - "капслок як зрив голосу: «THANK YOU!»"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Довгі описові блоки q1, q8, q26 —
    зв’язна проза про групу вцілілих.

new_names: ["Homan", "Dreadnought"]

