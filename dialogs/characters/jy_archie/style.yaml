      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        $(#jack/sister) у q1 і q27 — вуличне панібратське звертання (STYLE §3.2).
        Підтверджують наказові «tread carefully», «leave me to my fishin'» і суцільне
        просторіччя.
      gender_cues: ["$(#jack/sister)"]
    voice:
      register: просторічний, буркотливо-байдужий; короткі рублені речення
      idiolect:
        - "ya замість you, yerself замість yourself — послідовне просторіччя, передавати українським розмовним регістром, а не спотвореним правописом"
        - "подвійне заперечення: «We ain't got no laws», «I don't have none» — граматична неправильність навмисна, зберігати"
        - "випадання g: fishin', Crossin', Scavengin', nothin'"
        - "нав’язливе «Yup.» окремим реченням — словесний тик, тримати однаковим у q5, q9, q23"
        - "зачини «Eh...», «Nah.», «Why,»"
        - "розтягнуте «de-licious» у q11 — інтонаційне підкреслення, зберігати розрив"

