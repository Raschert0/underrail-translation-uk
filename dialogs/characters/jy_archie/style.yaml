    role: >-
      Рибалка на Звалищі, якому бракує двох пальців і терпіння: відповідає на питання
      неохоче, весь час натякаючи, щоб його лишили ловити рибу. Найгустіший діалект
      у пакеті — саме він, а не зміст реплік, робить персонажа.
