    name: Мора
    units: default
    confidence: certain
    evidence: [q8, q9, q41]
    role: >-
      Бійчиня Вільних Дронів, яку Протекторат тримає в камері; гравець її
      визволяє. Далі — вдячна оповідачка, що переказує історію осередку та
      характеризує решту побратимів.
    relationships:
      - "Бекет — давній друг і діловий партнер, постачальник осередку (q73, q74)"
      - "Кокошка — загиблий побратим, згадує з ніжністю (q63–q66)"
      - "Джулія Дарлінг — подруга, до якої Мора ходить виговоритися (q70, q71)"
      - "Трентон і Бейт — керівники осередку (q76, q82)"
      - "Марселла — взірець, «сильна лідерка» (q85, q87)"
      - "Гатч — загиблий молодший товариш (q60)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вулична, панібратська мова з наскрізним «man» як звертанням-заповнювачем
        і гендерним $(#jack/sis) — прямий маркер на користь «ти» (STYLE §3.2).
        Після визволення тон іще теплішає: «my savior», «$(#jack/sis)».
      gender_cues: ["$(#jack/sis)", "$(#him/her)"]
      switches:
        - {unit: q4, to: ти, trigger: "на початку вона налякана й насторожена — холодність передається лексикою, а не переходом на «ви»"}
    voice:
      register: вулична, емоційна, з лайливими характеристиками ворогів
      idiolect:
        - "наскрізне випадання g: gettin', savin', rottin', joinin', dyin', motivatin', hackin', nuthin' — в українській компенсується розмовною лексикою й синтаксисом, не фонетичним трюком"
        - "«man» як заповнювач на початку й усередині речення — не «чоловіче», а розмовне «слухай», «блін», «от», і не в кожному входженні"
        - "«ain't», «'cause», «outta», «nuthin'» — просторіччя"
        - "«Cans» — зневажливе прізвисько протекторатців, повторюване й пізнаване"
        - "Протекторат і його людей називає щурами й свинями (q80, q81, q83) — грубість не пом’якшувати"

