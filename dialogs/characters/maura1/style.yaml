pitfalls:
  - >-
    q85 і q87 — це та сама репліка у двох варіантах під стать гравця: у q85
    «You're a man, you might not understand it», у q87 «to us girls». Не
    зводити до одного тексту й не міняти адресата місцями.
  - >-
    q64 і q66 — той самий монолог у минулому (Кокошка загинув) і теперішньому
    (живий) часі. Час дієслів розрізняє гілки, його треба зберегти.
  - >-
    q65 «"He very fine man."» — навмисно ламана англійська, цитата чужих слів.
    Ламаність відтворити українською, а не виправляти на грамотне речення.
  - "$(#jack/sis) (q50, q90, q92, q96, q101) — гендерне звертання; обидві гілки перекласти українськими кличними формами, STYLE §2"
  - "$(#him/her) в a95 — гендерна форма гравця у ролі об’єкта, узгодити з рештою речення"
  - "$(context.player.Name) (a32, q33, a44, q45, a89, a91) — не відмінювати всередині плейсхолдера"
  - "q57 містить *Which* — зірочки є розміткою наголосу, зберігати"
  - "\\n\\n у q22, q45, q50, q64, q66, q85, q87, q90, q92, q94, q96 — літеральний розрив рядка, не чіпати"
  - >-
    «North Underrail», «Upper Underrail» — за глосарієм Underrail лишається
    латиницею й не відмінюється: «Північна Underrail», «Верхня Underrail».
    Biocorp — так само латиницею.
  - "«Free Drones» → «Вільні Дрони», «Protectorate» → «Протекторат», «Junkyard» → «Звалище», «rathounds» → «щурчаки», «Invictus» → «Інвіктус» — глосарій"
  - "Імена з реєстру: Becket → Бекет, Hutch → Гатч, Kokoschka → Кокошка, Darling → Дарлінг, Trenton → Трентон, Bate → Бейт, Marcella → Марселла, Maura → Мора"

