speakers:
  - slug: stavros
    name: Ставрос
    units: default
    confidence: certain
    evidence: [q4, q6, q241, q242, q247]
    role: >-
      Гармост Ставрос — командувач Preservation Forces у Cytosine Outpost, найвищий
      за званням тчортист у Глибоких Печерах після смерті Ейдейна. Говорить як
      воєначальник і водночас як духовна особа: наказ, доктрина й молитовна формула
      в одному реченні.
    relationships:
      - "Ейдейн — вищий за саном керівник Інституту; Ставрос приховує його смерть заради бойового духу"
      - "Превлич — рясофор в арсеналі, травмований; Ставрос захищає його від розмов"
      - "гравець — новіціат, якому Ставрос спершу не довіряє, потім цінує як бійця"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Найвищий сан і військова субординація: гравець незмінно звертається
        «Your Excellency», сам Ставрос віддає накази й вимагає підтвердження
        («Are we clear?»). Обидва напрямки — «ви» без винятків, навіть коли він
        кричить (q247).
      gender_cues: ["$(#man/woman)"]
      switches:
        - {unit: q215, to: ви, trigger: "зрив на крик «Out!» — регістр не змінюється, лише тон"}
    voice:
      register: >-
        високий, ораторський; повні речення без розмовних скорочень у наказах,
        книжковий синтаксис, звороти на кшталт «Adapt and overcome»
      idiolect:
        - "молитовні формули-обрамлення: «Tchort is Evolution» / «Evolution is Tchort», «Tchort guide you»"
        - "«Magnificent Tchort!» як вигук — не лайка, а вигук віри"
        - "«magnificence» про Тчорта повторюється як термін культу, тримати один відповідник"
        - "«inbreds» — зневажлива назва Безликих у його вустах, грубість зберігати"
        - "риторичне «Am I clear?» / «Are we clear?» — сталий контрольний повтор, перекладати однаково"

