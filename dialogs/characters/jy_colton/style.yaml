speakers:
  - slug: colton
    name: Колтон
    units: default
    confidence: certain
    evidence: [q63, q1, q3]
    role: >-
      Торговець і міняйло у Звалищі, свій серед Чорних Вугрів; після взяття Депо Б
      перебирає обов’язки доглядача пристані. Веде обмін валют, дає наводки й
      вибухівку, говорить як вуличний ділок, а не як службовець.
    relationships:
      - "Сайлас — доглядач пристані, до якого Колтон відсилає гравця (q63)"
      - "Скраппери — суперники, про них зневажливо: «those bastards control the gate»"
      - "Гравець — після Депо Б офіційно союзник: «Consider yerself our ally»"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Суцільна вулична мова з випаданням g і «ya/yer» замість you/your, плюс
        панібратське звертання $(#jack/lady) — STYLE §3.2 дає «ти», а репліки
        гравця дзеркалять базовий регістр (§3.3).
      gender_cues: ["$(#jack/lady)"]
    voice:
      register: розв’язана вулична говірка, добродушний ділок
      idiolect:
        - "суцільне випадання g: takin’, bein’, doin’, anythin’, leadin’, tradin’ — відтворювати українським просторіччям, а не апострофами"
        - "ya / yer / yerself замість you / your — тобто послідовне «ти» без жодного «ви»"
        - "ain’t, whatcha, yep, nope — короткі просторічні відповіді"
        - "торгова формула «Pleasure doin’ business with ya» повторюється в q14 і q23 — має бути дослівно однакова в обох"

