  - slug: mareth
    name: null
    units: default
    confidence: certain
    evidence: [q2, q98, q7, q11]
    role: >-
      Капітан CAU («хімів») Протекторату, який вербує гравця-капрала для газової атаки
      мутагеном на лігво Вільних Дронів. Говорить як освічений офіцер, що виправдовує
      масове вбивство термінологією («ми не вбили жодної людини — тільки собак») —
      холодна іронія й розпорядчий тон, а не крик.
    relationships:
      - "гравець — капрал у його підпорядкуванні, звертання виключно «Corporal»"
      - "Десс — підлегла, оцінює її прохолодно-професійно (q67, q68, q70)"
      - "Порожнеча — «my right hand man» (q75), мовчазний виконавець"
      - "консул Олівер — «our cowardly consul» (q91), зневага"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Мовлення бездоганно літературне, без випадання g і без вуличних стягнень;
        він старший за званням і тримає дистанцію повним «Corporal» у кожній репліці —
        службовий, формальний мовець (STYLE §3.2). Гравець відповідає «Yes, sir» (a99)
        і дзеркалить (§3.3); зухвалі a3, a37, a53 — зрив у межах «ви», не перехід на «ти».
      switches:
        - {unit: q38, to: ви, trigger: "різкий наказ «Now go!» — регістр той самий, змінюється лише тон; наказовий спосіб на «ви»: «Ідіть», STYLE §3.4"}
    voice:
      register: холодний, іронічний, розпорядчий; жорстокість подана як службова рутина
      idiolect:
        - "рефрен «No rest for the wicked» (q11, q15, q19, q47) — сталий переклад в усіх чотирьох входженнях"
        - "звіряча метафорика про ворогів: dogs, mongrels, mutts, hounds, vermin — тримати як систему, не зводити до одного слова"
        - "риторичні подвоєння «must I remind you… must I remind you» (q38) — зберігати паралелізм"
        - "виділення зірочками *I*, *one*, *will* — авторський наголос, зберігати розмітку"

