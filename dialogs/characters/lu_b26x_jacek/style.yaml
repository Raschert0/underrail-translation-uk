speakers:
  - slug: jacek
    name: "Jacek — канонічної української форми немає, див. new_names"
    units: default
    confidence: certain
    evidence: [q44, q24, q36]
    role: >-
      Ватажок табору, який тримає Г’юго заручником за борг у тисячу харонів і
      вимагає гроші від гравця. Голос — суцільна погроза з нетерплячим,
      вибуховим темпом; будь-яке пом’якшення руйнує сцену.
    relationships:
      - "Г’юго — боржник, якого він тримає; називає його не інакше як «this worm»"
      - "невідомий підлеглий, що пропустив гравця до табору (згадка в нарації q24)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Мовець грубий і відверто ворожий, звертається наказами й лайкою
        («Get lost!», «You got that?»), гендерних плейсхолдерів-звертань у вузлі
        немає, тож рішення спирається на характер персонажа (STYLE §3.2).
        Гравець дзеркалить базовий регістр, пор. «None of your business, pal».
    voice:
      register: агресивний, нетерплячий, вуличний; лайку й погрози не пом’якшувати
      idiolect:
        - "евфемістичне freakin' / freaking замість грубішого — тримати той самий рівень пом’якшеної лайки, не підсилювати й не знімати"
        - "рубана крапкова емфаза: «One. Thousand. Charons.», «I. Want. My. Money!»"
        - "потроєні повтори з наростанням: «I've waited … and waited, and WAITED!»"
        - "капслок як крик — окреме слово, не ціле речення"
        - "саркастичне цитування гравця з поверненням його ж слів"
        - "жорсткі короткі накази наприкінці репліки: «Now move it.», «Spill it.»"

