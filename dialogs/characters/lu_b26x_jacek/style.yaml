pitfalls:
  - "q20 і q40 — $(#he/she) стосується ГРАВЦЯ у третій особі (мовець передражнює його слова), а не адресата; це не звертання, тож потрібні форми «$(#він/вона)» з відповідним дієсловом"
  - "a26 містить $(context.player.Name) — не відмінювати всередині плейсхолдера"
  - "зірочковий наголос зберігати на відповідному українському слові: *hell* (q24, q42), *you* (q19, q39)"
  - "q47 у джерелі має злите «freaking'stupid» — це друкарська помилка джерела, українською писати нормально, роздільно"
  - "q13, q31, q37 — крапкова емфаза («One. Thousand. Charons.») працює тільки на коротких словах; при перекладі підібрати такий порядок слів, щоб рубка лишилася читабельною"
  - "charons → харони, stygian coins → стигійські монети (глосарій); сума «one thousand charons» повторюється в q13, q31, q37 — тримати однакове формулювання"
  - "Hugo → Г’юго (реєстр), відмінюється; апостроф — U+2019"
  - "q19/q39 і q20/q40 — дослівні дублікати пар; переклад має бути ідентичним у межах пари"
  - "::Attack!:: (a23, a50), ::Leave.:: (a11), ::Leave camp.:: (a6), ::Walk away.:: (a45) — підказки дії, інфінітив, STYLE §3.5"

