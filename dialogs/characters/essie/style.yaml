speakers:
  - slug: essie
    name: Ессі
    units: default
    confidence: certain
    evidence: [q1, q49, q51]
    role: >-
      Мешканка ССГ, яка знає станцію й маршрути напам’ять і радо розкладає
      гравцеві дорогу по кроках. Половина її реплік — це маршрутні вказівки,
      друга половина — балачка про станційні новини й покійного Патріка.
    relationships:
      - "Патрік Пірс — покійний, якого вона щиро любила; про нього говорить із болем"
      - "Великий Брет і Квінтон — дратують її буркотінням про Патрікові обігрівачі"
      - "Лора — поранена подруга, за яку вона тримає кулаки"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Стара знайома, а не службовець: одразу нагадує про себе на ім’я
        («remember me? Essie?»), сміється, вживає розмовне «not too shabby»,
        «gotta», «stinkin'» і сама зізнається «Sorry, I'm raging a bit».
        Гендерних плейсхолдерів звертання в джерелі немає.
    voice:
      register: тепла, балакуча, з легкою іронією; голос описано як «light soprano»
      idiolect:
        - "подвоєння для наголосу: «Right? Right?», «not too shabby, not too shabby»"
        - "маркер розважливості «I reckon» — не богословське «гадаю», а буденне «та мабуть»"
        - "лапки з астерисками для наголосу на слові — *entire*, *mad*, *killed*"
        - "у маршрутних репліках — чіткі команди напрямку поспіль; тримати їх короткими, не оздоблювати"

