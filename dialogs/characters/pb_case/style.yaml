pitfalls:
  - "q1 «DFAC is for military personnel only.» — єдина репліка без «Corporal» і без $(#sir/ma'am): суха службова відсічка. Не додавати ввічливості й не вирівнювати під решту його голосу"
  - "q33 і q39 містять майже дослівно однаковий довгий блок (гілки того самого діалогу) — перекладати ідентично; так само q31 і q37 у частині про таємницю"
  - "$(#sir/ma'am) → $(#пане/пані); регістр першої літери в гілках зберігати так, як у джерелі"
  - "Самоперебивання «Do you dig-- I mean understand» треба відтворити як обрив саме на жаргонному слові з наступною статутною заміною; якщо обрив зникне, зникне весь характер"
  - "q65 «the chems» — розмовна назва бійців CAU, а не «хімікати»"
  - "q2 «rathound stew» → щурчак (глосарій); «Kost» у цій репліці стоїть у звертанні — кличний відмінок"
  - "Глосарій: Core City → Центральне Місто (q56), Tunnelers → Тунельники і Faceless → Безликі (q70), Free Drones → Вільні Дрони, Protectorate → Протекторат, ::[Persuade]:: → ::[Переконати]:: (a29), ::Barter.:: → ::Торгувати.:: (a5)"
  - "Зірочки навколо слів (*us.*, *are*, *that*) — авторський наголос; переносити на відповідне українське слово, а не на позицію"
  - "«Underrail» у «South Underrail» лишається латиницею й не відмінюється (глосарій, read-only)"

