speakers:
  - slug: case
    name: Кейс
    units: default
    confidence: certain
    evidence: [q2, q3, q8, q31]
    role: >-
      Молодий південець, роздавальник у їдальні (DFAC) форту Fort Apogee;
      травмоване коліно не пустило його в солдати. Єдиний тут, хто говорить із
      гравцем як зі своїм — і щоразу себе на цьому осмикує.
    relationships:
      - "Лука — головний механік, перший друг у форті; разом п’ють біля рингу (q58–q60)"
      - "Анастасія, док Меррік — захищає її від співчутливих балачок (q62–q63)"
      - "Фрейзер — про нього принципово мовчить (q47–q48)"
      - "друзі дитинства серед Вільних Дронів — таємниця, яку він видає лише пошепки (q31)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        «$(#sir/ma'am)» у понад десяти репліках плюс постійне «Corporal» —
        обслуга, що говорить до старшого за званням; STYLE §3.2. Гравець
        дзеркалить (§3.3).
      gender_cues: ["$(#sir/ma'am)"]
    voice:
      register: привітний, послужливий, балакучий; пошепки — довірливий
      idiolect:
        - "«rotten» — словесний тик: rotten place, rotten thing, rotten psychos, rotten cyborgs (q21, q23, q56, q58, q65, q70). Має бути ОДНЕ українське слово в усіх входженнях"
        - "самоперебивання жаргон → статут: «Do you dig-- I mean understand» (q33, q39, q72), «Are you derailed... um, $(#sir/ma'am)?» (q39), «Eric... I mean, Staff Sergeant Fraser» (q18)"
        - "«um» як заповнювач вагання перед незручним словом"
        - "«Hardcore, hardcore.» (q59) — захоплений вигук, повтор зберігати"

