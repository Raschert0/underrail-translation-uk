speakers:
  - slug: fo_barkeeper
    name: шинкар
    units: default
    confidence: certain
    evidence: [q1, q5, q16]
    role: >-
      Шинкар Ливарні — головне джерело чуток у місті: розповідає про шахту,
      скельних тварюк, нетрі й місцевих торговців. Безперервно кашляє від
      брудного повітря, і цей кашель вплетений у майже кожну його репліку.
    relationships:
      - 'Hugo — постійний клієнт, шинкар його вигороджує попри підозрілу компанію'
      - 'Foundry Guard — гарант безпеки міста, говорить про них схвально'
      - 'Ironheads — вороги, зве їх barrenheads'
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Формально це обслуга, і STYLE §3.2 схиляв би до «ви», але звертання
        $(#pal/gal) — приятельське, і його підпирає суцільне просторіччя:
        ’cause, ya, ’im, you dig, жарти про girly men. Рішення на користь «ти»;
        це свідомий виняток із «обслуга → ви», і його треба тримати в усьому
        вузлі. Гравець дзеркалить (§3.3).
      gender_cues: ["$(#pal/gal)"]
    voice:
      register: гучний, панібратський, з грубуватим гумором
      idiolect:
        - 'словесний тик «you dig» (q21, q23, q26) — потрібен один повторюваний український відповідник, як-от «тямиш?»'
        - 'подвоєне ствердження «Yeah. Yeah.» і «Sure, sure.» — зберігати повтор'
        - 'сміх крізь кашель: He laughs and coughs at the same time — постійний прийом, не згладжувати'
        - 'односкладні відповіді-оцінки: «Golden.», «Nope, sorry.»'

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1, хоча сам шинкар каже «ти».
    Підказка дії ::Barter.:: — інфінітив (§3.5), готовий варіант у глосарії.

new_names: ["Bryan", "Stevenson", "Banner", "Ingram", "Balor", "rockies", "barrenheads"]

idioms:
  - unit: q1
    src: "dark, light, rocky and pansy"
    note: 'назви сортів пива — перекладати як цілісний набір; pansy має лишитися глузливим, бо на ньому тримається наступний жарт'
  - unit: q1
    src: "that one’s for girly men and northerners"
    note: 'грубий жарт — не пом’якшувати, STYLE §9'
  - unit: a11
    src: "the derailed preacher"
    note: 'залізнична метафора божевілля, доречна в Underrail; не калькувати «зійшов з рейок» буквально, але залізничний натяк варто зберегти'
  - unit: q12
    src: "Not Lunatic, but lunatic"
    note: 'гра на великій і малій літері: Lunatic — фракція, lunatic — просто причинний; протиставлення має читатися в українському'
  - unit: q15
    src: "be my guest and pay them a visit"
    note: 'іронічне запрошення — локалізувати, не калькувати'
  - unit: q38
    src: "that’ll do ya good"
    note: 'просторічне ya — регістр передавати лексикою, а не апострофами'
  - unit: q42
    src: "Eat that, Ironheads!"
    note: 'зловтішний вигук — «Отримайте!», не буквальне «з’їжте це»'
  - unit: q48
    src: "lubricate your dry, friable throat"
    note: 'навмисно пишномовний зворот у вустах шинкаря — комічний контраст зберегти'

