  - 'ремарка ::He coughs.:: повторюється щонайменше десять разів — перекласти один раз і вставляти дослівно, без синонімів'
  - 'q1, q16, q35, q39 містять $(#pal/gal) — гендерний плейсхолдер, обидві гілки в українських формах, латиниці всередині не лишати'
  - 'q1, q5, q39 містять літеральні \n\n — переносити без змін'
  - 'зірочка емфази у q6 (*I*) — розмітка наголосу, зберігати'
  - '«rockies» (q10) — місцеве прізвисько скельних тварюк; узгодити з назвою істоти централізовано'

