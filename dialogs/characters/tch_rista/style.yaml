speakers:
  - slug: rista
    name: Ріста
    units: default
    confidence: certain
    evidence: [q210, q75, q3]
    role: >-
      Головний дослідник (Principal Investigator) найзавантаженішого відділу Інституту
      Тчорта: пихатий, вічно роздратований науковець, який зустрічає гравця відкритою
      ворожістю, а після виконаного доручення різко теплішає до панібратства.
    relationships:
      - "Лідія — його безпосередня начальниця (Chief Investigator); боїться її й огризається за очі"
      - "Ейдейн — вища інстанція, згадується як формула («Eidein pardon them»)"
      - "Георгіс, Вук — підлеглі дослідники його відділу"
      - "Псих — піддослідна істота проєкту нейропацифікації, його головна цінність"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Ріста звертається до гравця виключно фамільярним $(#bro/sis), кидається лайкою
        («Out you inbred!») і командами («Now go!», «Out.»); це вуличне панібратство,
        а не службова ввічливість — STYLE §3.2. Гравець дзеркалить: «I feel for you man…»,
        «Tchort guide you, brother».
      gender_cues: ["$(#bro/sis)", "$(#Bro/Sis)", "$(#man/woman)", "$(#mister/miss)", "$(#his/her)"]
    voice:
      register: гучний, самозакоханий, дратівливий; наукова лексика впереміш із вуличною
      idiolect:
        - "«Indeed!» — головний словесний тик, окреме речення-вигук; тримати сталий український відповідник наскрізь"
        - "«Indubitably!» — другий тик, підкреслено книжніший за «Indeed»; має відрізнятися від нього"
        - "«Apex!» — його власний сленг на позначення «найвищого класу», і як вигук, і як прикметник («an apex find»)"
        - "«Magnificent Tchort!» — лайка-божба, не звертання до Тчорта"
        - "«That is all regarding the matter» — канцелярська формула закриття теми, повторюється дослівно"
        - "«cull» замість «kill» про істот — свідомий фаховий евфемізм, не зводити до «вбити»"
        - "емфатичні зірочки навколо слів (*I*, *should*, *before*) — зберігати на тому самому слові"
        - "«How-ever» через дефіс у q36 — навмисне розтягування, не помилка"

  - slug: panicked_investigator
    name: переляканий працівник лабораторії
    units: [q179, q183, q184, q186]
    confidence: probable
    evidence: [q179, q186]
    role: >-
      Безіменний співробітник, який вриваються в кабінет із новиною про втечу Психа;
      говорить задиханими уривками й звертається до Рісти на «Investigator».
    address:
      npc_to_player: ви
      player_to_npc: ти
      basis: >-
        До гравця прямо не звертається; з Рістою — підкреслено субординаційно
        («I'm so sorry to bother you, Investigator»), тож базовий регістр цього мовця — «ви».
    voice:
      register: захекана, перелякана службова мова
      idiolect:
        - "«Uh... whoooh...», «but, but, but» — задишка й затинання; відтворювати українськими вигуками, не викидати"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1, навіть там, де Ріста поруч каже «ти».
    q215 («::You hear rushed footsteps behind you.::») — суто нарація без мовця.
    a34, a38, a216 — підказки дій усередині ::…::, інфінітив за STYLE §3.5.

