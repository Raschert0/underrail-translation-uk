        Панібратське звертання «youngster» у кожній другій репліці, суцільні
        випадання g і просторіччя — «ти», STYLE §3.2; репліки гравця
        дзеркалять цей регістр, §3.3.
    voice:
      register: просторічний, довірчий, з нальотом хвальби
      idiolect:
        - "звертання «youngster» — словесний тик, тримати одним і тим самим українським словом у всіх репліках"
        - "випадання g: «fightin'», «lookin'», «tellin'» — знижений регістр, не вирівнювати до літературного"
        - "«he-he-he», «I'd be damned», «ya», «lotsa», «Them bloody Oligarchs» — просторічна морфологія, зберігати"
        - "шепіт і нахил уперед у q9 — зміна гучності всередині репліки, ремарку не прибирати"

