    англійської передавати однією формою
  - "«hoppers» → «стрибуни» (глосарій); у a55 це водночас каламбур-образа на адресу самого Ньютона"
  - "GMS (q7) лишається латиницею, SGS → ССГ — див. глосарій"
  - "розмітку наголосу *зірочками* (*not*, *hell*, *any*) зберігати"

