pitfalls:
  - "$(context.player.Name) трапляється у понад двадцяти юнітах (q3, q5, q11, q14, q23, q32, q35, q37, q57, q61, q73, q74, q82, q96, q142, q191, q200, q252, a194) — не відмінювати всередині плейсхолдера й не додавати закінчення поруч"
  - "$(#brother/sister) майже завжди у кличному звертанні (q2, q7, q43, q57, q90, q92, q100) — потрібна кличний-форма; у q21 воно з великої й у ролі підмета ($(#Brother/Sister) responded) — там називний"
  - "«Tchort guide you» та «Tchort is evolution / Evolution is Tchort» — ритуальні формули; q5 і a6 дзеркальні, переклад теж має дзеркалитися слово в слово"
  - "q10 «At. all. times.» — крапки як засіб наголосу, зберегти саме таке дроблення"
  - "виділення зірочками (*duty*, *very*, *order*, *we*, *you*, *Revolting*) — розмітка наголосу, переносити на відповідне українське слово"
  - "\\n\\n у джерелі — літеральні переноси рядків, не чіпати"
  - "q28 і q139 закінчуються нарацією без подальшого тексту — порожній хвіст юніта не заповнювати"
  - "суми монет у q52, q100, q115, q193 (400, 700, 550, 450) — stygian coins, глосарій дає «стигійська монета»; узгодити число з формою іменника"
  - "q1 і q2 — контекстні вигуки/привітання без діалогового оточення; атрибуцію Семюелові дає лексика («cull», «$(#brother/sister)»), а не сусідство"
  - "«Institute of Tchort» (Інститут Тчорта), «Faceless» (Безликі), «Deep Caverns» (Глибокі Печери), «Core City» (Центральне Місто) — глосарій, не перекладати наново"
  - "Preservation Forces у джерелі трапляється і як «Preservation», і як «Preservation Forces» — потрібне одне рішення на обидва варіанти"

