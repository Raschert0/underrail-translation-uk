speakers:
  - slug: samuel
    name: Семюел
    units: default
    confidence: certain
    evidence: [q5, q10, q21, q23]
    role: >-
      Медіант Семюел — друга особа в Preservation Forces Інституту Тчорта, тимчасово
      виконує обов’язки замість відсутнього гармоста Ставроса. Говорить як штабний
      офіцер, що весь час пам’ятає про свій ранг, і саме це, а не сюжет, диктує
      добір слів.
    relationships:
      - "єфрейтор Дензіл — підлеглий; Семюел зневажає його й прилюдно принижує (q12, q14)"
      - "гармост Ставрос — начальник, «His Excellency»; Семюел шанобливий, але дозволяє собі критику (q133)"
      - "Ейдейн — вища духовна інстанція Інституту; згадується з пієтетом"
      - "гравець — новіціат, якого Семюел просуває й водночас випробовує"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Семюел — високий чин, що звертається до новоприбулого підлеглого підкреслено
        церемонно ($(#brother/sister), «Welcome to my office»), а гравець послідовно
        відповідає титулами «Your Notability», «Mediant». Це службова вертикаль,
        а не вулиця — STYLE §3.2 і §3.3.
      gender_cues: ["$(#brother/sister)", "$(#Brother/Sister)"]
      switches:
        - {unit: q59, to: ви, trigger: "зривається на крик («Did you really just say that to me, novitiate?»), але «ви» тримає — грубішає лексика, не регістр"}
        - {unit: q105, to: ви, trigger: "переходить на прямий наказ («I *order* you to cull him!») — імперативи множини, STYLE §3.4"}
    voice:
      register: церемонний, багатослівний, поблажливо-ввічливий; під гнівом — уїдливий
      idiolect:
        - "нав’язливе питальне «no?» наприкінці речення — головний словесний тик; має бути ОДНА стала українська відповідність у всьому вузлі"
        - "божба «By the Tchort» / «Magnificent Tchort» — теж стала формула, не варіювати"
        - "евфемізм «cull» замість «kill» — свідома інституційна мова; потрібне одне дієслово скрізь, і воно не має бути нейтральним «вбити»"
        - "любить перепитувати самого себе й тут-таки відповідати («Hard work? Don’t make me laugh»)"
        - "наукоподібні евфемізми для людей — «foreign bodies», «devolved», «dystrophic»"

  - slug: denzil
    name: Дензіл
    units: [q3, q9, q11, q13, q15, q20]
    confidence: certain
    evidence: [q3, q9]
    role: >-
      Єфрейтор Дензіл — попередній квестодавець, який на початку вузла хвалиться перед
      медіантом і дістає прочухана. Його репліки звучать зовсім інакше — запобігливо,
      емоційно, з обірваними фразами.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        До гравця Дензіл звертається панібратськи й захоплено («good of you to finally
        show up!», глузливе «Khm... yo? Really?»), на відміну від медіанта. Базовий
        регістр самого персонажа задає його власний вузол — dialogs/characters/tch_denzil;
        тут лише не збивати його на офіційний тон Семюела.
    voice:
      register: запобігливий перед начальством, збуджений перед гравцем; обірвані фрази
      idiolect:
        - "затинається й перериває себе («I worked hard with, with $(context.player.Name)»)"
        - "до Семюела — виключно «Your Notability», «Mediant»"

