  - unit: q157
    src: "boxes of notable cubeness... of notable tesseractness"
    note: "псевдонауковий словотвір за зразком «of notable roundness»; тримати єдину модель"
  - unit: a894
    src: "Time to kick ass and chew bubble gum"
    note: "мем з Duke Nukem; має лишитися впізнаваною цитатою"
  - unit: q276
    src: "When you got zilch"
    note: "просторічне «ні шеляга», не нейтральне «нічого»"

pitfalls:
  - "a442 містить $(context.player.Name) — не відмінювати всередині плейсхолдера і не переносити його в інший відмінок фрази"
  - "Ім’я персонажа збігається із загальною назвою: «I'm the Dude» (q400, q439, q587) — Чувак з великої; «a dude's got to live somewhere» (q800), «if a dude ventures» (q594), «being the Dude» (q111) — загальна назва з малої. Розрізняти щоразу"
  - "Quinton vs Quentin (q111, a112, q113, a114) — Чувак вимовляє ім’я неправильно, гравець його виправляє. Канонічне Quinton → Квінтон (registry); для Quentin потрібна окрема, чутно інша форма, інакше жарт зникає"
  - >-
    Багато q-юнітів — обірвані фрагменти одного речення, склеєні в грі з наступним:
    q165 «And», q172 «Sure, man. But», q241 «Whoever you find, just tell them»,
    q519 «High pressure...», q559 «NAH! I'll have another one. Bar--», q1039
    «Therefore,». Не добудовувати їх до повного речення й не ставити крапку
  - >-
    Довгий п’яний блок реплік гравця (a815–a1082) навмисно записаний із
    заїканням: «H-here you go», «C-an you o-open», «ssss-ince», «doo-doo-- I mean
    - do». За STYLE §9 заїкання відтворюємо на українському приголосному, а не
    копіюємо англійські літери; a1000 «I'll t-t-t... t-t-t... Damn it! *Try*» —
    заїкання має зриватися саме на тому слові, яке потім вимовляється чисто
  - "Терміни з глосарію в тексті: rathound(s), hopper(s), burrower(s), siphoner(s), crawler, psi beetles, mindshroom, Faceless, Free Drones, Protectorate, Deep Caverns, Rail Crossing, South Gate Station, Core City, Junkyard, Foundry, The Rig, Buzzer, Invictus, Hardcore City Bar — брати готові відповідники, не вигадувати"
  - "Biocorp, Underrail, Underrail Express — латиницею, не відмінювати (глосарій)"
  - "«the Core» як скорочення від Core City (q630, q913 «rusty bar in the Core») — окреме рішення від Core Ring; узгодити перед перекладом"
  - "Похідні від crawler: shadow crawlers / death stalkers / black crawlers (q592–q594) — Чувак вибудовує з них градацію темряви; ряд має читатися як ряд"
  - "«the Juice» — назва препарату, скрізь з великої й однаково; «brew» (mushroom brew) — окремий напій, плутати не можна, вони протиставлені в q346"
  - "Підказки дій у ::…::: ::Barter.::, ::Nod.::, ::Follow Dude.::, ::Say nothing.::, ::Drink with Dude.::, ::Give him the ingredients.:: — інфінітив, STYLE §3.5"
  - "Літерали \\n\\n усередині юнітів — розрив абзацу, зберігати як є"
  - "«Princigator George» / «Invipal» (a1076, a1077) — п’яна каша зі слів, а не власні імена; відтворювати як спотворення, не транслітерувати як ім’я"

