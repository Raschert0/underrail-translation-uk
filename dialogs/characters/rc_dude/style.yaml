speakers:
  - slug: dude
    name: Чувак
    units: default
    confidence: certain
    evidence: [q400, q443, q445, q439]
    role: >-
      Постійний супутник гравця на всю лінію «мандрівки крізь розломи»: п’яний
      самозваний провидець, хімік-самоук і винахідник Соку. Говорить безперервно,
      плутано й самовпевнено — картка потрібна саме тому, що його голос має
      лишатися однаково розхлябаним на всіх 602 репліках, а не «випрямлятися»
      в довгих монологах.
    relationships:
      - "Гравець — напарник і «той, хто все приносить»; Чувак вважає його рівнею й другом"
      - "Quinton — постачальник, якого Чувак уперто зве «Quentin» (q111, q113); помилка сюжетна"
      - "Шинкар Залізничного Переїзду — постійний адресат вигуків «Barkeeper! Another one!» (q533)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Панібратський вуличний голос без жодної службової дистанції: звертання
        «man» у майже кожній репліці, «Hey, man», «Cheers, man», лайка й
        грубощі (q217 «you ain't retarded», q609 «shut the hell up»). Гендерні
        плейсхолдери фамільярні — $(#man/girl), $(#guy/gal) — а не $(#sir/ma'am).
        За STYLE §3.2 це однозначне «ти»; репліки гравця дзеркалять його (§3.3).
      gender_cues: ["$(#man/girl)", "$(#guy/gal)", "$(#he/she)"]
    voice:
      register: >-
        п’яний, розслаблений, безкінечно балакучий; тягне довгі псевдонаукові
        монологи, які самі себе плутають
      idiolect:
        - "«man» у кінці або всередині майже кожної фрази — головний словесний тик; це паразит, а не звертання «чоловіче», і перекладати щоразу однаково не можна"
        - "«like» як вставне слово-паразит («I, like, don't understand», «it's, like, wrong») — потребує українського відповідника-паразита, не пропуску"
        - "«Cheers!» / «Cheers, man!» — стала кінцівка тиради, майже підпис"
        - "перериває сам себе трикрапками й перезапускає речення: «I... I don't, like... Wait, wait!» (q51)"
        - "лічить аргументи хибно: «First… since… Third» (q507) — помилка навмисна"
        - "у видіннях мова розпадається на уривки з трикрапками (q548, q326)"
    note: >-
      У вузлі говорить лише Чувак і нарація. Шинкар, «that man» (q1056, q1068,
      q1078) і Quinton згадуються та цитуються, але власних q-юнітів не мають.

narration:
  present: true
  note: >-
    Дуже великий пласт: довгі описові вставки від другої особи (q94, q685, q757,
    q1068, q1084, q1087). «Ви» без винятків — STYLE §3.1 — навіть коли поруч
    Чувак каже «ти». Підказки дій усередині ::…:: — інфінітив (§3.5).

