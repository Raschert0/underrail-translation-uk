pitfalls:
  - "q13–q18, q53–q55, q59, q170, q171 — не самостійні репліки, а фрагменти одного речення, що склеюються рушієм. Перекладати як частини, узгоджені між собою; кінцеві пробіли й відсутність <end> усередині збірки не чіпати."
  - "q14 «him» і q55 «her» — окремі юніти-фрагменти під гендер небіжчика. Українська вимагає відмінка, якого в англійському фрагменті немає; переклад має лягати в конструкцію сусідніх фрагментів q13 і q15."
  - "$(tempcontext.wasteWater_pronoun1/2/3Cap) і $(context.frag_dun_wasteWater_corpseGender) — рушійні підстановки займенника й роду. Усередині плейсхолдера нічого не відмінювати; речення будувати так, щоб підставлений займенник не вимагав неможливого відмінка."
  - "$(context.player.Name) у q94, q200, q208, q211, q212 — не відмінювати всередині плейсхолдера; перебудовувати фразу під називний."
  - "\\n\\n у q36, q44, q90, q109, q118, q143, q164, q189, q195, q196, q221 — розрив абзацу, зберігати дослівно."
  - "Терміни глосарію: Mushroom Cove → Грибна Бухта, SGS → ССГ, Chancer's Bay → Затока Авантюриста, Junkyard → Звалище, Core City → Центральне Місто, Faceless → Безликі, Patrick Pierce → Патрік Пірс, scavengers → шукачі, innervated → іннервовано."
