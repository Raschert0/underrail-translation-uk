    name: Паскуале
    units: default
    confidence: certain
    evidence: [q75, q77, q86, q1]
    role: >-
      Лікар ССГ — єдиний мовець вузла. Веде прийом, оглядає тіла, пояснює гравцеві
      природу псіонічного потенціалу; говорить довгими науково-популярними абзацами,
      і саме це визначає добір слів, а не сюжет.
    relationships:
      - "Ньютон і Лора — його пацієнти; про обох говорить тепло й співчутливо (q174, q177)"
      - "Патрік Пірс — небіжчик, чию смерть від нього вимагають пояснити; тема його дратує (q66)"
      - "Квінтон, Біссон, Езра — колеги-псіоніки, про яких він розповідає гравцеві (q140–q143)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова особа при виконанні обов’язків, лікар на прийомі, звертається до
        пацієнта — STYLE §3.2 дає «ви». Мовлення підкреслено книжне, без випадання
        звуків і без ain’t; повні форми скорочень, вставні «Allow me to explain»,
        «I am obliged to mention», «I won’t bore you with details». Репліки гравця
        дзеркалять базу — теж «ви» (STYLE §3.3).
      gender_cues: []
      switches:
        - {unit: a127, to: ви, trigger: "«Forget it, doc» — фамільярне звертання «доку», але регістр не змінює: це тон, а не перехід"}
        - {unit: a97, to: ви, trigger: "«Gotta run, thanks man!» — емоційна невимушеність гравця, база лишається «ви» (STYLE §3.3)"}
    voice:
      register: ввічливий, книжний, лекторський; лікар, що любить пояснювати
      idiolect:
        - "подвоєні підтвердження як тик — «Yes, yes», «No, no, not at all», «Sure. Sure.», «Good. Good.»"
        - "самоперебиви й багатокрапки в роздумі — «I suppose... I suppose I can allow it»"
        - "науковий вокабуляр без спрощення — innervation, neurogenesis, metabolite saturation; не примітивізувати"
        - "сам себе ловить на багатослів’ї — «Sorry if I rambled» (q114); іронія має читатися"
        - "часто сміється тихим смішком — ::He chuckles.:: у q114, q204, q210, q223"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Юніти q1, q86, q125 — суцільна нарація від
    другої особи, а не мовлення Паскуале; решта нарації — короткі ремарки
    ::He chuckles.::, ::He pauses to think.:: всередині його реплік. Підказки дій
    у репліках гравця — інфінітив (STYLE §3.5): ::Wait.::, ::Barter.::,
    ::Nod and leave.::, ::Let him treat your wounds.::, ::Take the pill and swallow it.::
    Мітки навичок ::[Doctor]::, ::[Biology]::, ::[Persuade]:: беруться з глосарію.

