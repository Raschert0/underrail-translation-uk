pitfalls:
  - "$(#sir/ma'am) трапляється в ~15 рядках — усюди має бути той самий гендерний плейсхолдер, латиниці всередині $(#…) не лишати"
  - "«Corporal» (q9, q44, q55, q65, q75) і $(#sir/ma'am) співіснують — не зводити до одного звертання"
  - "q11 «Will» — це ім’я механіка, а не модальне дієслово (registry: Вілл)"
  - "a50, a52, a54 — гравець тричі перебиває Луку, називаючи його на ім’я; наростання має читатися за пунктуацією, не за зміною регістру"
  - "Drop Zone (q25) — глосарій дає «Зона Скидання», не вигадувати нового варіанта"
  - "pipeworker → труболаз, rathound → щурчак, siphoner → висмоктувач, crawler → повзун — усе з глосарія"

