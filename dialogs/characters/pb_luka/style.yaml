speakers:
  - slug: luka
    name: Лука
    units: default
    confidence: certain
    evidence: [q5, q73, q1]
    role: >-
      Лука Джотто, головний механік Форту Апогей, огрядний південець із Центрального
      Міста, який обслуговує Дредноути. Простакуватий, щирий і балакучий: захоплюється
      технікою й зривається на лайку, щойно згадують Вільних Дронів або Фрейзера.
    relationships:
      - "Фрейзер — ненавидить його, вважає зверхнім північанином (q48, q49, q51, q53)"
      - "Кейс — друг і земляк-південець, «hardcore person» (q57, q58)"
      - "Анастасія — приятелька, разом обідають у їдальні (q61)"
      - "Вілл — інший механік, до якого Лука відсилає гравця (q11)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Лука майже в кожній репліці вживає $(#sir/ma'am) і віддає честь (q75) —
        це прямий сигнал на «ви» за STYLE §3.2. Гравець дзеркалить (§3.3);
        звертання на ім’я «Луко» тут показує приязнь, а не перехід на «ти».
      gender_cues: ["$(#sir/ma'am)"]
    voice:
      register: простакуватий, добродушний, багатослівний
      idiolect:
        - "«Gee» на початку репліки — наскрізний словесний тик, ~15 входжень; потрібен один сталий український вигук на весь вузол"
        - "«hardcore» і «dominating» як універсальні слова захоплення (q17, q44, q58, q73) — не згладжувати в нейтральне «чудовий»"
        - "зонерський сленг: «zone out», «zoned to the bone», «derailed» (q28, q49, q63, q65)"
        - "випадання g: «fixin’ stuff» (q26) — розмовність передавати українським просторіччям, не апострофом"
        - "обірвані самопоправки через «--»: «those zon--... those bastards» (q34)"
        - "технічні назви вимовляє точно й із насолодою — APF-99, SBA-75, 1000 kW WPE (q17, q18)"

