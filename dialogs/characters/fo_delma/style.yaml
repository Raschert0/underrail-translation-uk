speakers:
  - slug: delma
    name: Делма
    units: default
    confidence: certain
    evidence: [q3, q72, q2]
    role: >-
      Начальниця в’язниці Ливарні, жінка середніх літ у металевому обладунку з
      важким низьким голосом. Говорить як службовець при виконанні: посилається
      на правила, процедуру й закон Ливарні навіть тоді, коли робить послугу.
    relationships:
      - "Тодор Sallywatch — підсудний, про якого гравець розпитує"
      - "шеф Banner — начальство, чиїм ім’ям гравець намагається тиснути"
      - "квіти в кабінеті — єдина тема, де службовий тон спадає"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Посадова особа при виконанні: $(#sir/ma’am) у першому звертанні (q72),
        офіційне представлення повним ім’ям і посадою, «Rules are rules». За
        STYLE §3.2 це «ви» в обидва боки.
      gender_cues: ["$(#sir/ma'am)", "$(#amigo/chica)"]
      switches:
        - {unit: q76, to: ви, trigger: "різкішає на грубість гравця, але лишається на «ви» — жорсткість передається лексикою, не переходом на «ти»"}
        - {unit: q80, to: ви, trigger: "виставляє гравця за двері; так само без переходу на «ти»"}
    voice:
      register: спокійна, службова; довгі повні речення, без скорочень
      idiolect:
        - "нав’язливе All is well — словесний тик (q13, q26, q45, q62, q68, q78); має бути одна й та сама формула в усіх шести"
        - "$(#amigo/chica) — друга константа мовлення, теплувате звертання поверх службового тону; воно НЕ переводить її на «ти»"
        - "любить формулу «Rules are rules» і посилання на закон Ливарні"

