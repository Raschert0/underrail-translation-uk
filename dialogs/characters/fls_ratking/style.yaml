    evidence: [q4, q6, q31, q37]
    role: >-
      Дід, що жив у печерній заставі до приходу людей ССГ і тепер огризається на
      всіх; двох щурчаків називає своїми дітьми. Уся розмова — торг за право
      лишитися вдома, тож його мова весь час на межі образи й жалю.
    relationships:
      - 'двоє щурчаків — «мої діти», для нього це рідня, а не звірі'
      - 'гравець і люди ССГ — загарбники його дому, він зве їх yobs і vultures'
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Грубий, ворожий, просторічний: ain’t, wanna, outta, gonna, Bah, you!,
        get the hell out. STYLE §3.2 — грубий вуличний мовець → «ти».
        Звертання young $(#man/lady) у q25 — це поблажливість за віком, а не
        пошана, і «ви» не мотивує. Гравець дзеркалить (§3.3): зве його old man
        і ugly rat.
      gender_cues: ["$(#him/her)", "$(#man/lady)"]
    voice:
      register: буркотливий, злостивий, старече-просторічний
      idiolect:
        - 'нав’язливе yobs про чужинців — тримати одне лайливе слово'
        - 'формула «I’m tired. I don’t wanna talk anymore.» повторюється в q11, q14, q16 — перекладати ідентично'
        - 'триразовий повтор ремарки про гримасу (q13, q16, q21) — це той самий рядок, не варіювати'
        - 'уривчасті вигуки-однослівники: Hmm? / Bah, you! / And stay out!'

