speakers:
  - slug: everard
    name: Еверард
    units: default
    confidence: certain
    evidence: [q2, q70]
    role: >-
      Керівник законспірованої групи, що діє з даху в Ливарні; дає гравцеві
      завдання витягти свого агента з в’язниці. Говорить як людина, що звикла
      віддавати накази й не підвищувати голосу — це визначає добір слів
      найбільше.
    relationships:
      - "Jack — його зверхник або зв’язковий; саме він прислав гравця (a5, q6)"
      - "Todor — підлеглий-убивця, ув’язнений; Еверард говорить про нього холодно й утилітарно"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Уникає скорочень там, де англійська їх очікує («I am Everard»,
        «I am joking, of course», «It is a truly problematic place»), будує
        повні періоди, звертається на ім’я гравця. Це витримана службова
        дистанція, а не приятельство.
      gender_cues: ["$(#him/her)", "$(#buddy/missy)"]
      switches:
        - {unit: q65, to: ви, trigger: "поблажливе $(#buddy/missy) — зниження тону, але не перехід на «ти»; передавати як зверхню фамільярність у межах «ви»"}
        - {unit: q68, to: ви, trigger: "жартівливе «Chillin’» — свідома стилістична гра, він одразу її знімає в q69"}
    voice:
      register: стриманий, велеречивий, з погрозою під ввічливістю
      idiolect:
        - "нав’язливе «Right?» наприкінці реплік (q3, q10, q18, q51, q57, q62, q63, q66, q69) — словесний тик, передавати однаковою короткою формою в усіх юнітах"
        - "евфемізми замість прямої мови про вбивство: «wish him a happy birthday» (q16), «Todor has been silenced» (a41)"
        - "курсивні наголоси зірочками (*you*, *very*, *all*) — риторичний натиск, зберігати розмітку"
        - "разові переходи в сленг задля іронії («Chillin’», q68) на тлі книжного синтаксису"

