pitfalls:
  - >-
    Головна складність вузла — рід мовця. Щонайменше q5, q7 і q8 українською
    потребують роду в минулому часі, а джерело його не дає. Не вгадувати:
    перебудовувати речення так, щоб рід не був потрібен.
  - >-
    Рядки не утворюють розмови — це окремі барки з різних станів квесту
    (мирне облаштування q2–q4, жаль q5, подяка q7, поразка q8, бій q9–q10).
    Не вирівнювати їх під один настрій.
  - >-
    q3 «That green sofa right there. Ahh.. I can only imagine.» — подвійна крапка
    в джерелі; в українській ставити нормативне трикрапкове вагання.
