  - unit: q7
    src: "We would've been toast without you."
    note: "«to be toast» — не калькувати; розмовне «нам був би кінець»"
  - unit: q4
    src: "I can't make up my mind"
    note: "стала формула вагання, локалізувати як формулу"
  - unit: q10
