speakers:
  - slug: unknown_1
    name: мовця встановити не вдалося
    units: default
    confidence: unknown
    reason: >-
      Назва теки дає лише скорочення «ryl», якого немає ні в реєстрі імен, ні в
      глосарії. У самому файлі немає ані нарації з власною назвою, ані звертання
      на ім’я, ані реплік гравця — самі барки. Стать мовця з тексту не
      виводиться: усі дієслова або в множині («We are considering»), або в
      минулому першої особи («I have failed»), що в англійській статі не показує.
    guidance: >-
      Це репліки супутника або союзника, який мандрує з гравцем: він говорить
      «ми», дякує за порятунок (q7) і сповіщає про наближення ворогів (q9).
      Регістр — «ти» як до товариша по загону (STYLE §3.2). Побудову добирати
      нейтральну, БЕЗ гендерованого минулого часу: q8 «I have failed» і q5
      «We were planning» українською вимагають роду, тож або перебудувати
      речення без минулого часу, або поставити $(#…/…) лише тоді, коли
      стать мовця буде встановлено централізовано. Ім’я в тексті не звучить —
      вигадувати його не треба.

