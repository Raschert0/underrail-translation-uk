        $(#brother/sister) у q43 — свій до свого, STYLE §3.2.
      gender_cues: ["$(#brother/sister)"]
    voice:
      register: теплий, метушливий, вибачливий; вуличний торговець без апломбу
      idiolect:
        - "затинання-заповнювачі «umm», «uhm» на початку фрази — знак ніяковості, не викидати"
        - "постійне «we» замість «I» — говорить від імені пари з Ryl"
        - "вигуки-реакції: Aww, Woah, Sheesh, Phew, heh heh"

