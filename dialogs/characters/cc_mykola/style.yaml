speakers:
  - slug: mykola
    name: Микола
    units: default
    confidence: certain
    evidence: [q45]
    role: >-
      Літній механік, чия крамниця збанкрутувала через Олігархію; тепер ремонтує
      тунельник для Зонних Щурів за тисячу харонів. Хворий: кашель розриває майже
      кожну його репліку, і саме це, а не зміст, визначає ритм перекладу.
    relationships:
      - "Vivian Young — гравець припускає, що вона його дочка; Микола заперечує («I never had a daughter»), і заперечення має звучати глухо, не сердито"
      - "Зонні Щури — підібрали його; говорить про них без пафосу, як про роботу"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Попри суцільно розмовну лексику («gonna», «'round here», «Drats!») —
        це літній крамар, який говорить із чужою людиною і торгується про гроші.
        Ключове для перекладача: «ви» тут не формальність, а дистанція до
        незнайомця; лексика лишається просторічною. Не робити з нього ні хама
        на «ти», ні чемного службовця. Гравець дзеркалить (STYLE §3.3), навіть
        у співчутливому «That coughing sounds painful».
      gender_cues: []
    voice:
      register: просторічний, утомлений, із сухою іронією; речення короткі, бо їх обриває кашель
      idiolect:
        - "«Drats!» — вигук досади після кожного нападу кашлю; один сталий український відповідник на весь вузол"
        - "«Lovely» / «Just lovely» — гірка іронія, ніколи не буквальне схвалення"
        - "«gibberish» про слова Олігархів — повторюване слово, тримати однаковим (q50, q51)"
        - "подвоєння слів від задишки: «the, the store is closed», «if you ask-- if you ask--»"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; «::Coughs.::» — найчастіша ремарка вузла, формулювання має бути однаковим усюди"

new_names: ["Young", "Vivian Young", "Tunneler"]

