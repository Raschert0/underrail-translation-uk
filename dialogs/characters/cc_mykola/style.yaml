  - unit: q24
    src: "shakes it like a ragdoll"
    note: "«ganчір’яна лялька» — образ є в українській, калькувати не треба, але й не спрощувати до «трясе»"
  - unit: q13
    src: "Maybe in a digital world!"
    note: "жарт про знецінення грошей; не пояснювати в перекладі, лишити таким самим коротким"

pitfalls:
  - "ГОЛОВНЕ: обірвані кашлем слова («See you la--», «This used to--», «Oli--», «righ--», «I'm-- », «A cha--», «si--») мусять обриватися на українському слові так, щоб наступна спроба його договорювала. Розрив ставити всередині того самого слова, а не між словами: «Побач-- ::Кашляє.:: Побачимось»"
  - "q26, q65 і початок q67 — майже дослівні дублікати; перекладати ідентично, інакше гра виглядатиме неохайно"
  - "a4 і a15 «::Give him 1000 stygian coins.::» — «стигійська монета» з глосарію; далі в тексті ті самі гроші звуться charons → «харони». Розбіжність є в оригіналі, зберегти обидва слова"
  - "числовий жарт q11→a12→q13→a18→q19→a20→a22→q23 тримається на «one» / «one thousand» / «one million» — наголос на слові «тисяча» (в оригіналі виділено зірочками) не загубити"
  - "$(context.player.Name) в a44 — не відмінювати"
  - "«tunneler» → тунельник (пор. Tunnelers → Тунельники в глосарії; тут це машина Безликих, не істота) — рішення варте звірки"
  - "«Faceless» → «Безликі», «Drop Zone» → «Зона Скидання», «zoner» → «зонер», «JKK» латиницею"
  - "q5, q8, q9, q26, q51, q65, q67 містять «\\n\\n» — абзаци зберігати"

