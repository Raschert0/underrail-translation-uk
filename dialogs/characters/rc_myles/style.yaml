pitfalls:
  - "$(tempcontext.RefurbishmentPrice) трапляється в ~40 юнітах — не перекладати, не відмінювати, нічого не дописувати всередину дужок"
  - >-
    після $(tempcontext.RefurbishmentPrice) майже завжди йде «charons» або «stygian coins»
    (глосарій: «харон», «стигійська монета»). Число підставляється динамічно, тож форма
    іменника має читатися при будь-якому числівнику — обирати варіант, що не ламається
    на 1 / 2 / 5
  - >-
    ::[Quality 110]::, ::[Both quality 145]::, ::[Persuade]::, ::[Mechanics]::,
    ::[Intelligence]::, ::[Mercantile]:: — теги перевірок; квадратні дужки й число
    лишаються, перекладається лише назва навички за глосарієм
  - >-
    q306 + q307/q309 та q278 + q279 — це РОЗІРВАНІ речення, які гра склеює на льоту
    («…I'm working on the » + «barrels. »). Кінцевий пробіл значущий, а український
    порядок слів має витримати обидва продовження. Не перебудовувати такі юніти
    в самостійні речення
  - "q289 починається з \\n\\n — літерали переносу лишати на місці, як у джерелі"
  - >-
    ~30 назв зброї (AKX, Dragunov, Tommy Gun, Wasteland Hawk, Black Arrow, Thumper…)
    і ~20 назв рам (Spearhead, Falchion, Impala, Marauder, Hornet, Harbinger…) —
    це предметна номенклатура з knowledge/, а не імена персонажів. Звіряти з файлами
    предметів, а не вигадувати тут
  - "Glück 17 (q67) — жарт тримається на самому написанні назви; лишати латиницею, інакше репліка втрачає сенс"
  - "Biocorp (q13, q275) — латиницею, не відмінювати; глосарій"
  - "q325 містить $(#boy/girl) — обидві гілки в українську форму, регістр «ти»"
  - "«Captain Triggerhappy» (q347) — саркастичне прізвисько, а не звання конкретної людини; «Captain» у a340 — окремий персонаж"
  - "q2 і q321 говорять про «plasma walkers» і «emitter» — тримати єдиний відповідник у межах вузла"

