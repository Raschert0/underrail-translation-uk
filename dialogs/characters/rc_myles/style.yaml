speakers:
  - slug: myles
    name: Майлз
    units: default
    confidence: certain
    evidence: [q370, q321, q2, q301]
    role: >-
      Зброяр на станції Залізничний Переїзд: лагодить і перебирає вогнепальну зброю,
      торгує, зневажає місцевих невмійок. Другий бік — захоплений знавець зброї
      Старого світу, який дитинно тішиться деревом і механікою.
    relationships:
      - "Дзижчик (Buzzer) — сусід-крамар зі станції; Майлз його зневажає й не приховує, що його смерть буде вигідна для торгівлі"
      - "Герве (Herve) — з його людьми Майлз мав справу в минулому; згадує з неприязню («the rat bastard»)"
      - "Travis — власник верстатів, якими Майлз користується для складніших робіт"
      - "Безликі (Faceless) — головна загроза станції; Майлз тверезо-обережний, не героїчний"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний ремісник із грубою прямою мовою, лайкою і зверхністю до клієнтів —
        STYLE §3.2 однозначно дає «ти». Жодного службового або обслугового регістру
        в тексті немає: він не запобігає перед покупцем, а гарикає на нього.
      gender_cues: ["$(#boy/girl)"]
    voice:
      register: грубий, різкий, розмовний; теплішає до захопленого, щойно мова заходить про стару зброю
      idiolect:
        - "стягнені форми gonna / wanna / 'cause / ya know / gotta — передавати розмовною українською, не літературною"
        - "подвоєння для наголосу як стала риса: «very nice, very nice», «the best, the best», «what a piece - what *a* piece» — зберігати повтор, не згладжувати в один прикметник"
        - "лайка-присмака: Damn, hell, «I don't give a damn» — лишається грубим, STYLE §9"
        - "зневажливі назви для місцевих: yokels, yahoos, «yokel guns» — стійка риса, а не разова образа"
        - "фахова зброярська лексика (ствол, затвор, приціл, магазин, ложа) — точна, він у ній як удома"
        - "звуконаслідування-вигуки: «Boom!», «Click!» — лишати короткими"

narration:
  present: true
  note: >-
    Нарація в ::…:: — «ви» без винятків, STYLE §3.1, навіть коли сам Майлз каже «ти».
    Тут вона двох типів: дії Майлза в третій особі («::He shakes his head::»)
    і дії гравця у другій («::You drop the rifle on the counter::», q227) — обидва
    в межах того самого правила.

new_names: ["Travis", "Terry", "Baker", "Triggerhappy"]

