speakers:
  - slug: tapio
    name: "ім’я в реєстрі відсутнє — див. new_names"
    units: default
    confidence: certain
    evidence: [q10, q17, q50]
    role: >-
      Недосвідчений мисливець, який перевантажений спорядженням застряг на березі
      зі зламаним джетскі й зрештою намагається збути його гравцеві. Увесь вузол —
      один торг, де ціна падає з 650 до 300 монет залежно від навичок гравця.
    relationships: []
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Випадкова зустріч рівних біля води: суцільне просторіччя («ain’t», «goin’»,
        «doin’»), фамільярні звертання «fellow» (q19), «Ay» (q44) і пряма лайка
        «Get lost, punk!» (q52). STYLE §3.2 — вуличний, свій, отже «ти»; репліки
        гравця дзеркалять (§3.3).
      gender_cues: []
    voice:
      register: >-
        мнучкий, знічений, весь час виправдовується; на тиск зривається в агресію
        і так само швидко здувається назад
      idiolect:
        - "заповнювачі «uhm», «heh heh», «mmm» у місцях невпевненості (q14, q17, q19, q42, q58)"
        - "заїкання від зніяковіння: «I-I mean» (q17), «Y-you know what?» (q58), «W-what?» (q73) — відтворювати на українському приголосному, STYLE §9"
        - "самопереконування повтором: «right? Right?» (q75), «yes… that’s the best course» (q75), «yeah…» (q44)"
        - "розтягнуті голосні на впізнаванні: «Ooooh… riiight» (q42)"
        - "випадання кінцевого g: goin’, buyin’, huntin’, doin’, sellin’, somethin’"
        - "у гніві переходить на короткі рубані погрози й курсивні наголоси: «eh, *eh*?» (q52), «*moron’s* tryin’ to *drown* me» (q69)"

