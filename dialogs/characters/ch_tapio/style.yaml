narration:
  present: true
  note: >-
    Крім окремих юнітів нарації, майже кожна репліка містить вкраплення ::He nods.::,
    ::He looks away.::, ::He shrugs.:: — вони теж на «ви» і теж третьою особою,
    STYLE §3.1. Ремарки гравця (::Wave back at him.::, ::Leave.::, ::Fight!::) —
    підказки дії, отже інфінітив, STYLE §3.5.

new_names: ["Tapio", "Junk Jet"]

idioms:
  - unit: q5
    src: "What a pile of junk!"
    note: "лейтмотив вузла — «pile of junk» повторюється в q10 і q58; тримати те саме сполучення щоразу"
  - unit: q17
    src: "seven-six fifty-ish, maybe?"
    note: >-
      Не помилка джерела, а самовиправлення вголос: почав казати «сімсот», обірвав,
      знизив до «шістсот п’ятдесят щось». Обрив зберігати.
  - unit: q19
    src: "Pleasure doin' business fellow, uhm... hunter."
    note: "затинання на звертанні — він не знає, як назвати гравця; пауза й невпевненість важливіші за буквальність"
  - unit: q22
    src: "Everyone out there's looking to catch loose fish, if you know what I mean."
    note: "«loose fish» — евфемізм для легкої здобичі/жертви, не про риболовлю; калька руйнує натяк"
  - unit: q22
    src: "get armed to the teeth before darin' to tangle such a challenge"
    note: "«armed to the teeth» має усталений український відповідник; «tangle such a challenge» — авторська неоковирність, вирівнювати не треба"
  - unit: q33
    src: "Half a price for half the machine, hehe."
    note: "жарт на паралелізмі half/half — зберегти повтор, інакше зникає дотеп"
  - unit: q52
    src: "Get lost, punk! Before I drown you with my bare hands."
    note: "грубе лишається грубим — STYLE §9; «punk» тут зневажливе до молодшого, не субкультура"
  - unit: q59
    src: "before I put a bounty on your hide"
    note: "«on your hide» — «за твою шкуру»; образ шкури доречний у мисливському таборі, зберегти"
  - unit: q61
    src: "as if a boulder had fallen from the top of the cave"
    note: "порівняння вписане в підземний світ гри — не замінювати на побутове"
  - unit: q78
    src: "Just chill out."
    note: "«охолонь / вгамуйся», не калька"

pitfalls:
  - "q29 і q31 містять зламаний тег навички ::[Mercantile|:: — вертикальна риска замість дужки. Це помилка оригіналу; відтворювати символ у символ, не «виправляти» на ::[Mercantile]::."
  - "Теги навичок ::[Mechanics]::, ::[Mercantile|::, ::[Persuasion]::, ::[Strength or Dexterity] (a60 — без закривних дужок) мають збігатися з назвами навичок у knowledge/; звірити з глосарієм, а не перекладати наново."
  - "«Expedition» у q22 — назва доповнення в глосарії лишається латиницею, але тут це внутрішньосвітова експедиція, про яку говорить персонаж. Рішення потрібне свідоме, а не автоматичне."
  - "Глосарні терміни: Black Sea → Чорне Море, Hell’s Gut → Нутро Пекла, Core City → Центральне Місто (усі три в q22)."
  - "Ціни («600 coins», «500 coins», «400 coins», «450 coins», «300 coins») — одиниця валюти має бути єдиною по всьому вузлу; числівники словами («nine hundred», «Four hundred it is», «Three hundred?») лишати словами."
  - "q12, q22, q42, q44, q50, q58, q61, q75 містять літеральні \\n\\n — зберігати розриви абзаців."
  - "q58 закінчується трьома кінцевими пробілами, q41 — одним; кінцеві пробіли не прибирати."
  - "Курсивні наголоси зірочками (*nine hundred* q17, *eh* q52, *moron’s*, *drown* q69) — розмітка наголосу, переносити на відповідне українське слово, а не на позицію."
  - "Персонажа в тексті жодного разу не названо на ім’я — «Tapio» відомий лише з назви теки. Не вставляти ім’я в переклад там, де його немає в джерелі."

