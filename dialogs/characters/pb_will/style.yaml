speakers:
  - slug: will
    name: Вілл
    units: default
    confidence: certain
    evidence: [q6, q41, q43, q45]
    role: >-
      Механік у Форті Апогей, який на прохання гравця споряджає дві каністри мутагену
      таймером. Простакуватий, послужливий, працею дорожить більше за розмову — саме це
      диктує його короткі, вибачливі репліки.
    relationships:
      - "гравець — замовник і старший за станом; Вілл звертається до нього тільки $(#sir/ma'am)"
      - "Staff Sergeant Fraser — не діє в сцені, лише привід для жарту про пляму (q4)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Вілл у 14 репліках поспіль вживає $(#sir/ma'am) і жодного разу не переходить
        на панібратство — це обслуга, що говорить до старшого (STYLE §3.2). Гравець
        дзеркалить базовий регістр (§3.3); лайливі рядки a31 і a37 — емоційний зрив,
        а не зміна регістру, «ви» в них зберігається.
      gender_cues: ["$(#sir/ma'am)", "$(#Sir/Ma'am)"]
    voice:
      register: простацький, послужливий, з вибаченнями через слово
      idiolect:
        - "суцільне випадання g: workin', chattin', hidin', askin' — передавати розмовною редукцією, не суржиком"
        - "аферези й скорочення: 'ere, 'Kay, 'n', o', 'Ere ya go — говірка простої людини"
        - "me замість my: «me bum», «me tummy» — маркер, тримати в усіх входженнях"
        - "вигук O' на початку репліки (q6, q21) — не читати як «Oh», це його власне слівце"
        - "подвійне заперечення «didn't mean no harm» (q43) — норма його мовлення"
        - "заїкання від переляку «Wha-- what did I do wrong?» (q32) — відтворити на українському приголосному, STYLE §9"

