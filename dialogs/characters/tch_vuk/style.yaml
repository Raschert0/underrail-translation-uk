    name: Вук
    units: default
    confidence: certain
    evidence: [q6, q20, q69]
    role: >-
      Біолог відділу біології Інституту Тчорта, доглядач приборканих істот у
      вольєрах; увесь у бруді, крові та зригнутій слизі. Розслаблений роботяга,
      що балакає з гравцем на перерві й на кожне серйозне питання відсилає до
      начальника.
    relationships:
      - "Головний дослідник Ріста — начальник; Вук нічого не продає й не пояснює без його дозволу, а про його кабінет жартує «enter at your own risk»"
      - "Псих — небезпечна істота у вольєрах, про яку Вук говорить із захопленим жахом (q71)"
      - "Гравець — рівня, майже колега; Вук радо визнає слушність його біологічної підказки (q22, q24)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Свій, вуличний, невимушений — STYLE §3.2. Скорочене $(#bro/sis) замість
        повного brother/sister, «Get outta here», «'Ey», «Ditto», «squishies»,
        обірвані речення («Yeah?», «Yes, $(#bro/sis)?»). Гравцеві дано дзеркальні
        репліки того ж регістру: «See ya», «Gotta run».
      gender_cues: ["$(#bro/sis)"]
    voice:
      register: розслаблений, розмовний, самоіронічний щодо власної брудної роботи
      idiolect:
        - "$(#bro/sis) — саме усічена форма; має звучати коротше й панібратськіше за повне $(#brother/sister) у сусідніх вузлах Інституту"
        - "«squishies» — його власне зневажливо-пестливе слівце для м’яких зразків; потрібен один сталий розмовний відповідник"
        - "обриви й самоперебивання: «Listen, I am-- ::He pauses::», «I... not without PI Rista's permission I can't», «well, at least I don't know if I'm allowed to so I better not...»"
        - "мовчазний сміх замість відповіді як повторюваний прийом (q34, q44, q60) — ремарка несе всю репліку"

