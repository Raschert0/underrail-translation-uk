idioms:
  - unit: q103
    src: "Take your pick. Take, not break."
    note: >-
      каламбур на «pick» — водночас «вибирай» і «кайло»; у джерелі прямо
      позначений як місцева приказка. Українською потрібна своя шахтарська
      гра слів, калька неможлива; те саме рішення має покрити q38
  - unit: q38
    src: "don't break your pick just yet"
    note: "той самий каламбур у значенні «не опускай руки завчасно» — перекладати узгоджено з q103"
  - unit: q111
    src: "A heavy steel plate was lifted off my chest"
    note: >-
      ливарський варіант «камінь з душі спав» — метал в образі свідомий,
      зберегти його, а не замінювати на стандартну ідіому
  - unit: q101
    src: "as friable as you may think"
    note: >-
      «friable» — місцеве слівце (крихкий, ламкий), звучить і в Маркоса;
      тримати спільний відповідник, це маркер говірки
  - unit: q47
    src: "Cheap as dirt."
    note: "розмовне «дешевше нікуди»; не калькувати «як бруд»"
  - unit: q89
    src: "the old coot"
    note: "фамільярно-тепле про Бернарда — «старий шкарбун» без образи, не лайка"
  - unit: q52
    src: "I'll have some nipper take this"
    note: "«nipper» — хлопчисько-підручний, не технічний інструмент"

pitfalls:
  - >-
    q9, q10, q12 і q23, q24 — це шматки одного речення, зшиті рушієм:
    q10 починається з коми («::, making a few trips…»), q12 — зі сполучника
    («:: and briskly returns…»). Не замикати їх як самостійні речення й
    зберігати початкові розділові знаки та пробіли
  - "q44, q56, q61, q68, q73 закінчуються пробілом або `\\n\\n` перед `<end>` — це склейка з наступним юнітом, пробіли зберігати дослівно"
  - "a51–a63 — десять паралельних реплік із наростанням чисел; тримати єдину граматичну формулу й правильні форми числівників («один набір», «два набори», «п’ять наборів»)"
  - "у вузлі співіснують «charons» (харон, глосарій) і «stygian coins» (стигійська монета) — це різні написання одного платежу, обидва беруться з глосарію без уніфікації"
  - "q91 «blueprint» → Креслення (глосарій), не «схема»"
  - "q120 «Looked like scavengers to me» — шукачі (глосарій), не «мародери»"
  - "«Foundry Guard» лишається латиницею (глосарій), місто Foundry → Ливарня; q111 містить обидва"
  - "q111 «go back to Lower Underrail» — Underrail лишається латиницею й не відмінюється"
  - "q99–q101 — репліки про жіночу роботу; іронія має лишитися впевненою, а не жалібною, і без пом’якшення (STYLE §9)"
  - "a29, a34 гравець зневажливо кидає «woman» — грубість зберігаємо, це вона й дає відсіч у q30"

