speakers:
  - slug: leonie
    name: Леоні
    units: default
    confidence: certain
    evidence: [q1, a43]
    role: >-
      Господиня металевої крамниці в Ливарні: сама торгує, сама тягає важке,
      сама рахує на пошарпаному калькуляторі. Привітна, але з жорсткуватим
      голосом і швидкою відсіччю тому, хто заговорить згорда.
    relationships:
      - "Бернард («Ben», «the old coot») — знайомий, який направляє до неї гравця з суперсталлю (q86, q89)"
      - "Foundry Guard — охорона поруч із крамницею; посилається на неї, коли їй грублять (q30)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Попри те, що вона за прилавком, голос не обслуговий: «So, boss, how about
        it?», «See ya», «Hey, sister», обірване «Shush, I'm calculating!» і
        «cheap as dirt». Це своя робітнича мова Ливарні — STYLE §3.2 для своїх і
        вуличних, гравець дзеркалить (§3.3).
      gender_cues: ["Hey, sister"]
      switches:
        - {unit: q105, to: ти, trigger: "лекція про сплав TiChrome — лексика стає технічною й гордою, але регістр звертання не міняється"}
    voice:
      register: жвавий, прямий, із хрипкуватою жорсткістю
      idiolect:
        - "ділові присудки без обрамлення: «Can do.», «No problem.», «There you go.»"
        - "подвоєння для згоди-відмахування: «Patience, patience.», «Yeah, yeah, this is fine.»"
        - "місцева ливарська говірка, яку вона сама так і називає: «It's local lingo» (q103)"
        - "самоіронічна гордість «I'm a *Foundry* woman, for crying out loud» (q99)"

