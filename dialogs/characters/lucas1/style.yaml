new_names: ["Lurkers", "Fort Apogee", "Shoddy Shotty", "Lanford"]

idioms:
  - unit: q19
    src: "Quaky. Eh, like a quaker. Or a hopper - *scared*."
    note: >-
      ланцюг-жарт: гравець перепитує незнайоме слівце, і Лукас його тлумачить.
      Український відповідник має бути таким самим малозрозумілим просторічним
      словом, яке справді можна перепитати й пояснити через «наляканий»;
      «hopper» → «стрибун» (глосарій) має лишитися частиною пояснення
  - unit: q21
    src: "Dig: to get - to understand."
    note: >-
      те саме, другий виток гри: питання a20 «Dig?» і тлумачення в q21 мусять
      узгодитися. Обирати українське сленгове «розумієш» так, щоб воно
      піддавалося перепитуванню
  - unit: q23
    src: "Now you're just playing slackjaw."
    note: "«вдавати з себе дурника»; не калькувати «відвислу щелепу»"
  - unit: q73
    src: "the Big Complainer threw a bit of a tantrum"
    note: "прізвисько-кепкування з Великого Брета — гра з його канонічним іменем; зберегти зв’язок"
  - unit: q87
    src: "his R&R ain't overdue"
    note: "R&R — армійська відпустка на відпочинок; розкрити зрозуміло, абревіатуру не лишати"
  - unit: a65
    src: "Guns are for wussies."
    note: "грубе лишається грубим — STYLE §9; не пом’якшувати до «для боягузів»"
  - unit: q79
    src: "Get away, you damned abominations!"
    note: "патетичний зрив у переказі; урочистість навмисна й трохи смішна — зберегти"
  - unit: q92
    src: "What kind of a derailed dream is that"
    note: "«derailed» — гра з залізничним світом гри; шукати образ, а не словникове «зійшов з рейок»"

pitfalls:
  - >-
    ГОЛОВНЕ: репліки розбиті на фрагменти, які движок склеює. q8 обривається на
    «preparing for » і продовжується або q9 «a massive Faceless assault.», або
    q40 «a Lurker invasion.»; так само q12+q13, q95+q96, q107, і одинокий q106 «?».
    Український переклад мусить давати граматично злитне речення при БУДЬ-ЯКОМУ
    з варіантів продовження — отже, керувати відмінком у хвостовому фрагменті,
    а не в головному. Не «виправляти» обірвані фрагменти в самостійні речення.
  - "q1, q21, q71, q78, q91, q92, q102, q113 містять $(context.player.Name) — плейсхолдер не відмінювати й не змінювати; фразу будувати так, щоб ім’я стояло в називному"
  - "«Faceless» → «Безликі», «Tunnelers» → «Тунельники», «Core City» → «Центральне Місто», «Deep Caverns» → «Глибокі Печери», «rathound» → «щурчак», «hopper» → «стрибун» — глосарій"
  - "Lurkers у глосарії немає — до єдиного рішення не вигадувати варіант (див. new_names)"
  - "«::Barter.::» (a5, a6, a29, a30, a105, a110, a111) → «::Торгувати.::» — сталий рядок глосарія, однаковий в усіх юнітах"
  - "«::[Persuade]::» (a47, a50, a52) → «::[Переконати]::» — сталий рядок глосарія"
  - "зірочки навколо слів (*scared*, *exactly*, *Novel*) — ігрове виділення; переносити на відповідне українське слово, не втрачати"
  - "«five-mil», «fourty-four», «twelve-gauge» — калібри; лишати числовими, не переказувати словами"
  - "q7, q35, q59, q61, q86, q90, q99 закінчуються пробілом перед <end> — не чіпати"

