  - slug: lucas
    name: Лукас
    units: default
    confidence: certain
    evidence: [q1, q3, q67]
    role: >-
      Зброяр ССГ, брат Венцеля; продає спорядження й дає доручення щодо Гарланда.
      Балакучий і панібратський — сипле сленгом, підсміюється з себе й з інших,
      але без злості.
    relationships:
      - "Венцель — рідний брат: «Pals? We're brothers!» (q67), «we're bros» (q69)"
      - "Гарланд — охоронець, якого Лукас вважає параноїком; тема наскрізного доручення (q8, q13, q86)"
      - "Ньютон — інший власник пістолета, привід для жарту (q45)"
      - "Великий Брет — «the Big Complainer», Лукас кепкує з його бурчання (q73)"
      - "Горський, Таннер, Патрік Пірс — згадувані зі щирим жалем (q71, q91, q92)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Свій, панібратський: «Well, friend - make yourself at home» (q3),
        «You dig?» (q19), «Damn, $(context.player.Name), where've you been living»
        (q21), «See ya» від гравця (a38). STYLE §3.2 — свої, вуличні — «ти»;
        §3.3 — гравець дзеркалить.
      switches: []
    voice:
      register: гучний, теплий, розхристаний; жарт як спосіб триматися
      idiolect:
