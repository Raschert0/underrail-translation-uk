speakers:
  - slug: henderson
    name: Гендерсон
    units: default
    confidence: certain
    evidence: [q15, q17, q20]
    role: >-
      Агентка Джулія Гендерсон командує обороною під час нападу: роздає
      накази власним агентам і приймає гравця як рівного за званням.
      Говорить стисло, по-службовому, без жодного зайвого слова.
    relationships:
      - "Гарлан — той, кому гравець підпорядкований і кому має відзвітувати (q6, q8)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова взаємодія двох агентів, звертання за званням «Agent» у
        більшості реплік, статутні формули — «ви» в обидва боки,
        STYLE §3.2, §3.3.
    voice:
      register: командний, стриманий, статутний
      idiolect:
        - "звертання «Agent» — постійне, і до гравця, і до підлеглих; тримати одним українським відповідником"
        - "накази підлеглим окремим абзацом після \\n\\n: «Assume your positions, agents!», «Agents, move up to the sandbags!» — зміна адресата всередині юніта"
        - "коротке схвалення замість похвали: «Agreed.», «Sounds like a plan.»"
    switches:
      - {unit: q20, to: ви, trigger: "у другому абзаці звертається вже не до гравця, а до свого загону — множина, наказовий спосіб"}
      - {unit: q23, to: ви, trigger: "те саме: наказ підлеглим, не репліка гравцеві"}
      - {unit: q25, to: ви, trigger: "те саме"}

