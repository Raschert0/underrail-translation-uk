speakers:
  - slug: jack_quicksilver
    name: Джек Квіксілвер
    units: default
    confidence: certain
    evidence: [q67, q113, q41]
    role: >-
      Куратор гравця від таємної організації — вербує, роздає завдання й платить,
      тримаючи дистанцію й майже нічого не пояснюючи. Його мова навмисно вирівняна
      й контрольована: це інструмент влади в розмові, а не характеристика освіти.
    relationships:
      - "Абрам — рівня йому людина в тій самій організації; саме він рекомендував гравця (q36, q51, q67)"
      - "Азіф — той, до кого Джек відправляє гравця далі, не пояснюючи хто це (q15, q18)"
      - "Еверард, Ленокс Пірс, Огад Ксандер — три контакти трьох завдань (q55, q58, q60)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Синтаксис підкреслено книжний і безособовий: «I've been informed of your
        refusal» (q1), «Indeed you have, and with optimal results even» (q13),
        «As I hoped» (q34), «We require maximum discretion» (q54), «Don't answer a
        question with a question» (q120). Це мова куратора, який утримує відстань, —
        STYLE §3.2 трактує таких як «ви». Гравець дзеркалить базовий регістр (§3.3),
        попри панібратське «Catch you later, Jack» в a42 і a109.
      gender_cues: []
      switches:
        - {unit: q12, to: ти, trigger: "розмовний зрив «Sure you do... Ain't it so?» — одинична поблажлива фамільярність, базу не змінює"}
        - {unit: q111, to: ви, trigger: "перша зустріч у ССГ: коротко й непривітно, але дистанція та сама"}
    voice:
      register: рівний, стриманий, іронічно-поблажливий; погрожує не підвищуючи тону
      idiolect:
        - "формули підтвердження замість «yes»: «Indeed you have» (q13), «Indeed you are» (q32), «That I did» (q64), «As I hoped» (q34)"
        - "пасив і безагентність там, де хтось інший сказав би «я дізнався»: «I've been informed» (q1, q29, q51)"
        - "мова про себе в третій особі: «That's enough of Jack's wisdom for now» (q41)"
        - "коротка відмова без пояснень як окремий юніт: «No questions.» (q98), «You'll find out.» (q18), «It's a business secret.» (q84)"
        - "лексика роботодавця, а не приятеля: assignment, cooperation, optimal, satisfactory, discretion — тримати канцелярський шар"

