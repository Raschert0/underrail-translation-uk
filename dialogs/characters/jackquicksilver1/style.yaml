  present: true
  note: "«ви» без винятків — STYLE §3.1; тут нарація майже вся мінімальна (::He nods.::, ::He smirks.::)"

new_names: ["Jack Quicksilver", "Hanging Rat"]

idioms:
  - unit: q64
    src: "Guilty as charged."
    note: "юридична формула, вжита жартома; локалізувати як визнання провини з тим самим правничим відтінком, не калькувати"
  - unit: q40
    src: "There are always cracks in the walls for you to get through"
    note: "розгорнута метафора шпарин у стіні; тримати образ через усі три частини речення, не зводити до «завжди є вихід»"
  - unit: q12
    src: "Ain't it so?"
    note: "єдине просторічне «ain't» у вузлі — знижена форма має бути помітною саме тому, що вона одна"
  - unit: q120
    src: "Don't answer a question with a question. It's irritating."
    note: "докір-афоризм; зберегти сухість другого речення, не підсилювати емоцію"
  - unit: a11
    src: "I punched through a rock wall with my bare fists"
    note: "хвастощі гравця; гіпербола має лишитися гіперболою"
  - unit: q49
    src: "Well, I've waited, and waited, and waited..."
    note: "потроєння з наростанням; зберегти саме три повтори й три крапки"

