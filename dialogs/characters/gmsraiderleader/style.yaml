speakers:
  - slug: gms_raider_leader
    name: ватажок рейдерів у GMS
    units: default
    confidence: certain
    evidence: [q2, q7, q9, q22]
    role: >-
      Безіменний головоріз, що тримає комплекс GMS і його мешканців у заручниках.
      Розмова з ним — переговори бранця з тим, хто будь-якої миті може наказати
      вбити; його рішення й визначає, чи вузол закінчиться боєм.
    relationships:
      - "охоронці — підлеглі; звертаються до нього «boss» і доповідають"
      - "Max — його підручний, посланий нагору й уже мертвий (q7)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Він зневажливо-грубий вуличний ватажок: «punk», «this idiot», «this fool»,
        погроза «we will waste you» — STYLE §3.2 однозначно дає «ти». Гравець
        дзеркалить базовий регістр (§3.3): навіть офіційне «I demand that you set
        these people free» лишається на «ти» — це виклик, а не ввічливість.
      gender_cues: ["::He narrows his eyes on you.::", "::He smirks at you.::"]
    voice:
      register: холодно-глумливий, з награною поштивістю перед погрозою
      idiolect:
        - "фірмове «Waste this idiot/fool!» — повторюваний наказ на страту; тримати один український відповідник у всіх повторах"
        - "переходить на канцелярську побудову, коли глумиться: «I suggest you start being more cooperative»"
        - "звертається до гравця в третій особі, коли говорить до охоронців: «Get rid of $(#him/her).»"

  - slug: gms_raider_guard
    name: охоронець рейдерів
    units: [q3, q4, q5, q8, q40, q41]
    confidence: certain
    evidence: [q3]
    role: >-
      Підлеглий, що доповідає ватажкові про схопленого гравця. Говорить не до
      гравця, а про нього — тому весь його текст у третій особі.
    address:
      npc_to_player: ви
      player_to_npc: ти
      basis: >-
        До гравця він не звертається взагалі; до ватажка — службово, зі
        зверненням «boss». Регістр його реплік визначає саме ця субординація,
        а не ставлення до гравця.
    voice:
      register: службовий, короткий, рапортом
      idiolect:
        - "рублені доповідні речення без прикрас: «Claims $(#he/she) didn't see him.»"

