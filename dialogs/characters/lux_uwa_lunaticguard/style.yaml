speakers:
  - slug: lunatic_guard
    name: мовця названо лише роллю — вартовий культу
    units: default
    confidence: certain
    evidence: [q1, q14]
    role: >-
      Вартовий культу Transfinity на підході до табору: зустрічає гравця,
      промацує його думки й, задовольнившись, відсилає до All-seeing One у
      центрі табору. Незгодного оголошує таким, що не має права існувати поряд
      зі святинею.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Ритуально-поетичний регістр без жодного побутового маркера; гравця
        звертає не на ім’я, а як «wanderer» (q1, q57) — тобто як стороннього,
        що прийшов до святині. Плейсхолдерів роду у вузлі немає; рішення за
        STYLE §3.2. Гравець у ключових репліках свідомо переходить на його ж
        манеру (a22 «Let me attend, let me see»), тобто дзеркалить регістр.
    voice:
      register: >-
        наспівний, доброзичливо-екзальтований; у q14 і q24 різко обертається на
        холодну ворожість, лишаючись у тій самій віршовій формі
      idiolect:
        - >-
          ГОЛОВНЕ: увесь його мовний потік римований — нарація q1 це прямо
          заявляє («he talks to you in rhyme»). Рима обов’язкова в перекладі;
          проза замість неї знищує персонажа, бо на римі тримається і
          сюжетна деталь (q10 «our thoughts start to rhyme»)
        - >-
          перехресні чуття, спільні з провідником культу: «A sight to be
          smelled, a feeling to be seen», «hear its beautiful color», «read its
          majestic heat». Не згладжувати в звичайні порівняння
        - "Finity й Transfinity — власні назви, з великої; q47 будує риму на їх протиставленні"
        - "q41–q66 — короткі бойові й фонові вигуки, теж римовані, здебільшого парою рядків; риму тримати й у них"

  - slug: narrator
    name: нарація без мовця
    units: [q2, q16, q17]
    confidence: certain
    evidence: [q17]
    reason: >-
      Три юніти — суцільна нарація в ::…::, що повідомляє гравцеві про Окулус;
      вартовому вони належати не можуть, бо q17 прямо каже, що він не знає про
      існування споруди («unaware of its actual existence»).
    guidance: >-
      «ви» без винятків, STYLE §3.1; спостережний тон гравцевого сприйняття, без
      віршової форми вартового і без гендерованого минулого часу.

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Ремарки в межах реплік вартового (q6, q19,
    q21, q23, q24, q26, q28, q34, q39, q43, q51) перекладаються як нарація,
    навіть коли сама репліка римована — рима на ремарки не поширюється.

new_names: ["All-seeing One", "Transfinity", "Finity"]

idioms:
  - unit: q1
    src: "The wanderers peak their heads in but their thoughts are lacking in whim."
    note: >-
      «peak» — помилка джерела замість «peek» (зазирають); перекладати за
      змістом, а не за написанням
  - unit: q4
    src: "Can you hear its beautiful color, can you read its majestic heat?"
    note: "навмисна синестезія, а не мовна помилка — зберігати перехресні пари відчуттів"
  - unit: q59
    src: "new horizons ahead for us to dine upon"
    note: "«обідати обріями» — навмисна дика метафора; не нормалізувати до «здобувати»"
  - unit: q64
    src: "embark on its glorious vibe"
    note: "розмовне «vibe» у високому регістрі — свідомий стилістичний збій, зберегти дисонанс"

pitfalls:
  - "q23, q26, q28 — три дослівно ідентичні репліки; переклад має збігатися слово в слово в усіх трьох"
  - "q19 і q39 — так само ідентична пара"
  - "q6 текстуально збігається з q23/q26/q28 — тобто це чотири однакові репліки, а q34 лише варіант тієї самої формули з іншими дієсловами («digest», «calculate»)"
  - "\\n\\n на початку q2, q7 (у складі q14), q16, q17, q19, q21, q24, q39 — керуючий перенос рядка, зберігати як є"
  - "::[Persuade]:: (a20, a22, a25, a27, a29, a30, a33) — тег перевірки; глосарій дає ::[Переконати]::"
  - "Oculus (q2, q17) — глосарій: Окулус"
  - "a30 «My thoughs» — друкарська помилка джерела замість «thoughts»; перекладати за змістом"
  - "q21 «Transfini - ty..» — навмисний розрив слова на складі, імітація повільної вимови; зберегти розрив"
  - "q1 «a man clearly in a world of its own» — «its» замість «his» у джерелі; це недогляд, а не характеристика"

