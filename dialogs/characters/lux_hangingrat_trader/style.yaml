pitfalls:
  - >-
    ГОЛОВНЕ: «$(#Ugly Joe/Ugly Jane)» — прізвисько гравця, що повторюється в
    десяти юнітах (q1, q16, q24, q26, q28, q30, q32, q34, q41, q43, q45, q54, q61).
    Український варіант обрати ОДИН раз і повторювати дослівно в усіх; обидві
    гілки плейсхолдера мусять бути українськими, латиниці всередині $(#…) не лишати
  - "q57 містить $(#Mister/Miss) Wiseass Uglington — і плейсхолдер, і вигадане прізвище; узгодити з обраним варіантом «Ugly Joe/Ugly Jane»"
  - "q54, q57 містять $(#guy/girl) — окремий плейсхолдер, не плутати з прізвиськом"
  - "a21–q34 — обмін жартами «You're so ugly, …»; кожна репліка гравця має мати свою відповідь-панчлайн у наступному q, тож жарт треба локалізувати парою, а не порядково"
  - "«burrower» → «копака», «rathounds» → «щурчаки», «cave hopper» → печерний «стрибун», «Deep Caverns» → «Глибокі Печери» — глосарій; «Underrail» лишається латиницею й не відмінюється (q13, q60)"
  - "назва бару в тексті пишеться і як «Hangin' Rat» (q11, q19, q20), і як «Hanging Rat» (a18) — це та сама назва; переклад один, апостроф-скорочення відтворювати просторіччям, а не двома різними назвами"
  - "зірочки (*extreme*, *extremely*, *didn't*) — ігрове виділення; переносити на відповідне українське слово"
  - "q36 «That's not a ba--» — обрив на півслові; зберегти обрив, не добудовувати"
  - "a27, q61 закінчуються пробілом чи \\n перед <end> — не чіпати"

