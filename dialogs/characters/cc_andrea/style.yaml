speakers:
  - slug: andrea
    name: Андреа
    units: default
    confidence: certain
    evidence: [q1, q53]
    role: >-
      Реєстраторка Рукавиці: приймає заявки бігунів, пояснює правила забігу й видає
      винагороду. Головна її риса — крайнє недосипання: вона постійно збивається,
      затинається й перепитує саму себе, і саме це має нести переклад.
    relationships:
      - "Ланіста — телефонує їй про гладіаторів, яких вона мусить упізнати (q21)"
      - "JKK — транслює Рукавицю на всю Underrail (q42)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Службова роль за стійкою й підкреслено обслуговчий вступ «good day… and how may
        I help you?» — STYLE §3.2, обслуга на «ви». Втома збиває їй мову, але не регістр:
        зривів на «ти» в джерелі немає. §3.3 — гравець дзеркалить.
      gender_cues: []
    voice:
      register: ввічливий службовий, розмитий утомою
      idiolect:
        - "нав’язливе «Um,» майже в кожній репліці — не викидати; це портрет персонажа, а не сміття"
        - "хвостове «and stuff like that» (q7, q10, q17, q18) — той самий український відповідник у всіх входженнях"
        - "самовиправлення «What I meant was» / «What I wanted to say was» (q5, q10, q47, q51) після недоречної відвертості — формула, тримати єдиною"
        - "речення, що обриваються на півслові: «I haven’t slept in… in…» (q11), «I’m not sure I did…» (q28)"
        - "зривається на канцелярську точність, коли переказує правила (q17–q20), і знову розсипається поза ними"

narration:
  present: true
  note: "«ви» без винятків — STYLE §3.1; підказка дії «::Start the Gauntlet.::» — інфінітив, §3.5"

new_names:
  - "Gauntlet"
  - "runner"

idioms:
  - unit: q4
    src: "That was a good run."
    note: "«run» тут — забіг Рукавицею, а не біг узагалі; термін має бути єдиним у всьому вузлі."
  - unit: q4
    src: "She points at the locker, but also doesn't at the same time."
    note: "Комічний оксюморон нарації — зберегти суперечність, не згладжувати в «махнула рукою»."
  - unit: q19
    src: "the final stretch"
    note: "Спортивне «фінішна пряма»; у q36 те саме з друкарською помилкою «strech» — той самий переклад."
  - unit: q27
    src: "You can't just walk in her--"
    note: "Обірване на півслові «in here» — обрив зберегти, з тире."
  - unit: q47
    src: "I long - I yearn for a warm bed"
    note: "Раптовий сплеск лірики в утомленої людини; два різні дієслова бажання, не повторювати одне."
  - unit: q47
    src: "One that will embrace me tightly, love me, caress me"
    note: "Ліжко описане як коханець — образ навмисний, не нейтралізувати."

pitfalls:
  - "q21 містить $(context.playerArenaTitle) — плейсхолдер не чіпати й не відмінювати; будувати фразу так, щоб він стояв у називному."
  - "q1, q7, q14, q42, q53 містять \\n\\n — розриви абзаців зберігати дослівно."
  - "Пари майже однакових реплік: q17≈q34, q18≈q35, q19≈q36, q20≈q37, а також q15≈q23≈q26. Перекладати узгоджено — розбіжність читатиметься як помилка."
  - "У q34 джерело зіпсоване подвійним запереченням («neither the runners or the viewers don’t know»), у q27 — «Gaunlet», у q36 — «strech». Перекладати за змістом, помилки не відтворювати."
  - "Invictus → «Інвіктус» (глосарій, титул на Арені). У q14 слово вжито двічі: з великої як звертання-титул і з малої як загальна назва — розрізняти."
  - "Lanista → «Ланіста» (реєстр, прізвище, попри збіг із латинським терміном)."
  - "«two thousand charons» (q39) і «2000 stygian coins» (q4) — глосарій: «харон» і «стигійська монета»; курсивний наголос «*two* *thousand*» зберегти."
  - "JKK і Underrail (q42) — лишаються латиницею й не відмінюються (глосарій)."
  - "q21 «Are you the gladiator…» і q14 «I didn’t recognize you» стосуються гравця — українська потребує роду там, де англійська обходиться без нього; додати $(#…) (STYLE §2, це норма, а не вільність)."

