  - slug: tchortist_investigator
    name: тчортистський розвідник
    units: default
    confidence: certain
    evidence: [q4, q6]
    role: >-
      Агент Інституту Тчорта, спійманий за зламом електронного замка в
      Центральному Місті. Викручується не запереченням, а гладенькою погрозою
      через службову субординацію співрозмовника.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Обидва тримають підкреслено службову дистанцію: гравець виступає як
        Praetorian Enforcer і чотири рази каже «sir» (a3, a7, a11, a16), NPC
        відповідає повними формами й формулою «I hope we understand each other»
        (q6) — STYLE §3.2, формальні мовці.
      gender_cues: []
    voice:
      register: гладенький, підкреслено чемний, з погрозою під ввічливістю
      idiolect:
        - "усмішка як зброя — тричі відзначена в нарації (q4, q6, q12)"
        - "пом’якшувальні вставки: «merely», «mmm», «injudicious», «Would you kindly»"
        - "обмовка «Look, efreit--» (q6) — виказує зневагу, яку він одразу маскує"

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q25]
    confidence: unknown
    reason: >-
      «Stay away, inbred!» різко суперечить ввічливому, безлайливому мовленню
      розвідника в усіх інших q-рядках. Це або окремий вуличний NPC, або
      бойовий барк іншого персонажа; у файлі немає жодної позначки.
    guidance: >-
      Перекладати грубо й коротко, без пом’якшення (STYLE §9), нейтральною
      побудовою без гендерованого минулого часу.

