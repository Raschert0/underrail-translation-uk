new_names: ["Praetorian Enforcer", "Praetorian Senior Enforcer", "haxxor", "efreit"]

idioms:
  - unit: q6
    src: "Look, efreit-- Eh, enforcer."
    note: >-
      Обмовка: він мало не вжив внутрішньоігрову зневажливу назву, тоді
      виправився на службову. Українська пара має звучати як обірване слово,
      що починається схоже на офіційну назву, — інакше сенс обмовки зникає.
  - unit: q6
    src: "one of great diplomatic and educational importance"
    note: "канцелярський штамп — відтворювати штампом, а не гладкою прозою"
  - unit: a10
    src: "Tell that to the judge, crook."
    note: "поліцейська стала формула; локалізувати як формулу"

pitfalls:
  - >-
    a3 і a17 — той самий рядок із різним званням (Enforcer / Senior Enforcer).
    Переклад має відрізнятися лише званням, решта слово в слово однакова.
  - >-
    «haxxor» — внутрішньоігровий пристрій-жаргонізм; за прикладом «zoner» у
    глосарії тяжіє до запозичення, але рішення централізоване — див. new_names.
  - >-
    Praetorian Security за глосарієм лишається латиницею; чи поширюється це на
    звання «Praetorian Enforcer» — окреме рішення, не вигадувати на місці.
  - >-
    a13 і a23 поєднують репліку з бойовою міткою ::Attack!:: — мітка це підказка
    дії, отже інфінітив, STYLE §3.5.

examples:
  - unit: a9
    rule: "підказка дії всередині ::…:: — інфінітив, STYLE §3.5"
    uk_fragment: "::Битися!::"
