pitfalls:
  - "q358 містить $(#man/woman) — єдиний гендерний плейсхолдер у вузлі; перекладати обидві гілки"
  - >-
    репліки гравця з минулим часом потребують плейсхолдерів, яких в англійському
    немає: a189 «I killed him in the Arena», a305 «I talked to Sneaky» — додати $(#…)
  - >-
    багато юнітів — незакінчені фрагменти речення, що продовжуються в іншому юніті
    (q9, q33, q34, q57, q58, q60, q61, q167, q234, q235, q264, q265, q296, q297, q322, q362, q363):
    не дописувати крапку, не переставляти слова так, щоб склейка зламалася
  - >-
    q265 і q264 — два різні входи в один перелік псевдонімів; обидва мають
    граматично стикуватися з q235
  - "«\\n\\n» усередині юнітів — розрив абзацу, зберігати як є"
  - "Hardcore City Bar має канонічний варіант у глосарії — «Хардкор Сіті Бар»; назва бару не перекладається за змістом, хоча слово «hardcore» у прозі Джона — перекладається"
  - "Coretech, Biocorp, JKK, Praetorian Security, Underrail — латиницею, глосарій, read-only"
  - "Skull Smasher має канонічний варіант «Дробитель Черепів» (глосарій); «Master Skull Smasher» будувати на ньому"
  - "Drop Zone → «Зона Скидання», Black Sea → «Чорне Море», Rail Crossing → «Залізничний Переїзд», Free Drones → «Вільні Дрони» — глосарій"
  - "Rag (q149, q151) — глосарій дає «Ганчірка»; у q151 названо справжнє ім’я Gale, воно канонічного варіанта не має"
  - "Aegis у глосарії — бойовий препарат «Егіда»; тут Aegis Incorporated — інша сутність, рішення потрібне окреме"

