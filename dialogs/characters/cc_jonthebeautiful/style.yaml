    src: "I'm Jon the Beautiful. Am I not? Eh? *Eh*?"
    note: "самопрезентація з епітетом; епітет — частина імені, а не означення"
  - unit: q9
    src: "That's what I'm talking about"
    note: "не перекладати щоразу по-новому — це впізнаваний рефрен, потрібна одна формула"
  - unit: q204
    src: "the zone's zoners often zone other zoners out"
    note: >-
      навмисна тавтологія на корені «zone»; глосарій дає «зонер» —
      каламбур будувати на ньому, а не калькувати англійську фразу
  - unit: q149
    src: "his wares ain't much to type home about"
    note: >-
      навмисно зіпсована ідіома «write home about» — помилка авторська,
      відтворити зіпсованістю української ідіоми, не виправляти
  - unit: q149
    src: "a real son of a rat"
    note: "локалізована лайка, не калька; тримати тваринний образ"
  - unit: q173
    src: "They did a three-sixty... No, wait - one-eighty degree turn"
    note: "самовиправлення — обидві цифри лишаються, помилка є частиною жарту"
  - unit: q335
    src: "I have a seventh sense... Sixth is the food detector"
    note: "жарт тримається на лічбі чуттів — зберегти сьоме й шосте"
  - unit: q138
    src: "Jon needs some brew, it goes well with mushroom stew! Get it? It rhymes."
    note: >-
      римування названо вголос — український відповідник мусить справді
      римуватися, інакше наступна фраза втрачає сенс
  - unit: q243
    src: "The guy's as sly as a... ...very sly guy."
    note: "порівняння навмисно провалюється — тавтологія обов’язкова"
  - unit: q213
    src: "Corecitians - I know it's not a word"
    note: "оказіоналізм від назви міста; коментар «це не слово» вимагає, щоб слово справді було вигаданим"
  - unit: q233
