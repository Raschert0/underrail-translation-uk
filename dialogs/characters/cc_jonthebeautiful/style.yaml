    name: Джон Красень
    name_status: pending
    name_note: >-
      Канонічного українського варіанта немає ні в registry.yaml, ні в глосарії.
      Винесено в new_names; до централізованого рішення транслітерацію не вигадувати.
    units: default
    confidence: certain
    evidence: [q6, q77, q296]
    role: >-
      Вуличний інформатор Центрального Міста, що торгує чутками виключно за їжу.
      Це визначає весь словник: кожна друга репліка повертається до їжі, шлунка
      й апетиту, і саме там, а не в сюжеті, лежить його голос.
    relationships:
      - "Пронира (Sneaky) — колишня; покинула його, він удає, що це його не зачепило (q306, q308, q310)"
      - "Мо (Moe) — шинкар, у якого замовляють «Jon’s special» (q104)"
      - "Гравець — постійний клієнт; Джон звертається «pal» практично в кожній репліці"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Панібратський вуличний мовець без жодної дистанції: нав’язливе «pal»,
        «don’t be silly», «you’re not as dumb as you loo--», тицяння пальцем в
        обличчя вже в першій репліці. STYLE §3.2 — свої й вуличні на «ти».
        Гравець дзеркалить (§3.3).
      gender_cues: ["$(#man/woman)"]
    voice:
      register: гучний, безцеремонний, самозакоханий; мова дитинна там, де про їжу
      idiolect:
        - "«pal» у кожній другій репліці — вокативний тик, потрібен один стабільний відповідник на весь вузол"
        - "«That’s what I’m talking about!» — рефрен-візитівка; має бути дослівно однаковим щоразу (q6, q9, q107, q136, q166, q190, q269, q312)"
        - "«hardcore» як універсальний оцінний прикметник — і похвала, і лайка, і назва бару"
        - "«dominate / dominating / DomiNation» — той самий корінь у трьох ролях: оцінка, назва бару, назва турніру"
        - "«tummy» замість «stomach», «Me hungry» — навмисне дитинне мовлення (q52, q54, q239, q274, q291)"
        - "говорить із набитим ротом: приголосні пливуть (q148, q151, q233, q235, q237, q270, q271, q273)"
        - "хвалиться в третій особі: «Jon’s your man», «Jon Vision», «I’m Jon the Beautiful»"
        - "риторичне «Am I not? Eh? *Eh*?» — саморекламний рефрен (q6, q282, q346)"
        - "«zone out» = вбити; «pipeworker» як лайка, а не професія"
        - "*зірочками* виділені наголошені слова — це інтонація, зберігати позицію"

