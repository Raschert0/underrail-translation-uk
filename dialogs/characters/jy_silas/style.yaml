speakers:
  - slug: silas
    name: Сайлас
    units: default
    confidence: certain
    evidence: [q10, q209, q195, q197]
    role: >-
      Ватажок Black Eels, що керує доками Звалища; наймає гравця зірвати
      Scrappers і продає доступ до «wormhole» за харони або за послуги.
      Говорить як діловий бандит: коротко, з погрозою під поверхнею, торгується.
    relationships:
      - "Колтон — його підлеглий, готує вибухівку (q12, q64)"
      - "Бродерік — капітан на його службі; про його смерть шкодує як про втрату працівника, не друга (q211)"
      - "Едді — бос Scrappers, ворог; лише лайливо (q5)"
      - "Блейн — колишній Scrapper, «old rat», потрібен Сайласу як джерело (q45, q51)"
      - "Гровер — боржник, якого Сайлас велить витрусити або вбити (q117)"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний бос, який звертається до гравця зверхньо-панібратськи: «kid»
        (q127, q152, q162), «station $(#boy/girl)» (q197), «You look green»
        (q80). Формальних маркерів немає в жодному юніті; STYLE §3.2 — грубий
        свій мовець на «ти». Репліки гравця дзеркалять базу (STYLE §3.3),
        зокрема відверто ворожі a160, a161.
      gender_cues: ["$(#boy/girl)", "$(#his/her)"]
    voice:
      register: >-
        грубий, уривчастий, командний; вулична говірка ватажка, що звик,
        що його слухають
      idiolect:
        - "систематичне випадання -g: cleanin', startin', scavengin', sailin' — передавати розмовними формами, а не апострофами"
        - "стале ain't і got замість have (q4, q44, q158) — просторічний шар, не пом’якшувати"
        - "лайливе bloody як підсилювач (q47, q53, q72, q161) — не буквально, а українським лайливим підсилювачем"
        - "нав’язливе Excellent на схвалення (q16, q64, q117, q140, q162, q166) — тримати один сталий відповідник у всьому вузлі"
        - "подвоєння для схвалення: «Very good, very good» (q91, q101)"
        - "he-he як писаний смішок (q49)"
        - "зневажливі клички для чужих: muties (q22), sons of rats (q199, q200), fancy pants (q195)"

narration:
