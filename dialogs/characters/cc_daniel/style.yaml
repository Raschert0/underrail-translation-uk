pitfalls:
  - "q45 «::He interruption comes with a snarl.::» — граматична помилка оригіналу; перекладати за змістом («Він уриває вас гарчанням»), не відтворювати ламану будову."
  - "q36 «I remember it like it was a year ago, because it was about a year ago» — навмисний жарт на зруйнованому кліше; зберегти обидві половини, інакше зникне сміх у наступній ремарці."
  - "Перехід від «ви» до «ти» на q45 — свідомий злам характеру, не згладжувати до рівного регістру в обидва боки."
  - "charons → «харони» (глосарій, монета) з малої; суми лишати цифрами."
  - "Hardcore City Bar → «Хардкор Сіті Бар», Junkyard → «Звалище», Foundry → «Ливарня», Arena → «Арена», Core City → «Центральне Місто» — глосарій."
  - "Гаррієтта (q40) відмінюється: «з Гаррієттою» — реєстр."

