speakers:
  - slug: daniel
    name: Деніел
    units: default
    confidence: certain
    evidence: [q2, q7, q45]
    role: >-
      Мандрівний торговець-одноокий, що збуває бойовий препарат Hercules у
      Хардкор Сіті Барі. Улесливий продавець із заготовленою біографією; щойно
      покупця запідозрено в перевірці товару — маска злітає.
    relationships:
      - "Гаррієтта в барі — до неї підкреслено тепло, «that sweet Harriette»"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Базово — обслуга при незнайомому покупцеві, STYLE §3.2: «ви».
        Ввічлива дистанція витримана всюди, де він продає («Name’s Daniel Arda,
        and it’s a pleasure to meet you»); панібратське friend тут — прийом
        продавця, а не перехід на «ти».
      switches:
        - {unit: q45, to: ти, trigger: "коли гравець згадує аналіз препарату — зрив на пряму лайку, «Listen to me, you moron!»"}
        - {unit: q48, to: ти, trigger: "«Now get lost, punk!» — торг закінчено, ввічливість скинуто"}
        - {unit: q56, to: ти, trigger: "нарація фіксує гарчання; звертання відкрито вороже"}
        - {unit: q58, to: ти, trigger: "те саме, повторна відмова говорити"}
        - {unit: q60, to: ти, trigger: "те саме"}
    voice:
      register: улесливо-балакучий комівояжер; після зриву — хрипкий і брутальний
      idiolect:
        - "friend / my friend наприкінці чи всередині майже кожної репліки — словесний тик, зберігати як звертання"
        - "подвоєння для натиску: «Really? Really?», «Excuse me? Excuse me?», «poor, poor family», «Good, good»"
        - "питальне eh? наприкінці фрази — просити згоди в покупця"
        - "риторичні ланцюжки запитань у рекламному пасажі q21 — ритм зберегти"
        - "ремарки ::He laughs.:: після майже кожної теми; сміх — частина торгової подачі"
        - "після зриву голос описано як raspy, growly — лексика має стати односкладовою й різкою"

