speakers:
  - slug: west
    name: Вест
    units: default
    confidence: certain
    evidence: [q1, q13, q51]
    role: >-
      Джордж Вест — власник крамниці електроніки в Ливарні, передчасно постарілий
      від отруєного повітря й безперервно кашляє. Тримається привітно-професійно
      з усіма, тож його голос — це ввічливий торговець, який мимоволі видає свою
      втому й розчарування містом.
    relationships:
      - "Бернард — замовник ремонту печі; Вест ставиться до нього іронічно («not exactly the sanest man around here»)"
      - "Foundry Guard — Вест довіряє їм більше, ніж гравцеві, і посилається на них, коли відмовляється говорити (q65, q67)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Вест — обслуга у власній крамниці, який кожну другу репліку завершує
        приязним «friend», але дистанцію тримає: торгується, називає ціну,
        відмовляє. За STYLE §3.2 обслуга й формальний мовець — «ви»; репліки
        гравця дзеркалять базовий реєстр (§3.3). Гендерних плейсхолдерів у вузлі
        немає, тож рішення спирається на роль.
    voice:
      register: >-
        привітний, трохи старомодний, із паузами й покашлюванням; у розмові про
        повітря й місто прохоплюється гіркота
      idiolect:
        - "«friend» як звертання наприкінці репліки — головний тик (q23, q45, q47, q51, q70, q75, q76); потрібне одне стале українське звертання на весь вузол"
        - "::He coughs.:: — повторювана ремарка, що структурує його мову; ставити тим самим формулюванням щоразу"
        - "«friable» про власне тіло — «ламкий, крихкий» (q16 про вуха, q32 про спину); авторський дивакуватий вибір слова, зберегти незвичність"
        - "затягнуті вагання перед відповіддю: «Hmm.», «Mmm,», «Mmmm...»"
        - "скорочення в мовленні: «Name's George West», «'cause», «What've you got»"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Довгий вступний портрет q1 і мікроремарки
    ::He coughs.::, ::He nods.::, ::He shrugs.:: — та сама нарація, реєстр однаковий.
    Підказки дій усередині ::…:: (a3, a15, a20, a31, a37) — інфінітив за §3.5.

new_names: ["Core City Housing Corporation"]

idioms:
  - unit: q1
    src: "his wrinkles form ravines in his face"
    note: "розгорнута метафора яруг; зберегти образ, не зводити до «глибокі зморшки»"
  - unit: q16
    src: "I just hope Bernard doesn't talk my friable ears off"
    note: "«talk one's ears off» — забалакати до смерті; локалізувати ідіомою, але зберегти гру з «friable»"
  - unit: q19
    src: "I must've gone derailed to accept this"
    note: >-
      внутрішньоігровий сленг Underrail («з’їхав з рейок» = божевільний); той самий
      зворот є у fo_saban q50 — рішення має бути спільним для обох вузлів
  - unit: q56
    src: "tighter than a miner who had found a lump of gold"
    note: "локальне порівняння з шахтарем; зберегти саме шахтаря, місто живе з копальні"
  - unit: q64
    src: "like starving rathounds eyeing their prey"
    note: "щурчаки за глосарієм; порівняння тримає всю характеристику незнайомців"
  - unit: q69
    src: "security here is top notch"
    note: "розмовна похвала; не переходити на канцелярит"
  - unit: q32
    src: "Old age, what can I say."
    note: "самоіронія — ключ до персонажа, він насправді не старий (q1); не згладжувати"

