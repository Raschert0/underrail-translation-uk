speakers:
  - slug: maxim
    name: Максим
    units: default
    confidence: certain
    evidence: [q30, q33, q85]
    role: >-
      Спадкоємець торгового дому Талоскі — багатий, марнославний і настирливо
      залицяльний юнак, який міряє світ грішми, прізвищем і Ареною. Говорить майже
      винятково про себе; будь-яку тему повертає на власне багатство або на флірт.
    relationships:
      - "Влатко — батько, засновник справи, «мій ідол»"
      - "Sophia/Sophie — молодша сестра, яку він зве набридливою; гравець потрапляє до нього як її знайомий (q1)"
      - "прадід — «ancient», «not right in the head», живе нагорі й не виходить"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Попри багатство мовець не формальний, а фамільярно-залицяльний:
        «darling», «pretty», «mushroom cake», «Eh?». STYLE §3.2 дає «ти».
        Гравець дзеркалить (§3.3), зокрема в різкому a44 і a51.
      gender_cues: ["$(#guy/girl)", "$(#man/girl)", "$(#him/her)"]
      switches:
        - {unit: q45, to: ти, trigger: "образа у відповідь на приниження — тон падає з залицяння в лють, але регістр той самий; згладжувати грубість не можна"}
        - {unit: q50, to: ти, trigger: "«charm» зникає — перехід на суху відмову, без пестливих звертань"}
    voice:
      register: пихатий, солодкавий, хвалькуватий
      idiolect:
        - "звертання «mushroom cake» — фірмове пестливе слівце (q3, q19, q23, q33), має бути тим самим у всіх появах"
        - "паразитне «hm» усередині й наприкінці фраз (q30, q33, q41, q85)"
        - "риторичне «Eh?» як вимога погодитися (q35, q41)"
        - "«hardcore» як найвища похвала — спільне слівце з Маком (cc_mac), узгодити передачу між вузлами"
        - "нав’язливе «rich» — повторює тричі поспіль у q6–q8 і знову в q55; повтор навмисний, не синонімізувати"
        - "говорить про себе в третій особі: «What can Maxim do for you?», «you'll be back to Maxim»"

narration:
  present: true
  note: >-
    «Ви» без винятків — STYLE §3.1. Нарація тут переважно описує його погляд і
    жести (q28, q30, q33, q43, q45); саме вона несе оцінку персонажа, тому
    іронію тексту тримати, а не пом’якшувати.

new_names: ["Talloski", "Sophia", "Pulverizer", "Carnifex"]

idioms:
  - unit: q3
    src: "mushroom cake"
    note: >-
      Пестливе звертання-візитівка, побудоване на грибах Underrail. Локалізувати як
      живе пестливе слово, а не як кулінарний термін; a47 і a36 обіграють його
      прямо, тож форма має витримувати повтор із вуст гравця.
  - unit: q37
    src: "Blood is red, my eyes are blue, wanna come over to Talloski Manor, what say you?"
    note: >-
      Знімальна віршована примовка. Має римуватися українською й лишатися незграбною —
      незграбність тут і є жартом; підрядник її вбиває.
  - unit: q35
    src: "Who is immensely rich and blinks?"
    note: "загадка з відповіддю-жестом (він блимає очима); зв’язок питання й нарації ::He starts blinking:: має читатися, повторюється в q48"
  - unit: a38
    src: "you handsome devil"
    note: "іронічний комплімент, гравець підіграє; локалізувати як розмовну лестку"
  - unit: a46
    src: "You're not as smooth as you think"
    note: "«smooth» тут — про вміння клеїтися, не про гладкість; те саме слово в лапках у a51 («cut the \"smooth\" talk»), обидва місця узгодити"
  - unit: q45
    src: "go and die in a hole full of acid"
    note: "дитяча за побудовою лайка — саме її недоладність показує, що його вперше зачепили; грубе лишається грубим, STYLE §9"
  - unit: q28
    src: "so heavy it would likely kill a rathound if dropped on its head"
    note: "іронічна гіпербола нарації; «rathound» → «щурчак» (глосарій)"
  - unit: q15
    src: "that old geezer"
    note: "зневажливе про прадіда; зберегти нешанобливість, вона характеризує мовця"

pitfalls:
  - "q71 і a72 містять $(context.playerArenaTitle) — плейсхолдер підставляє титул у називному відмінку. Речення будувати так, щоб називний був граматичним; усередині плейсхолдера нічого не змінювати."
  - "a84 містить $(context.player.Name) — не відмінювати всередині плейсхолдера."
  - "q71 містить $(#him/her), який стосується ГРАВЦЯ у третій особі — це не звертання; гілки мають бути «його/її», а не «йому/їй», перевірити за керуванням дієслова «invited»."
  - "q45 звертається до гравця як «you revolting woman» без плейсхолдера — джерело припускає жінку незалежно від статі персонажа. Не вигадувати тут $(#…): це рішення гри, а не пропуск; передавати як є."
  - "Сестра зветься то «Sophie» (q1), то «Sophia» (q8, q10) — у реєстрі є лише Sophie → Софі. До вирішення тримати обидві появи однією формою й не плодити третю."
  - "«Talloski» — прізвище, «Talloski Manor» — маєток, «I am a Talloski» — рід. Три вживання мають бути впізнавано одного кореня."
  - "Глосарій: Arena → Арена, Core City → Центральне Місто, Invictus → Інвіктус, rathound → щурчак; «Praetorian Security» лишається латиницею й не відмінюється."
  - "«hardcore» звучить у q21, q59, q62, q65, q81 як оцінка — тримати одне слово в усіх п’яти, це маркер персонажа."
  - "q19 і q23 — той самий рядок прощання з різних гілок; розбіжність читатиметься як помилка."

