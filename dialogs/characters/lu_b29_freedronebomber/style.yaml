speakers:
  - slug: lu_b29_freedronebomber
    name: підривник Вільних Дронів
    units: default
    confidence: certain
    evidence: [q1, q4]
    role: >-
      Останній уцілілий боєць Вільних Дронів біля бомби: наляканий, але
      готовий підірватися разом із вантажем. Говорить гаслами руху, і саме
      цей пафос відрізняє його від звичайних бандитів у сусідніх вузлах.
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Особиста лють і звинувачення «Damn you, $(#man/woman)! You... you
        killed all my friends!» — це не службова дистанція, а зрив,
        STYLE §3.2. Гравець відповідає прямими погрозами, STYLE §3.3.
      gender_cues: ["$(#man/woman)"]
    voice:
      register: піднесений, ідеологічний, на межі зриву
      idiolect:
        - "лозунгові формули руху: «I'm a Free Drone, that's who I am!», «Death to Protectorate!»"
        - "зірочки для наголосу: «make *sure*» — зберігати розрядку"
        - "паузи-затинання через три крапки «You... you killed» — відтворювати"

narration:
  present: true
  note: "q1, q7, q8 містять ::…:: — «ви» без винятків, STYLE §3.1"

