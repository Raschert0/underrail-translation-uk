  - "«Dreadnoughts» у q4 — назва бойових машин Протекторату, канонічного варіанта ще немає"
  - "a6 ::[Intimidate]:: — назва перевірки, узгодити з глосарієм навичок"
  - "q7 містить пробіл перед <end> — не прибирати, це формат рядка"

