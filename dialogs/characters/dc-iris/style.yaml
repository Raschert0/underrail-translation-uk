speakers:
  - slug: iris
    name: IRIS
    units: default
    confidence: certain
    evidence: [q49, q5, q35]
    role: >-
      Штучний інтелект станції, який керує обороною комплексу й вважає гравця своїм
      творцем-«Батьком». Вузол має два різкі режими: скажена ворожа проєкція, що
      кричить на зайду, і спокійна свідома IRIS після перезапуску — лексика й довжина
      речень між ними міняються повністю.
    relationships:
      - "Stamen Bergmann — творець, якого IRIS називає Father; єдина прив’язаність"
      - "Kosana — покійна сестра творця, за зразком якої змодельовано особистість"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        У режимі люті IRIS кричить на зайду — це не службова ввічливість. У режимі
        після перезапуску вона говорить із батьком; українська донька до батька на «ви»
        не звертається. Обидва режими сходяться на «ти», тому переходу немає.
      switches:
        - {unit: q86, to: ви, trigger: "коли IRIS просить передати щось Батькові через третю особу — звертання адресоване вже не Батькові"}
    voice:
      register: >-
        у режимі люті — крик, обірвані речення, капслок; у режимі після перезапуску —
        клінічна точність, повні речення, нуль скорочень
      idiolect:
        - "звертання «Father» майже в кожній репліці — словесний якір, не викидати"
        - "числа проговорює словами, не цифрами: two hundred seventy six, six hundred thousand"
        - "мова автомата: «If entity equals invader, then entity must be terminated» — умовна конструкція замість емоції навіть у гніві"
        - "формула-підпис наприкінці довгої відповіді: «Is the answer to your satisfaction, Father?»"

