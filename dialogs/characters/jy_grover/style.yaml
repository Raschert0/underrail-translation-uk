pitfalls:
  - "q7 «this is my friend Treasa» — Гровер представляє Трісу гравцеві; ім’я в репліці вказує на того, про кого мова, а не на мовця"
  - "q8, q10, q17 містять звертання «Grover» — це репліки Тріси ДО Гровера, не Гроверові слова"
  - "a19 «Don't worry, ma'am» — гравець звертається до Тріси, а не до Гровера, хоч у тій самій репліці згадано «my friend Grover»"
  - "q30 і q54 змішують нарацію в «::…::» з прямою мовою в одному юніті — регістр усередині юніта різний: «ви» в нарації, «ти» в мові"
  - "«charons» (q32) — глосарій: «харон», з малої, як монета"
  - "«Scrappers» (q11) — фракція без канонічного рішення; не вигадувати переклад до внесення в реєстр"

