speakers:
  - slug: grover
    name: Гровер
    units: default
    confidence: certain
    evidence: [q50, q52, q24]
    role: >-
      Дрібний боржник зі Звалища, який заборгував Докмайстрові й ховається від
      Чорних Вугрів. Тон коливається від удаваної байдужості до відвертого
      скиглення — саме цей злам і треба тримати в перекладі.
    relationships:
      - "Сайлас — через нього передано борг; Гровер уже виправдовувався перед ним (q52)"
      - "Тріса — «friend», яку він здає гравцеві заради власного порятунку"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Вуличний боржник без жодної службової дистанції: звертання «man»,
        «$(#jack/sister)», панібратське «my favorite extorter». Гравець приходить
        вибивати борг — ввічливої форми тут немає з жодного боку.
      gender_cues: ["$(#jack/sister)"]
    voice:
      register: розхристаний, запобігливий, з нальотом фальшивої бадьорості
      idiolect:
        - "систематичне випадання g: «tellin'», «nuthin'», «sellin'», «waitin'» — передавати розмовним усіченням, не орфографічною помилкою"
        - "«ain't», «gotta», «wanna», «kinda» — знижений регістр, не згладжувати"
        - "заповнювачі «like», «yeah», «you know» — словесні тики, лишати"
        - "у сценах страху мова розсипається на повтори: «I can, I can help you», «I promise. I promise.»"

  - slug: treasa
    name: Тріса
    units: [q8, q10, q14, q17, q20, q25]
    confidence: probable
    evidence: [q8, q10]
    role: >-
      Мешканка Звалища, яку Гровер заманює в завулок заради енергоядра.
      Реагує гнівом і недовірою, не проханням.
    relationships:
      - "Гровер — називає його «you slimy good-for-nuthin'», тобто жодної приязні"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Одразу після появи говорить вороже й через голову гравця («Who's this
        $(#guy/woman)?»), далі переходить до погроз. Дистанція тут не ввічлива,
        а конфліктна.
      gender_cues: ["$(#guy/woman)"]
      switches:
        - {unit: a19, to: ви, trigger: "гравець удавано ґречно каже «Don't worry, ma'am» — глумлива ввічливість перед нападом; зберегти контраст, а не вирівняти під «ти»"}
    voice:
      register: різкий, підозріливий, у сутичці — відверто лайливий
      idiolect:
        - "те саме випадання g, що й у Гровера («nuthin'») — обоє з того самого дна"

