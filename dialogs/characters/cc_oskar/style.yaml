idioms:
  - unit: q46
    src: "One wrong step and off you go to kiss the ground below"
    note: "евфемізм смерті від падіння — локалізувати образ, не калькувати «цілувати землю»"
  - unit: q61
    src: "which would be retarded, let's face it"
    note: "грубе лишається грубим — не пом’якшувати (STYLE §9); це характеристика Оскара, а не недогляд"
  - unit: q64
    src: "he gathered some bad boys and enforced order"
    note: "«bad boys» тут схвально — «крутих хлопців», не «поганих»"
  - unit: q67
    src: "Some wimpy northerner"
    note: "зневажливий демонім-ярлик; «northerner» перекладати, зневагу зберігати"
  - unit: q75
    src: "was born under a lucky stalactite"
    note: "переробка ідіоми «born under a lucky star» під підземний світ гри — зберегти саме сталактит, у цьому й жарт"
  - unit: q76
    src: "he might as well zone himself out"
    note: "«zone out» тут — убити; спирається на глосарійне «zoner» → «зонер», тримати спільний корінь"
  - unit: q81
    src: "I'm gonna be the one zoning them out"
    note: "той самий сленг, що й у q76 — відповідник має збігатися"
  - unit: q82
    src: "they are gonna get some Oskarnation. Get it? It's Oskar and domination."
    note: >-
      Каламбур Oskar + domination, який персонаж тут-таки пояснює й сам псує
      («that sounds like a nation of Oskars»). Потрібне українське словозлиття
      з тим самим коренем, що й обраний відповідник «domination», інакше
      пояснення в наступному реченні втратить сенс. Ключове місце вузла.
  - unit: q62
    src: "watch people murder each other's faces off"
    note: "гіпербола-грубість — зберігати надмір, не згладжувати до «дивитись бої»"
  - unit: q87
    src: "respectably hardcore. For a scavenger."
    note: "«scavenger» — глосарій дає «шукачі»; поблажливе «for a…» зберігати як окреме речення"

pitfalls:
  - "«Praetorian Security», «Biocorp», «Coretech», «ArenaNow», «JKK», «Underrail» — лишаються латиницею (глосарій, read-only)"
  - "«Faceless» → «Безликі», «Protectorate» → «Протекторат», «Foundry» → «Ливарня», «Drop Zone» → «Зона Скидання», «Camp Hathor» → «Табір Хатор», «Arena» → «Арена» — беруться з глосарію"
  - "q64 «Archibald Knight, chief» — за реєстром «шеф Найт» з малої літери; повне ім’я — «Арчібальд Найт» (глосарій)"
  - "q56 перелічує Knight, Edstrom і Simmons — усі три в реєстрі: Найт, Едстром, Сіммонс"
  - "q26 і q27 містять літеральні \\n усередині одного юніта — це рядки списку, зберігати кожен розрив"
  - "q26 обривається на середині списку, а q27 його продовжує: юніти перекладаються як одне ціле, узгодьте оформлення списку між ними"
  - "q31 і q32 — майже дублікати з однією відмінністю (згадка Мордре / без неї); переклад має відрізнятися рівно на цю згадку"
  - "a23 «::Give him 100 stygian coins.::» — глосарій дає «стигійська монета»; підказка дії лишається інфінітивом (STYLE §3.5)"
  - "асиметричні виділення *You*, *have*, *most*, *and* — переносити на слово, що несе наголос в українському реченні"
  - "«Tchortists» походить від глосарійного «Tchort» → «Тчорт»; тримати той самий корінь"

