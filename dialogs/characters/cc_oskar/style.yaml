speakers:
  - slug: oskar
    name: Оскар
    units: default
    confidence: certain
    evidence: [q1, q2, q78]
    role: >-
      Власник збройової крамниці в Центральному Місті й колишній енфорсер
      Praetorian Security; торгує зброєю та вибухівкою і за плату показує
      викрадене досьє на Спектрів. Уся його мова побудована навколо одного
      слова — комічний персонаж однієї нав’язливої ідеї.
    relationships:
      - "Praetorian Security — колишній роботодавець, яким він хизується й у якого вкрав документ"
      - "Al Fabet — тема, від якої Оскар щоразу ухиляється; єдиний випадок, коли він втрачає браваду"
      - "Гравець — постійний клієнт, до якого він звертається «gunslinger»"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Звертання $(#man/sister) і прізвисько «gunslinger», суцільний сленг
        («gonna», «sayin'», «'cause», «freakin'»), відсутність будь-яких
        формальних маркерів — STYLE §3.2. Крамарський статус тут не робить його
        обслугою: тон панібратський від першої репліки.
      gender_cues: ["$(#man/sister)", "$(#Man/Sister)"]
    voice:
      register: гучний, бравадний, вуличний; синтаксис короткий і рубаний
      idiolect:
        - "«hardcore» — центральний словесний тик, близько тридцяти вживань; потрібен ОДИН український відповідник, що працює і як прикметник, і як вигук, і в складних формах («hardcoreness», «hardcore serious», «a hardcore peek»)"
        - "«dominate / dominating / domination» — другий наскрізний тик, той самий, що в Оли; тримати спільний відповідник по обох вузлах"
        - "«The end!» як крапка в кінці тиради (q56, q65) — риторичне закриття теми, не буквальне «кінець»"
        - "«Yeah.» окремим реченням-підтвердженням власних слів"
        - "випадання g та стягнення: «sayin'», «'cause», «gonna», «wanna», «every-freaking-where»"

  - slug: spectre_dossier
    name: текст досьє (не мовець)
    units: [q26, q27, q28, q31, q32]
    confidence: certain
    evidence: [q26, q27]
    reason: >-
      Це не репліка Оскара, а документ, який гравець читає з рук: канцелярський
      реєстр із полями «Full name», «Part of», «Insignia» та списком прізвищ.
    guidance: >-
      Перекладати як письмовий документ, а не як мову: «ви» (STYLE §3.1),
      знеособлені конструкції, нейтральна канцелярська лексика. Жодного
      «hardcore» тут немає й бути не повинно — стилістичний контраст із рештою
      вузла навмисний. Імена зі списку членів не транслітерувати самотужки.

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Іменована нарація (q78 «Oskar's face
    rearranges itself…») доводить атрибуцію; q1 — розгорнутий вступний опис
    персонажа, найдовший зв’язний текст у вузлі.

