speakers:
  - slug: marcella
    name: Марселла
    units: default
    confidence: certain
    evidence: [q67, q73]
    role: >-
      Керівниця південного осередку Вільних Дронів, яку Бейт скинув зі скелі й
      лишив помирати; гравець знаходить її в «Hanging Rat» без пам’яті. Вузол
      розпадається на дві людини в одному персонажі: зацькована безіменна жінка
      до q67 і командирка, що згадала себе, після нього.
    relationships:
      - "Бейт — колишній коханець і зрадник, який намагався її вбити; після повернення пам’яті говорить про нього з холодною люттю"
      - "Трентон — співкерівник осередку, якому вона довіряє й до якого апелює на очній ставці"
    address:
      npc_to_player: змішане
      player_to_npc: змішане
      basis: >-
        До q67 вона розмовляє з чужою людиною й сама це проговорює («you are a
        stranger», «strangers can’t be trusted») — дистанція тримається на «ви»,
        і саме «ви» несе її холод. Після повернення пам’яті гравець стає
        соратником, з яким вона йде на базу, — далі «ти». Репліки гравця
        дзеркалять цей самий злам (STYLE §3.3).
      switches:
        - {unit: q67, to: ти, trigger: "повернення пам’яті: гравець із чужинця стає союзником"}
    voice:
      register: до q67 — уривчастий, оборонний, короткі речення; після q67 — командний, різкий, з відкритою ненавистю
      idiolect:
        - "часті обриви думки й повтори («I try and I try», «I don’t know anything»), що передають розгубленість — не згладжувати в плавну мову"
        - "після q67 з’являються лайливі образи на адресу Бейта (slimeball, bastard, Pig) — грубе лишається грубим"

  - slug: bate
    name: Бейт
    units: [q12, q15, q17, q19]
    confidence: certain
    evidence: [q19, q17]
    role: >-
      Викритий на очній ставці шпигун Протекторату й один із керівників осередку.
      Спершу перекидає звинувачення на Марселлу, потім переходить на любовну
      риторику, і аж у q19 зривається.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Прямо до гравця в цьому вузлі не звертається — у q15 говорить про нього
        в третій особі («She fooled kiddo»). Базовий регістр беремо як у керівника
        до сторонньої людини; до Трентона й Марселли він на «ти».
    voice:
      register: спершу вкрадливо-переконливий, далі благальний, наприкінці зламаний
      idiolect:
        - "«Muffin» — інтимне звертання до Марселли; має звучати як пестливе прізвисько, бо на ньому тримається впізнавання в a63"

  - slug: trenton
    name: Трентон
    units: [q13, q18]
    confidence: probable
    evidence: [q18]
    role: >-
      Другий керівник осередку, який веде очну ставку: ставить питання Марселлі
      й оголошує Бейтові вирок. Говорить коротко, без емоційних прикрас.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        До гравця в цьому вузлі не звертається. До Бейта — «ти»: багаторічний
        співкерівник, і холодна зневага в українській звучить саме на «ти».
        Наказ успадковує вибір (STYLE §3.4): «Здай зброю».
    voice:
      register: сухий, командний, без скорочень і без образливої лексики

  - slug: unknown_1
    name: мовця встановити не вдалося
    units: [q1, q5, q7, q10]
    confidence: unknown
    reason: >-
      Післябойові репліки без імені в нарації. q1 звертається до Трентона, отже
      Трентон їх не говорить. q7 («I never, ever had a reason to suspect him»)
      прямо суперечить словам Марселли в q72, де вона каже, що підозри мала, —
      отже це й не вона. q5 і q10 витримані тим самим аналітичним голосом
      керівника, але жодного механічного сигналу для атрибуції в джерелі немає.
    guidance: >-
      Тримати базовий регістр вузла й нейтральну побудову; уникати гендерованого
      минулого часу від першої особи («знаю Бейта не перший рік», а не «знав/знала»),
      бо стать мовця не встановлена.

  - slug: unknown_2
    name: мовця встановити не вдалося
    units: [q79]
    confidence: unknown
    reason: >-
      Репліка стороннього відвідувача «Hanging Rat», що ображається на слово «dump»
      у q78. Мовний відбиток різко інший, ніж у Марселли: «Whatcha», «ain’t», «Yer».
      Ані нарації з іменем, ані звертання в тексті немає.
    guidance: >-
      Просторічний, грубуватий тон і «ти»; просторіччя передавати українськими
      розмовними формами, не орфографічними помилками. Стать мовця з джерела
      не випливає — уникати гендерованих форм.

narration:
  present: true
  note: >-
    Нарації тут більше, ніж прямої мови: розгорнуті описи погляду й міміки.
    «Ви» без винятків — STYLE §3.1.

