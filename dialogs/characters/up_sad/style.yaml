speakers:
  - slug: sad
    name: SAD-5
    units: default
    confidence: certain
    evidence: [q2, q3, q7]
    role: >-
      Бойовий робот, чиї репліки оформлені як журнал системи: мітка типу
      повідомлення, двокрапка, тіло. Комізм у зіткненні холодного протоколу
      з відвертою кровожерливістю.
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Це не характер, а системний голос: «Scanning...», «Warning!»,
        «Recommended course of action». Регістр UI-повідомлення — «ви»
        (STYLE §3.2, службовий мовець). Погрози тону не змінюють, бо машина
        не переходить на панібратство. Реплік гравця у вузлі немає.
      gender_cues: []
    voice:
      register: машинний протокол, безособові конструкції, окличні збої
      idiolect:
        - "мітки-заголовки «Query;», «Statement;», «Greeting ;», «Taunt;», «Threat;» перед тілом репліки — синтаксис, а не звертання"
        - "збій як драматичний прийом: «ERROR!» посеред репліки перевертає зміст (q12)"
        - "механічний сміх «HA-HA-HA!» капслоком — лишати як є"

narration:
  present: false
  note: "справжньої нарації ::…:: немає; q-рядки — це вивід на екран"

