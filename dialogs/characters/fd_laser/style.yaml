speakers:
  - slug: laser
    name: Лазер
    units: default
    confidence: certain
    evidence: [q5]
    role: >-
      Пес, чия «мова» — це поведінка: погляд, гарчання, виляння хвостом.
      Реагує на те, як гравець до нього заговорив, і нічого не промовляє,
      крім «Woof!».
    relationships:
      - "Гатч — господар; реєстр прямо вказує, що Лазер — його пес"
    address:
      basis: >-
        Полів npc_to_player і player_to_npc свідомо немає. Пес не говорить, а
        репліки гравця звернені до тварини (a3, a6) — вибір «ти/ви» тут не
        застосовний. Керує лише правило нарації, STYLE §3.1.
      gender_cues: []
    voice:
      register: без мови; уся характеристика — у розлогій нарації поведінки
      idiolect:
        - "«Woof! Woof!» — єдине, що пес «промовляє» (q9, q10)"
        - "нарація про нього нарочито клінічна й довга (q2, q7) — контраст із простотою тварини"

  - slug: hutch
    name: Гатч
    units: [q5]
    confidence: probable
    evidence: [q5]
    role: >-
      Голос за кадром, що кличе пса. У кадрі не з’являється й більше нічого
      не каже.
    address:
      basis: >-
        Кличе тварину, до гравця не звертається; питання регістру не постає.
      gender_cues: []
    voice:
      register: гучний оклик здалеку

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Тут це керує майже всім вузлом: вісім із
    дев’яти q-юнітів — суцільна нарація від другої особи («you get the
    impression», «your ear-drums»).

new_names: []

idioms:
  - unit: a3
    src: "Who's a good doggie? Are you? Yes you are, yes you are!"
    note: >-
      Сюсюкання до собаки — усталений мовний жанр. Потрібен український
      відповідник цього жанру, а не дослівний переклад питань.
  - unit: a6
    src: "Get lost, mut! Shoo!"
    note: >-
      «Shoo» — вигук відгону тварини, має бути саме вигуком. «mut» — написання
      джерела замість «mutt», тобто «дворняга».
  - unit: q7
    src: "sawing through your ear-drums like a steady, serrated blade"
    note: "розгорнуте порівняння — зберегти як образ, не згортати до «дуже гучно»"

pitfalls:
  - >-
    Лазер є в реєстрі як кличка пса Гатча — «Лазер». Не перекладати як
    загальну назву приладу й не міняти на інше слово.
  - >-
    q5 — єдина репліка людини в усьому вузлі, і за реєстром це найпевніше
    Гатч. Атрибуція позначена як probable: у самому файлі сказано лише «a male
    voice». Якщо переклад вимагатиме роду чи звертання, спиратися на «чоловічий
    голос», а не на ім’я.
  - >-
    a8 — підказка дії всередині ::…::, отже інфінітив, STYLE §3.5.
  - >-
    «occassional» у q9 — помилка джерела; українською пишемо нормативно.

examples:
  - unit: a8
    rule: "підказка дії всередині ::…:: — інфінітив, STYLE §3.5"
    uk_fragment: "::Завмерти.::"
    status: proposed
