speakers:
  - slug: guzomir
    name: Гузомір
    units: default
    confidence: certain
    evidence: [q1, q2, q3, q16]
    role: >-
      Чужинець-переселенець у халупі на виступі в Центральному Місті: газова
      маска, засмальцьований одяг завеликого розміру, здає в оренду бочки для
      бочкового супу. Говорить приязно й самопринижено, але постійно
      підкреслює «ми, чужинці» — це громада, що тримається купи.
    relationships:
      - "громада «foreigners», про яку він каже «we» — сусіди-переселенці з того ж заходу"
      - "гравця сприймає як особу при владі (звертається «officer»)"
    address:
      npc_to_player: ви
      basis: >-
        Звертається «Hello, officer $(#sir/ma’am)» — мешканець нетрів до
        людини в однострої. Панібратське «bre» і «$(#brother/sister)» — це
        теплота мовця, а не перехід на «ти»: воно чудово живе всередині «ви».
      gender_cues: ["$(#sir/ma'am)", "$(#brother/sister)"]
    player_to_npc: ви
    voice:
      register: розмовний, добродушний, трохи запобігливий; мова з виразним чужинським акцентом
      idiolect:
        - "«bre» — наскрізне слівце-паразит, у q18 воно ще й тема репліки"
        - "«you dig» / «Dig, bre?» — перепитування, чи зрозуміли"
        - "«dominating» / «not dominating» — місцевий сленг Центрального Міста як оцінка"
        - "розтягнуте «Breeeee!» (q25) — емоційний вигук, а не слово"

