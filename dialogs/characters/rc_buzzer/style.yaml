speakers:
  - slug: buzzer
    name: Дзижчик
    units: default
    confidence: certain
    evidence: ["q42", "q46", "q9"]
    role: >-
      Крамар із Залізничного Переїзду, торгує дивною електронікою; Безликі вломилися
      в його крамницю й тримали його в клітці, доки гравець його не визволив.
      Балакучий, спостережливий, із виразними політичними симпатіями до Вільних Дронів.
    relationships:
      - "Cornell та його ватага — покупці, що принесли йому дивний пристрій і накликали Безликих"
      - "Безликі — тримали його в клітці й вивідували щось із його свідомості"
      - "Terry і Lora Baker — постійні торгові партнери зі ССГ"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Плейсхолдери $(#boy/girl) (q35), $(#man/sister) (q46, q47), $(#man/woman) (q49) —
        панібратські звертання, сильний сигнал на «ти» (STYLE §3.2). Підкріплено
        зверненням «man» у q27 і репліками гравця «See you later, man» (a41).
      gender_cues: ["$(#boy/girl)", "$(#man/sister)", "$(#man/woman)"]
    voice:
      register: розмовний, крамарський, із лайкою середньої сили; охоче розповідає довгі історії
      idiolect:
        - "«man» як звертання-заповнювач — в українському тексті не калькувати як «чоловіче» щоразу, а чергувати природні розмовні вставки"
        - "проковтнута лайка: «hell», «freaking», «bloody», «hot damn», «damn it to hell» — грубе лишається грубим, не пом’якшувати (STYLE §9)"
        - "суха жартівливість із паузою: «A singularity bomb...» / «Just kidding» (q29–q30) — тайминг зберегти окремими юнітами"
        - "у розповіді переходить у теперішній час: «he tells me», «By this point I’m intrigued» (q10, q12) — розмовний наративний теперішній, відтворити"
        - "у політичному монолозі (q32–q36) риторичні питання й публіцистичний регістр — контраст із побутовою мовою решти вузла"

