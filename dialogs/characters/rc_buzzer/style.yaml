    src: "you did take care of them freaks"
    note: "«them freaks» замість «those freaks» — просторічна форма, знак низького регістру мовця"

pitfalls:
  - "q46 містить $(#man/sister) — обидві гілки перекладаємо українськими звертаннями, латиниці всередині $(#…) лишатися не має"
  - "Underrail не перекладається й не відмінюється (глосарій): «Lower Underrail», «South Underrail», «North Underrail» — означення українською, назва латиницею"
  - "Faceless → «Безликі», Free Drones → «Вільні Дрони», Protectorate → «Протекторат», Core City → «Центральне Місто», SGS → «ССГ», scavengers → «шукачі» — глосарні відповідники"
  - "«the Cans» (q32) і «Tin Cans» (q36) — те саме зневажливе прізвисько протекторатських солдатів; переклад має бути один і впізнаваний в обох юнітах"
  - "q11 «twenty-sided Rubik’s cube» — реальний бренд, лишається впізнаваним; двадцятигранність зберегти, це опис предмета"
  - "q46 і q47 — взаємовиключні варіанти тієї самої сцени (визволив / не визволив); тон різний, але звертання й імена мають збігатися"
  - "q42–q44, q46, q47, q49 не мають реплік-відповідей у файлі — це репліки-оклики поза деревом; вони мають читатися самостійно"

