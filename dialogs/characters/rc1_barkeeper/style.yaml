pitfalls:
  - >-
    КРИТИЧНО: q65, q66, q68, q101, q102, q104, q106, q108 — не самостійні речення,
    а фрагменти, які рушій склеює в один рядок (q65 «You and Dude had » + q66
    «twenty bottles… and paid for none of it! » + q68 «That's two hundred sixty
    charons you owe me. »). Кінцеві пробіли зберігати дослівно, а українську
    побудову підбирати так, щоб склейка лишалася граматичною — узгодження відмінка
    між частинами не можна перевіряти по одному юніту окремо
  - "той самий каркас повторюється для другої суми: q102 «thirteen bottles… four bags» + q101 «one hundred seventy charons» — обидві версії мають бути побудовані однаково"
  - "числівники в q68, q101 записані словами, а в a40, a43 — цифрами (260, 170). Зберігати спосіб запису кожного юніта, не уніфіковувати"
  - "«charons» (q67, q68, q101) — канонічно «харон» (глосарій), мала літера; a40, a43 «stygian coins» — «стигійські монети», це та сама валюта під іншою назвою"
  - "«Dude» (q3, q4, q72, q82, q83, q85, q88, q89, a105) — канонічно «Чувак» (реєстр), це ім’я, з великої"
  - "«Buzzer» (a15, q16, q17, q32) — «Дзижчик»; «Myles» (q17, q25) — «Майлз»; «Herve» (q26, q50, q51, q91) — «Герве» (реєстр)"
  - "«SGS» (a48) — «ССГ»; «Foundry» (q20, a23) — «Ливарня»; «Free Drones» (a7, q8) — «Вільні Дрони»; «Protectorate» (q8, q9, q11) — «Протекторат»; «Deep Caverns» (q30) — «Глибокі Печери»; «Faceless» — «Безликі»; «Rail Crossing» — «Залізничний Переїзд» (глосарій)"
  - "«North Underrail» (q8) — Underrail латиницею й без відмінювання (глосарій)"
  - "«the Hanging Rat» (q14) — назва закладу-орієнтира, канонічного варіанта немає; узгодити окремо, не вигадувати похапцем"
  - "«mushroom brew», «hardcore chips», «core chips» (q66, q67, q111, q120) — назви товарів меню; у q67 вони йдуть цінником, переклад має збігатися з назвами в реченнях шинкаря"
  - "зірочки навколо слів (*you*, *whole*, *Dude*, *infrequent*, *Alright*) — наголос рушія, зберігати"
  - "q9 і q11 — майже однакові репліки з різними кінцівками; перекладати паралельно"

