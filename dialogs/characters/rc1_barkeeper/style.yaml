speakers:
  - slug: rc1_barkeeper
    name: шинкар
    units: default
    confidence: certain
    evidence: [q110, q3, q46, q65]
    role: >-
      Господар єдиного бару Залізничного Переїзду, двадцять років за тією самою
      стійкою. Дві сюжетні лінії вузла — стягнення боргу за пиятику з Чуваком
      (крик, погрози, миття посуду) і спокійна роль місцевого джерела чуток
      про Безликих та Дзижчика.
    relationships:
      - "Чувак (Dude) — постійний-непостійний відвідувач, співвинуватець боргу; шинкар його зневажає"
      - "Гравець — боржник, а потім співрозмовник; ставлення хитається від люті до панібратського «friend»"
      - "Капітан Герве (Captain Herve) — начальник станції, до якого шинкар відсилає гравця"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Грубий вуличний мовець: ain’t, outta, ’cause, gonna, wanna, ya dig,
        а в сцені боргу — punk, bastards, filthy liar. STYLE §3.2 відносить
        таких до «ти»; гравець дзеркалить базовий регістр (§3.3). Навіть
        привітне «friend» тут панібратське, а не ввічливе.
      gender_cues: []
      switches:
        - {unit: q49, to: ти, trigger: "коли гравець тисне статусом громадянина ССГ, шинкар стишується, але на «ви» не переходить — тон холоднішає в межах «ти»"}
    voice:
      register: гучний, грубуватий, балакучий; у сцені боргу — відверто агресивний
      idiolect:
        - "словесний тик «Dig?» / «you dig?» / «ya dig!» — q4, q69, q78, q87, q92; перекладати ОДНІЄЮ сталою формулою в усіх позиціях"
        - "звертання-філер «friend» — q10, q16, q25, q26, q28, q33, q35, q120; теж єдина стала форма"
        - "стягнення: ain’t, outta, gonna, wanna, lotsa, ’cause, betcha"
        - "самоперебивання й обірвані слова: «If people knew they’d nev-- Um», «the freaking plumbi--», «I’ll return--»"

