    evidence: [q2, q7, q11]
    role: >-
      Смертельно хворий мешканець нетрів, що ледве говорить крізь хрипи й
      кашель. Тримається віри в «джуджу» як оберіг і байдуже згадує, що вони
      з’їли когось зі своїх — голос повністю виснажений.
    address:
      npc_to_player: ти
      player_to_npc: н/д
      basis: >-
        Вулична, своя манера без жодної ввічливої формули, звертання «for a
        mutant» — «ти», STYLE §3.2. Реплік гравця у вузлі немає.
    voice:
      register: уривчастий, ледь чутний; довгі паузи важать більше за слова
      idiolect:
        - "«::wheeze::» розриває майже кожну репліку — рвана побудова є змістом, не склеювати фрази в гладкі речення"
        - "регістр ремарки міняється: «::wheeze::» з малої, «::Wheeze::» і «::Coughs::» з великої — відтворювати регістр джерела (STYLE §4)"
        - "обірваний «yester--» (q7) і нелюдське «Mrrrr» — залишати як є"

