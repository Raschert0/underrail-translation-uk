    src: "I hope... it chokes on me."
    note: "гірка іронія приреченого; не пом’якшувати, STYLE §9"
  - unit: q3
    src: "Joojoo keeps *it* away."
    note: >-
      «joojoo» — забобон-оберіг (варіант juju); внутрішньоігрове слово,
      лишати запозиченням, а не перекладати описово. Зірочки виділення
      навколо *it* зберегти

pitfalls:
  - "«::wheeze::» — за глосарієм «::хрип::»; у корпусі це закріплена емоційна ремарка (позначена як Abram's emote)"
  - "Twitch (q7) — тут ім’я персонажа, якого з’їли, а не препарат; реєстр дає «Сіпавка», але глосарій прямо каже, що персонажа з таким іменем належить транслітерувати окремо — рішення не приймати самотужки"
  - "«mutt» (q9) — зневажливо про пса чи людину, не нейтральне «собака»"
  - "«soup» (q8, q10) — бочковий суп нетрів; натяк на канібалізм має лишитися прочитуваним, не пояснювати його"

