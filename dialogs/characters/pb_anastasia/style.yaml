pitfalls:
  - "«khm» — головний ризик вузла: потрібен ОДИН український відповідник («кхм»), у тій самій кількості й на тих самих місцях. Не збирати їх докупи, не «прибирати зайві» й не виносити за межі речення — це і є її голос"
  - "У файлі немає жодного $(#…), але українська потребує гендерних плейсхолдерів там, де йдеться про гравця: q41 «He's a Southerner, much like you» — іменник про гравця вимагає $(#…). Додавання плейсхолдера, якого не було в джерелі, тут правильне (CLAUDE.md, STYLE §2)"
  - "q7, q52 містять $(context.player.Name) — усередині плейсхолдера нічого не відмінювати"
  - "«Underrail» лишається латиницею й не відмінюється навіть у сполуках: «Північна Underrail», «Південна Underrail» (глосарій, read-only)"
  - "Глосарій: Free Drones → Вільні Дрони, Protectorate → Протекторат, Faceless → Безликі, ::Barter.:: → ::Торгувати.::"
  - "Звання й посади (Corporal, Staff Sergeant, Consul, Colonel) — не імена: Фрейзер, Олівер, Каткарт беруться з реєстру, звання з малої"
  - "q52 «Khm... Corporal?» — коротка репліка-заглушка до того, як гравець назвався; не дописувати їй змісту"
  - "q11, q21, q33 — ремарка :: :: та пряма мова в одному юніті: розділювачі та їх кількість зберігати точно"

