      Головна лікарка Протекторату у форті Fort Apogee. Кілька років тому
      пережила хімічну атаку: обпечена ліва рука й незворотно спотворені
      голосові зв’язки — її мова передусім боротьба з власним горлом, і лише
      потім характер.
    relationships:
      - "Лука — головний механік, близький друг; про нього говорить тепло й усміхається (q37–q39)"
      - "Фрейзер — штаб-сержант, якого вона зневажає за расизм; єдине місце, де тон стає різким (q33–q35)"
      - "Кейс — працівник їдальні, про якого говорить професійно-прихильно (q41–q42)"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        Звертається виключно за званням «Corporal», говорить довгими книжними
        періодами, жодного жаргону; лікарка на службі — STYLE §3.2. Гравець
        дзеркалить (§3.3), у q49 «Doc» лишається шанобливим.
    voice:
      register: стримана, книжна, професійна; емоцію видає лише ремарка
      idiolect:
        - "«khm...» — не вигук, а спазм горла: десятки входжень, розсипаних усередині речень, а не між ними"
        - "обриви на півслові через спазм: «much more dang-- khm... khm..» (q21)"
        - "медична точність як мимовільна звичка: у q41 першою називає діагноз, а вже потім людину"

