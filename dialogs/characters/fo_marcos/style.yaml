    role: >-
      Маркос Банті, гірничий наглядач Ливарні: працьовитий шахтар із багаторічним
      стажем, хворими легенями й твердою відмовою підривати шахту. Говорить швидко,
      просторічно, весь час перебиваючи себе кашлем.
    relationships:
