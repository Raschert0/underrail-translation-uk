      - "Foundry Guard — покладається на них у справі з істотами, сам мовчить, поки вони не розберуться (q24)"
      - "Клод — джерело чистої води, яку Маркос радить пити (q22)"
    address:
      npc_to_player: ти
      player_to_npc: ти
