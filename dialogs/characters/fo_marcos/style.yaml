        - "«golden» як оцінка «чудово, все гаразд» — повторюється чотири рази (q4, q6, q21)"
        - "здивоване гортанне «'Uh?» на початку репліки (q4, q18, q27, q64, q65)"
        - "стягнення й випадання: «Whatcha need», «lotsa coins», «outta there», «diggin'», «gonna», «them worms», «half o' the damn mine»"
