pitfalls:
  - >-
    Пароль побудований на розриві слова: NPC каже «Psi» (q1), і єдина правильна
    відповідь — «Onic» (a8, a38), бо разом виходить Psionic. Решта варіантів
    (Empathy, Mentor, Booster, Beetle, Bug, Mind, Feelings, Trance, Destruction) —
    хибні приманки. Українською склад має так само стикуватися з «Псі-» — рішення
    приймати для q1/a8/a38 разом, окремо їх перекладати не можна.
  - >-
    «Tranquility» (q9) — відгук-підтвердження пароля, а не звичайне слово; має
    лишатися впізнаваним однослівним відгуком.
  - >-
    «Big Bernie» — вигаданий персонаж, якого не існує (q13 «No one.»); гравець
    може підтримати гру або викрити її (a26). Ім’я має звучати однаково в a20–a26.
  - >-
    Praetorian Security (a33) — лишати латиницею, глосарій. В a34 «Underrail
    Protectorate»: Underrail латиницею й без відмінювання, Protectorate → Протекторат.
  - >-
    Термінологія a22 з глосарію: Mushroom Cove → Грибна Бухта, hopper → стрибун,
    «lake shrooms» — розмовна форма від lake mushroom → озерний гриб.
  - >-
    «::[Intelligence]::» у a3, a6–a8, a27–a32 — тег перевірки навички, оформлюється
    як ::[Переконати]:: у глосарії; квадратні дужки й «::» зберегти.

