speakers:
  - slug: branwen
    name: Бранвен
    units: default
    confidence: certain
    evidence: [q5]
    role: >-
      Лейтенантка Протекторату, що тримає позицію під Інститутом Тчорта.
      Крижано офіційна; від гравця-цивільного відмахується, гравця-капрала
      терпить рівно стільки, скільки вимагає статут.
    relationships:
      - "полковник Каткарт — вищий за званням, їй же підпорядкована звітність"
    address:
      npc_to_player: ви
      player_to_npc: ви
      basis: >-
        «direct, unyielding and very official tone of voice» просто в ремарці
        q5 — службовий регістр (STYLE §3.2). «Ви» тримається і в холодній
        гілці для цивільного: зневага передається лексикою «citizen», а не
        переходом на «ти».
    voice:
      register: карбований статутний, без жодного скорочення
      idiolect:
        - "принципово без скорочень: «I am Lieutenant Branwen», «I am under no obligation» — не стягувати"
        - "звертання-ярлик «Corporal» / «citizen» замість імені; підміна одного одним і є її зброя"
        - "статутні формули «At ease», «You are dismissed» — усталені кліше"
        - "зірочки як наголос: «*really*», «*Leave.*» — зберігати"

narration:
  present: true
  note: >-
    «ви» без винятків — STYLE §3.1. Портретні блоки q2, q23, q25, q27
    несуть майже все характеротворення цього вузла.

