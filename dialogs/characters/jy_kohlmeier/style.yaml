    role: >-
      Старий безпритульний мешканець наметового табору Звалища, колишній
      домовласник зі східного кварталу, якого Вугри вигнали за несплату
      «за охорону». Наймає гравця повернути сентиментально дорогий ножик —
      старече самовладання й гумор поверх втрати, а не жалібність.
    relationships:
      - "Вугри (Eels) — вигнали його з дому, стережуть парадні двері"
      - "United Stations — годують табір; він до них прихильний, хоч і зве їх bozos"
      - "Вінс і його зграя — межа безпечної території (q28)"
      - "Нинішній мешканець його старого дому — власник ножа, у тексті безіменний"
    address:
      npc_to_player: ти
      player_to_npc: ти
      basis: >-
        Він старший і прямо маркує вікову дистанцію — «youngster», «Do you dig?»,
        «You greedy bastard!»; це усталене звертання старшого до молодшого,
        отже «ти» (STYLE §3.2). Гравець дзеркалить базу (§3.3): звертається
        «old timer», «old fart», торгується як зі своїм.
      switches:
        - {unit: q44, to: ти, trigger: "перше знайомство звучить церемонно («Might you, by any chance…»), але це піднесена лексика, а не перехід на «ви» — регістр лишається «ти», ввічливість передавати добором слів"}
    voice:
      register: старечий, оповідний, з навмисними паузами
      idiolect:
        - "«Hee-hee» — характерний смішок, віддавати сталим варіантом в обох появах (q6, q62)"
        - "багатокрапка-затинка посеред фрази: «The important... bit», «I... said» — ритм вагання, зберігати"
        - "звертання до гравця «youngster», «stranger» — не переходити на нейтральне"
        - "виділення курсивними зірочками *quite*, *you*, *can't*, *Obviously* — логічний наголос, зірочки лишати"
        - "лайка «bastards», «bozos» не пом’якшується — STYLE §9"

