      player_to_npc: ви
      basis: >-
        Крамарка при незнайомому покупці, вітання суто торгове
        («Ah, a customer. Come in, come in»), поради подано як послугу
        («I don’t recommend you go there either»). STYLE §3.2 — обслуга на «ви»;
