pitfalls:
  - "q56 «for your station» — «ваша станція» стосується Станції Саут-Гейт, звідки гравець; це не помилка джерела."
  - "Латиницею без відмінювання (глосарій, read-only): Biocorp, Praetorian Security, JKK, Coretech, Underrail. При цьому «Praetorians» як демонім у q23/q32/q44 — окреме рішення, глосарій це прямо позначає; не вигадувати форму на місці."
  - "Foundry Guard і Praetorian Security лишаються латиницею, але місто Foundry → «Ливарня»."
  - "Топоніми з глосарія: Drop Zone → «Зона Скидання», Core City → «Центральне Місто», Arena → «Арена», barrel soup → «бочковий суп», Hardcore City Bar → «Хардкор Сіті Бар», zoner → «зонер», Faceless → «Безликі»."
  - "Імена з реєстру: Оскар, Влатко, Аль Фабет, Деніел, Джин, Лора, Патрік Пірс, Арчібальд Найт, Гуннар Едстром, Руперт Сіммонс — списувати, не транслітерувати наново."
  - "q62 «Hermes, I believe» — Деріка плутає назву препарату (Hercules); спотворення навмисне, зберегти помилку."
  - "Деріка — жінка: минулий час і дієприкметники в її репліках у жіночому роді; у вузлі немає $(#…), тож помилку роду ніщо не підстрахує."

