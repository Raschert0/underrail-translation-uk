# Канонічні українські імена персонажів Underrail.
#
# ЄДИНЕ ДЖЕРЕЛО ІСТИНИ. Картки style.yaml беруть імена звідси; генератори карток
# НЕ мають права вигадувати транслітерацію для імені, яке тут є. Ім'я, якого тут
# немає, потрапляє в `new_names:` картки й вирішується централізовано.
#
# Правила — STYLE-uk.md §6: особові імена транслітеруємо й відмінюємо; латинський
# h → Г; літера Ґ не вживається; корпорації й бренди лишаються латиницею.
#
# kind: person | nickname | title | faction
# frozen: true — рішення закріплене глосарієм проєкту, не переглядати.

registry_version: 2

# Політика слов'янських імен: питома українська форма без винятків
